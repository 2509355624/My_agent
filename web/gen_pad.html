<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跑图台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%237c5cff'/></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f; --bg-elev: #12121a; --bg-input: #1a1a24;
    --border: #2a2a3a; --border-soft: #1f1f2e;
    --text: #e8e8f0; --text-dim: #8888a0; --text-mute: #555570;
    --accent: #7c5cff; --success: #4ade80; --error: #f87171;
    --warn: #fbbf24; --info: #4fc3f7; --radius: 12px; --radius-sm: 8px;
  }
  html, body { background: var(--bg); color: var(--text);
    font-family: "SF Mono", "JetBrains Mono", "Consolas", "Microsoft YaHei", monospace;
    font-size: 14px; height: 100%; overflow: hidden; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--border-soft); }
  .topbar h1 { font-size: 16px; font-weight: 500; }
  .topbar .sub { color: var(--text-dim); font-size: 12px; }
  .topbar .spacer { flex: 1; }
  a.link { color: var(--text-dim); text-decoration: none; font-size: 13px; }
  a.link:hover { color: var(--accent); }

  .pad { display: flex; height: calc(100vh - 45px); }

  /* ── 左：渠道列 ───────────────────────── */
  .channels { width: 208px; flex: none; border-right: 1px solid var(--border-soft);
    display: flex; flex-direction: column; background: var(--bg-elev); }
  .ch-head { padding: 10px 12px 6px; font-size: 12px; color: var(--text-dim); }
  .ch-list { overflow-y: auto; flex: 1; padding: 0 6px 10px; }
  .ch-item { padding: 7px 10px; border-radius: var(--radius-sm); cursor: pointer;
    margin-bottom: 2px; border: 1px solid transparent; }
  .ch-item:hover { background: var(--bg-input); }
  .ch-item.on { background: var(--bg-input); border-color: var(--accent); }
  .ch-item .id { font-size: 13px; }
  .ch-item .sum { font-size: 11px; color: var(--text-mute); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── 中：展示区 + 输入栏 ───────────────── */
  .stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .view { flex: 1; overflow-y: auto; padding: 16px; }
  .view-empty { color: var(--text-mute); text-align: center; padding: 60px 0;
    font-size: 13px; line-height: 2; }
  .job { background: var(--bg-elev); border: 1px solid var(--border-soft);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
  .job .row1 { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .job .skill { color: var(--info); }
  .job .state { font-size: 12px; }
  .job .state.queued { color: var(--warn); }
  .job .state.done { color: var(--success); }
  .job .state.error { color: var(--error); }
  .job .seed { color: var(--text-mute); font-size: 12px; }
  .job .elapsed { color: var(--text-mute); font-size: 12px; margin-left: auto; }
  .job .prompt { color: var(--text-dim); font-size: 12px; margin-top: 6px;
    word-break: break-all; }
  .job .err { color: var(--error); font-size: 12px; margin-top: 6px;
    word-break: break-all; }
  .job .again { margin-top: 8px; }
  .shot { background: var(--bg-elev); border: 1px solid var(--border-soft);
    border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
  .shot img { max-width: 100%; border-radius: var(--radius-sm); cursor: zoom-in;
    display: block; }
  .shot .meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px;
    font-size: 12px; color: var(--text-dim); }
  .shot .meta .sk { color: var(--info); }
  .shot .p { font-size: 12px; color: var(--text-mute); margin-top: 6px;
    word-break: break-all; max-height: 60px; overflow-y: auto; }

  .composer { border-top: 1px solid var(--border-soft); padding: 10px 16px 12px;
    background: var(--bg-elev); }
  .composer textarea { width: 100%; background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); padding: 10px 12px; font: inherit; font-size: 13px;
    resize: vertical; min-height: 44px; max-height: 45vh; outline: none; }
  .composer textarea:focus { border-color: var(--accent); }
  .nai-options { display: none; align-items: center; gap: 8px; margin-bottom: 8px; }
  .nai-options.on { display: flex; }
  .nai-options label { flex: none; color: var(--text-dim); font-size: 12px; }
  .nai-options select, .nai-options input { min-width: 0; background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text);
    padding: 7px 9px; font: inherit; font-size: 12px; outline: none; }
  .nai-options select { width: 150px; flex: none; }
  .nai-options input { flex: 1; }
  .nai-options select:focus, .nai-options input:focus { border-color: var(--accent); }
  .nai-options .btn { flex: none; }

  /* ── LoRA 槽（只有 moss 这种 Toggle 渠道出现）──
     默认**收起**，只留一行摘要（开了几个 + 名字/强度），点「展开」才露出槽位——
     7 个槽铺开要占掉输入区一大截，收起来是常态（2026-10-28）。
     展开后两列排布（窄屏 auto-fit 自动退回一列）。名字短的显示短名，全名在悬停卡片里。 */
  .lora-options { display: none; margin-bottom: 8px; padding: 4px 10px;
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: var(--radius-sm); }
  .lora-options.on { display: block; }
  .lora-head { display: flex; align-items: center; gap: 8px; font-size: 12px;
    color: var(--text-dim); min-height: 26px; }
  .lora-head .title { flex: none; }
  .lora-sum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--text-mute); }
  .lora-sum b { color: var(--info); font-weight: 400; }
  #loraRows { display: none; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1px 16px; margin: 0 -10px; padding: 5px 10px 4px;
    border-top: 1px solid var(--border-soft); }
  .lora-options.open #loraRows { display: grid; }
  .lora-row { display: flex; align-items: center; gap: 8px; padding: 1px 0;
    min-width: 0; }
  .lora-row .lchk { display: flex; align-items: center; gap: 6px; flex: 1;
    min-width: 0; font-size: 12px; color: var(--text-dim); cursor: pointer; }
  .lora-row .lname { overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .lora-row input[type=number] { width: 62px; flex: none; background: var(--bg-elev);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); padding: 2px 6px; font: inherit; font-size: 12px;
    outline: none; }
  .lora-row input[type=number]:focus { border-color: var(--accent); }
  .composer .bar { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .composer .cur { font-size: 12px; color: var(--text-dim); }
  .composer .cur b { color: var(--info); font-weight: 400; }
  .composer .qdepth { font-size: 12px; color: var(--warn); }
  /* 步数：留空 = 按渠道模板（placeholder 显示默认值）。NAI 云端渠道整块藏起来 */
  .steps-box { display: none; align-items: center; gap: 6px; font-size: 12px;
    color: var(--text-dim); }
  .steps-box.on { display: flex; }
  .steps-box input { width: 62px; background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); padding: 5px 7px; font: inherit; font-size: 12px;
    outline: none; }
  .steps-box input:focus { border-color: var(--accent); }
  .steps-box .hint { color: var(--text-mute); font-size: 11px; }
  .composer .spacer { flex: 1; }
  /* 负向提示词（2026-10-31）：留空 = 只用渠道模板那段。NAI 云端渠道、
     以及没有 CLIP 负向节点的渠道（如 qwen-charsheet）整块藏起来。 */
  .neg-box { display: none; margin-top: 8px; }
  .neg-box.on { display: block; }
  .neg-box textarea { min-height: 36px; font-size: 12px; }
  .btn { background: var(--bg-input); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 6px 14px; font: inherit; font-size: 13px;
    cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn.small { padding: 3px 10px; font-size: 12px; }

  /* ── 右：历史栏 ───────────────────────── */
  .history { width: 264px; flex: none; border-left: 1px solid var(--border-soft);
    display: flex; flex-direction: column; background: var(--bg-elev); }
  .history.hidden { display: none; }
  .h-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    font-size: 12px; color: var(--text-dim); border-bottom: 1px solid var(--border-soft); }
  .h-head .spacer { flex: 1; }
  .h-list { overflow-y: auto; flex: 1; padding: 8px; }
  .h-item { display: flex; gap: 8px; padding: 6px; border-radius: var(--radius-sm);
    cursor: pointer; align-items: center; }
  .h-item:hover { background: var(--bg-input); }
  .h-item.on { background: var(--bg-input); outline: 1px solid var(--accent); }
  .h-item img { width: 46px; height: 46px; object-fit: cover; border-radius: 6px;
    flex: none; background: var(--bg-input); }
  .h-item .noimg { width: 46px; height: 46px; border-radius: 6px; flex: none;
    background: var(--bg-input); display: flex; align-items: center;
    justify-content: center; color: var(--error); font-size: 16px; }
  .h-item .info { min-width: 0; flex: 1; }
  .h-item .sk { font-size: 12px; color: var(--info); }
  .h-item .sd { font-size: 11px; color: var(--text-mute); }
  .h-item .tm { font-size: 11px; color: var(--text-mute); }
  .h-item .dur { font-size: 11px; color: var(--success); }
  .h-item .bad { font-size: 11px; color: var(--error); }
  .h-item .lor { font-size: 10px; color: var(--warn); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  /* 「复制」按鼠标悬停才浮出来：面板只有 264px，常驻按钮会把缩略图挤窄 */
  .h-item { position: relative; }
  .h-copy { position: absolute; top: 6px; right: 6px; padding: 0 6px;
    font: inherit; font-size: 11px; line-height: 16px; color: var(--text-dim);
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 4px; cursor: pointer; opacity: 0; transition: opacity .12s; }
  .h-item:hover .h-copy, .h-copy:focus-visible { opacity: 1; }
  .h-copy:hover { border-color: var(--accent); color: var(--accent); }
  .h-empty { color: var(--text-mute); font-size: 12px; text-align: center;
    padding: 30px 0; }
  .show-history { position: fixed; right: 0; top: 60px; z-index: 5; }

  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: var(--bg-elev); border: 1px solid var(--error); color: var(--error);
    padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px;
    display: none; z-index: 10; max-width: 70vw; }

  /* ── 自绘悬停卡片（2026-10-29）──────────────────────────
     为什么不用原生 title：浏览器在任何按键（哪怕只按一下 Ctrl）时都会立刻
     收掉 tooltip，用户想 Ctrl+Alt+A 截图根本抓不住，试了很多次才截到。
     这个 div 只由鼠标进出控制显隐，**不绑任何键盘事件**，按住 Ctrl 也不收。 */
  .hovercard { position: fixed; z-index: 60; left: 0; top: 0;
    max-width: 470px; max-height: 62vh; overflow: auto; display: none;
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 12px;
    font-size: 12px; line-height: 1.7; color: var(--text-dim);
    box-shadow: 0 14px 36px rgba(0,0,0,.55); pointer-events: none;
    word-break: break-word; }
  .hovercard.on { display: block; }
  .hovercard .hc-title { color: var(--info); font-size: 12px;
    margin-bottom: 5px; word-break: break-all; }
  .hovercard .hc-body { white-space: pre-wrap; }
  .hovercard .hc-key { color: var(--text-mute); }

  /* ── 灯箱：在本页放大看图（不跳新标签页） ────── */
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.9);
    z-index: 40; display: none; overflow: auto; }
  .lightbox.on { display: block; }
  .lb-inner { min-width: 100%; min-height: 100%; box-sizing: border-box;
    padding: 24px; display: flex; }
  /* margin:auto 而不是 justify-content:center —— 图比窗口大时前者的
     左/上溢出仍然滚得到，后者会把溢出部分裁到滚不回去。 */
  .lightbox img { margin: auto; display: block; border-radius: 6px;
    max-width: 100%; max-height: calc(100vh - 48px); cursor: zoom-in; }
  .lightbox.full img { max-width: none; max-height: none; cursor: zoom-out; }
  .lb-hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    color: #999; font-size: 12px; pointer-events: none; z-index: 41; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>🎨 跑图台</h1>
    <span class="sub">无 AI · 选渠道 · 写提示词 · 直接出图</span>
    <span class="spacer"></span>
    <a class="link" href="/comic_studio.html">漫画工作台 →</a>
  </div>

  <div class="pad">
    <!-- 左：渠道列 -->
    <aside class="channels">
      <div class="ch-head">生图渠道（和 QQ 机器人同一份清单）</div>
      <div class="ch-list" id="chList"><div class="h-empty">加载中…</div></div>
    </aside>

    <!-- 中：展示区 + 输入栏 -->
    <main class="stage">
      <section class="view" id="view">
        <div class="view-empty" id="viewEmpty">
          左边选个渠道，下面写提示词，点「生成」<br>
          Ctrl+Enter 也能提交 · ComfyUI 图在 output，NAI 图在云端临时目录
        </div>
        <div id="jobs"></div>
        <div id="shot"></div>
      </section>

      <section class="composer">
        <div class="nai-options" id="naiOptions">
          <label for="naiArtist">画师串前缀</label>
          <select id="naiArtist" aria-label="选择已保存的画师串">
            <option value="">不加前缀</option>
          </select>
          <input id="naiArtistInput" type="text" maxlength="2000"
            placeholder="输入 NovelAI 画师串；填写后优先于下拉选择">
          <button class="btn small" id="naiArtistSave" type="button">保存</button>
        </div>
        <div class="lora-options" id="loraBox">
          <div class="lora-head">
            <span class="title" title="勾选只影响这次提交；「存为默认」写入模板，QQ 侧和三个台都跟着变">LoRA</span>
            <span class="lora-sum" id="loraSum"></span>
            <button class="btn small" id="loraToggle" type="button">展开</button>
            <button class="btn small" id="loraSave" type="button">存为默认</button>
          </div>
          <div id="loraRows"></div>
        </div>
        <textarea id="prompt" rows="2"
          placeholder="提示词：英文 tag 或自然句子都行（按渠道习惯写，silver/krea2/anima 用 tag 串，qwen 用完整句子）"></textarea>
        <div class="neg-box" id="negBox">
          <textarea id="neg" rows="2"
            placeholder="负向提示词：追加在渠道模板的负向后面（留空 = 只用模板；不要写正向内容）"></textarea>
        </div>
        <div class="bar">
          <span class="cur">渠道：<b id="curChan">未选</b></span>
          <span class="steps-box" id="stepsBox">
            <label for="stepsIn">步数</label>
            <input id="stepsIn" type="number" min="1" max="100" step="1"
                   placeholder="默认" title="留空按渠道模板；填了只影响这次提交">
            <span class="hint" id="stepsHint"></span>
          </span>
          <span class="steps-box" id="cfgBox">
            <label for="cfgIn">CFG</label>
            <input id="cfgIn" type="number" min="0" max="20" step="0.1"
                   placeholder="默认" title="留空按渠道模板；填了只影响这次提交">
            <span class="hint" id="cfgHint"></span>
          </span>
          <span class="qdepth" id="qdepth" style="display:none"></span>
          <span class="spacer"></span>
          <button class="btn primary" id="btnGen" onclick="gen()">生成</button>
        </div>
      </section>
    </main>

    <!-- 右：历史栏（可隐藏） -->
    <aside class="history" id="history">
      <div class="h-head">
        <span>历史（本机生成）</span>
        <span class="spacer"></span>
        <button class="btn small" onclick="clearHistory()">清空</button>
        <button class="btn small" onclick="toggleHistory()">隐藏 ▸</button>
      </div>
      <div class="h-list" id="hList"><div class="h-empty">还没有记录</div></div>
    </aside>
    <button class="btn small show-history" id="btnShow" style="display:none"
            onclick="toggleHistory()">◂ 历史</button>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lb-inner"><img id="lbImg" alt=""></div>
    <div class="lb-hint">点图切「适应窗口 / 原始像素」 · Esc 或点空白关掉</div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="hovercard" id="hovercard"></div>

<script>
let CHANNELS = [];
let CUR = localStorage.getItem('gp_channel') || '';
let JOBS = [];              // 最近一次 status 拿到的任务
let HISTORY = [];           // 账本行（新的在前）
let PINNED = null;          // 当前大图对应的任务/历史 tag
let PINNED_AUTO = false;    // PINNED 是轮询自动展示的（true）还是用户手点的（false）。
                            // 区分这两者：自动展示的可以被更新完成的图顶掉；
                            // 用户手点的历史行不能被抢（2026-10-28 修「出图不自动刷」）。
let POLL = null;
// 步数（2026-10-29）：留空 = 按渠道模板；填了只影响这一次提交，记在本机。
let STEPS = localStorage.getItem('gp_steps') || '';
// CFG / 负向（2026-10-31）：同一套约定——留空按模板、只影响本次、记在本机。
// 负向在后端是**追加**到模板负向池后面，不是替换。
let CFG = localStorage.getItem('gp_cfg') || '';
let NEG = localStorage.getItem('gp_neg') || '';
let NAI_ARTISTS = JSON.parse(localStorage.getItem('gp_nai_artists') || '[]');

function isNai() { return CUR === 'nai' || CUR === 'nai_wide'; }

function renderNaiArtists() {
  const sel = document.getElementById('naiArtist');
  sel.innerHTML = '<option value="">不加前缀</option>';
  NAI_ARTISTS.forEach((value, i) => {
    const opt = document.createElement('option');
    opt.value = value;
    opt.textContent = '画师串 ' + (i + 1) + ' · ' + value.slice(0, 24);
    opt.title = value;
    sel.appendChild(opt);
  });
}

function updateNaiOptions() {
  document.getElementById('naiOptions').classList.toggle('on', isNai());
}

function selectedNaiPrefix() {
  const typed = document.getElementById('naiArtistInput').value.trim();
  return typed || document.getElementById('naiArtist').value.trim();
}

async function api(url, opt) {
  const r = await fetch(url, opt ? {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(opt)
  } : undefined);
  const d = await r.json().catch(() => ({}));
  if (!r.ok || d.ok === false) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 4000);
}

// ── 自绘悬停卡片（2026-10-29 用户要求）────────────────────
// 原生的 `title` 属性在任何按键（哪怕只按下 Ctrl）时会被浏览器**立刻收掉**，
// 用户想 Ctrl+Alt+A 截图根本抓不住，试了很多次才截到两张。这里换成一个普通
// div：显示/隐藏只由 mouseenter / mouseleave 决定，**完全不绑键盘事件**，
// 按住 Ctrl / Shift / Alt 都不会消失。
//
// 位置：默认贴在被悬停元素的右侧，右边放不下就翻到左侧；上下夹在视口内。
// `pointer-events: none` 保证它不会挡住鼠标、也就不会自己触发 mouseleave。
const HCARD = document.getElementById('hovercard');

function hideHoverCard() { HCARD.classList.remove('on'); }

function showHoverCard(el, title, body) {
  if (!title && !body) { hideHoverCard(); return; }
  HCARD.innerHTML = '';
  if (title) {
    const t = document.createElement('div');
    t.className = 'hc-title'; t.textContent = title;
    HCARD.appendChild(t);
  }
  if (body) {
    const b = document.createElement('div');
    b.className = 'hc-body'; b.textContent = body;
    HCARD.appendChild(b);
  }
  HCARD.classList.add('on');
  const r = el.getBoundingClientRect();
  const w = HCARD.offsetWidth, h = HCARD.offsetHeight;
  let left = r.right + 10;
  if (left + w > window.innerWidth - 8) left = Math.max(8, r.left - w - 10);
  let top = r.top;
  if (top + h > window.innerHeight - 8) top = Math.max(8, window.innerHeight - h - 8);
  HCARD.style.left = left + 'px';
  HCARD.style.top = top + 'px';
}

// 给元素挂卡片；每次悬停时现算内容（数据会变）。传 null 就只清掉原生 title。
function bindHoverCard(el, build) {
  el.removeAttribute('title');        // 原生 tooltip 一律不要，见上面注释
  if (!build) return;
  el.addEventListener('mouseenter', () => {
    const it = build() || {};
    showHoverCard(el, it.title, it.body);
  });
  el.addEventListener('mouseleave', hideHoverCard);
}

function fmtTime(ts) {
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, '0');
  return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

// 复制到剪贴板。localhost 算安全上下文走 clipboard API；兜底 execCommand
// 是给 http 局域网访问用的（那不是安全上下文，navigator.clipboard 是 undefined）。
async function copyText(text) {
  if (!text) { toast('这条没有记录提示词'); return false; }
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    toast('提示词已复制（' + text.length + ' 字）');
    return true;
  } catch (e) { toast('复制失败：' + e.message); return false; }
}

// ── 渠道列 ────────────────────────────────
async function loadChannels() {
  try {
    const d = await api('/api/gen/channels');
    CHANNELS = d.channels || [];
  } catch (e) { toast('渠道列加载失败：' + e.message); return; }
  const box = document.getElementById('chList');
  if (!CHANNELS.length) { box.innerHTML = '<div class="h-empty">一个渠道都没有</div>'; return; }
  box.innerHTML = '';
  for (const c of CHANNELS) {
    const el = document.createElement('div');
    el.className = 'ch-item' + (c.id === CUR ? ' on' : '');
    el.dataset.id = c.id;
    el.innerHTML = '<div class="id"></div>' +
      (c.summary ? '<div class="sum"></div>' : '');
    // 展示名（2026-10-29）：`label` 是 skill.md 里写的中文名（如 moss-light
    // → "moss光影"），id 仍是提交参数。没有 label 就照旧显示 id。
    el.querySelector('.id').textContent = c.label || c.id;
    if (c.summary) el.querySelector('.sum').textContent = c.summary;
    bindHoverCard(el, () => ({
      title: (c.label && c.label !== c.id) ? (c.label + '（' + c.id + '）') : c.id,
      body: [c.summary || '', c.cloud ? '云端渠道（NAI）' : '',
             (c.steps ? '默认步数 ' + c.steps : ''),
             (!c.cloud && c.cfg ? '默认 CFG ' + c.cfg : '')].filter(Boolean).join('\n')
    }));
    el.onclick = () => pick(c.id);
    box.appendChild(el);
  }
  if (!CHANNELS.some(c => c.id === CUR)) CUR = CHANNELS[0].id;
  renderNaiArtists();
  showCur();
  loadLoras(CUR);
}

function pick(id) {
  CUR = id;
  localStorage.setItem('gp_channel', id);
  document.querySelectorAll('.ch-item').forEach(el =>
    el.classList.toggle('on', el.dataset.id === id));
  showCur();
  loadLoras(id);
}

function showCur() {
  const ch = curChannel();
  document.getElementById('curChan').textContent =
    (ch && ch.label) ? ch.label : (CUR || '未选');
  updateNaiOptions();
  updateParams();
}

// ── 参数输入：步数 / CFG / 负向（2026-10-29 起，10-31 加 CFG 与负向）──
// placeholder 显示渠道模板当前值（"30" / "8+12"），留空就是按它跑；
// NAI 是云端参数，没有本地工作流，整块藏起来。负向还要看渠道有没有
// 接进采样器的 CLIPTextEncode（`ch.negative` 由后端算）。
function curChannel() { return CHANNELS.find(c => c.id === CUR) || null; }

function updateParams() {
  const ch = curChannel();
  const cloud = !ch || ch.cloud;
  const stepsBox = document.getElementById('stepsBox');
  const input = document.getElementById('stepsIn');
  const hint = document.getElementById('stepsHint');
  const cfgBox = document.getElementById('cfgBox');
  const cfgIn = document.getElementById('cfgIn');
  const cfgHint = document.getElementById('cfgHint');
  const negBox = document.getElementById('negBox');
  const negIn = document.getElementById('neg');
  stepsBox.classList.toggle('on', !cloud);
  cfgBox.classList.toggle('on', !cloud);
  negBox.classList.toggle('on', !cloud && !!(ch && ch.negative));
  if (cloud) return;
  const def = ch.steps || '';
  input.placeholder = def ? ('默认 ' + def) : '默认';
  hint.textContent = def ? '' : '该渠道没有可调步数';
  input.disabled = !def;
  input.value = STEPS;
  const defCfg = ch.cfg || '';
  cfgIn.placeholder = defCfg ? ('默认 ' + defCfg) : '默认';
  cfgHint.textContent = defCfg ? '' : '该渠道没有可调 CFG';
  cfgIn.disabled = !defCfg;
  cfgIn.value = CFG;
  negIn.value = NEG;
}

const STEPS_INPUT = document.getElementById('stepsIn');
STEPS_INPUT.addEventListener('input', () => {
  STEPS = STEPS_INPUT.value.trim();
  try { localStorage.setItem('gp_steps', STEPS); } catch (e) {}
});

const CFG_INPUT = document.getElementById('cfgIn');
CFG_INPUT.addEventListener('input', () => {
  CFG = CFG_INPUT.value.trim();
  try { localStorage.setItem('gp_cfg', CFG); } catch (e) {}
});

const NEG_INPUT = document.getElementById('neg');
NEG_INPUT.addEventListener('input', () => {
  // 负向保留原样（换行/逗号都是用户的事），提交前才 trim
  NEG = NEG_INPUT.value;
  try { localStorage.setItem('gp_neg', NEG); } catch (e) {}
});

// ── LoRA 槽位（2026-10-28 用户要求「自己选开哪个」）──
// 只有 moss 这种「一个节点并联多槽」的渠道有槽位；别的渠道接口返回空，面板
// 不显示。勾选状态记在本机（gp_loras_<渠道>），换渠道互不干扰。
let LORA = [];
let LORA_KIND = '';
// 面板默认收起（7 个槽铺开会把输入区顶出大半屏）；展开与否记在本机。
let LORA_OPEN = false;
try { LORA_OPEN = localStorage.getItem('gp_lora_open') === '1'; } catch (e) {}

function loraKey(skill) { return 'gp_loras_' + (skill || ''); }

function shortName(name) {
  return (name || '').replace(/^moss-/, '').replace(/\.safetensors$/, '');
}

function setLoraOpen(open) {
  LORA_OPEN = !!open;
  document.getElementById('loraBox').classList.toggle('open', LORA_OPEN);
  document.getElementById('loraToggle').textContent = LORA_OPEN ? '收起' : '展开';
  try { localStorage.setItem('gp_lora_open', LORA_OPEN ? '1' : '0'); } catch (e) {}
}

function updateLoraSum() {
  const el = document.getElementById('loraSum');
  if (!LORA.length) { el.textContent = ''; return; }
  const on = readLoraRows().filter(r => r.on);
  el.innerHTML = '';
  const b = document.createElement('b');
  b.textContent = on.length;
  el.appendChild(b);
  el.appendChild(document.createTextNode('/' + LORA.length + '　'
    + (on.length ? on.map(r => {
        const s = LORA.find(x => x.slot === r.slot);
        return shortName(s && s.name) + ' ' + r.strength;
      }).join(' · ') : '全部关闭')));
}

function readLoraRows() {
  const out = [];
  document.querySelectorAll('#loraRows .lora-row').forEach(r => {
    out.push({slot: Number(r.dataset.slot),
              on: r.querySelector('input[type=checkbox]').checked,
              strength: Number(r.querySelector('.lora-str').value)});
  });
  return out;
}

function cacheLoras() {
  try { localStorage.setItem(loraKey(CUR), JSON.stringify(readLoraRows())); }
  catch (e) { /* 隐私模式下 localStorage 会抛，忽略 */ }
}

async function loadLoras(skill) {
  LORA = []; LORA_KIND = '';
  const box = document.getElementById('loraBox');
  if (!skill) { box.classList.remove('on'); return; }
  let d;
  try { d = await api('/api/gen/loras?skill=' + encodeURIComponent(skill)); }
  catch (e) { box.classList.remove('on'); return; }
  if (d.kind !== 'toggle' || !(d.slots || []).length) {
    box.classList.remove('on'); return;
  }
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(loraKey(skill)) || 'null'); }
  catch (e) { saved = null; }
  const bySlot = {};
  (saved || []).forEach(s => { bySlot[s.slot] = s; });
  LORA_KIND = 'toggle';
  LORA = d.slots.map(s => {
    const m = bySlot[s.slot];
    if (!m) return s;
    return {slot: s.slot, name: s.name, on: !!m.on,
            strength: (typeof m.strength === 'number' ? m.strength : s.strength)};
  });
  renderLoras();
  setLoraOpen(LORA_OPEN);
  box.classList.add('on');
}

function renderLoras() {
  const rows = document.getElementById('loraRows');
  rows.innerHTML = '';
  LORA.forEach(s => {
    const row = document.createElement('div');
    row.className = 'lora-row';
    row.dataset.slot = s.slot;
    row.innerHTML = '<label class="lchk"><input type="checkbox">'
      + '<span class="lname"></span></label>'
      + '<input class="lora-str" type="number" step="0.05" min="0" max="2">';
    row.querySelector('.lname').textContent = shortName(s.name);
    // 短名看不出是哪个文件，悬停给全名（自绘卡片，按 Ctrl 也不会消失）
    bindHoverCard(row.querySelector('.lname'), () => ({
      title: s.name, body: '槽 ' + s.slot
    }));
    const cb = row.querySelector('input[type=checkbox]');
    cb.checked = !!s.on;
    cb.addEventListener('change', () => { cacheLoras(); updateLoraSum(); });
    const num = row.querySelector('.lora-str');
    num.value = s.strength;
    num.addEventListener('input', () => { cacheLoras(); updateLoraSum(); });
    rows.appendChild(row);
  });
  updateLoraSum();
}

async function saveLoraDefault() {
  if (!LORA.length) return;
  try {
    const d = await api('/api/lora/save', {skill: CUR, slots: readLoraRows()});
    toast(d.message || '已存为默认');
  } catch (e) { toast(e.message); }
}

// ── 输入栏：自动长高 + Ctrl+Enter ─────────────
const TA = document.getElementById('prompt');
const NAI_ARTIST_INPUT = document.getElementById('naiArtistInput');
const NAI_ARTIST_SELECT = document.getElementById('naiArtist');
document.getElementById('naiArtistSave').addEventListener('click', () => {
  const value = NAI_ARTIST_INPUT.value.trim();
  if (!value) { toast('先输入要保存的画师串'); NAI_ARTIST_INPUT.focus(); return; }
  if (!NAI_ARTISTS.includes(value)) NAI_ARTISTS.push(value);
  localStorage.setItem('gp_nai_artists', JSON.stringify(NAI_ARTISTS));
  renderNaiArtists();
  NAI_ARTIST_SELECT.value = value;
  toast('画师串已保存');
});
NAI_ARTIST_SELECT.addEventListener('change', () => {
  NAI_ARTIST_INPUT.value = '';
});
document.getElementById('loraSave').addEventListener('click', saveLoraDefault);
document.getElementById('loraToggle').addEventListener('click', () => setLoraOpen(!LORA_OPEN));
TA.addEventListener('input', () => {
  TA.style.height = 'auto';
  TA.style.height = TA.scrollHeight + 'px';   // max-height 45vh 由 CSS 兜底
});
TA.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') gen();
});

// ── 生成 ────────────────────────────────
async function gen(promptOverride) {
  const prompt = (promptOverride !== undefined ? promptOverride : TA.value).trim();
  if (!prompt) { toast('提示词是空的'); TA.focus(); return; }
  if (!CUR) { toast('先在左边选个渠道'); return; }
  const artistPrefix = promptOverride === undefined ? selectedNaiPrefix() : '';
  document.getElementById('btnGen').disabled = true;
  try {
    const body = {skill: CUR, prompt: prompt, artist_prefix: artistPrefix};
    if (LORA_KIND === 'toggle' && LORA.length) body.loras = readLoraRows();
    // 步数 / CFG / 负向只在 ComfyUI 渠道发；NAI 走云端，本地参数没意义
    // （后端也会忽略，但前端先拦住，免得用户以为填了生效）。输入框被禁用
    // （渠道模板没这个字段）或整块藏起来（渠道没有负向节点）时不发——
    // 否则会带着上一个渠道留下的值跑，后端只能打条警告然后忽略。
    const st = STEPS_INPUT.value.trim();
    if (st && !isNai() && !STEPS_INPUT.disabled) body.steps = Number(st);
    const cf = CFG_INPUT.value.trim();
    if (cf && !isNai() && !CFG_INPUT.disabled) body.cfg = Number(cf);
    const negOn = document.getElementById('negBox').classList.contains('on');
    const ng = negOn ? NEG_INPUT.value.trim() : '';
    if (ng && !isNai()) body.negative = ng;
    const d = await api('/api/gen/submit', body);
    JOBS.unshift(d.job);
    renderJobs();
    startPoll();
    if (promptOverride === undefined) {
      PINNED = null;
      TA.value = ''; TA.style.height = '';   // 发出去了就清空，接着写下一条
    }
  } catch (e) {
    toast(e.message);
  } finally {
    document.getElementById('btnGen').disabled = false;
  }
}

// ── 轮询进行中的任务 ───────────────────────
function startPoll() {
  if (POLL) return;
  POLL = setInterval(async () => {
    try {
      const d = await api('/api/gen/status');
      JOBS = d.jobs || [];
      const qd = document.getElementById('qdepth');
      if (d.queue_depth) {
        qd.style.display = '';
        qd.textContent = '队列里还有 ' + d.queue_depth + ' 张（含 QQ 的）';
      } else { qd.style.display = 'none'; }
      renderJobs();
      // 自动切大图：没钉过图就切；钉的是「自动展示」的也切（新图顶旧图）——
      // 之前只判 !PINNED，连发两张时第二张永远不自动出来。
      const done = JOBS.filter(j => j.state === 'done');
      if (done.length && (!PINNED || (PINNED_AUTO && done[0].id !== PINNED)))
        showLatestDone();
      if (!JOBS.some(j => j.state === 'queued')) {
        loadHistory();
        stopPoll();
      }
    } catch (e) { /* 轮询失败不打扰，下一轮再来 */ }
  }, 2000);
}
function stopPoll() { clearInterval(POLL); POLL = null; }

function renderJobs() {
  const box = document.getElementById('jobs');
  const active = JOBS.filter(j => j.state === 'queued' || j.state === 'error');
  document.getElementById('viewEmpty').style.display =
    (active.length || document.getElementById('shot').children.length) ? 'none' : '';
  if (!active.length) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  for (const j of active) {
    const el = document.createElement('div');
    el.className = 'job';
    const secs = Math.max(0, Math.round(Date.now() / 1000 - j.ts));
    const st = j.state === 'queued'
      ? '<span class="state queued">排队/生成中</span>'
      : '<span class="state error">失败了</span>';
    el.innerHTML =
      '<div class="row1"><span class="skill"></span>' + st +
      '<span class="seed"></span><span class="elapsed">' + secs + 's</span></div>' +
      '<div class="prompt"></div>' +
      (j.error ? '<div class="err"></div>' : '') +
      (j.error ? '<button class="btn small again">把提示词放回输入栏，改改再发</button>' : '');
    el.querySelector('.skill').textContent = j.skill;
    el.querySelector('.seed').textContent = 'seed ' + (j.seed ?? '云端随机');
    el.querySelector('.prompt').textContent = j.prompt;
    if (j.error) {
      el.querySelector('.err').textContent = j.error;
      el.querySelector('.again').onclick = () => {
        TA.value = j.prompt; TA.dispatchEvent(new Event('input')); TA.focus();
      };
    }
    box.appendChild(el);
  }
}

// ── 展示区：最新成图 ───────────────────────
function showLatestDone() {
  const done = JOBS.filter(j => j.state === 'done');
  if (!done.length) return;
  showShot(done[0], true);
}

function showShot(j, auto) {
  PINNED = j.id || j.tag;
  PINNED_AUTO = !!auto;
  document.getElementById('viewEmpty').style.display = 'none';
  const box = document.getElementById('shot');
  box.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'shot';
  const img = document.createElement('img');
  img.src = '/api/gen/img?f=' + encodeURIComponent(j.file);
  img.title = '点击在本页放大';
  img.onclick = () => openLightbox(img.src);
  img.onerror = () => { img.replaceWith(Object.assign(document.createElement('div'),
    {className: 'err', style: 'color:var(--error);font-size:12px;padding:20px 0',
     textContent: '图取不到：服务暂时不可用，或图片已过期'})); };
  el.appendChild(img);
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = '<span class="sk"></span><span>seed ' + (j.seed ?? '云端随机') + '</span>' +
    '<span>' + fmtTime(j.ts) + '</span>' +
    (stepsText(j) ? '<span class="stp"></span>' : '') +
    (cfgText(j) ? '<span class="cf"></span>' : '') +
    (secsText(j.secs) ? '<span class="dur"></span>' : '');
  meta.querySelector('.sk').textContent = j.skill;
  if (stepsText(j)) meta.querySelector('.stp').textContent = stepsText(j);
  if (cfgText(j)) meta.querySelector('.cf').textContent = cfgText(j);
  if (secsText(j.secs)) meta.querySelector('.dur').textContent = 'ComfyUI ' + secsText(j.secs);
  el.appendChild(meta);
  if (j.prompt) {
    const p = document.createElement('div');
    p.className = 'p'; p.textContent = j.prompt;
    el.appendChild(p);
  }
  box.innerHTML = ''; box.appendChild(el);
  renderHistoryOn();
}

// ── 历史栏 ────────────────────────────────
async function loadHistory() {
  try {
    const d = await api('/api/gen/history?limit=100');
    HISTORY = d.rows || [];
  } catch (e) { return; }
  renderHistory();
}

// ── 历史行上的 LoRA 短标（2026-10-28：方便同 seed 对比）──
// moss-maliker_moss_base_style_v3_e40.safetensors → maliker 0.4。先去扩展名
// 和 moss- 前缀，取第一段（到 _ 或 - 为止），没有分隔符就截 7 字；
// 完整名放在行级悬停卡片里（2026-10-29 换成自绘卡片，原生 title 按 Ctrl 会消失）。
function loraShort(name) {
  const s = (name || '').replace(/\.safetensors$/i, '').replace(/^moss-/, '');
  return (s.split(/[_\-]/)[0] || s).slice(0, 7);
}
function loraTag(loras) {
  return (loras || []).filter(l => l.name).map(l =>
    loraShort(l.name) + ' ' + (Math.round((l.strength || 0) * 100) / 100)
  ).join(' · ');
}

// ── 步数 / 生成耗时（2026-10-29）──────────────
// 耗时口径是 ComfyUI 的 execution_start → execution_success，**不含排队**：
// 用户要看的是「模型开跑到出图」，不是「我点了之后等了多久」。
function secsText(s) {
  if (s === null || s === undefined || isNaN(s)) return '';
  return (s >= 100 ? Math.round(s) : Math.round(s * 10) / 10) + 's';
}
function stepsText(o) {
  const v = (o && (o.steps_label || o.steps)) || '';
  return v ? (v + ' 步') : '';
}
// CFG（2026-10-31）：只有本次显式填了才会出现在账本 / 任务里；
// 按模板跑的行没有这个字段，就不用显示。
function cfgText(o) {
  const v = o && o.cfg;
  return (v === null || v === undefined || v === '') ? '' : ('cfg ' + v);
}

function renderHistory() {
  const box = document.getElementById('hList');
  if (!HISTORY.length) { box.innerHTML = '<div class="h-empty">还没有记录</div>'; return; }
  box.innerHTML = '';
  for (const r of HISTORY) {
    const el = document.createElement('div');
    el.className = 'h-item' + (r.tag === PINNED ? ' on' : '');
    if (r.ok && r.file) {
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = '/api/gen/img?f=' + encodeURIComponent(r.file);
      img.onerror = () => { img.style.display = 'none'; };
      el.appendChild(img);
    } else {
      const no = document.createElement('div');
      no.className = 'noimg'; no.textContent = '⚠'; no.title = r.error || '失败了';
      el.appendChild(no);
    }
    const info = document.createElement('div');
    info.className = 'info';
    const lt = loraTag(r.loras);
    info.innerHTML = '<div class="sk"></div>' +
      (lt ? '<div class="lor"></div>' : '') +
      '<div class="sd"></div>' +
      (r.ok ? '<div class="tm"></div>' : '<div class="bad"></div>') +
      (r.ok && (stepsText(r) || cfgText(r) || secsText(r.secs)) ? '<div class="dur"></div>' : '');
    info.querySelector('.sk').textContent =
      ((CHANNELS.find(c => c.id === r.skill) || {}).label) || r.skill;
    if (lt) {
      // 完整 LoRA 名单在行级悬停卡片里（见下面 bindHoverCard），这里不再挂
      // 原生 title：否则鼠标停在黄字上会同时弹出浏览器 tooltip，一按 Ctrl
      // 就消失，反而挡着截图。
      info.querySelector('.lor').textContent = lt;
    }
    info.querySelector('.sd').textContent = 'seed ' + (r.seed ?? '—');
    if (r.ok) info.querySelector('.tm').textContent = fmtTime(r.ts);
    else info.querySelector('.bad').textContent = (r.error || '失败').slice(0, 40);
    if (r.ok && info.querySelector('.dur')) {
      info.querySelector('.dur').textContent =
        [stepsText(r), cfgText(r), secsText(r.secs)].filter(Boolean).join(' · ');
    }
    el.appendChild(info);
    if (r.prompt) {
      const cp = document.createElement('button');
      cp.className = 'h-copy'; cp.type = 'button'; cp.textContent = '复制';
      cp.title = '复制这条的提示词';
      cp.onclick = ev => { ev.stopPropagation(); copyText(r.prompt); };
      el.appendChild(cp);
    }
    // 悬停看这张图的**完整内容**（2026-10-29）：渠道 / LoRA 全名与强度 /
    // 种子 / 步数 / ComfyUI 耗时 / 时间 / 整条提示词。用自绘卡片而不是原生
    // title —— 原生 tooltip 一按 Ctrl 就没了，截不到图。
    bindHoverCard(el, () => {
      const ch = CHANNELS.find(c => c.id === r.skill);
      const lines = [];
      lines.push('渠道　' + ((ch && ch.label) ? ch.label + '（' + r.skill + '）'
                                           : r.skill));
      const loras = (r.loras || []).filter(l => l.name);
      if (loras.length) {
        lines.push('LoRA');
        loras.forEach(l => lines.push('　' + l.name + '  ' + l.strength));
      }
      lines.push('种子　' + (r.seed ?? '—'));
      if (r.ok) {
        lines.push('步数　' + (stepsText(r) || '—'));
        lines.push('CFG　' + (cfgText(r).replace(/^cfg /, '') || '—'));
        if (r.negative) lines.push('负向追加　' + r.negative);
        lines.push('耗时　' + (secsText(r.secs) || '—'));
        lines.push('时间　' + fmtTime(r.ts));
      } else {
        lines.push('失败　' + (r.error || '未知错误'));
      }
      return {
        title: r.tag + (r.ok ? '' : '（失败）'),
        body: lines.join('\n') + (r.prompt ? '\n\n' + r.prompt : '')
      };
    });
    el.onclick = () => { if (r.ok && r.file) showShot(r); renderHistoryOn(); };
    box.appendChild(el);
  }
}

function renderHistoryOn() {
  document.querySelectorAll('.h-item').forEach((el, i) =>
    el.classList.toggle('on', HISTORY[i] && HISTORY[i].tag === PINNED));
}

async function clearHistory() {
  if (!confirm('清空历史显示？（图片文件和账本行都不删，只是不再列出）')) return;
  try {
    await api('/api/gen/clear', {});
    PINNED = null; HISTORY = [];
    renderHistory();
    document.getElementById('shot').innerHTML = '';
    if (!JOBS.some(j => j.state === 'queued'))
      document.getElementById('viewEmpty').style.display = '';
  } catch (e) { toast(e.message); }
}

function toggleHistory() {
  const h = document.getElementById('history');
  h.classList.toggle('hidden');
  document.getElementById('btnShow').style.display =
    h.classList.contains('hidden') ? '' : 'none';
}

// ── 灯箱：本页放大看图 ─────────────────────
function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lbImg').src = src;
  lb.classList.remove('full');
  lb.classList.add('on');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('on', 'full');
}

document.getElementById('lightbox').addEventListener('click', closeLightbox);
document.getElementById('lbImg').addEventListener('click', e => {
  e.stopPropagation();                                  // 点图 = 缩放，不关
  document.getElementById('lightbox').classList.toggle('full');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox();
});

// ── 启动 ────────────────────────────────
loadChannels();
loadHistory();
api('/api/gen/status').then(d => {
  JOBS = d.jobs || [];
  renderJobs();
  if (JOBS.some(j => j.state === 'queued')) startPoll();
  const done = JOBS.filter(j => j.state === 'done');
  if (done.length && !PINNED) showLatestDone();
}).catch(() => {});
</script>
</body>
</html>
