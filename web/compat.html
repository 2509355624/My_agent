<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>兼容自检</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%234fc3f7'/></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f; --elev: #12121a; --input: #1a1a24;
    --line: #2a2a3a; --line2: #1f1f2e;
    --tx: #e8e8f0; --dim: #8888a0; --mute: #555570;
    --ok: #4ade80; --bad: #f87171; --warn: #fbbf24; --info: #4fc3f7;
    --accent: #f472b6;
  }
  html, body { background: var(--bg); color: var(--tx); min-height: 100%;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 13px; line-height: 1.6; padding-bottom: 90px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }

  h1 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 16px; }

  /* 结论卡 */
  .verdict { padding: 14px 16px; border-radius: 10px; margin-bottom: 16px;
    border: 1px solid var(--line2); background: var(--elev); }
  .verdict .big { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .verdict.good { border-color: #1e5c3a; }
  .verdict.good .big { color: var(--ok); }
  .verdict.bad { border-color: #6b2020; }
  .verdict.bad .big { color: var(--bad); }
  .verdict.warn { border-color: #6b5218; }
  .verdict.warn .big { color: var(--warn); }
  .verdict .why { font-size: 12.5px; color: var(--dim); }

  h2 { font-size: 12px; color: var(--mute); font-weight: 500;
    margin: 18px 0 8px; letter-spacing: .4px; }
  table { width: 100%; border-collapse: collapse; background: var(--elev);
    border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; }
  td { padding: 7px 11px; border-bottom: 1px solid var(--line2);
    font-size: 12.5px; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.k { color: var(--dim); width: 44%; }
  td.v { font-family: "SF Mono", Consolas, monospace; font-size: 12px;
    word-break: break-all; }
  .y { color: var(--ok); }
  .n { color: var(--bad); }
  .w { color: var(--warn); }
  .hint { color: var(--mute); font-size: 11px; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: rgba(10,10,15,.96); border-top: 1px solid var(--line2); }
  .bar .in { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  button { flex: 1; background: var(--input); border: 1px solid var(--line);
    color: var(--tx); border-radius: 8px; padding: 11px; font: inherit;
    font-size: 13px; cursor: pointer; }
  button:active { background: var(--accent); color: #000; }
  textarea { position: fixed; left: -9999px; top: 0; }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
    background: var(--input); border: 1px solid var(--line); padding: 8px 16px;
    border-radius: 18px; font-size: 12.5px; opacity: 0; transition: opacity .2s;
    pointer-events: none; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>兼容自检</h1>
  <div class="sub">把这一页截图或者点下面「复制诊断」发给我，就能定位问题。</div>

  <div class="verdict" id="verdict">
    <div class="big" id="vBig">检测中…</div>
    <div class="why" id="vWhy"></div>
  </div>

  <h2>视口实测（判断「输入框看不见」的关键）</h2>
  <table id="tView"></table>
  <div class="hint" id="hView"></div>

  <h2>CSS 特性</h2>
  <table id="tCss"></table>

  <h2>浏览器 API</h2>
  <table id="tApi"></table>

  <h2>环境</h2>
  <table id="tEnv"></table>
</div>

<div class="bar">
  <div class="in">
    <button id="copy">复制诊断</button>
    <button id="reload">重新检测</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<textarea id="dump"></textarea>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var rows = { view: [], css: [], api: [], env: [] };

  function add(group, k, v, cls) {
    rows[group].push([k, v, cls || ""]);
  }

  function yn(ok) { return ok ? ["支持", "y"] : ["不支持", "n"]; }

  // ── CSS 特性：用 CSS.supports 问浏览器 ──
  function cssSupports(prop, val) {
    try {
      if (window.CSS && CSS.supports) return CSS.supports(prop, val);
    } catch (e) {}
    // 极老的浏览器没有 CSS.supports，用一个探针元素试
    try {
      var el = document.createElement("div");
      el.style[prop] = val;
      return el.style[prop] !== "";
    } catch (e) { return false; }
  }

  function run() {
    rows = { view: [], css: [], api: [], env: [] };

    // ── 视口实测 ──
    var innerH = window.innerHeight || 0;
    var clientH = document.documentElement.clientHeight || 0;
    // 真量一个 100vh 的元素，看它比可视区高多少
    var probe = document.createElement("div");
    probe.style.cssText = "position:fixed;top:0;left:0;width:1px;height:100vh;" +
                          "visibility:hidden;pointer-events:none;";
    document.body.appendChild(probe);
    var vhPx = probe.offsetHeight;
    document.body.removeChild(probe);

    var vv = window.visualViewport;
    var vvH = vv ? Math.round(vv.height) : null;

    add("view", "window.innerHeight", innerH + " px");
    add("view", "documentElement.clientHeight", clientH + " px");
    add("view", "1 个 100vh 的实际高度", vhPx + " px");

    // 关键差值：100vh 比真正看得见的那块高出多少
    var base = vvH !== null ? vvH : clientH;
    var diff = vhPx - base;
    add("view", "可视高度（visualViewport 优先）",
        (vvH !== null ? vvH + " px（有 visualViewport）"
                      : clientH + " px（无 visualViewport）"));
    add("view", "100vh 比可视区多出", diff + " px",
        diff > 40 ? "n" : (diff > 4 ? "w" : "y"));

    // ── CSS ──
    var feats = [
      ["CSS 变量 var()", "color", "var(--x)", "--x"],
      ["CSS Grid", "display", "grid"],
      ["flex 的 gap", "gap", "1rem"],
      ["dvh 单位", "height", "100dvh"],
      ["env(safe-area-inset-*)", "padding-bottom", "env(safe-area-inset-bottom)"],
      ["position: fixed", "position", "fixed"],
      ["aspect-ratio", "aspect-ratio", "1 / 1"],
      ["@supports", null, null]
    ];
    feats.forEach(function (f) {
      if (f[1] === null) {
        var ok = cssSupports("color", "red") &&
                 (function () {
                   try { return CSS && typeof CSS.supports === "function"; }
                   catch (e) { return false; }
                 })();
        add("css", f[0], yn(ok)[0], yn(ok)[1]);
        return;
      }
      var r = yn(cssSupports(f[1], f[2]));
      add("css", f[0], r[0], r[1]);
    });

    // ── JS API ──
    var apis = [
      ["fetch", typeof fetch === "function"],
      ["Promise", typeof Promise === "function"],
      ["async / await", (function () {
        try { new Function("return (async function(){})()"); return true; }
        catch (e) { return false; }
      })()],
      ["可选链 a?.b", (function () {
        try { new Function("var a={}; return a?.b"); return true; }
        catch (e) { return false; }
      })()],
      ["空值合并 a ?? b", (function () {
        try { new Function("var a=null; return a ?? 1"); return true; }
        catch (e) { return false; }
      })()],
      ["Array.prototype.includes", typeof [].includes === "function"],
      ["Object.assign", typeof Object.assign === "function"],
      ["visualViewport", !!window.visualViewport],
      ["localStorage", (function () {
        try { localStorage.setItem("_t", "1"); localStorage.removeItem("_t");
              return true; } catch (e) { return false; }
      })()],
      ["IntersectionObserver", typeof IntersectionObserver === "function"]
    ];
    apis.forEach(function (a) { add("api", a[0], yn(a[1])[0], yn(a[1])[1]); });

    // ── 环境 ──
    add("env", "User-Agent", navigator.userAgent);
    add("env", "屏幕（CSS 像素）",
        (screen.width || 0) + " × " + (screen.height || 0));
    add("env", "窗口",
        (window.outerWidth || 0) + " × " + (window.outerHeight || 0));
    add("env", "设备像素比", (window.devicePixelRatio || 1) + "");
    add("env", "语言", navigator.language || "");
    add("env", "是否触摸设备",
        ("ontouchstart" in window) ? "是" : "否");

    // ── 渲染 ──
    ["view", "css", "api", "env"].forEach(function (g) {
      var t = $("t" + g.charAt(0).toUpperCase() + g.slice(1));
      t.innerHTML = rows[g].map(function (r) {
        return '<tr><td class="k">' + esc(r[0]) + '</td>' +
               '<td class="v ' + r[2] + '">' + esc(r[1]) + '</td></tr>';
      }).join("");
    });

    // ── 结论 ──
    var noGap = !cssSupports("gap", "1rem");
    var noGrid = !cssSupports("display", "grid");
    var noDvh = !cssSupports("height", "100dvh");
    var v = $("verdict");
    var big = $("vBig"), why = $("vWhy");

    if (diff > 40) {
      v.className = "verdict bad";
      big.textContent = "底部会被浏览器 UI 挡住";
      why.textContent = "100vh 比真正看得见的区域高出 " + diff +
        "px —— 输入框正好落在这段里。这就是「看不到输入框」的原因。";
    } else if (noGrid) {
      v.className = "verdict bad";
      big.textContent = "不支持 CSS Grid";
      why.textContent = "三栏布局会竖着堆起来。页面已用 flex 兜底，" +
        "但如果还有错位，把这份诊断发给我。";
    } else if (noGap) {
      v.className = "verdict warn";
      big.textContent = "不支持 flex 的 gap";
      why.textContent = "元素会贴在一起。页面已用 margin 兜底，可以正常用。";
    } else if (noDvh) {
      v.className = "verdict warn";
      big.textContent = "不支持 dvh";
      why.textContent = "已退回 100vh，配合视觉视口检测一般不影响使用。";
    } else {
      v.className = "verdict good";
      big.textContent = "浏览器没有明显问题";
      why.textContent = "关键特性都在。如果页面还是不对劲，" +
        "把这份诊断发给我看具体数值。";
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function toast(t) {
    var el = $("toast");
    el.textContent = t;
    el.className = "toast on";
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.className = "toast"; }, 2200);
  }

  function dump() {
    var out = ["=== 角色扮演兼容自检 ===",
               "时间: " + new Date().toString(), ""];
    [["视口", "view"], ["CSS", "css"], ["API", "api"], ["环境", "env"]]
      .forEach(function (g) {
        out.push("[" + g[0] + "]");
        rows[g[1]].forEach(function (r) {
          out.push("  " + r[0] + ": " + r[1]);
        });
        out.push("");
      });
    out.push("结论: " + $("vBig").textContent);
    out.push("说明: " + $("vWhy").textContent);
    return out.join("\n");
  }

  $("copy").onclick = function () {
    var text = dump();
    var ta = $("dump");
    ta.value = text;
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    if (!ok && navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function () {
        toast("已复制");
      }, function () { toast("复制失败，长按下面文字手动选"); });
      return;
    }
    toast(ok ? "已复制" : "复制失败，截图也行");
  };

  $("reload").onclick = function () { run(); toast("已重新检测"); };

  run();
  // 转屏 / 键盘弹出后数值会变，重测一次
  window.addEventListener("resize", function () {
    clearTimeout(window._rt);
    window._rt = setTimeout(run, 300);
  });
})();
</script>
</body>
</html>
