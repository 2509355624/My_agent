<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0d10">
<!-- 主题先于样式落地，避免白天模式闪一下黑底。localStorage 记用户选择，
     没选过就跟系统偏好；页面内切换按钮只改这一个属性。 -->
<script>
(function () {
  var t = "dark";
  try { t = localStorage.getItem("gal_theme") || ""; } catch (e) {}
  if (t !== "light" && t !== "dark") {
    t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
      ? "light" : "dark";
  }
  document.documentElement.dataset.theme = t;
})();
</script>
<title>画廊</title>
<style>
  :root{
    --bg:#0c0d10; --card:#171a20; --card2:#20242c; --line:#2a2f39;
    --line-soft:#20242c; --tx:#f2f3f7; --dim:#9aa0ad; --mute:#6e7482;
    --pink:#ff5c8a; --pink-soft:rgba(255,92,138,.15); --gold:#ffc453;
    --topbar:rgba(12,13,16,.92); --scrim:rgba(8,9,12,.86);
    --on-image:#f5f5f7; --shadow:0 16px 44px rgba(0,0,0,.45);
  }
  :root[data-theme="light"]{
    --bg:#f5f6f8; --card:#ffffff; --card2:#eef1f5; --line:#dfe3ea;
    --line-soft:#e9ecf1; --tx:#1b1e24; --dim:#67707e; --mute:#929aa6;
    --pink:#e0456f; --pink-soft:rgba(224,69,111,.1); --gold:#c08a15;
    --topbar:rgba(245,246,248,.92); --scrim:rgba(12,14,18,.82);
    --on-image:#ffffff; --shadow:0 16px 44px rgba(24,32,48,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
    "Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  a{color:inherit;text-decoration:none}

  /* ── 顶栏 ── */
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:12px 14px calc(12px + env(safe-area-inset-top,0)) 14px;
    background:var(--bg);
    border-bottom:1px solid var(--line)}
  .brand{font-size:17px;font-weight:700;letter-spacing:.5px}
  .brand i{color:var(--pink);font-style:normal}
  .tabs{display:flex;gap:4px;margin-left:auto;background:var(--card);
    border-radius:10px;padding:3px}
  .tabs button{border:0;background:transparent;color:var(--dim);font:inherit;
    font-size:13px;padding:6px 14px;border-radius:8px;cursor:pointer}
  .tabs button.on{background:var(--card2);color:var(--tx);font-weight:600}
  .go{font-size:13px;color:var(--dim);padding:6px 10px;border:1px solid var(--line);
    border-radius:9px;white-space:nowrap;flex:0 0 auto;background:transparent;
    cursor:pointer;font-family:inherit}
  .go:hover{color:var(--tx);border-color:var(--pink)}
  .go.theme{width:34px;padding:6px 0;text-align:center;font-size:16px;line-height:1}
  /* 游客的登录按钮：要在一排灰按钮里被一眼看到，否则等于没做 */
  .go.login-btn{color:#fff;background:var(--pink);border-color:var(--pink);
    font-weight:600}
  .go.login-btn:hover{color:#fff;filter:brightness(1.08)}
  .more-menu{display:none;position:absolute;right:12px;top:calc(100% + 8px);
    z-index:30;width:210px;padding:8px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow)}
  header.more-open .more-menu{display:grid;gap:2px}
  .menu-item{display:block;padding:10px 12px;border-radius:8px;
    color:var(--dim);font-size:13px}
  .menu-item:hover{background:var(--card2);color:var(--tx)}
  @media(max-width:430px){
    header{gap:8px;padding-left:12px;padding-right:12px}
    .brand{font-size:16px}
    .tabs button{padding:6px 10px;font-size:12.5px}
    .go{padding:6px 8px;font-size:12px}
    .more-menu{left:12px;right:12px;width:auto;
      grid-template-columns:1fr 1fr}
  }
  /* 加上主题按钮后，320px 上四个标题挤不下；这个宽度页面身份已经由 tab
     说清楚了，品牌字让位给操作。 */
  @media(max-width:380px){
    .brand{display:none}
    .tabs{margin-left:auto}
    .go.theme{width:30px}
  }

  /* ── 工具条 ── */
  .tools{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px 4px;
    position:relative}
  .tools .tool-more{display:none;position:absolute;left:14px;top:calc(100% + 2px);
    z-index:25;min-width:132px;padding:6px;background:var(--card);
    border:1px solid var(--line);border-radius:10px;
    box-shadow:var(--shadow);flex-direction:column;gap:4px}
  .tools .tool-more.on{display:flex}
  .tools .tool-more button{text-align:left;white-space:nowrap}
  .tools .tool-more-label{font-size:11px;color:var(--dim);padding:2px 8px 5px;
    border-bottom:1px solid var(--line);margin-bottom:2px;white-space:nowrap}
  .tools button{border:1px solid var(--line);background:var(--card);color:var(--tx);
    font:inherit;font-size:13px;padding:7px 13px;border-radius:10px;cursor:pointer}
  .tools button:active{background:var(--card2)}
  .tools button.primary{background:var(--pink);border-color:var(--pink);
    color:#fff;font-weight:600}
  /* 分类条（2026-11-05）：按主文件夹快速切换。横向可滚，手机上一行放不下。
     2026-11-10：原来把滚动条藏了、桌面竖滚轮又不能横滚 → 用户看着一堆标签
     卡在那儿"滑不动"。改成细滚动条常显 + JS 把竖滚轮映射成横滚。 */
  .grps{display:none;gap:6px;padding:8px 14px 10px;overflow-x:auto;
    -webkit-overflow-scrolling:touch;scrollbar-width:thin;
    scrollbar-color:var(--line) transparent}
  .grps.on{display:flex}
  .grps::-webkit-scrollbar{height:6px}
  .grps::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .grps::-webkit-scrollbar-track{background:transparent}
  .grps button{flex:none;border:1px solid var(--line);background:var(--card);
    color:var(--dim);font:inherit;font-size:12.5px;padding:5px 12px;
    border-radius:999px;cursor:pointer;white-space:nowrap}
  .grps button.on{background:var(--card2);border-color:var(--pink);color:var(--tx);
    font-weight:600}
  /* 「我的」的子标签：作品 / 收藏 / 点赞。做成下划线式，不跟顶栏那两个
     药丸抢视觉——这里切的是同一页的内容细分，不是换去处。 */
  .subtabs{display:none;gap:18px;padding:10px 14px 2px;border-bottom:1px solid var(--line)}
  .subtabs.on{display:flex}
  .subtabs button{border:0;background:transparent;color:var(--dim);font:inherit;
    font-size:13.5px;padding:0 0 9px;cursor:pointer;position:relative}
  .subtabs button.on{color:var(--tx);font-weight:600}
  .subtabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;
    height:2px;background:var(--pink);border-radius:2px}

  .hint{padding:0 14px 6px;color:var(--dim);font-size:12.5px;line-height:1.6}
  /* 一句话就够：这面墙是什么、主操作在哪。不再做一张说明卡占首屏。 */
  .wall-guide{margin:8px 14px 0;color:var(--mute);font-size:12px;line-height:1.5}

  /* ── 网格 ── */
  main{padding:6px 14px calc(40px + env(safe-area-inset-bottom,0))}
  /* 320px 的老 SE 也要能放两列：2×140 + 10 间隙 = 290 ≤ 屏宽减边距 */
  #grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  @media(min-width:760px){#grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}}
  .card{position:relative;border-radius:12px;overflow:hidden;background:var(--card);
    cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
  .card:active{transform:scale(.975)}
  /* 桌面才有 hover，触摸设备上按住就亮会很脏（:hover 在手机上会粘住） */
  @media(hover:hover) and (pointer:fine){
    .card:hover{transform:translateY(-3px);
      box-shadow:var(--shadow),0 0 0 1px var(--line)}
  }
  .card .ph{width:100%;aspect-ratio:3/4;display:block;object-fit:cover;
    background:linear-gradient(135deg,var(--card2),var(--line-soft));opacity:0;transition:opacity .35s}
  .card .ph.ok{opacity:1}
  .card .meta{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 11px;
    background:linear-gradient(transparent,var(--scrim));font-size:12px}
  .card .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .srow{display:flex;align-items:center;gap:8px;margin-top:2px}
  .card .s{flex:1 1 auto;min-width:0;color:var(--on-image);font-size:11px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 卡片最下面的「隐藏」：只有站主在站长 tab 看得到。字要小、底要暗，
     别把标题和封面压下去；按下去给一下反馈，避免连点。 */
  .card .hb{flex:0 0 auto;font:inherit;font-size:11px;line-height:1;
    padding:5px 10px;border-radius:20px;cursor:pointer;
    color:var(--on-image);background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.26)}
  .card .hb:active{background:var(--pink);border-color:var(--pink);color:#fff}
  .card .hb.back{border-color:rgba(255,92,138,.65);color:#ffd3de}
  .card .badge{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.66);
    color:var(--on-image);font-size:11px;padding:2px 7px;border-radius:20px}
  .card .off{position:absolute;top:7px;left:7px;background:rgba(255,92,138,.92);
    color:#fff;font-size:11px;padding:2px 7px;border-radius:20px}

  .empty{text-align:center;color:var(--dim);padding:56px 20px;font-size:14px;line-height:1.8}

  /* ── 作品集详情（网格）── */
  #detail{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;
    flex-direction:column}
  #detail.on{display:flex}
  .dtop{display:flex;align-items:center;gap:10px;padding:12px 14px;
    padding-top:calc(12px + env(safe-area-inset-top,0));flex:0 0 auto;
    background:var(--topbar);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line)}
  .dtop button{border:0;background:var(--card2);color:var(--tx);
    font:inherit;font-size:20px;line-height:1;width:36px;height:36px;
    border-radius:50%;cursor:pointer;flex:0 0 auto}
  .dinfo{flex:1;min-width:0}
  .dt{font-size:15px;font-weight:600;overflow:hidden;white-space:nowrap;
    text-overflow:ellipsis}
  .dby{font-size:12px;color:var(--dim);margin-top:1px}
  /* 排版切换：按钮上直接写「现在是哪种」，比一个抽象图标好猜 */
  #dmode{width:auto;border-radius:10px;padding:0 12px;font-size:13px;
    background:var(--card);border:1px solid var(--line);height:32px}
  /* 「加图」单独占一行放在左上：36px 的圆形按钮里塞三个字点不准，
     而且在顶栏里还得跟标题抢位置。给个 44px 高的大按钮，拇指一按就到。 */
  .daddbar{display:none;align-items:center;gap:10px;padding:10px 14px 12px;
    flex:0 0 auto;background:var(--topbar);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line)}
  .daddbar.on{display:flex}
  #dadd{height:44px;border:0;border-radius:12px;padding:0 22px;font:inherit;
    font-size:16px;font-weight:700;letter-spacing:.5px;color:#141418;
    background:linear-gradient(135deg,#ff5c8a,#ffa0bd);cursor:pointer;
    box-shadow:0 6px 18px rgba(255,92,138,.28);white-space:nowrap}
  #dadd:active{transform:scale(.97)}
  .daddhint{font-size:12.5px;color:var(--dim);min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  /* 网格是默认，单列给「想看清楚点」的场景。
     ⚠️ 两种都按原比例完整显示，绝不裁切 —— 之前用 aspect-ratio:3/4
     配 object-fit:cover，4928×7360 的竖图被切掉上下，人物脸都在框外。
     网格用几个子列各自向下堆（瀑布流），一行里高度不同也不会互相拉扯；
     单列直接竖排。高度全由图片自己决定，别用 grid 的行高（会把十几张
     平均压进一屏，每张只剩一条横条）。 */
  #dgrid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:flex;gap:8px;align-items:flex-start;
    padding:10px 12px calc(28px + env(safe-area-inset-bottom,0))}
  #dgrid.one{flex-direction:column;gap:10px;max-width:760px;
    margin:0 auto;width:100%;align-items:stretch}
  .dcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  @media(min-width:760px){
    #dgrid{gap:12px}
    .dcol{gap:12px}
  }
  .shot{position:relative;border-radius:10px;overflow:hidden;background:var(--card);
    cursor:pointer;
    /* ⚠️ flex 里子项默认会被压缩：不给 flex:0 0 auto，十几张图会被挤进
       一屏，每张只剩一条几十像素的横条（单列和两列都踩过这个坑）。 */
    flex:0 0 auto;width:100%}
  /* aspect-ratio 只是懒加载前的占位，加载完 onload 会换成真实比例 */
  .shot img{width:100%;height:auto;display:block;opacity:0;
    transition:opacity .3s;aspect-ratio:3/4;background:var(--card)}
  .shot img.ok{opacity:1}
  .shot .pg{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.62);
    color:var(--on-image);font-size:11px;line-height:16px;padding:1px 6px;
    border-radius:20px;backdrop-filter:blur(4px)}
  .shot .mk{position:absolute;right:7px;top:6px;font-size:14px;line-height:1;
    text-shadow:0 1px 4px rgba(0,0,0,.9)}
  /* 单张隐藏：右下角那颗按钮。存在感要低（一屏几十张，别抢图），但按下去
     要够大——手机上用拇指点，20px 的小图标点不中。 */
  .shot .hb-item{position:absolute;right:6px;bottom:6px;z-index:3;
    padding:3px 9px;border:0;border-radius:999px;cursor:pointer;
    background:rgba(0,0,0,.56);color:#fff;font-size:11px;line-height:16px;
    font-family:inherit;backdrop-filter:blur(4px);opacity:.72;
    transition:opacity .16s,background .16s}
  .shot .hb-item:hover,.shot .hb-item:active{opacity:1;background:rgba(0,0,0,.78)}
  /* 已藏的那张：压暗 + 灰，一眼能看出「这张不公开」 */
  .shot.off img{opacity:.32 !important;filter:grayscale(.45)}
  .shot.off .hb-item{opacity:1;background:var(--pink);color:#fff}
  .dempty{text-align:center;color:var(--dim);padding:48px 20px;font-size:14px;
    flex:1;width:100%}

  /* ── 查看器 ── */
  #viewer{position:fixed;inset:0;z-index:50;background:#000;display:none;
    flex-direction:column}
  #viewer.on{display:flex}
  .vtop{display:flex;align-items:center;gap:10px;padding:12px 14px;
    padding-top:calc(12px + env(safe-area-inset-top,0));position:relative;z-index:2}
  .vtop .vt{font-size:14px;font-weight:600;overflow:hidden;white-space:nowrap;
    text-overflow:ellipsis;flex:1}
  .vtop .vby{font-size:12px;color:var(--dim)}
  .vtop button{border:0;background:rgba(255,255,255,.1);color:#fff;width:34px;height:34px;
    border-radius:50%;font-size:17px;line-height:1;cursor:pointer;flex:0 0 auto}
  .stage{flex:1;position:relative;overflow:hidden;touch-action:pan-y}
  .track{display:flex;height:100%;will-change:transform;
    transition:transform .28s cubic-bezier(.22,.61,.36,1)}
  .track.drag{transition:none}
  .slide{flex:0 0 auto;height:100%;display:flex;align-items:center;
    justify-content:center;padding:8px}
  .slide img{max-width:100%;max-height:100%;object-fit:contain;
    opacity:0;transition:opacity .25s;user-select:none;-webkit-user-drag:none}
  .slide img.ok{opacity:1}
  .vbot{display:flex;align-items:center;gap:6px;padding:10px 14px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom,0));
    background:linear-gradient(transparent,rgba(0,0,0,.9));position:relative;z-index:2}
  .vbot .pg{font-size:13px;color:var(--dim);min-width:64px}
  .vbot .sp{flex:1}
  .act{border:0;background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:13px;
    padding:8px 13px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:5px}
  .act.on{background:var(--pink)}
  .act.fav.on{background:var(--gold);color:#2a1d00}
  .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;border:0;
    background:rgba(0,0,0,.45);color:#fff;width:40px;height:58px;border-radius:10px;
    font-size:20px;cursor:pointer}
  .nav.l{left:8px}.nav.r{right:8px}
  /* 触摸设备上箭头纯属挡图：手指本来就能滑（见下面那段 touchstart/move），
     40×58 的方块还正好压在图片左右两边。 */
  @media(hover:none){.nav{display:none}}
  /* 手机上底部四个元素在 320px 上会顶出去，允许换行兜底；同时把按钮压窄一点，
     正常 360px 及以上的机型还是一行。 */
  @media(max-width:430px){
    .vbot{gap:5px;padding-left:12px;padding-right:12px;flex-wrap:wrap}
    .vbot .pg{min-width:52px;font-size:12px}
    .act{padding:7px 10px;font-size:12.5px;gap:4px}
  }

  /* ── 上传面板 ── */
  #up{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:none;
    align-items:flex-end;justify-content:center;padding:0}
  #up.on{display:flex}
  .sheet{width:100%;max-width:560px;background:var(--card);border-radius:18px 18px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom,0));
    max-height:86vh;overflow:auto}
  @media(min-width:600px){#up{align-items:center}
    .sheet{border-radius:18px}}
  .sheet h3{margin:0 0 4px;font-size:16px}
  .sheet p{margin:0 0 14px;color:var(--dim);font-size:12.5px}
  .sheet input[type=text]{width:100%;background:var(--card2);border:1px solid var(--line);
    color:var(--tx);font:inherit;padding:11px 12px;border-radius:10px;margin-bottom:12px}
  .pick{display:block;border:1px dashed var(--line);border-radius:12px;padding:22px 12px;
    text-align:center;color:var(--dim);font-size:13px;margin-bottom:12px;cursor:pointer}
  .pick.has{color:var(--tx);border-style:solid}
  .pickdir{display:block;width:100%;border:1px solid var(--line);border-radius:11px;
    background:var(--card2);color:var(--tx);font:inherit;padding:12px;
    margin-bottom:10px;cursor:pointer}
  .pickdir[disabled]{opacity:.55;cursor:default}
  #prev{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  #prev img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:var(--card2)}
  .row{display:flex;gap:8px}
  .row button{flex:1;border:0;font:inherit;padding:12px;border-radius:11px;cursor:pointer}
  .row .cancel{background:var(--card2);color:var(--tx)}
  .row .ok{background:var(--pink);color:#fff;font-weight:600}
  .row .ok[disabled]{opacity:.5}

  /* ── 选文件夹面板 ── */
  #scanbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);
    display:none;align-items:flex-end;justify-content:center}
  #scanbox.on{display:flex}
  @media(min-width:600px){#scanbox{align-items:center}}

  /* ── 看已隐藏：密码面板 ── */
  #pinbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.76);
    display:none;align-items:flex-end;justify-content:center}
  #pinbox.on{display:flex}
  @media(min-width:600px){#pinbox{align-items:center}}
  #pinbox .sheet{max-width:380px}
  #pininput{letter-spacing:.4em;font-size:20px !important;text-align:center}
  #pinerr{min-height:18px;color:#ff8f8f;font-size:12.5px;margin:-4px 0 10px}
  .sheet .row input[type=text]{margin-bottom:0}
  .sheet .row .up{flex:0 0 auto;background:var(--card2);border:0;color:var(--tx);
    font:inherit;font-size:16px;padding:0 15px;border-radius:10px;cursor:pointer}
  .dirs{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:12px;
    background:var(--card2);margin-bottom:12px;-webkit-overflow-scrolling:touch}
  .dirs .d{display:flex;align-items:center;gap:9px;padding:11px 12px;cursor:pointer;
    font-size:13.5px;border-bottom:1px solid var(--line)}
  .dirs .d:last-child{border-bottom:0}
  .dirs .d:active{background:var(--card)}
  .dirs .d .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .dirs .d .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dirs .d .hp{color:var(--dim);font-size:11px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .dirs .d .ct{color:var(--gold);font-size:12px;flex:0 0 auto}
  .dirs .d .ct.z{color:var(--dim)}
  .dirs .n{padding:20px 12px;text-align:center;color:var(--dim);font-size:13px}
  .nowline{font-size:12.5px;color:var(--dim);margin-bottom:10px;line-height:1.6;
    word-break:break-all}
  .nowline b{color:var(--tx);font-weight:600}

  #toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);
    background:var(--card2);color:var(--tx);font-size:13px;padding:10px 18px;
    border-radius:20px;opacity:0;pointer-events:none;transition:.24s;z-index:99;
    border:1px solid var(--line);max-width:86vw;text-align:center}
  #toast.on{opacity:1;transform:translate(-50%,0)}

  /* 翻页条（2026-11-22 群友要求）：墙面是「往下滑无限加载」，滑到第 5 页
     关掉再进来又从第 1 页开始，中途也看不出自己在第几页。这条常驻底部：
     上一页 / 直接输页码 / 下一页。位置记在 localStorage，下次进来直接还原。 */
  .pager{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
    display:none;align-items:center;gap:2px;z-index:40;
    background:var(--topbar);border:1px solid var(--line);border-radius:20px;
    padding:4px 6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .pager.on{display:flex}
  .pager button{width:32px;height:30px;border:0;background:transparent;color:var(--tx);
    font-size:18px;line-height:1;border-radius:50%;cursor:pointer;padding:0}
  .pager button:disabled{opacity:.28}
  .pager input{width:3.2em;height:30px;border:0;background:transparent;color:var(--tx);
    font:inherit;font-size:13.5px;text-align:center;padding:0}
  .pager input::-webkit-outer-spin-button,
  .pager input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .pager .pgsum{color:var(--dim);font-size:11.5px;padding:0 6px 0 2px;white-space:nowrap}
</style>
</head>
<body>

<header id="galHeader">
  <div class="brand">画廊</div>
  <div class="tabs">
    <button data-tab="owner" class="on">站长</button>
    <button data-tab="pub">公开</button>
    <button data-tab="mine" id="tabMine">我的</button>
  </div>
  <button class="go theme" id="themeToggle" type="button"
          aria-label="切换白天/黑夜模式" title="切换白天/黑夜模式">☀</button>
  <!-- 游客的常驻登录按钮（2026-11-25）：原来只在「更多 ▾」菜单里有一条文字，
       群友根本找不到，于是「有登录墙却找不到登录的地方」。这里放在页头常驻，
       登录后由 applyGuest 的反向逻辑收起来。 -->
  <a class="go login-btn" href="/preset" id="guestLoginBar" style="display:none"
     title="登录后可以收藏、点赞、进自己的作品">登录</a>
  <button class="go more-btn" id="moreBtn" type="button"
          aria-haspopup="true" aria-expanded="false">更多 ▾</button>
  <div class="more-menu" id="moreMenu">
    <a class="menu-item" href="/preset" id="presetLink">自定义预设</a>
    <!-- 游客用「登录」占住预设那个位置：点了回到登录页，登完再进画廊 -->
    <a class="menu-item" href="/preset" id="guestLogin" style="display:none">登录</a>
    <a class="menu-item" href="/workshop">提示词工坊</a>
    <a class="menu-item" href="/persona">角色扮演</a>
    <a class="menu-item" href="/comic">漫画台</a>
    <a class="menu-item" href="/novel">小说模式</a>
  </div>
</header>

<!-- 「我的」下面再分三格：作品 / 收藏 / 点赞。只在「我的」时出现 -->
<div class="subtabs" id="subtabs">
  <button data-sub="works" class="on">作品</button>
  <button data-sub="favs">收藏</button>
  <button data-sub="likes">点赞</button>
</div>

<div class="wall-guide" id="wallGuide" role="note"></div>

<div class="tools" id="tools"></div>
<!-- 分类条：按主文件夹切换（2026-11-05）。只在「站长」tab 显示 -->

<div class="hint" id="hint">正在加载…</div>

<main><div id="grid"></div></main>

<div class="pager" id="pager">

<!-- 作品集详情：先进这里看网格，点某张才全屏 -->
<div id="detail">
  <div class="dtop">

<!-- 查看器 -->
<div id="viewer">
  <div class="vtop">
    <button id="vclose">✕</button>

      <div class="vt" id="vtitle"></div>

  <div class="vbot">

<!-- 上传 -->
<div id="up">
  <div class="sheet">
    <h3 id="upttl">上传作品集</h3>
    <p>默认并进你上一个没装满的作品集，凑满 100 张才开新的。上传会压成
      1600px 的 WebP，原图不用你管。</p>
    <input type="text" id="uptitle" placeholder="给这个作品集起个名字" maxlength="40">
    <label id="newline" style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);padding:0 0 10px">

    </label>

    </label>

    <div class="row">

</div>

<!-- 选文件夹扫描 -->
<div id="scanbox">
  <div class="sheet">
    <h3>扫描文件夹</h3>
    <p>点「从电脑中选择文件夹」，或者直接粘完整路径。只能扫具体文件夹，
      不能扫整块盘；每个「直接放着图」的目录算一个作品集。</p>
    <div class="nowline" id="scnow"></div>
    <button class="pickdir" id="scpick" type="button">从电脑中选择文件夹</button>
    <div class="row" style="margin-bottom:10px">
      <input type="text" id="scpath" placeholder="D:\Users\gjl\Pictures\new">
      <button class="up" id="scup" title="上一级">↑</button>
    </div>
    <div class="dirs" id="scdirs"></div>
    <div class="row">
      <button class="cancel" id="sccancel">取消</button>
      <button class="ok" id="scgo">扫描这里</button>
    </div>
  </div>
</div>

<!-- 看已隐藏：6 位密码（每次进都要重输，不记验证态） -->
<div id="pinbox">
  <div class="sheet">
    <h3>查看已隐藏</h3>
    <p>这是站主私人的一面墙。输入 6 位密码才能进入。</p>
    <input type="text" id="pininput" inputmode="numeric" autocomplete="off"
           placeholder="6 位数字" maxlength="6">
    <div id="pinerr"></div>
    <div class="row">
      <button class="cancel" id="pincancel">取消</button>
      <button class="ok" id="pinok">进入</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  var S = { tab: "owner", sub: "works", page: 1, more: true, busy: false,
            owner: false, guest: false, works: [], cur: null, idx: 0,
            items: [], likes: {}, fav: {}, layout: "2", shotEls: [],
            grp: "", grps: [], hiddenView: false };

  var PAGE_SIZE = 24;

  // ── 白天 / 黑夜 ────────────────────────────────────────
  // 主题在 <head> 里已经先落到 <html data-theme>，这里只同步按钮和浏览器配色。
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    var btn = $("themeToggle");
    if (btn) {
      btn.textContent = t === "dark" ? "☀" : "☾";
      var label = t === "dark" ? "切到白天模式" : "切到黑夜模式";
      btn.setAttribute("aria-label", label);
      btn.title = label;
    }
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = t === "light" ? "#f5f6f8" : "#0c0d10";
  }
  applyTheme(document.documentElement.dataset.theme || "dark");
  var themeBtn = $("themeToggle");
  if (themeBtn) themeBtn.onclick = function () {
    var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    try { localStorage.setItem("gal_theme", next); } catch (e) {}
    applyTheme(next);
  };

  // ── 位置记忆（2026-11-22 群友要求）────────────────────
  // 墙面滑到第 5 页、作品集看到第 120 张，退出再进来都是从第一屏开始。
  // 这里把「已经加载到第几页 + 视口第一个的序号」记进 localStorage，
  // 下次进同一个 tab（同一个分类）先把它加载回来再滚过去。
  //
  // 为什么记序号而不是 scrollTop：详情页几百张图是 lazy 的，没加载的图
  // 高度就是 0，scrollTop 存下来的那个数字再恢复时对不上同一个位置；
  // 序号（第几张）跟布局无关，滚过去之后图自己会长出来。
  var POS_KEY = "gal_pos_v1";
  var RESTORE = null;          // 这次 load(true) 要还原到哪：{p: 页, i: 序号}
  var RESTORE_TRIES = 0;

  function posAll() {
    try { return JSON.parse(localStorage.getItem(POS_KEY) || "{}") || {}; }
    catch (e) { return {}; }
  }
  function posPut(key, val) {
    var a = posAll();
    a[key] = val;
    // 只留最近 40 条：站主 370 个作品集，每本都记一条会把 localStorage 撑满
    var ks = Object.keys(a);
    if (ks.length > 40) {
      ks.sort(function (x, y) { return (a[x].t || 0) - (a[y].t || 0); });
      ks.slice(0, ks.length - 40).forEach(function (k) { delete a[k]; });
    }
    try { localStorage.setItem(POS_KEY, JSON.stringify(a)); } catch (e) {}
  }
  function posGet(key) { return posAll()[key] || null; }
  // 「看已隐藏」是另一面墙，位置分开记，切回来不会把正常那面的进度冲掉
  function wallKey() {
    return "w|" + S.tab + "|" + S.sub + "|" + S.grp + (S.hiddenView ? "|h" : "");
  }

  // 视口里第一个还没滚过去的卡片，就是「我看到哪儿了」
  function firstVisibleIdx() {
    var kids = $("grid").children;
    for (var i = 0; i < kids.length; i++) {
      if (kids[i].getBoundingClientRect().bottom > 56) return i;
    }
    return Math.max(0, kids.length - 1);
  }

  function saveWallPos() {
    if (!S.works.length || !S.page) return;
    posPut(wallKey(), { p: S.page - 1, i: firstVisibleIdx(), t: Date.now() });
  }

  function restoreWallPos() {
    RESTORE_TRIES = 0;
    var p = posGet(wallKey());
    RESTORE = (p && p.p > 1) ? { p: p.p, i: p.i || 0 } : null;
  }

  // 缺的页一页一页补回来，补够再滚过去。墙最多几百个作品集（十几页），
  // 本地一次往返几十毫秒；走隧道的群友会慢一点，但只发生在进来的那一下。
  function pumpRestore() {
    if (!RESTORE) return;
    if (RESTORE_TRIES++ > 60) { RESTORE = null; return; }
    if (S.page - 1 < RESTORE.p) {
      if (S.more) { load(false); return; }
      // 已经到底（或者这一次 has_more 没给对）：退到最后已知的一屏。
      // 这条兜底是必须的——不然人就被留在第一页顶上，正是要修的那个病。
      RESTORE = { p: S.page - 1, i: Math.max(0, S.works.length - PAGE_SIZE) };
    }
    var el = $("grid").children[Math.min(RESTORE.i, S.works.length - 1)];
    if (el) el.scrollIntoView({ block: "start" });
    RESTORE = null;
    renderPager();
  }

  // ── 翻页条 ────────────────────────────────────────────
  function curPage() {
    if (!S.works.length) return 1;
    return Math.floor(firstVisibleIdx() / PAGE_SIZE) + 1;
  }

  function renderPager() {
    var on = !!S.works.length && document.body.style.overflow !== "hidden";
    $("pager").classList.toggle("on", on);
    if (!on) return;
    var n = curPage();
    var inp = $("pgIn");
    if (document.activeElement !== inp) inp.value = n;
    $("pgPrev").disabled = (n <= 1);
    $("pgNext").disabled = (!S.more) && (n * PAGE_SIZE >= S.works.length);
    $("pgSum").textContent = "/ " + (S.page - 1);
  }

  function gotoPage(n) {
    n = Math.max(1, Math.floor(n) || 1);
    var target = (n - 1) * PAGE_SIZE;
    if (target >= S.works.length) {
      if (!S.more) { toast("已经到底了，最后一页是第 " + (S.page - 1) + " 页"); return; }
      // 还没加载到那一页：补到那一页再滚
      $("pgSum").textContent = "加载中…";
      RESTORE = { p: n, i: target };
      RESTORE_TRIES = 0;
      load(false);
      return;
    }
    var el = $("grid").children[target];
    if (el) el.scrollIntoView({ block: "start" });
    renderPager();
  }

  function $(id) { return document.getElementById(id); }

  function toast(msg, ms) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(toast._t);
    // 上传完那条要报七八个数字，2.4 秒看不完
    toast._t = setTimeout(function () { t.classList.remove("on"); },
                          ms || 2400);
  }

  function api(path, opt) {
    opt = opt || {};
    return fetch("/api/gal/" + path, opt).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: "返回看不懂" }; });
    }).then(function (d) {
      if (!d.ok && d.error) throw new Error(d.error);
      return d;
    });
  }

  // ── 缩略图批取 ────────────────────────────────────────
  // 一张 17KB 的缩略图走隧道要 0.6 秒，而那 0.6 秒几乎全是「等对方回话」，
  // 不是传图。首屏 24 张各自等一次就是十几秒。这里一次请求把一屏全拿回来
  // （服务端 base64 塞 JSON），只等一次。
  //
  // 拿回来的 dataURL 存在内存里：同一张图在同一页里只取一次，翻回去、
  // 重进作品集都不用再问。按字节数封顶，超了先丢最早的那批——手机内存
  // 经不起把整墙图都留成 base64。
  //
  // 键必须带尺寸：`t` 是 360px 缩略图，`v` 是 1600px 预览。早先只按 id 存，
  // 网格预取过缩略图之后，点开大图 `picSrc(id,"v")` 直接把那 360px 的
  // dataURL 还给查看器——看着像「大图迟迟不变清楚」，其实是永远拿不到了。
  var PIC = new Map(), PIC_BYTES = 0, PIC_MAX = 8 << 20;
  var PIC_CHUNK = 24;

  function picKey(id, mode) { return (mode || "t") + ":" + id; }

  function picPut(id, url, mode) {
    var k = picKey(id, mode);
    if (PIC.has(k)) return;
    PIC.set(k, url);
    PIC_BYTES += url.length;
    while (PIC_BYTES > PIC_MAX && PIC.size > 1) {
      var old = PIC.keys().next().value;
      PIC_BYTES -= PIC.get(old).length;
      PIC.delete(old);
    }
  }

  function picGet(id, mode) { return PIC.get(picKey(id, mode)); }

  function picSrc(id, mode) {
    return picGet(id, mode) || ("/api/gal/img/" + id + "?s=" + (mode || "t"));
  }

  // 把一批 id 预取到内存里。永远 resolve，最多等 ms 毫秒——慢也不能把
  // 整个页面卡在这个 await 上，超时就退回逐张请求。
  function prefetch(ids, mode, ms) {
    mode = mode || "t";
    var need = [], seen = {};
    ids.forEach(function (id) {
      if (!id || seen[id] || picGet(id, mode)) return;
      seen[id] = 1;
      need.push(id);
    });
    if (!need.length) return Promise.resolve();

    var per = mode === "v" ? 6 : PIC_CHUNK;
    var jobs = [];
    for (var i = 0; i < need.length; i += per) {
      jobs.push(need.slice(i, i + per));
    }
    var all = Promise.all(jobs.map(function (chunk) {
      return fetch("/api/gal/thumbs?ids=" + chunk.join(",") +
                   "&s=" + mode)
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d || !d.ok || !d.items) return;
          Object.keys(d.items).forEach(function (k) { picPut(+k, d.items[k], mode); });
        })
        .catch(function () {});       // 预取失败就当没做，逐张请求照样能看
    }));
    return Promise.race([
      all,
      new Promise(function (res) { setTimeout(res, ms || 5000); })
    ]);
  }

  // 图片怎么铺：
  // 1) 先按正常 URL 拉。图带一年 immutable，翻回去、清屏重开都是 0 请求
  //    ——这条不能丢，它是「第二次打开快」的全部依据。
  // 2) 一秒后还没出来的（隧道一次一次往返，24 张能拖十几秒），改走批接口
  //    一次全拿回来。只补「屏幕上和下一屏」的，一个作品集 288 张的话不能
  //    把没滚动到的全预取下来。
  // 两条路都失败也不报错，图就是灰底占位，跟以前一样。
  function fillPics(list, mode) {
    if (!list.length) return;
    list.forEach(function (x) { x.el.src = picSrc(x.id, mode); });

    setTimeout(function () {
      var vh = window.innerHeight || 800;
      var need = list.filter(function (x) {
        if (!x.el.isConnected || x.el.complete) return false;
        var r = x.el.getBoundingClientRect();
        return r.bottom > -vh && r.top < vh * 2.2;
      });
      if (!need.length) return;
      // 这些还在一个个慢慢拉，先把它们掐掉——不然批请求要和二十几个
      // 半截请求抢同一条窄管道，等于白传一遍。
      var ids = need.map(function (x) { return x.id; });
      need.forEach(function (x) { x.el.removeAttribute("src"); });
      prefetch(ids, mode, 8000).then(function () {
        need.forEach(function (x) {
          if (!x.el.isConnected) return;
          var u = picGet(x.id, mode);
          x.el.style.opacity = "";
          // 批请求失败就退回单张：宁可慢一点，也不能让图空在那里
          x.el.src = u || ("/api/gal/img/" + x.id + "?s=" + mode);
        });
      });
    }, 900);
  }

  // ── 列表 ──────────────────────────────────────────────
  // 「我的 / 收藏」「我的 / 点赞」是**按图**排的（item 级），其它都是作品集。
  function isPhoto() { return S.tab === "mine" && S.sub !== "works"; }

  function load(reset) {
    if (S.busy) return Promise.resolve();
    if (!reset && !S.more) return Promise.resolve();
    S.busy = true;
    if (reset) {
      S.page = 1; S.more = true; S.works = []; $("grid").innerHTML = "";
      restoreWallPos();          // 上次看到第几页，这次一进来就补回去
    }
    var photo = isPhoto();
    var q;
    if (photo) {
      q = (S.sub === "favs" ? "favs" : "likes") + "?page=" + S.page + "&size=24";
    } else if (S.tab === "mine") {
      q = "mine?page=" + S.page + "&size=24";
    } else {
      // scope=owner 站长的（磁盘目录 + 站主网页上传的）；scope=pub 其他人的
      q = "list?scope=" + (S.tab === "pub" ? "pub" : "owner") +
          "&page=" + S.page + "&size=24";
      if (S.grp) q += "&grp=" + encodeURIComponent(S.grp);
      // 「看已隐藏」只出下架那批，给站主反悔用；群友点了也没有这个入口
      if (S.hiddenView) q += "&hidden=1";
    }

    var p = api(q).then(function (d) {
      S.owner = !!d.owner;
      S.grps = (!photo && S.tab !== "mine") ? (d.grps || []) : [];
      renderTools();
      renderGrps();
      var pics = [];
      if (photo) {
        (d.items || []).forEach(function (it) {
          S.works.push(it); addPhoto(it, pics);
        });
      } else {
        (d.works || []).forEach(function (w) {
          S.works.push(w); addCard(w, pics);
        });
      }
      fillPics(pics, "t");
      S.more = !!d.has_more;
      S.page += 1;
      $("hint").textContent = S.works.length
        ? (S.more ? "继续往下滑…" : "一共 " + S.works.length + (photo ? " 张" : " 个作品集"))
        : "";
      if (!S.works.length) showEmpty();
    }).catch(function (e) {
      $("hint").textContent = e.message || "加载失败";
    }).then(function () {
      S.busy = false;
      renderPager();
      // 还原位置优先：目标那页还没补齐就接着补，补齐了才滚过去；
      // 还原期间不做「首屏没撑满就自动续载」，否则两路会打架。
      if (RESTORE) { pumpRestore(); return; }
      // 首屏没撑满一屏时，IntersectionObserver 只会在页面刚加载时回调一次，
      // 那会儿 busy 还是 true，直接被 return 吞掉；之后 sentinel 一直没离开
      // 视口，就再也不会回调 —— 表现就是「永远只有第一页 24 个」。这里补一次。
      if (S.more && sentinel && window.innerHeight &&
          sentinel.getBoundingClientRect().top < window.innerHeight + 600) {
        load(false);
      }
    });
    return p;
  }

  function showEmpty() {
    var g = $("grid");
    g.innerHTML = "";
    var d = document.createElement("div");
    d.className = "empty";
    d.style.gridColumn = "1 / -1";
    if (S.hiddenView) {
      d.innerHTML = "没有隐藏的作品。<br>卡片点「隐藏」之后会收在这里，随时能放回去。";
    } else if (S.tab === "mine" && S.sub === "favs") {
      d.innerHTML = "还没收藏过。<br>点开任意一张图，点右下角的「☆ 收藏」。";
    } else if (S.tab === "mine" && S.sub === "likes") {
      d.innerHTML = "还没点过赞。<br>看到喜欢的图点一下 ♡ 就行。";
    } else if (S.tab === "mine") {
      d.innerHTML = S.owner
        ? "还没有作品集。<br>切到「站长」可以扫描磁盘上的文件夹。"
        : "你还没上传过作品。<br>点上面的「上传作品集」选几张图试试。";
    } else if (S.tab === "pub") {
      d.innerHTML = "还没有其他人上传。<br>群友在「我的」里传了自己的图，就会出现在这里。";
    } else {
      d.innerHTML = "画廊还是空的。<br>站主扫描一下磁盘，或者自己传一组上去。";
    }
    g.appendChild(d);
  }

  function addCard(w, out) {
    var c = document.createElement("div");
    c.className = "card";
    // 单图作品集（2026-11-05）：点击直接进查看器，不再多点一次作品集详情。
    // 两张以上才需要先看网格。
    c.onclick = function () { openWork(w.id, w.n === 1 ? 0 : null,
                                         w.n === 1); };

    var img = document.createElement("img");
    img.className = "ph";
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = w.title;
    // src 先不填：这一屏的封面统一走一次批请求，回来再一起填。
    if (w.cover && out) out.push({ id: w.cover, el: img });
    else if (w.cover) img.src = "/api/gal/img/" + w.cover + "?s=t";
    img.onload = function () { img.classList.add("ok"); };
    img.onerror = function () { img.classList.add("ok"); img.style.opacity = ".35"; };
    c.appendChild(img);

    if (w.n > 1) {
      var b = document.createElement("div");
      b.className = "badge";
      b.textContent = w.n;
      c.appendChild(b);
    }
    if (w.hidden) {
      var o = document.createElement("div");
      o.className = "off";
      o.textContent = "已下架";
      c.appendChild(o);
    }

    var m = document.createElement("div");
    m.className = "meta";
    var t = document.createElement("div");
    t.className = "t";
    t.textContent = w.title;
    var srow = document.createElement("div");
    srow.className = "srow";
    var s = document.createElement("div");
    s.className = "s";
    s.textContent = (w.grp ? w.grp + " · " : "") + w.by;
    srow.appendChild(s);
    // 站长（w.can_hide 由后端按身份给）对谁的都能隐藏：磁盘目录、群友上传
    // 的公开作品都一样。点了就和清掉扫描结果一样从墙上消失（2026-11-22
    // 用户要求，不弹确认）。文件还在盘上；误点从「看已隐藏」里捞回来。
    // 「我的」tab 不出这个按钮，那边是作者自己的管理页，口径保持原样。
    if (w.can_hide && S.tab !== "mine") {
      var hb = document.createElement("button");
      hb.type = "button";
      hb.className = "hb" + (S.hiddenView ? " back" : "");
      hb.textContent = S.hiddenView ? "恢复" : "隐藏";
      hb.onclick = function (e) {
        e.stopPropagation();        // 别顺手把作品集点开
        setHidden(w, c, !S.hiddenView);
      };
      srow.appendChild(hb);
    }
    m.appendChild(t); m.appendChild(srow);
    c.appendChild(m);
    $("grid").appendChild(c);
  }

  // 收藏 / 点赞里的单张图。点开直接进查看器并停在那一张，
  // 不经过「先列作品集、再进去找」这一步。
  function addPhoto(it, out) {
    var c = document.createElement("div");
    c.className = "card";
    c.onclick = function () { openWork(it.work, it.idx); };

    var img = document.createElement("img");
    img.className = "ph";
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = it.title;
    if (out) out.push({ id: it.id, el: img });
    else img.src = "/api/gal/img/" + it.id + "?s=t";
    img.onload = function () { img.classList.add("ok"); };
    img.onerror = function () { img.classList.add("ok"); img.style.opacity = ".35"; };
    c.appendChild(img);

    var m = document.createElement("div");
    m.className = "meta";
    var t = document.createElement("div");
    t.className = "t";
    t.textContent = it.title;
    var s = document.createElement("div");
    s.className = "s";
    s.textContent = it.by;
    m.appendChild(t); m.appendChild(s);
    c.appendChild(m);
    $("grid").appendChild(c);
  }

  // 每个 tab 一句白话说明：先说清这面墙是什么，再说按钮干什么。
  // 隐藏墙没有密码缓存，退出后指引立刻跟着变回去。
  function updateGuide() {
    var box = $("wallGuide");
    if (!box) return;
    if (S.hiddenView) {
      box.textContent = "已隐藏的作品 · 点「← 返回画廊」退出";
      return;
    }
    var texts = {
      owner: "本机作品 · 上传 / 整理在下方",
      pub: "群友公开作品 · 点开看图",
      mine: "我的作品 · 收藏 / 点赞可切换"
    };
    box.textContent = texts[S.tab] || "";
  }

  // ── 工具条 ────────────────────────────────────────────
  function renderTools() {
    updateGuide();
    var t = $("tools");
    t.innerHTML = "";
    if (S.tab === "mine" && S.sub === "works") {
      t.appendChild(btn("＋ 上传作品集", "primary", function () { openUpload(); }));
    }
    // 扫描是站主的事，放「站长」tab —— 它扫的就是这一批目录，
    // 放在这里按钮和内容对得上，也不用挤在「我的」里。
    // 隐藏墙（2026-11-22 确认：站长 tab / 公开 tab 的入口进来是同一面
    // 列全的墙）——退出按钮在哪都得有，且要一眼看得到，不能只藏在
    // 「更多」里。返回不需要密码。
    if (S.owner && S.hiddenView) {
      t.appendChild(btn("← 返回画廊", "primary", toggleHidden));
    }
    if (S.owner && S.tab === "owner") {
      if (!S.hiddenView) {
        t.appendChild(btn("＋ 扫描文件夹", "primary", openScan));
      }
      t.appendChild(btn("更多 ▾", "tool-more-btn", function () {
        var m = $("toolMore");
        if (m) m.classList.toggle("on");
      }));
      var more = document.createElement("div");
      more.className = "tool-more";
      more.id = "toolMore";
      more.appendChild(moreLabel("整理（清空类操作不可撤销）"));
      more.appendChild(btn("↻ 全部重扫", "", scanAll));
      more.appendChild(btn("⌫ 清理失效", "", clean));
      if (S.grp && !S.hiddenView) {
        // 只清当前选中的这个文件夹。分类条上点的是哪个，清的就是哪个，
        // 判据和列表完全一致（连虚拟标签「漫画」都一样）。
        more.appendChild(btn("🗑 清空「" + S.grp + "」", "", function () {
          clearGrp(S.grp);
        }));
      }
      more.appendChild(btn("🗑 清空扫描结果", "", clearScan));
      // 进隐藏墙要先过 6 位密码；退出（toggleHidden 回正常墙）不用。
      if (!S.hiddenView) {
        more.appendChild(btn("👁 看已隐藏（需密码）", "", askPin));
      }
      t.appendChild(more);
    }
    // 公开 tab 站长也有「看已隐藏」入口：隐藏的可能是群友传的公开作品，
    // 反悔时不用切回站长 tab 再找（2026-11-22 用户确认，两个 tab 都要）。
    if (S.owner && S.tab === "pub" && !S.hiddenView) {
      t.appendChild(btn("更多 ▾", "tool-more-btn", function () {
        var m = $("toolMore");
        if (m) m.classList.toggle("on");
      }));
      var pm = document.createElement("div");
      pm.className = "tool-more";
      pm.id = "toolMore";
      pm.appendChild(moreLabel("隐私（进墙要密码）"));
      pm.appendChild(btn("👁 看已隐藏（需密码）", "", askPin));
      t.appendChild(pm);
    }
  }

  function btn(text, cls, fn) {
    var b = document.createElement("button");
    b.textContent = text;
    if (cls) b.className = cls;
    b.onclick = fn;
    return b;
  }

  function moreLabel(text) {
    var d = document.createElement("div");
    d.className = "tool-more-label";
    d.textContent = text;
    return d;
  }

  // 分类条：`全部` + 接口返回的各主文件夹名。只在「站长」tab 显示——
  // 公开墙是群友上传，没有磁盘分类这回事。
  function renderGrps() {
    var box = $("grps");
    if (!box) return;
    // 竖滚轮 → 横向滚（2026-11-10）：桌面端鼠标没有横向滚动手势，标签一多
    // 就"堆着滑不动"。只在真有横向溢出、且以纵向滚动为主时才接管；滚到两端
    // 就放行页面，别把人卡在标签条上。只挂一次，重复 render 不重复绑。
    if (!box.dataset.wheelBound) {
      box.dataset.wheelBound = "1";
      box.addEventListener("wheel", function (e) {
        if (this.scrollWidth <= this.clientWidth) return;      // 没溢出，别管
        if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;  // 已经是横滚，别插手
        var atStart = this.scrollLeft <= 0 && e.deltaY < 0;
        var atEnd = this.scrollLeft + this.clientWidth >= this.scrollWidth - 1
                    && e.deltaY > 0;
        if (atStart || atEnd) return;                          // 到头了，让页面滚
        this.scrollLeft += e.deltaY;
        e.preventDefault();
      }, { passive: false });
    }
    // 2026-11-22：原来这里带 S.owner，手机走 5175 隧道没带站主 QQ，
    // 后端 owner=false，分类条就被藏了——但 grps 数据照常返回，白瞎。
    // 分类只是文件夹名（moss漫画 / 生图页…），站长 tab 的作品本来就按
    // hidden=0 公开列出，显示分类不泄露任何额外内容，所以不再看 owner。
    // 隐藏墙入口（renderTools 里那个）仍认 owner，那里才是真隐私。
    var show = S.tab === "owner" && !S.hiddenView
               && (S.grps || []).length > 0;
    box.classList.toggle("on", show);
    if (!show) { box.innerHTML = ""; return; }
    box.innerHTML = "";
    [""].concat(S.grps).forEach(function (g) {
      var b = document.createElement("button");
      b.textContent = g || "全部";
      if ((S.grp || "") === g) b.className = "on";
      b.onclick = function () {
        if ((S.grp || "") === g) return;
        saveWallPos();              // 每个分类各记各的位置
        S.grp = g;
        load(true);
        renderGrps();
      };
      box.appendChild(b);
    });
  }

  // 扫全部已配置的根（.env 里那两个）。日常增量更新点这个。
  function scanAll() {
    if (S.busy) return;
    S.busy = true;
    toast("正在扫描磁盘…");
    api("scan", { method: "POST", headers: { "Content-Type": "application/json" },
                  body: "{}" }).then(function (d) {
      var r = d.result || {};
      toast("扫完了：" + (r.works || 0) + " 个作品集，"
            + (r.items || 0) + " 张图，" + (r.seconds || 0) + " 秒");
      // 必须先放开 busy 再 load：load() 开头就有 `if (S.busy) return`，
      // 原来这里 busy 还是 true，扫完原地不动 —— 看起来就是「扫了没反应」。
      S.busy = false;
      load(true);
    }).catch(function (e) { toast(e.message); S.busy = false; });
  }

  // ── 选文件夹 ──────────────────────────────────────────
  var SC = { path: "", parent: "" };

  function isDriveRoot(p) {
    return /^[A-Za-z]:[\\/]?$/.test(p || "") || (p || "") === "/";
  }

  function markScanButton() {
    var b = $("scgo");
    var blocked = isDriveRoot(SC.path);
    b.disabled = !SC.path || blocked;
    b.textContent = blocked ? "请进到文件夹" : "扫描这里";
  }

  function openScan() {
    $("scanbox").classList.add("on");
    var last = "";
    try { last = localStorage.getItem("gal_scan_path") || ""; } catch (e) {}
    browseTo(last);
  }
  function closeScan() { $("scanbox").classList.remove("on"); }

  // 服务端弹出 Windows 原生选文件夹窗口。浏览器本身拿不到本机绝对路径，
  // 这一步必须由服务端（就是站主这台电脑）来选。
  function pickFolder() {
    var b = $("scpick");
    if (b.disabled) return;
    b.disabled = true;
    b.textContent = "正在打开选择窗口…";
    api("pick-folder?initial=" + encodeURIComponent(SC.path || ""))
      .then(function (d) {
        if (d.path) browseTo(d.path);
      }).catch(function (e) { toast(e.message); })
      .then(function () {
        b.disabled = false;
        b.textContent = "从电脑中选择文件夹";
      });
  }

  function browseTo(p) {
    api("browse?path=" + encodeURIComponent(p || "")).then(function (d) {
      SC.path = d.path || "";
      SC.parent = d.parent || "";
      $("scpath").value = SC.path;
      try { localStorage.setItem("gal_scan_path", SC.path); } catch (e) {}
      markScanButton();

      var now = $("scnow");
      now.innerHTML = "";
      if (SC.path) {
        var has = d.images || 0;
        now.appendChild(document.createTextNode("当前："));
        var b = document.createElement("b");
        b.textContent = SC.path;
        now.appendChild(b);
        now.appendChild(document.createTextNode(
          has ? "（这里直接有 " + has + " 张图）" : "（这里没有直接的图，只有子目录）"));
      } else {
        now.textContent = "点下面的文件夹进去，或者在上面粘一个完整路径。";
      }

      var box = $("scdirs");
      box.innerHTML = "";
      if (!d.dirs || !d.dirs.length) {
        box.innerHTML = '<div class="n">这里面没有子目录</div>';
        return;
      }
      d.dirs.forEach(function (x) {
        var r = document.createElement("div");
        r.className = "d";
        var ic = document.createElement("span");
        ic.textContent = "📁";
        var mid = document.createElement("span");
        mid.className = "mid";
        var nm = document.createElement("span");
        nm.className = "nm";
        nm.textContent = x.name;
        mid.appendChild(nm);
        if (x.hint) {
          var hp = document.createElement("span");
          hp.className = "hp";
          hp.textContent = x.hint;
          mid.appendChild(hp);
        }
        var ct = document.createElement("span");
        ct.className = "ct" + (x.n ? "" : " z");
        ct.textContent = x.n ? x.n + " 张" : "";
        r.appendChild(ic); r.appendChild(mid); r.appendChild(ct);
        r.onclick = function () { browseTo(x.path); };
        box.appendChild(r);
      });
    }).catch(function (e) { toast(e.message); });
  }

  function goScan() {
    if (!SC.path) { toast("先点进一个文件夹"); return; }
    if (isDriveRoot(SC.path)) { toast("不能扫描整块盘，请进到具体文件夹"); return; }
    var b = $("scgo");
    b.disabled = true;
    b.textContent = "扫描中…";
    api("scan", { method: "POST", headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ path: SC.path }) })
      .then(function (d) {
        var r = d.result || {};
        toast("扫完了：" + (r.works || 0) + " 个作品集，"
              + (r.items || 0) + " 张图");
        closeScan();
        setTab("owner");
      }).catch(function (e) { toast(e.message); })
      .then(function () { markScanButton(); });
  }

  $("sccancel").onclick = closeScan;
  $("scanbox").onclick = function (e) { if (e.target === $("scanbox")) closeScan(); };
  $("scpick").onclick = pickFolder;
  $("scup").onclick = function () { if (SC.path) browseTo(SC.parent); };
  $("scgo").onclick = goScan;
  $("scpath").onkeydown = function (e) {
    if (e.key === "Enter") { e.preventDefault(); browseTo(this.value.trim()); }
  };

  function clean() {
    api("clean", { method: "POST", headers: { "Content-Type": "application/json" },
                   body: "{}" }).then(function (d) {
      toast("清掉 " + (d.removed || 0) + " 条失效记录");
      load(true);
    }).catch(function (e) { toast(e.message); });
  }

  // 清空站主扫描索引。群友上传的作品和磁盘原图都不动，只把扫错的目录
  // 从库里拿掉，方便重新扫正确的文件夹。
  function clearScan() {
    if (S.busy) return;
    if (!window.confirm("清空站长的扫描结果？群友上传的作品和磁盘原图不会动。")) {
      return;
    }
    S.busy = true;
    toast("正在清空扫描结果…");
    api("clear", { method: "POST", headers: { "Content-Type": "application/json" },
                   body: "{}" }).then(function (d) {
      S.grp = "";
      toast("已清空 " + (d.works || 0) + " 个作品集、"
            + (d.items || 0) + " 张图的索引");
      S.busy = false;
      load(true);
    }).catch(function (e) { toast(e.message); S.busy = false; });
  }

  // 只清一个文件夹的扫描索引（2026-11-22 用户要求：不弹确认）。
  // 站主扫进来一个不想留的目录，没必要为它整库重扫几个小时。原图还在盘上，
  // 想找回来重新扫那个目录就行——这条只是把库里的记录拿掉。
  function clearGrp(grp) {
    if (!grp || S.busy) return;
    S.busy = true;
    toast("正在清空「" + grp + "」…", 4000);
    api("clear", { method: "POST", headers: { "Content-Type": "application/json" },
                   body: JSON.stringify({ grp: grp }) }).then(function (d) {
      S.grp = "";
      toast("「" + grp + "」清掉了：" + (d.works || 0) + " 个作品集、"
            + (d.items || 0) + " 张图", 3600);
      S.busy = false;
      load(true);
    }).catch(function (e) { toast(e.message); S.busy = false; });
  }

  // 单本隐藏 / 恢复。隐藏 = 公开墙和管理页都不再出现（服务端 hidden=1），
  // 和清掉扫描结果看到的效果一样，但文件、缩略图、排序都留着，随时能放回。
  function setHidden(w, el, hidden) {
    api("visible", { method: "POST", headers: { "Content-Type": "application/json" },
                     body: JSON.stringify({ work_id: w.id, hidden: hidden }) })
      .then(function () {
        w.hidden = hidden;
        // 直接从这个墙面摘掉，不留空位；S.works 不动，位置记忆的序号不会错位
        if (el) el.style.display = "none";
        toast((hidden ? "已隐藏《" : "已放回《") + w.title + "》"
              + (hidden ? "　更多 → 看已隐藏（需密码）" : ""), 3000);
      }).catch(function (e) { toast(e.message); });
  }

  function toggleHidden() {
    S.hiddenView = !S.hiddenView;
    S.grp = "";
    renderTools();
    renderGrps();
    load(true);
  }

  // ── 看已隐藏：6 位密码 ────────────────────────────────
  // 每次点进来都要重输一次，不在前端存任何「已验证」标记——
  // 面试把手机递出去，对方就算翻到这个入口也进不去那面墙。
  // 校验在后端（密码只有 state 里的哈希），前端连密码是什么都不知道。
  function askPin() {
    $("pininput").value = "";
    $("pinerr").textContent = "";
    $("pinbox").classList.add("on");
    setTimeout(function () { $("pininput").focus(); }, 50);
  }
  function closePin() { $("pinbox").classList.remove("on"); }

  function submitPin() {
    var code = ($("pininput").value || "").trim();
    if (!/^\d{6}$/.test(code)) {
      $("pinerr").textContent = "请输入 6 位数字";
      return;
    }
    var okBtn = $("pinok");
    okBtn.disabled = true;
    api("pin/verify", { method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ pin: code }) })
      .then(function () {
        closePin();
        toggleHidden();                   // 验过了才进，验不过留在原墙面
      })
      .catch(function (e) {
        $("pinerr").textContent = e.message || "验证失败";
        $("pininput").value = "";
        $("pininput").focus();
      })
      .then(function () { okBtn.disabled = false; });
  }

  $("pincancel").onclick = closePin;
  $("pinok").onclick = submitPin;
  $("pininput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") submitPin();
  });
  $("pinbox").addEventListener("click", function (e) {
    if (e.target === $("pinbox")) closePin();   // 点遮罩空白处关掉
  });

  // ── 作品集详情 ────────────────────────────────────────
  // 点卡片进来先看网格（两列 / 单列可切），再点某张才全屏滑动。
  // `at` 有值时（从收藏、点赞点进来）直接替你打开全屏并停在那张，
  // 但详情页依然垫在它下面，关掉查看器不会一脚踹回首页。
  function openWork(id, at, direct) {
    RESTORE = null;                       // 进作品集了，墙不用再往回补页
    saveWallPos();                        // 从哪一格点进来的，回去还在那儿
    api("work/" + id).then(function (d) {
      S.cur = d.work;
      S.items = d.items || [];
      S.fav = {};
      (d.items || []).forEach(function (it) { if (it.fav) S.fav[it.id] = 1; });
      // 单图作品集：不垫详情页，直接开查看器（2026-11-05 用户要求）。
      // 关掉查看器就回墙面；`closeViewer` 已经处理了「详情页没开」的滚动。
      if (direct && S.items.length === 1) {
        warmHd([S.items[0].id]);
        openViewer(0);
        return;
      }
      renderDetail();
      $("detail").classList.add("on");
      document.body.style.overflow = "hidden";
      $("dgrid").scrollTop = 0;
      // 上次在这本里看到第几张就滚回第几张。at 指定了具体某张时不还原：
      // 那是从墙上点进来看的那一张，他要去的就是那张。
      if (at == null) restoreDetailPos(S.cur.id);
      $("pager").classList.remove("on");
      // 详情页一打开就把头几张的大图热起来（浏览器缓存 + 后端转码）。
      // 从网格点进去是最常见路径，那一下不该再等 0.4 秒转码加一次往返。
      var head = (at != null && at > 1) ? Math.max(0, at - 1) : 0;
      warmHd(S.items.slice(head, head + 6).map(function (it) { return it.id; }));
      if (at != null) openViewer(at);
    }).catch(function (e) { toast(e.message); });
  }

  // ── 作品集里「看到第几张」──────────────────────────────
  // 一个作品集能装 100 张，手机上一屏三张，看到第 60 张退出再进来又回顶上。
  // 记序号不记 scrollTop：没加载的图高度是 0，scrollTop 存下来对不上位置。
  // 恢复也不能只滚一次——图一张张撑开会把目标往下推，所以「推一次校一次」，
  // 位置连续两次不动才算稳；用户一碰屏幕就停，不跟他抢。
  function saveDetailPos() {
    if (!S.cur || !S.items.length) return;
    var box = $("dgrid");
    if (!box) return;
    var top = box.getBoundingClientRect().top;
    var best = 0;
    for (var i = 0; i < S.shotEls.length; i++) {
      var s = S.shotEls[i];
      if (s && s.getBoundingClientRect().bottom > top + 8) { best = i; break; }
    }
    posPut("d|" + S.cur.id, { i: best, t: Date.now() });
  }

  function restoreDetailPos(id) {
    var p = posGet("d|" + id);
    if (!p || !p.i) return;
    var el = S.shotEls[p.i];
    if (!el) return;
    var n = 0, last = -1, stop = false;
    function halt() { stop = true; }
    window.addEventListener("touchstart", halt, { once: true, passive: true });
    window.addEventListener("wheel", halt, { once: true, passive: true });
    function fix() {
      if (stop || !S.cur || S.cur.id !== id || !el.isConnected) return;
      var top = el.offsetTop;
      el.scrollIntoView({ block: "start" });
      if (Math.abs(top - last) > 6 && n++ < 25) setTimeout(fix, 140);
    }
    fix();
  }

  // 网格铺几列：手机 2、平板 3、桌面 4。按视口宽度算，别写死成两列 ——
  // 1280 的屏幕上两列每张 620px 宽，一屏只能看到两张的头顶。
  function colCount() {
    var w = window.innerWidth || document.documentElement.clientWidth || 390;
    if (w >= 1180) return 4;
    if (w >= 840) return 3;
    return 2;
  }

  function renderDetail() {
    if (!S.cur) return;
    $("dtitle").textContent = S.cur.title;
    $("dby").textContent = S.cur.by +
      (S.cur.n > 1 ? " · " + S.cur.n + " 张" : "") +
      (S.cur.hidden ? " · 已下架" : "");

    // 只有自己传的作品集能继续加图，到了 100 张就不再给入口——留着按钮
    // 点进去必然失败，不如让它消失。
    // ⚠️ 用 class 控制显隐，别用 style.display = ""：那条 inline 只是把
    // 样式撤掉，CSS 里的 display:none 会重新生效，按钮等于永远不出现。
    var n = S.cur.n || 0;
    var canAdd = !!S.cur.can_delete && n < WORK_MAX;
    $("daddbar").classList.toggle("on", canAdd);
    if (canAdd) {
      $("daddhint").textContent = "这个作品集还能加 " + (WORK_MAX - n) + " 张";
    }

    var box = $("dgrid");
    box.innerHTML = "";
    S.shotEls = [];
    box.classList.toggle("one", S.layout === "one");
    if (!S.items.length) {
      box.innerHTML = '<div class="dempty">这个作品集里没有能看的图</div>';
      return;
    }

    // 两列：两个子列交替放，各自往下堆；单列：直接塞进 #dgrid 竖排。
    var cols = null;
    if (S.layout !== "one") {
      var n = colCount();
      cols = [];
      for (var k = 0; k < n; k++) {
        var d = document.createElement("div");
        d.className = "dcol";
        cols.push(d);
        box.appendChild(d);
      }
    }

    var pics = [];
    S.items.forEach(function (it, i) {
      var s = document.createElement("div");
      s.className = "shot" + (it.hidden ? " off" : "");
      s.onclick = function () { openViewer(i); };

      var im = document.createElement("img");
      im.loading = "lazy";              // 一个作品集可能 288 张，不能全拉
      im.decoding = "async";
      im.alt = "";
      pics.push({ id: it.id, el: im });
      im.onload = function () {
        im.classList.add("ok");
        // 占位比例换成真实比例，图才是完整的（不裁、不留黑边）
        if (im.naturalWidth && im.naturalHeight) {
          im.style.aspectRatio = im.naturalWidth + " / " + im.naturalHeight;
        }
      };
      im.onerror = function () { im.classList.add("ok"); im.style.opacity = ".3"; };
      s.appendChild(im);

      var pg = document.createElement("div");
      pg.className = "pg";
      pg.textContent = i + 1;
      s.appendChild(pg);

      if (it.fav) {
        var mk = document.createElement("div");
        mk.className = "mk";
        mk.textContent = "★";
        s.appendChild(mk);
      }

      /* 单张隐藏（2026-11-24 用户：「进到作品集里面的单个图片，右下角也有
         隐藏的按钮，单独隐藏这个图片」）。作品集详情页只有站主能进，所以
         这个按钮不用再判权限。已藏的图在网格里压暗 + 打个「已隐藏」，点按钮
         就是恢复。`stopPropagation` 必须——外层 s.onclick 是打开查看器。 */
      var hb = document.createElement("button");
      hb.type = "button";
      hb.className = "hb-item";
      hb.title = it.hidden ? "取消隐藏这张" : "隐藏这张";
      hb.textContent = it.hidden ? "已隐藏" : "隐藏";
      hb.addEventListener("click", function (e) {
        e.stopPropagation();
        toggleItemHidden(it, s, hb);
      });
      s.appendChild(hb);

      S.shotEls[i] = s;
      (cols ? cols[i % cols.length] : box).appendChild(s);
    });
    fillPics(pics, "t");
  }

  /* 单张隐藏 / 恢复。和 `setHidden`（整本下架）是两件事：这边只让这一页
     不公开，作品集照常挂在墙上、照常点得进来，只是少一张。

     服务端会把 works.n 重算成可见张数，所以「全藏完」之后这本会从墙上
     消失——那种情况直接关掉详情页回墙面，别让站主停在一面全灰的墙上。 */
  function toggleItemHidden(it, el, btn) {
    var on = !it.hidden;
    api("item/hidden", { method: "POST",
                         headers: { "Content-Type": "application/json" },
                         body: JSON.stringify({ item_id: it.id, hidden: on }) })
      .then(function (d) {
        it.hidden = on ? 1 : 0;
        // 抬头那行的「N 张」是可见张数（服务端重算过），跟着改
        if (S.cur && d && typeof d.left === "number") S.cur.n = d.left;
        if (el) el.classList.toggle("off", on);
        if (btn) {
          btn.textContent = on ? "已隐藏" : "隐藏";
          btn.title = on ? "取消隐藏这张" : "隐藏这张";
        }
        // 详情页抬头那行「N 张」要跟着变，不然藏了一张还写着原来的数
        $("dby").textContent = S.cur.by + (S.cur.n > 1 ? " · " + S.cur.n + " 张" : "");
        toast(on ? "这张已隐藏" : "这张放回来了", 1800);
        if (on && d && d.left === 0) {
          // 这本一张可见的都不剩了：服务端那边 n 已经是 0，墙上不会再出现。
          toast("这本的图全藏起来了，已从墙上下架", 3200);
          closeDetail();
          S.dirty = false;
          load(true);
        }
      }).catch(function (e) { toast(e.message); });
  }

  function closeDetail() {
    saveDetailPos();                  // 记住看到第几张，下次进来接着看
    $("detail").classList.remove("on");
    document.body.style.overflow = "";
    $("dgrid").innerHTML = "";
    S.shotEls = [];
    S.cur = null;
    S.items = [];
    renderPager();
    if (location.hash.indexOf("#w=") === 0) {
      history.replaceState(null, "", location.pathname + location.search);
    }
    // 在收藏 / 点赞里改过标记，回到墙面上要重拉，否则卡片还是老样子。
    // 没动过就不重拉，保住原来的滚动位置。
    if (S.dirty) { S.dirty = false; if (isPhoto()) load(true); }
  }

  // 排版：网格 / 单列。记住上次选的，别每次进来都重置。
  // 两种排版的 DOM 结构不一样（几个子列 vs 直接竖排），所以切换得重建。
  function setLayout(m) {
    S.layout = (m === "one") ? "one" : "2";
    try { localStorage.setItem("gal_layout", S.layout); } catch (e) {}
    $("dmode").textContent = S.layout === "one" ? "☰ 单列" : "⊞ 网格";
    if (S.cur) {
      var y = $("dgrid").scrollTop;
      renderDetail();
      $("dgrid").scrollTop = y;
    }
  }

  // 旋转屏幕 / 拉窗口会改变列数，重建一次。防抖，别每像素重排。
  var _rsz = 0;
  window.addEventListener("resize", function () {
    if (!S.cur || S.layout === "one") return;
    clearTimeout(_rsz);
    _rsz = setTimeout(function () {
      if (!S.cur) return;
      var y = $("dgrid").scrollTop;
      renderDetail();
      $("dgrid").scrollTop = y;
    }, 250);
  });

  $("dback").onclick = closeDetail;
  $("dmode").onclick = function () {
    setLayout(S.layout === "one" ? "2" : "one");
  };
  $("dadd").onclick = function () {
    if (S.cur) openUpload(S.cur.id);
  };

  // ── 查看器 ────────────────────────────────────────────
  function openViewer(i) {
    if (!S.items.length || !S.cur) return;
    $("vtitle").textContent = S.cur.title;
    $("vby").textContent = S.cur.by +
      (S.cur.n > 1 ? " · " + S.cur.n + " 张" : "");
    $("vdel").style.display = S.cur.can_delete ? "" : "none";
    $("vdelone").style.display = S.cur.can_delete ? "" : "none";
    buildTrack();
    $("viewer").classList.add("on");
    var n = Math.max(0, Math.min(S.items.length - 1, i || 0));
    go(n, true);
  }

  function buildTrack() {
    var tr = $("track");
    tr.innerHTML = "";
    S.items.forEach(function (it, i) {
      var s = document.createElement("div");
      s.className = "slide";
      var im = document.createElement("img");
      im.alt = "";
      im.decoding = "async";
      im.onload = function () { im.classList.add("ok"); };
      s.appendChild(im);
      tr.appendChild(s);
    });
    tr.style.width = (S.items.length * 100) + "%";
    // 只加载当前和相邻两张：一屏几十 MB 的话手机直接卡死
    S.items.forEach(function (_it, i) { tr.children[i].style.width = (100 / S.items.length) + "%"; });
  }

  // 大图走单张请求：一张 1600px 的预览 170KB 上下，走批接口只是把 base64
  // 灌进内存，多花 1/3 体积。但**不能等点开才开始要**——一张 5MB 原图要
  // 现转码 0.4 秒，再走隧道一次往返，头一秒半就是纯黑屏。所以：
  //   1) 详情页一打开就预热前几张（浏览器缓存 + 后端转码一起）；
  //   2) 打开查看器时先铺已经到手的 360px 缩略图，立刻有画面；
  //   3) 1600px 到了再顶上去，浏览器会等新图解码完才换，不闪白。
  function hdUrl(id) { return "/api/gal/img/" + id + "?s=v"; }

  // 用 <img> 预取而不是塞 PIC：图片带一年 immutable，浏览器磁盘缓存足够，
  // 真正打开时 src 完全一样 → 0 请求。1600px 的 base64 一张顶三张缩略图，
  // 那点手机内存留给网格更划算。
  var WARMING = {}, WARM_IMGS = [], warmT = 0, warmQ = [];

  function warmHd(ids) {
    var fresh = [];
    ids.forEach(function (id) {
      if (!id || WARMING[id]) return;
      WARMING[id] = 1;
      fresh.push(id);
      var im = new Image();
      im.decoding = "async";
      im.onerror = function () { delete WARMING[id]; };   // 失败就下次再说
      im.src = hdUrl(id);
      WARM_IMGS.push(im);
    });
    while (WARM_IMGS.length > 24) WARM_IMGS.shift();   // 别把解码后的位图留一墙
    if (!fresh.length) return;
    warmQ = warmQ.concat(fresh);
    if (warmT) return;
    // 服务端也要提前算：缓存没备好时它是真在解码原图。攒一小会儿再发，
    // 免得滑动时一次一次地打请求。
    warmT = setTimeout(function () {
      var ids = warmQ.slice(0, 12);
      warmQ = [];
      warmT = 0;
      if (!ids.length) return;
      api("warm", { method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ ids: ids }) }).catch(function () {});
    }, 250);
  }

  function preload(i) {
    if (i < 0 || i >= S.items.length) return;
    var s = $("track").children[i];
    if (!s || s.dataset.on) return;          // 同一张只铺一次，别来回重下
    var im = s.querySelector("img");
    if (!im) return;
    s.dataset.on = "1";
    var id = S.items[i].id;
    im.onload = function () { im.classList.add("ok"); };
    var low = picGet(id, "t");
    if (!low) { im.src = hdUrl(id); return; }
    im.src = low;                            // 手里已经有的，0 延迟
    im.classList.add("ok");
    setTimeout(function () { im.src = hdUrl(id); }, 16);
  }

  function go(i, instant) {
    if (!S.items.length) return;
    S.idx = Math.max(0, Math.min(S.items.length - 1, i));
    var tr = $("track");
    if (instant) tr.classList.add("drag");
    tr.style.transform = "translateX(" + (-S.idx * 100 / S.items.length) + "%)";
    if (instant) requestAnimationFrame(function () { tr.classList.remove("drag"); });

    preload(S.idx);
    preload(S.idx + 1);
    preload(S.idx - 1);
    // 再往外的几张只「备着」，不挂进 DOM：连着划的时候不该每次都等隧道。
    warmHd([S.idx + 2, S.idx + 3, S.idx - 2, S.idx + 4, S.idx + 5]
      .map(function (k) { return S.items[k] ? S.items[k].id : 0; }));

    $("vpg").textContent = (S.idx + 1) + " / " + S.items.length;
    $("vprev").style.visibility = S.idx > 0 ? "visible" : "hidden";
    $("vnext").style.visibility = S.idx < S.items.length - 1 ? "visible" : "hidden";
    syncMark();
  }

  function syncMark() {
    var it = S.items[S.idx];
    if (!it) return;
    var lk = $("vlike");
    lk.classList.toggle("on", !!it.like);
    lk.querySelector("b").textContent = it.likes || 0;
    var fv = $("vfav");
    var on = !!(S.fav && S.fav[it.id]);
    fv.classList.toggle("on", on);
    fv.textContent = on ? "★ 已收藏" : "☆ 收藏";
  }

  function mark(kind) {
    var it = S.items[S.idx];
    if (!it) return;
    if (kind === "like") it.like = it.like ? 0 : 1;
    else {
      S.fav = S.fav || {};
      S.fav[it.id] = !S.fav[it.id];
      it.fav = S.fav[it.id] ? 1 : 0;   // 详情网格的星标读这个
    }
    S.dirty = true;                 // 关查看器时决定要不要重拉列表
    syncMark();
    api("mark", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ item_id: it.id, kind: kind, on: kind === "like" ? !!it.like : !!S.fav[it.id] })
    }).then(function (d) {
      if (kind === "like") { it.likes = d.count; syncMark(); }
    }).catch(function (e) { toast(e.message); });
  }

  function closeViewer() {
    $("viewer").classList.remove("on");
    $("track").innerHTML = "";
    // 详情页还垫在下面，body 继续锁滚动；两层都关了才放开。
    if (!$("detail").classList.contains("on")) document.body.style.overflow = "";
    // 收藏星标要跟手更新，不然刚收藏完退回网格还是空的
    if (S.dirty) syncDetailMarks();
  }

  // 把 S.items 上的收藏状态同步到详情网格右上角那颗星。

  // 左右滑

  // ── 上传 ──────────────────────────────────────────────
  var picked = [];
  // 与服务端 UPLOAD_MAX / gallery.WORK_MAX 对齐。一次选多少、一个作品集
  // 总共能装多少是两件事：群友传不完可以先传一批，回头进作品集再接着加。
  var UP_MAX = 10, WORK_MAX = 100;
  var upWid = 0;          // 非 0 = 往已有作品集里加图
  var upLeft = WORK_MAX;  // 这个作品集还能加几张

  // 浏览器能不能编 WebP。Safari 老版本只能 JPEG，那就在 canvas 里先铺白底，
  // 否则透明 PNG 压完是黑块。
  var CAN_WEBP = (function () {
    try {
      return document.createElement("canvas").toDataURL("image/webp")
        .indexOf("image/webp") === 0;
    } catch (e) { return false; }
  })();

  // 传之前先在浏览器里缩到 1600 长边、转 WebP。
  // 慢的不是转码，是传输：一张 13MB 的原图要顺着家宽上行推过隧道，
  // 二十几秒才到；缩完约 150KB。服务端本来就压到 1600，这里压到同一尺寸，
  // 画质一点没多损，省下的是 98% 的流量。
  //
  // 刻意不看 f.type 判断「是不是图」：手机相册、微信选出来的 File 经常
  // type 是空串，按 MIME 挡一道等于把压缩整个跳过，结果就是上百 MB 原图
  // 直接上路——那才是「一直处理中」的真凶。能不能解，交给解码器自己说，
  // 解不开再老老实实回退原图。
  function toFile(cv, name) {
    var type = CAN_WEBP ? "image/webp" : "image/jpeg";
    return new Promise(function (res, rej) {
      cv.toBlob(function (b) {
        if (!b) return rej(new Error("编码失败"));
        res(new File([b], name.replace(/\.[^.]+$/, "")
                     + (CAN_WEBP ? ".webp" : ".jpg"), { type: type }));
      }, type, 0.85);
    });
  }

  function paint(src, w, h, cw, ch, done) {
    try {
      var cv = document.createElement("canvas");
      cv.width = cw;
      cv.height = ch;
      var ctx = cv.getContext("2d");
      if (!CAN_WEBP) {
        ctx.fillStyle = "#fff";     // 不铺白底，透明 PNG 压完是黑块
        ctx.fillRect(0, 0, cw, ch);
      }
      ctx.drawImage(src, 0, 0, cw, ch);
      done(cv);
    } catch (e) { done(null); }
  }

  // 快路径：先只读尺寸（不落像素），再让浏览器**按目标尺寸**解码。
  // JPEG 能直接走 1/2、1/4 降采样，比「全解进内存再缩」快好几倍，
  // 而且解码在后台线程，主线程不卡。
  function shrinkFast(f, res) {
    var url = URL.createObjectURL(f);
    var probe = new Image();
    probe.onload = function () {
      var w = probe.naturalWidth, h = probe.naturalHeight;
      URL.revokeObjectURL(url);
      if (!w || !h) return shrinkSlow(f, res);
      var m = Math.min(1, 1600 / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * m));
      var ch = Math.max(1, Math.round(h * m));
      createImageBitmap(f, { resizeWidth: cw, resizeHeight: ch,
                             resizeQuality: "high" })
        .then(function (bm) {
          paint(bm, w, h, cw, ch, function (cv) {
            bm.close && bm.close();
            if (!cv) return shrinkSlow(f, res);
            toFile(cv, f.name).then(res, function () { res(f); });
          });
        })
        .catch(function () { shrinkSlow(f, res); });
    };
    probe.onerror = function () { URL.revokeObjectURL(url); res(f); };
    probe.src = url;
  }

  // 慢路径 / 兜底：老浏览器没有 createImageBitmap 时走这条。
  function shrinkSlow(f, res) {
    var url = URL.createObjectURL(f);
    var img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight;
      var m = Math.min(1, 1600 / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * m));
      var ch = Math.max(1, Math.round(h * m));
      paint(img, w, h, cw, ch, function (cv) {
        URL.revokeObjectURL(url);
        if (!cv) return res(f);
        toFile(cv, f.name).then(res, function () { res(f); });
      });
    };
    img.onerror = function () { URL.revokeObjectURL(url); res(f); };
    img.src = url;
  }

  function shrink(f) {
    return new Promise(function (res) {
      if (window.createImageBitmap) shrinkFast(f, res);
      else shrinkSlow(f, res);
    });
  }

  function mb(n) {
    return n >= 1048576 ? (n / 1048576).toFixed(1) + "MB"
                        : Math.max(1, Math.round(n / 1024)) + "KB";
  }

  // 上传速率。隧道那头有多快，光看"处理中"是看不出来的——
  // 150KB 走 10 秒和走 0.3 秒，症状一模一样。
  function speed(bytes, ms) {
    if (!bytes || ms < 100) return "";
    var kbs = bytes / 1024 / (ms / 1000);
    return kbs >= 1024 ? (kbs / 1024).toFixed(1) + "MB/s"
                       : Math.round(kbs) + "KB/s";
  }

  // 这一次最多能选几张：单次上限和作品集剩余名额取小的那个。
  function pickMax() { return Math.max(0, Math.min(UP_MAX, upLeft)); }

  function pickHint() {
    if (!upWid) return "＋ 选择图片（最多 " + UP_MAX + " 张）";
    return "＋ 选择图片（最多 " + pickMax() + " 张，这个作品集还能加 "
           + upLeft + " 张）";
  }

  // wid 传了就是「往这个作品集加图」：不新建、不问标题、按剩余名额截。
  // 只认正整数——按钮的 onclick 会把事件对象当第一个参数塞进来，
  // 不挡一下就会把一个 MouseEvent 当成作品集 id。
  function openUpload(wid) {
    upWid = (typeof wid === "number" && wid > 0) ? wid : 0;
    upLeft = upWid ? Math.max(0, WORK_MAX - ((S.cur && S.cur.n) || 0))
                   : WORK_MAX;
    picked = [];
    $("uptitle").value = "";
    $("file").value = "";
    $("prev").innerHTML = "";
    $("pick").classList.remove("has");
    $("upttl").textContent = upWid ? "往作品集里加图" : "上传作品集";
    $("uptitle").style.display = upWid ? "none" : "";
    // 往已有作品集加图时这条没意义——目标已经定死了
    $("newline").style.display = upWid ? "none" : "flex";
    $("upnew").checked = false;
    $("pick").firstChild.textContent = pickHint();
    $("upsubmit").disabled = true;
    $("upsubmit").textContent = "上传";
    $("up").classList.add("on");
  }
  function closeUpload() { $("up").classList.remove("on"); }

  $("upcancel").onclick = closeUpload;
  $("up").onclick = function (e) { if (e.target === $("up")) closeUpload(); };

  $("file").onchange = function () {
    var fs = Array.prototype.slice.call(this.files || []);
    var cap = pickMax();
    if (fs.length > cap) {
      toast(cap ? "这一次最多 " + cap + " 张，多的先去掉"
                : "这个作品集已经 " + WORK_MAX + " 张，满了");
      fs = fs.slice(0, cap);
    }
    picked = fs;
    $("prev").innerHTML = "";
    fs.forEach(function (f) {
      var im = document.createElement("img");
      im.src = URL.createObjectURL(f);
      $("prev").appendChild(im);
    });
    $("pick").classList.add("has");
    var sz = fs.reduce(function (s, f) { return s + (f.size || 0); }, 0);
    $("pick").firstChild.textContent =
      "已选 " + fs.length + " 张 · " + mb(sz) + "（点这里重选）";
    $("upsubmit").disabled = !fs.length;
    if (!$("uptitle").value && fs.length === 1 && !upWid) {
      $("uptitle").value = fs[0].name.replace(/\.[^.]+$/, "").slice(0, 40);
    }
  };

  $("upsubmit").onclick = function () {
    if (!picked.length) return;
    var b = this;
    var title = upWid ? "" : $("uptitle").value.trim();
    var adding = !!upWid;
    var total = picked.length;
    var wid = upWid || 0, ok = 0, bad = 0, inB = 0, outB = 0, upB = 0;
    var lastErr = "";
    var mergedName = "";        // 并进了哪个已有作品集（非空才提示）
    // 三个计时：整批、压缩、纯上传（不含服务端落盘）。
    // 10 张等了一百多秒的时候，光看"处理中"根本不知道慢在浏览器还是网络。
    var tAll = performance.now(), tComp = 0, tUp = 0;
    var label = "准备", ticker = null;

    function secs(ms) { return (ms / 1000).toFixed(1) + "s"; }

    function show() {
      b.textContent = label + " · " + secs(performance.now() - tAll);
    }

    b.disabled = true;
    ticker = setInterval(show, 200);

    function stop() {
      if (ticker) { clearInterval(ticker); ticker = null; }
    }

    function fail(msg) {
      stop();
      toast(msg || "上传失败");
      b.disabled = false;
      b.textContent = "上传";
    }

    function done() {
      stop();
      if (!ok) {
        // 一张都没成：把空壳作品集收回去，别在墙上留个空的。
        // 往已有作品集加图时没这个壳，别去碰它。
        if (wid && !adding) {
          var fd = new FormData();
          fd.append("wid", wid);
          fetch("/api/gal/upload/abort", { method: "POST", body: fd });
        }
        return fail(lastErr || "一张都没传成");
      }
      var saved = outB < inB ? " · " + mb(inB) + "→" + mb(outB) : "";
      var split = "（压缩 " + secs(tComp) + " / 上传 " + secs(tUp)
                + (upB ? " · " + speed(upB, tUp) : "") + "）";
      var head = adding ? "又加了 "
               : mergedName ? "并到《" + mergedName + "》，加了 "
               : "传好了，";
      toast(head + ok + " 张 · 共 "
            + secs(performance.now() - tAll) + split + saved
            + (bad ? "，失败 " + bad + " 张" : ""), 6000);
      closeUpload();
      // 加图之后停在原作品集上刷新，跳回墙上反而让人找不到刚加的那几张
      if (adding) openWork(wid);
      else setTab("mine", "works");
    }

    // 压一张、传一张，而不是攒够一整套再发：第一张几秒内就落地，进度
    // 一直在动；某张失败也只丢那一张，不用把整批重传一遍。
    function step(i) {
      if (i >= total) return done();
      label = (i + 1) + "/" + total + " 压缩中";
      show();
      inB += picked[i].size || 0;
      var t0 = performance.now();
      shrink(picked[i]).then(function (f2) {
        tComp += performance.now() - t0;
        outB += f2.size || 0;
        send(i, f2);
      }, function () {
        tComp += performance.now() - t0;
        bad++;
        step(i + 1);
      });
    }

    function send(i, f) {
      var fd = new FormData();
      fd.append("title", title);
      if (wid) {
        fd.append("wid", wid);
      } else if ($("upnew").checked) {
        // 只有第一张才决定「新建还是并入」：后面几张已经认准同一个集了
        fd.append("force_new", "1");
      }
      fd.append("file", f, f.name);
      var xhr = new XMLHttpRequest();
      xhr.open("POST", "/api/gal/upload/one");
      var t1 = performance.now();
      // 请求体发完的那一下，才是"网络"的真实耗时；之后是服务端在转码落盘。
      xhr.upload.onload = function () {
        tUp += performance.now() - t1;
        upB += f.size || 0;
      };
      xhr.upload.onprogress = function (e) {
        if (!e.lengthComputable) return;
        var pct = Math.round(e.loaded / e.total * 100);
        label = (i + 1) + "/" + total + " 上传 " + pct + "%";
        show();
      };
      xhr.onload = function () {
        var d = {};
        try { d = JSON.parse(xhr.responseText) || {}; } catch (e) {}
        if (d.ok) {
          wid = d.work_id; ok++;
          // 第一张回来才知道落到哪个集：不是新建的就记下人家的名字
          if (!adding && d.new === false && !mergedName) mergedName = d.title;
        }
        else { bad++; lastErr = d.error || "上传失败"; }
        step(i + 1);
      };
      xhr.onerror = function () { bad++; lastErr = "网络断了"; step(i + 1); };
      xhr.send(fd);
    }

    step(0);
  };

  // ── tab / 滚动 ────────────────────────────────────────

  // 游客模式（2026-11-04）：只读。收掉「我的」和「自定义预设」，换成「登录」。
  // 隐藏只是界面层的收窄——写接口在 5174 仍然要 qq，藏不藏按钮都改不了数据。
  //
  // 2026-11-25：「登录」原来只有「更多 ▾」菜单里一个文字项，群友找不到，
  // 表现出来就是「有登录墙但不知道在哪登录」。现在页头常驻一个「登录」按钮。
  function applyGuest() {
    S.guest = true;
    var mine = $("tabMine");
    if (mine) mine.style.display = "none";
    var preset = $("presetLink");
    if (preset) preset.style.display = "none";
    var login = $("guestLogin");
    if (login) login.style.display = "";
    var bar = $("guestLoginBar");
    if (bar) bar.style.display = "";
    if (S.tab === "mine") { S.tab = "owner"; S.sub = "works"; }
    document.querySelectorAll(".tabs button").forEach(function (b) {
      b.classList.toggle("on", b.dataset.tab === S.tab);
    });
    renderSubtabs();
  }

  // 深链接：/gallery#w=35 打开某个作品集；#pub / #mine / #favs / #likes 直接切过去
  function fromHash() {
    var h = location.hash || "";
    if (S.guest && (h === "#mine" || h === "#favs" || h === "#likes")) {
      h = "#owner";                      // 游客没有「我的」，别把人送进空页
    }
    if (h === "#mine") { setTab("mine", "works"); return; }
    if (h === "#favs") { setTab("mine", "favs"); return; }
    if (h === "#likes") { setTab("mine", "likes"); return; }
    if (h === "#pub") { setTab("pub"); return; }
    if (h === "#owner") { setTab("owner"); return; }
    var m = /^#w=(\d+)$/.exec(h);
    if (m) openWork(parseInt(m[1], 10));
  }
  window.addEventListener("hashchange", fromHash);

  // 首屏先按 hash 定 tab，避免「先请求站长、再切我的」跑两遍
  (function () {
    var h = location.hash || "";
    if (h === "#pub") S.tab = "pub";
    else if (h === "#mine" || h === "#favs" || h === "#likes") S.tab = "mine";
    if (h === "#favs") S.sub = "favs";
    else if (h === "#likes") S.sub = "likes";
    document.querySelectorAll(".tabs button").forEach(function (b) {
      b.classList.toggle("on", b.dataset.tab === S.tab);
    });
    renderSubtabs();
    updateGuide();
  })();
  // 排版沿用上次选的（两列 / 单列），默认两列
  (function () {
    var m = "2";
    try { m = localStorage.getItem("gal_layout") || "2"; } catch (e) {}
    setLayout(m);
  })();
  // 先问一句「我是谁」再走：游客要收掉两个入口，不能先渲染出「我的」再闪掉。
  // /me 在本机是同一进程，几十毫秒；失败也照常进画廊（登录页已经拦过一道）。
  //
  // ⚠️ 2026-11-25 修 bug：原来失败分支是空的（`.catch(function(){})`），
  // 于是 /me 一挂就**既没收掉「我的」、也没露出登录按钮**——用户看到的是
  // 「有登录墙但找不到登录的地方」。失败时按游客处理：宁可少露一个「我的」，
  // 也不能让人找不到登录入口。
  fetch("/me").then(function (r) { return r.json(); }).then(function (m) {
    if (!m || m.guest || !m.qq) applyGuest();
  }).catch(function () {
    applyGuest();
  }).then(function () { load(true); });
  setTimeout(fromHash, 600);
})();
</script>

<script>
(function () {
  var head = document.getElementById("galHeader");
  var btn = document.getElementById("moreBtn");
  var menu = document.getElementById("moreMenu");
  if (!head || !btn || !menu) return;
  function close() {
    head.classList.remove("more-open");
    btn.setAttribute("aria-expanded", "false");
  }
  btn.addEventListener("click", function (e) {
    e.stopPropagation();
    var open = head.classList.toggle("more-open");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  menu.addEventListener("click", function (e) {
    if (e.target.closest("a")) close();
  });
  head.addEventListener("click", function (e) {
    if (e.target.closest("#moreBtn") || e.target.closest("#moreMenu")) return;
    close();
  });
  document.addEventListener("click", function (e) {
    if (!head.contains(e.target)) close();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") close();
  });
  document.addEventListener("click", function (e) {
    var m = document.getElementById("toolMore");
    if (!m) return;
    if (e.target.closest(".tool-more")) { m.classList.remove("on"); return; }
    if (!e.target.closest(".tools")) m.classList.remove("on");
  });
})();
</script>
