<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d10">
<title>画廊</title>
<style>
  :root{
    --bg:#0d0d10; --card:#17171c; --card2:#1e1e25; --line:#2a2a33;
    --tx:#ececf1; --dim:#8a8a99; --pink:#ff5c8a; --gold:#ffc453;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
    "Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  a{color:inherit;text-decoration:none}

  /* ── 顶栏 ── */
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:12px 14px calc(12px + env(safe-area-inset-top,0)) 14px;
    background:rgba(13,13,16,.86);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line)}
  .brand{font-size:17px;font-weight:700;letter-spacing:.5px}
  .brand i{color:var(--pink);font-style:normal}
  .tabs{display:flex;gap:4px;margin-left:auto;background:var(--card);
    border-radius:10px;padding:3px}
  .tabs button{border:0;background:transparent;color:var(--dim);font:inherit;
    font-size:13px;padding:6px 14px;border-radius:8px;cursor:pointer}
  .tabs button.on{background:var(--card2);color:var(--tx);font-weight:600}
  .go{font-size:13px;color:var(--dim);padding:6px 10px;border:1px solid var(--line);
    border-radius:9px;white-space:nowrap;flex:0 0 auto}
  /* 顶栏三样（标题/两个 tab/入口）在 360px 上装不下整句，窄屏只留两个字的 */
  .go .g2{display:none}
  @media(max-width:430px){
    header{gap:8px;padding-left:12px;padding-right:12px}
    .brand{font-size:16px}
    .tabs button{padding:6px 10px;font-size:12.5px}
    .go .g1{display:none}
    .go .g2{display:inline}
  }

  /* ── 工具条 ── */
  .tools{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px 4px}
  .tools button{border:1px solid var(--line);background:var(--card);color:var(--tx);
    font:inherit;font-size:13px;padding:7px 13px;border-radius:10px;cursor:pointer}
  .tools button:active{background:var(--card2)}
  .tools button.primary{background:var(--pink);border-color:var(--pink);
    color:#fff;font-weight:600}
  /* 「我的」的子标签：作品 / 收藏 / 点赞。做成下划线式，不跟顶栏那两个
     药丸抢视觉——这里切的是同一页的内容细分，不是换去处。 */
  .subtabs{display:none;gap:18px;padding:10px 14px 2px;border-bottom:1px solid var(--line)}
  .subtabs.on{display:flex}
  .subtabs button{border:0;background:transparent;color:var(--dim);font:inherit;
    font-size:13.5px;padding:0 0 9px;cursor:pointer;position:relative}
  .subtabs button.on{color:var(--tx);font-weight:600}
  .subtabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;
    height:2px;background:var(--pink);border-radius:2px}

  .hint{padding:0 14px 6px;color:var(--dim);font-size:12.5px;line-height:1.6}

  /* ── 网格 ── */
  main{padding:6px 14px calc(40px + env(safe-area-inset-bottom,0))}
  /* 320px 的老 SE 也要能放两列：2×140 + 10 间隙 = 290 ≤ 屏宽减边距 */
  #grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  @media(min-width:760px){#grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}}
  .card{position:relative;border-radius:12px;overflow:hidden;background:var(--card);
    cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
  .card:active{transform:scale(.975)}
  /* 桌面才有 hover，触摸设备上按住就亮会很脏（:hover 在手机上会粘住） */
  @media(hover:hover) and (pointer:fine){
    .card:hover{transform:translateY(-3px);
      box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 0 1px var(--line)}
  }
  .card .ph{width:100%;aspect-ratio:3/4;display:block;object-fit:cover;
    background:linear-gradient(135deg,#1a1a21,#22222b);opacity:0;transition:opacity .35s}
  .card .ph.ok{opacity:1}
  .card .meta{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 11px;
    background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:12px}
  .card .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .s{color:#c9c9d4;font-size:11px;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .badge{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.66);
    color:#fff;font-size:11px;padding:2px 7px;border-radius:20px}
  .card .off{position:absolute;top:7px;left:7px;background:rgba(255,92,138,.92);
    color:#fff;font-size:11px;padding:2px 7px;border-radius:20px}

  .empty{text-align:center;color:var(--dim);padding:56px 20px;font-size:14px;line-height:1.8}

  /* ── 作品集详情（网格）── */
  #detail{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;
    flex-direction:column}
  #detail.on{display:flex}
  .dtop{display:flex;align-items:center;gap:10px;padding:12px 14px;
    padding-top:calc(12px + env(safe-area-inset-top,0));flex:0 0 auto;
    background:rgba(13,13,16,.9);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line)}
  .dtop button{border:0;background:rgba(255,255,255,.08);color:var(--tx);
    font:inherit;font-size:20px;line-height:1;width:36px;height:36px;
    border-radius:50%;cursor:pointer;flex:0 0 auto}
  .dinfo{flex:1;min-width:0}
  .dt{font-size:15px;font-weight:600;overflow:hidden;white-space:nowrap;
    text-overflow:ellipsis}
  .dby{font-size:12px;color:var(--dim);margin-top:1px}
  /* 排版切换：按钮上直接写「现在是哪种」，比一个抽象图标好猜 */
  #dmode{width:auto;border-radius:10px;padding:0 12px;font-size:13px;
    background:var(--card);border:1px solid var(--line);height:32px}
  /* 网格是默认，单列给「想看清楚点」的场景。
     ⚠️ 两种都按原比例完整显示，绝不裁切 —— 之前用 aspect-ratio:3/4
     配 object-fit:cover，4928×7360 的竖图被切掉上下，人物脸都在框外。
     网格用几个子列各自向下堆（瀑布流），一行里高度不同也不会互相拉扯；
     单列直接竖排。高度全由图片自己决定，别用 grid 的行高（会把十几张
     平均压进一屏，每张只剩一条横条）。 */
  #dgrid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:flex;gap:8px;align-items:flex-start;
    padding:10px 12px calc(28px + env(safe-area-inset-bottom,0))}
  #dgrid.one{flex-direction:column;gap:10px;max-width:760px;
    margin:0 auto;width:100%;align-items:stretch}
  .dcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  @media(min-width:760px){
    #dgrid{gap:12px}
    .dcol{gap:12px}
  }
  .shot{position:relative;border-radius:10px;overflow:hidden;background:var(--card);
    cursor:pointer;
    /* ⚠️ flex 里子项默认会被压缩：不给 flex:0 0 auto，十几张图会被挤进
       一屏，每张只剩一条几十像素的横条（单列和两列都踩过这个坑）。 */
    flex:0 0 auto;width:100%}
  /* aspect-ratio 只是懒加载前的占位，加载完 onload 会换成真实比例 */
  .shot img{width:100%;height:auto;display:block;opacity:0;
    transition:opacity .3s;aspect-ratio:3/4;background:var(--card)}
  .shot img.ok{opacity:1}
  .shot .pg{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.62);
    color:#fff;font-size:11px;line-height:16px;padding:1px 6px;
    border-radius:20px;backdrop-filter:blur(4px)}
  .shot .mk{position:absolute;right:7px;top:6px;font-size:14px;line-height:1;
    text-shadow:0 1px 4px rgba(0,0,0,.9)}
  .dempty{text-align:center;color:var(--dim);padding:48px 20px;font-size:14px;
    flex:1;width:100%}

  /* ── 查看器 ── */
  #viewer{position:fixed;inset:0;z-index:50;background:#000;display:none;
    flex-direction:column}
  #viewer.on{display:flex}
  .vtop{display:flex;align-items:center;gap:10px;padding:12px 14px;
    padding-top:calc(12px + env(safe-area-inset-top,0));position:relative;z-index:2}
  .vtop .vt{font-size:14px;font-weight:600;overflow:hidden;white-space:nowrap;
    text-overflow:ellipsis;flex:1}
  .vtop .vby{font-size:12px;color:var(--dim)}
  .vtop button{border:0;background:rgba(255,255,255,.1);color:#fff;width:34px;height:34px;
    border-radius:50%;font-size:17px;line-height:1;cursor:pointer;flex:0 0 auto}
  .stage{flex:1;position:relative;overflow:hidden;touch-action:pan-y}
  .track{display:flex;height:100%;will-change:transform;
    transition:transform .28s cubic-bezier(.22,.61,.36,1)}
  .track.drag{transition:none}
  .slide{flex:0 0 auto;height:100%;display:flex;align-items:center;
    justify-content:center;padding:8px}
  .slide img{max-width:100%;max-height:100%;object-fit:contain;
    opacity:0;transition:opacity .25s;user-select:none;-webkit-user-drag:none}
  .slide img.ok{opacity:1}
  .vbot{display:flex;align-items:center;gap:6px;padding:10px 14px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom,0));
    background:linear-gradient(transparent,rgba(0,0,0,.9));position:relative;z-index:2}
  .vbot .pg{font-size:13px;color:#b9b9c7;min-width:64px}
  .vbot .sp{flex:1}
  .act{border:0;background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:13px;
    padding:8px 13px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:5px}
  .act.on{background:var(--pink)}
  .act.fav.on{background:var(--gold);color:#2a1d00}
  .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;border:0;
    background:rgba(0,0,0,.45);color:#fff;width:40px;height:58px;border-radius:10px;
    font-size:20px;cursor:pointer}
  .nav.l{left:8px}.nav.r{right:8px}
  /* 触摸设备上箭头纯属挡图：手指本来就能滑（见下面那段 touchstart/move），
     40×58 的方块还正好压在图片左右两边。 */
  @media(hover:none){.nav{display:none}}
  /* 手机上底部四个元素在 320px 上会顶出去，允许换行兜底；同时把按钮压窄一点，
     正常 360px 及以上的机型还是一行。 */
  @media(max-width:430px){
    .vbot{gap:5px;padding-left:12px;padding-right:12px;flex-wrap:wrap}
    .vbot .pg{min-width:52px;font-size:12px}
    .act{padding:7px 10px;font-size:12.5px;gap:4px}
  }

  /* ── 上传面板 ── */
  #up{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:none;
    align-items:flex-end;justify-content:center;padding:0}
  #up.on{display:flex}
  .sheet{width:100%;max-width:560px;background:var(--card);border-radius:18px 18px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom,0));
    max-height:86vh;overflow:auto}
  @media(min-width:600px){#up{align-items:center}
    .sheet{border-radius:18px}}
  .sheet h3{margin:0 0 4px;font-size:16px}
  .sheet p{margin:0 0 14px;color:var(--dim);font-size:12.5px}
  .sheet input[type=text]{width:100%;background:var(--card2);border:1px solid var(--line);
    color:var(--tx);font:inherit;padding:11px 12px;border-radius:10px;margin-bottom:12px}
  .pick{display:block;border:1px dashed var(--line);border-radius:12px;padding:22px 12px;
    text-align:center;color:var(--dim);font-size:13px;margin-bottom:12px;cursor:pointer}
  .pick.has{color:var(--tx);border-style:solid}
  #prev{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  #prev img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:var(--card2)}
  .row{display:flex;gap:8px}
  .row button{flex:1;border:0;font:inherit;padding:12px;border-radius:11px;cursor:pointer}
  .row .cancel{background:var(--card2);color:var(--tx)}
  .row .ok{background:var(--pink);color:#fff;font-weight:600}
  .row .ok[disabled]{opacity:.5}

  /* ── 选文件夹面板 ── */
  #scanbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);
    display:none;align-items:flex-end;justify-content:center}
  #scanbox.on{display:flex}
  @media(min-width:600px){#scanbox{align-items:center}}
  .sheet .row input[type=text]{margin-bottom:0}
  .sheet .row .up{flex:0 0 auto;background:var(--card2);border:0;color:var(--tx);
    font:inherit;font-size:16px;padding:0 15px;border-radius:10px;cursor:pointer}
  .dirs{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:12px;
    background:var(--card2);margin-bottom:12px;-webkit-overflow-scrolling:touch}
  .dirs .d{display:flex;align-items:center;gap:9px;padding:11px 12px;cursor:pointer;
    font-size:13.5px;border-bottom:1px solid var(--line)}
  .dirs .d:last-child{border-bottom:0}
  .dirs .d:active{background:var(--card)}
  .dirs .d .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .dirs .d .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dirs .d .hp{color:var(--dim);font-size:11px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .dirs .d .ct{color:var(--gold);font-size:12px;flex:0 0 auto}
  .dirs .d .ct.z{color:var(--dim)}
  .dirs .n{padding:20px 12px;text-align:center;color:var(--dim);font-size:13px}
  .nowline{font-size:12.5px;color:var(--dim);margin-bottom:10px;line-height:1.6;
    word-break:break-all}
  .nowline b{color:var(--tx);font-weight:600}

  #toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);
    background:rgba(30,30,38,.97);color:#fff;font-size:13px;padding:10px 18px;
    border-radius:20px;opacity:0;pointer-events:none;transition:.24s;z-index:99;
    border:1px solid var(--line);max-width:86vw;text-align:center}
  #toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <div class="brand">画<i>廊</i></div>
  <div class="tabs">
    <button data-tab="owner" class="on">站长</button>
    <button data-tab="pub">公开</button>
    <button data-tab="mine">我的</button>
  </div>
  <a class="go" href="/preset"><span class="g1">自定义预设</span><span class="g2">预设</span></a>
</header>

<!-- 「我的」下面再分三格：作品 / 收藏 / 点赞。只在「我的」时出现 -->
<div class="subtabs" id="subtabs">
  <button data-sub="works" class="on">作品</button>
  <button data-sub="favs">收藏</button>
  <button data-sub="likes">点赞</button>
</div>

<div class="tools" id="tools"></div>
<div class="hint" id="hint">正在加载…</div>

<main><div id="grid"></div></main>

<!-- 作品集详情：先进这里看网格，点某张才全屏 -->
<div id="detail">
  <div class="dtop">
    <button id="dback" title="返回">‹</button>
    <div class="dinfo">
      <div class="dt" id="dtitle"></div>
      <div class="dby" id="dby"></div>
    </div>
    <button id="dmode" title="切换排版">⊞ 网格</button>
  </div>
  <div id="dgrid"></div>
</div>

<!-- 查看器 -->
<div id="viewer">
  <div class="vtop">
    <button id="vclose">✕</button>
    <div style="flex:1;min-width:0">
      <div class="vt" id="vtitle"></div>
      <div class="vby" id="vby"></div>
    </div>
    <button id="vdel" style="display:none">🗑</button>
  </div>
  <div class="stage" id="stage">
    <div class="track" id="track"></div>
    <button class="nav l" id="vprev">‹</button>
    <button class="nav r" id="vnext">›</button>
  </div>
  <div class="vbot">
    <span class="pg" id="vpg">1 / 1</span>
    <span class="sp"></span>
    <button class="act" id="vlike">♡ <b id="vlikec">0</b></button>
    <button class="act fav" id="vfav">☆ 收藏</button>
    <button class="act" id="vdl">↓ 下载</button>
  </div>
</div>

<!-- 上传 -->
<div id="up">
  <div class="sheet">
    <h3>上传作品集</h3>
    <p>一次选多张，就是一个作品集。上传会压成 1600px 的 WebP，原图不用你管。</p>
    <input type="text" id="uptitle" placeholder="给这个作品集起个名字" maxlength="40">
    <label class="pick" id="pick">＋ 选择图片（最多 40 张）
      <input type="file" id="file" accept="image/*" multiple hidden>
    </label>
    <div id="prev"></div>
    <div class="row">
      <button class="cancel" id="upcancel">取消</button>
      <button class="ok" id="upsubmit" disabled>上传</button>
    </div>
  </div>
</div>

<!-- 选文件夹扫描 -->
<div id="scanbox">
  <div class="sheet">
    <h3>扫描文件夹</h3>
    <p>点进目录选中它，或者直接粘完整路径。选中的目录连同子目录一起扫，
      每个「直接放着图」的目录算一个作品集。</p>
    <div class="nowline" id="scnow"></div>
    <div class="row" style="margin-bottom:10px">
      <input type="text" id="scpath" placeholder="D:\Users\gjl\Pictures\new">
      <button class="up" id="scup" title="上一级">↑</button>
    </div>
    <div class="dirs" id="scdirs"></div>
    <div class="row">
      <button class="cancel" id="sccancel">取消</button>
      <button class="ok" id="scgo">扫描这里</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  var S = { tab: "owner", sub: "works", page: 1, more: true, busy: false,
            owner: false, works: [], cur: null, idx: 0, items: [], likes: {},
            fav: {}, layout: "2", shotEls: [] };

  function $(id) { return document.getElementById(id); }

  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove("on"); }, 2400);
  }

  function api(path, opt) {
    opt = opt || {};
    return fetch("/api/gal/" + path, opt).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: "返回看不懂" }; });
    }).then(function (d) {
      if (!d.ok && d.error) throw new Error(d.error);
      return d;
    });
  }

  // ── 列表 ──────────────────────────────────────────────
  // 「我的 / 收藏」「我的 / 点赞」是**按图**排的（item 级），其它都是作品集。
  function isPhoto() { return S.tab === "mine" && S.sub !== "works"; }

  function load(reset) {
    if (S.busy) return;
    if (!reset && !S.more) return;
    S.busy = true;
    if (reset) { S.page = 1; S.more = true; S.works = []; $("grid").innerHTML = ""; }
    var photo = isPhoto();
    var q;
    if (photo) {
      q = (S.sub === "favs" ? "favs" : "likes") + "?page=" + S.page + "&size=24";
    } else if (S.tab === "mine") {
      q = "mine?page=" + S.page + "&size=24";
    } else {
      // scope=owner 站长的（磁盘目录 + 站主网页上传的）；scope=pub 其他人的
      q = "list?scope=" + (S.tab === "pub" ? "pub" : "owner") +
          "&page=" + S.page + "&size=24";
    }

    api(q).then(function (d) {
      S.owner = !!d.owner;
      renderTools();
      if (photo) {
        (d.items || []).forEach(function (it) { S.works.push(it); addPhoto(it); });
      } else {
        (d.works || []).forEach(function (w) { S.works.push(w); addCard(w); });
      }
      S.more = !!d.has_more;
      S.page += 1;
      $("hint").textContent = S.works.length
        ? (S.more ? "继续往下滑…" : "一共 " + S.works.length + (photo ? " 张" : " 个作品集"))
        : "";
      if (!S.works.length) showEmpty();
    }).catch(function (e) {
      $("hint").textContent = e.message || "加载失败";
    }).then(function () {
      S.busy = false;
      // 首屏没撑满一屏时，IntersectionObserver 只会在页面刚加载时回调一次，
      // 那会儿 busy 还是 true，直接被 return 吞掉；之后 sentinel 一直没离开
      // 视口，就再也不会回调 —— 表现就是「永远只有第一页 24 个」。这里补一次。
      if (S.more && sentinel && window.innerHeight &&
          sentinel.getBoundingClientRect().top < window.innerHeight + 600) {
        load(false);
      }
    });
  }

  function showEmpty() {
    var g = $("grid");
    g.innerHTML = "";
    var d = document.createElement("div");
    d.className = "empty";
    d.style.gridColumn = "1 / -1";
    if (S.tab === "mine" && S.sub === "favs") {
      d.innerHTML = "还没收藏过。<br>点开任意一张图，点右下角的「☆ 收藏」。";
    } else if (S.tab === "mine" && S.sub === "likes") {
      d.innerHTML = "还没点过赞。<br>看到喜欢的图点一下 ♡ 就行。";
    } else if (S.tab === "mine") {
      d.innerHTML = S.owner
        ? "还没有作品集。<br>切到「站长」可以扫描磁盘上的文件夹。"
        : "你还没上传过作品。<br>点上面的「上传作品集」选几张图试试。";
    } else if (S.tab === "pub") {
      d.innerHTML = "还没有其他人上传。<br>群友在「我的」里传了自己的图，就会出现在这里。";
    } else {
      d.innerHTML = "画廊还是空的。<br>站主扫描一下磁盘，或者自己传一组上去。";
    }
    g.appendChild(d);
  }

  function addCard(w) {
    var c = document.createElement("div");
    c.className = "card";
    c.onclick = function () { openWork(w.id); };

    var img = document.createElement("img");
    img.className = "ph";
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = w.title;
    if (w.cover) img.src = "/api/gal/img/" + w.cover + "?s=t";
    img.onload = function () { img.classList.add("ok"); };
    img.onerror = function () { img.classList.add("ok"); img.style.opacity = ".35"; };
    c.appendChild(img);

    if (w.n > 1) {
      var b = document.createElement("div");
      b.className = "badge";
      b.textContent = w.n;
      c.appendChild(b);
    }
    if (w.hidden) {
      var o = document.createElement("div");
      o.className = "off";
      o.textContent = "已下架";
      c.appendChild(o);
    }

    var m = document.createElement("div");
    m.className = "meta";
    var t = document.createElement("div");
    t.className = "t";
    t.textContent = w.title;
    var s = document.createElement("div");
    s.className = "s";
    s.textContent = (w.grp ? w.grp + " · " : "") + w.by;
    m.appendChild(t); m.appendChild(s);
    c.appendChild(m);
    $("grid").appendChild(c);
  }

  // 收藏 / 点赞里的单张图。点开直接进查看器并停在那一张，
  // 不经过「先列作品集、再进去找」这一步。
  function addPhoto(it) {
    var c = document.createElement("div");
    c.className = "card";
    c.onclick = function () { openWork(it.work, it.idx); };

    var img = document.createElement("img");
    img.className = "ph";
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = it.title;
    img.src = "/api/gal/img/" + it.id + "?s=t";
    img.onload = function () { img.classList.add("ok"); };
    img.onerror = function () { img.classList.add("ok"); img.style.opacity = ".35"; };
    c.appendChild(img);

    var m = document.createElement("div");
    m.className = "meta";
    var t = document.createElement("div");
    t.className = "t";
    t.textContent = it.title;
    var s = document.createElement("div");
    s.className = "s";
    s.textContent = it.by;
    m.appendChild(t); m.appendChild(s);
    c.appendChild(m);
    $("grid").appendChild(c);
  }

  // ── 工具条 ────────────────────────────────────────────
  function renderTools() {
    var t = $("tools");
    t.innerHTML = "";
    if (S.tab === "mine" && S.sub === "works") {
      t.appendChild(btn("＋ 上传作品集", "primary", openUpload));
    }
    // 扫描是站主的事，放「站长」tab —— 它扫的就是这一批目录，
    // 放在这里按钮和内容对得上，也不用挤在「我的」里。
    if (S.owner && S.tab === "owner") {
      t.appendChild(btn("⟳ 扫描文件夹", "primary", openScan));
      t.appendChild(btn("↻ 全部重扫", "", scanAll));
      t.appendChild(btn("⌫ 清理失效", "", clean));
    }
  }

  function btn(text, cls, fn) {
    var b = document.createElement("button");
    b.textContent = text;
    if (cls) b.className = cls;
    b.onclick = fn;
    return b;
  }

  // 扫全部已配置的根（.env 里那两个）。日常增量更新点这个。
  function scanAll() {
    if (S.busy) return;
    S.busy = true;
    toast("正在扫描磁盘…");
    api("scan", { method: "POST", headers: { "Content-Type": "application/json" },
                  body: "{}" }).then(function (d) {
      var r = d.result || {};
      toast("扫完了：" + (r.works || 0) + " 个作品集，"
            + (r.items || 0) + " 张图，" + (r.seconds || 0) + " 秒");
      // 必须先放开 busy 再 load：load() 开头就有 `if (S.busy) return`，
      // 原来这里 busy 还是 true，扫完原地不动 —— 看起来就是「扫了没反应」。
      S.busy = false;
      load(true);
    }).catch(function (e) { toast(e.message); S.busy = false; });
  }

  // ── 选文件夹 ──────────────────────────────────────────
  var SC = { path: "", parent: "" };

  function openScan() {
    $("scanbox").classList.add("on");
    var last = "";
    try { last = localStorage.getItem("gal_scan_path") || ""; } catch (e) {}
    browseTo(last);
  }
  function closeScan() { $("scanbox").classList.remove("on"); }

  function browseTo(p) {
    api("browse?path=" + encodeURIComponent(p || "")).then(function (d) {
      SC.path = d.path || "";
      SC.parent = d.parent || "";
      $("scpath").value = SC.path;
      try { localStorage.setItem("gal_scan_path", SC.path); } catch (e) {}

      var now = $("scnow");
      now.innerHTML = "";
      if (SC.path) {
        var has = d.images || 0;
        now.appendChild(document.createTextNode("当前："));
        var b = document.createElement("b");
        b.textContent = SC.path;
        now.appendChild(b);
        now.appendChild(document.createTextNode(
          has ? "（这里直接有 " + has + " 张图）" : "（这里没有直接的图，只有子目录）"));
      } else {
        now.textContent = "点下面的文件夹进去，或者在上面粘一个完整路径。";
      }

      var box = $("scdirs");
      box.innerHTML = "";
      if (!d.dirs || !d.dirs.length) {
        box.innerHTML = '<div class="n">这里面没有子目录</div>';
        return;
      }
      d.dirs.forEach(function (x) {
        var r = document.createElement("div");
        r.className = "d";
        var ic = document.createElement("span");
        ic.textContent = "📁";
        var mid = document.createElement("span");
        mid.className = "mid";
        var nm = document.createElement("span");
        nm.className = "nm";
        nm.textContent = x.name;
        mid.appendChild(nm);
        if (x.hint) {
          var hp = document.createElement("span");
          hp.className = "hp";
          hp.textContent = x.hint;
          mid.appendChild(hp);
        }
        var ct = document.createElement("span");
        ct.className = "ct" + (x.n ? "" : " z");
        ct.textContent = x.n ? x.n + " 张" : "";
        r.appendChild(ic); r.appendChild(mid); r.appendChild(ct);
        r.onclick = function () { browseTo(x.path); };
        box.appendChild(r);
      });
    }).catch(function (e) { toast(e.message); });
  }

  function goScan() {
    if (!SC.path) { toast("先点进一个文件夹"); return; }
    var b = $("scgo");
    b.disabled = true;
    b.textContent = "扫描中…";
    api("scan", { method: "POST", headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ path: SC.path }) })
      .then(function (d) {
        var r = d.result || {};
        toast("扫完了：" + (r.works || 0) + " 个作品集，"
              + (r.items || 0) + " 张图");
        closeScan();
        setTab("owner");
      }).catch(function (e) { toast(e.message); })
      .then(function () { b.disabled = false; b.textContent = "扫描这里"; });
  }

  $("sccancel").onclick = closeScan;
  $("scanbox").onclick = function (e) { if (e.target === $("scanbox")) closeScan(); };
  $("scup").onclick = function () { if (SC.path) browseTo(SC.parent); };
  $("scgo").onclick = goScan;
  $("scpath").onkeydown = function (e) {
    if (e.key === "Enter") { e.preventDefault(); browseTo(this.value.trim()); }
  };

  function clean() {
    api("clean", { method: "POST", headers: { "Content-Type": "application/json" },
                   body: "{}" }).then(function (d) {
      toast("清掉 " + (d.removed || 0) + " 条失效记录");
      load(true);
    }).catch(function (e) { toast(e.message); });
  }

  // ── 作品集详情 ────────────────────────────────────────
  // 点卡片进来先看网格（两列 / 单列可切），再点某张才全屏滑动。
  // `at` 有值时（从收藏、点赞点进来）直接替你打开全屏并停在那张，
  // 但详情页依然垫在它下面，关掉查看器不会一脚踹回首页。
  function openWork(id, at) {
    api("work/" + id).then(function (d) {
      S.cur = d.work;
      S.items = d.items || [];
      S.fav = {};
      (d.items || []).forEach(function (it) { if (it.fav) S.fav[it.id] = 1; });
      renderDetail();
      $("detail").classList.add("on");
      document.body.style.overflow = "hidden";
      $("dgrid").scrollTop = 0;
      if (at != null) openViewer(at);
    }).catch(function (e) { toast(e.message); });
  }

  // 网格铺几列：手机 2、平板 3、桌面 4。按视口宽度算，别写死成两列 ——
  // 1280 的屏幕上两列每张 620px 宽，一屏只能看到两张的头顶。
  function colCount() {
    var w = window.innerWidth || document.documentElement.clientWidth || 390;
    if (w >= 1180) return 4;
    if (w >= 840) return 3;
    return 2;
  }

  function renderDetail() {
    if (!S.cur) return;
    $("dtitle").textContent = S.cur.title;
    $("dby").textContent = S.cur.by +
      (S.cur.n > 1 ? " · " + S.cur.n + " 张" : "") +
      (S.cur.hidden ? " · 已下架" : "");

    var box = $("dgrid");
    box.innerHTML = "";
    S.shotEls = [];
    box.classList.toggle("one", S.layout === "one");
    if (!S.items.length) {
      box.innerHTML = '<div class="dempty">这个作品集里没有能看的图</div>';
      return;
    }

    // 两列：两个子列交替放，各自往下堆；单列：直接塞进 #dgrid 竖排。
    var cols = null;
    if (S.layout !== "one") {
      var n = colCount();
      cols = [];
      for (var k = 0; k < n; k++) {
        var d = document.createElement("div");
        d.className = "dcol";
        cols.push(d);
        box.appendChild(d);
      }
    }

    S.items.forEach(function (it, i) {
      var s = document.createElement("div");
      s.className = "shot";
      s.onclick = function () { openViewer(i); };

      var im = document.createElement("img");
      im.loading = "lazy";              // 一个作品集可能 288 张，不能全拉
      im.decoding = "async";
      im.alt = "";
      im.src = "/api/gal/img/" + it.id + "?s=t";
      im.onload = function () {
        im.classList.add("ok");
        // 占位比例换成真实比例，图才是完整的（不裁、不留黑边）
        if (im.naturalWidth && im.naturalHeight) {
          im.style.aspectRatio = im.naturalWidth + " / " + im.naturalHeight;
        }
      };
      im.onerror = function () { im.classList.add("ok"); im.style.opacity = ".3"; };
      s.appendChild(im);

      var pg = document.createElement("div");
      pg.className = "pg";
      pg.textContent = i + 1;
      s.appendChild(pg);

      if (it.fav) {
        var mk = document.createElement("div");
        mk.className = "mk";
        mk.textContent = "★";
        s.appendChild(mk);
      }
      S.shotEls[i] = s;
      (cols ? cols[i % cols.length] : box).appendChild(s);
    });
  }

  function closeDetail() {
    $("detail").classList.remove("on");
    document.body.style.overflow = "";
    $("dgrid").innerHTML = "";
    S.shotEls = [];
    S.cur = null;
    S.items = [];
    if (location.hash.indexOf("#w=") === 0) {
      history.replaceState(null, "", location.pathname + location.search);
    }
    // 在收藏 / 点赞里改过标记，回到墙面上要重拉，否则卡片还是老样子。
    // 没动过就不重拉，保住原来的滚动位置。
    if (S.dirty) { S.dirty = false; if (isPhoto()) load(true); }
  }

  // 排版：网格 / 单列。记住上次选的，别每次进来都重置。
  // 两种排版的 DOM 结构不一样（几个子列 vs 直接竖排），所以切换得重建。
  function setLayout(m) {
    S.layout = (m === "one") ? "one" : "2";
    try { localStorage.setItem("gal_layout", S.layout); } catch (e) {}
    $("dmode").textContent = S.layout === "one" ? "☰ 单列" : "⊞ 网格";
    if (S.cur) {
      var y = $("dgrid").scrollTop;
      renderDetail();
      $("dgrid").scrollTop = y;
    }
  }

  // 旋转屏幕 / 拉窗口会改变列数，重建一次。防抖，别每像素重排。
  var _rsz = 0;
  window.addEventListener("resize", function () {
    if (!S.cur || S.layout === "one") return;
    clearTimeout(_rsz);
    _rsz = setTimeout(function () {
      if (!S.cur) return;
      var y = $("dgrid").scrollTop;
      renderDetail();
      $("dgrid").scrollTop = y;
    }, 250);
  });

  $("dback").onclick = closeDetail;
  $("dmode").onclick = function () {
    setLayout(S.layout === "one" ? "2" : "one");
  };

  // ── 查看器 ────────────────────────────────────────────
  function openViewer(i) {
    if (!S.items.length || !S.cur) return;
    $("vtitle").textContent = S.cur.title;
    $("vby").textContent = S.cur.by +
      (S.cur.n > 1 ? " · " + S.cur.n + " 张" : "");
    $("vdel").style.display = S.cur.can_delete ? "" : "none";
    buildTrack();
    $("viewer").classList.add("on");
    var n = Math.max(0, Math.min(S.items.length - 1, i || 0));
    go(n, true);
  }

  function buildTrack() {
    var tr = $("track");
    tr.innerHTML = "";
    S.items.forEach(function (it, i) {
      var s = document.createElement("div");
      s.className = "slide";
      var im = document.createElement("img");
      im.alt = "";
      im.decoding = "async";
      im.onload = function () { im.classList.add("ok"); };
      s.appendChild(im);
      tr.appendChild(s);
    });
    tr.style.width = (S.items.length * 100) + "%";
    // 只加载当前和相邻两张：一屏几十 MB 的话手机直接卡死
    S.items.forEach(function (_it, i) { tr.children[i].style.width = (100 / S.items.length) + "%"; });
  }

  function src(i) { return S.items[i] ? "/api/gal/img/" + S.items[i].id + "?s=v" : ""; }

  function preload(i) {
    if (i < 0 || i >= S.items.length) return;
    var im = $("track").children[i].querySelector("img");
    if (im && !im.src) im.src = src(i);
  }

  function go(i, instant) {
    if (!S.items.length) return;
    S.idx = Math.max(0, Math.min(S.items.length - 1, i));
    var tr = $("track");
    if (instant) tr.classList.add("drag");
    tr.style.transform = "translateX(" + (-S.idx * 100 / S.items.length) + "%)";
    if (instant) requestAnimationFrame(function () { tr.classList.remove("drag"); });

    preload(S.idx);
    preload(S.idx + 1);
    preload(S.idx - 1);

    $("vpg").textContent = (S.idx + 1) + " / " + S.items.length;
    $("vprev").style.visibility = S.idx > 0 ? "visible" : "hidden";
    $("vnext").style.visibility = S.idx < S.items.length - 1 ? "visible" : "hidden";
    syncMark();
  }

  function syncMark() {
    var it = S.items[S.idx];
    if (!it) return;
    var lk = $("vlike");
    lk.classList.toggle("on", !!it.like);
    lk.querySelector("b").textContent = it.likes || 0;
    var fv = $("vfav");
    var on = !!(S.fav && S.fav[it.id]);
    fv.classList.toggle("on", on);
    fv.textContent = on ? "★ 已收藏" : "☆ 收藏";
  }

  function mark(kind) {
    var it = S.items[S.idx];
    if (!it) return;
    if (kind === "like") it.like = it.like ? 0 : 1;
    else {
      S.fav = S.fav || {};
      S.fav[it.id] = !S.fav[it.id];
      it.fav = S.fav[it.id] ? 1 : 0;   // 详情网格的星标读这个
    }
    S.dirty = true;                 // 关查看器时决定要不要重拉列表
    syncMark();
    api("mark", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ item_id: it.id, kind: kind, on: kind === "like" ? !!it.like : !!S.fav[it.id] })
    }).then(function (d) {
      if (kind === "like") { it.likes = d.count; syncMark(); }
    }).catch(function (e) { toast(e.message); });
  }

  function closeViewer() {
    $("viewer").classList.remove("on");
    $("track").innerHTML = "";
    // 详情页还垫在下面，body 继续锁滚动；两层都关了才放开。
    if (!$("detail").classList.contains("on")) document.body.style.overflow = "";
    // 收藏星标要跟手更新，不然刚收藏完退回网格还是空的
    if (S.dirty) syncDetailMarks();
  }

  // 把 S.items 上的收藏状态同步到详情网格右上角那颗星。
  // 两列时 DOM 是按 1/3/5 和 2/4/6 分进两个子列的，不能靠 children 下标取。
  function syncDetailMarks() {
    S.items.forEach(function (it, i) {
      var s = (S.shotEls || [])[i];
      if (!s) return;
      var mk = s.querySelector(".mk");
      if (it.fav && !mk) {
        mk = document.createElement("div");
        mk.className = "mk";
        mk.textContent = "★";
        s.appendChild(mk);
      } else if (!it.fav && mk) {
        mk.parentNode.removeChild(mk);
      }
    });
  }

  $("vclose").onclick = closeViewer;
  $("vprev").onclick = function () { go(S.idx - 1); };
  $("vnext").onclick = function () { go(S.idx + 1); };
  $("vlike").onclick = function () { mark("like"); };
  $("vfav").onclick = function () { mark("fav"); };
  $("vdl").onclick = function () {
    var it = S.items[S.idx];
    if (!it) return;
    var a = document.createElement("a");
    // 下载发的是 1600px 压缩图，不是磁盘上的 PNG 原图：原图中位 5MB、
    // 最大 149MB，一个作品集整个拖一遍就是几个 GB 的上行。
    a.href = "/api/gal/img/" + it.id + "?s=v";
    // 后缀必须和实际格式一致，否则手机上下出来打不开。
    a.download = (S.cur ? S.cur.title : "image") + "-" + (S.idx + 1) +
                 "." + (it.ext || "webp");
    a.click();
  };
  $("vdel").onclick = function () {
    if (!S.cur || !confirm("删掉整个作品集？图片会一起删，不能恢复。")) return;
    fetch("/api/gal/work/" + S.cur.id, { method: "DELETE" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) throw new Error(d.error || "删除失败");
        toast("已删除");
        closeViewer();
        closeDetail();
        load(true);
      }).catch(function (e) { toast(e.message); });
  };

  // 左右滑
  (function () {
    var st = $("stage"), x0 = 0, y0 = 0, dx = 0, on = false, lock = null;
    st.addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) return;
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
      dx = 0; on = true; lock = null;
      $("track").classList.add("drag");
    }, { passive: true });
    st.addEventListener("touchmove", function (e) {
      if (!on) return;
      dx = e.touches[0].clientX - x0;
      var dy = e.touches[0].clientY - y0;
      if (lock === null) lock = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      if (lock === "x") {
        e.preventDefault();
        if ((S.idx === 0 && dx > 0) || (S.idx === S.items.length - 1 && dx < 0)) dx *= .3;
        $("track").style.transform =
          "translateX(calc(" + (-S.idx * 100 / S.items.length) + "% + " + dx + "px))";
      }
    }, { passive: false });
    st.addEventListener("touchend", function () {
      if (!on) return;
      on = false;
      $("track").classList.remove("drag");
      if (lock === "x" && Math.abs(dx) > 46) go(S.idx + (dx < 0 ? 1 : -1));
      else go(S.idx);
      dx = 0;
    });
  })();

  document.addEventListener("keydown", function (e) {
    if ($("viewer").classList.contains("on")) {
      if (e.key === "Escape") closeViewer();
      if (e.key === "ArrowLeft") go(S.idx - 1);
      if (e.key === "ArrowRight") go(S.idx + 1);
      return;
    }
    // 查看器没开时 ESC 退详情页，不然全屏层里按 ESC 什么都不会发生
    if (e.key === "Escape" && $("detail").classList.contains("on")) closeDetail();
  });

  // ── 上传 ──────────────────────────────────────────────
  var picked = [];

  // 浏览器能不能编 WebP。Safari 老版本只能 JPEG，那就在 canvas 里先铺白底，
  // 否则透明 PNG 压完是黑块。
  var CAN_WEBP = (function () {
    try {
      return document.createElement("canvas").toDataURL("image/webp")
        .indexOf("image/webp") === 0;
    } catch (e) { return false; }
  })();

  // 传之前先在浏览器里缩到 1600 长边、转 WebP。
  // 慢的不是转码，是传输：一张 8MB 的原图要顺着家宽上行推过隧道，
  // 十几秒才到；缩完约 150KB。服务端本来就压到 1600，这里压到同一尺寸，
  // 画质一点没多损，省下的是 98% 的流量。
  function shrink(f) {
    return new Promise(function (res) {
      if (!/^image\//.test(f.type || "")) return res(f);
      var url = URL.createObjectURL(f);
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        try {
          var m = Math.min(1, 1600 / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * m));
          var ch = Math.max(1, Math.round(h * m));
          var cv = document.createElement("canvas");
          cv.width = cw;
          cv.height = ch;
          var ctx = cv.getContext("2d");
          if (!CAN_WEBP) {
            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, cw, ch);
          }
          ctx.drawImage(img, 0, 0, cw, ch);
          var type = CAN_WEBP ? "image/webp" : "image/jpeg";
          cv.toBlob(function (b) {
            URL.revokeObjectURL(url);
            if (!b) return res(f);
            var ext = CAN_WEBP ? ".webp" : ".jpg";
            res(new File([b], f.name.replace(/\.[^.]+$/, "") + ext,
                         { type: type }));
          }, type, 0.85);
        } catch (e) {
          // 内存不够、canvas 被禁：压不动就传原图，别把上传卡死在这
          URL.revokeObjectURL(url);
          res(f);
        }
      };
      img.onerror = function () { URL.revokeObjectURL(url); res(f); };
      img.src = url;
    });
  }

  function mb(n) {
    return n >= 1048576 ? (n / 1048576).toFixed(1) + "MB"
                        : Math.max(1, Math.round(n / 1024)) + "KB";
  }

  function openUpload() {
    picked = [];
    $("uptitle").value = "";
    $("file").value = "";
    $("prev").innerHTML = "";
    $("pick").classList.remove("has");
    $("pick").firstChild.textContent = "＋ 选择图片（最多 40 张）";
    $("upsubmit").disabled = true;
    $("upsubmit").textContent = "上传";
    $("up").classList.add("on");
  }
  function closeUpload() { $("up").classList.remove("on"); }

  $("upcancel").onclick = closeUpload;
  $("up").onclick = function (e) { if (e.target === $("up")) closeUpload(); };

  $("file").onchange = function () {
    var fs = Array.prototype.slice.call(this.files || []);
    if (fs.length > 40) { toast("最多 40 张，多的先去掉"); fs = fs.slice(0, 40); }
    picked = fs;
    $("prev").innerHTML = "";
    fs.forEach(function (f) {
      var im = document.createElement("img");
      im.src = URL.createObjectURL(f);
      $("prev").appendChild(im);
    });
    $("pick").classList.add("has");
    var sz = fs.reduce(function (s, f) { return s + (f.size || 0); }, 0);
    $("pick").firstChild.textContent =
      "已选 " + fs.length + " 张 · " + mb(sz) + "（点这里重选）";
    $("upsubmit").disabled = !fs.length;
    if (!$("uptitle").value && fs.length === 1) {
      $("uptitle").value = fs[0].name.replace(/\.[^.]+$/, "").slice(0, 40);
    }
  };

  $("upsubmit").onclick = function () {
    if (!picked.length) return;
    var b = this;
    var title = $("uptitle").value.trim();
    var before = picked.reduce(function (s, f) { return s + (f.size || 0); }, 0);
    var out = [];
    b.disabled = true;

    function fail(e) {
      toast(e.message || "上传失败");
      b.disabled = false;
      b.textContent = "上传";
    }

    // 串行压：一张 4000×6000 的解码要吃近 100MB 内存，并行几张中低端
    // 手机会直接白屏。慢一点没关系，反正比传原图还是快几十倍。
    function step(i) {
      if (i >= picked.length) return send();
      b.textContent = "压缩 " + (i + 1) + "/" + picked.length;
      shrink(picked[i]).then(function (f2) { out.push(f2); step(i + 1); })
        .catch(function () { out.push(picked[i]); step(i + 1); });
    }

    function send() {
      var fd = new FormData();
      fd.append("title", title);
      out.forEach(function (f) { fd.append("files", f, f.name); });
      var after = out.reduce(function (s, f) { return s + (f.size || 0); }, 0);
      var xhr = new XMLHttpRequest();
      xhr.open("POST", "/api/gal/upload");
      // fetch 看不到上传进度，慢的时候人不知道是在传还是卡死了
      xhr.upload.onprogress = function (e) {
        if (!e.lengthComputable) return;
        b.textContent = e.loaded >= e.total ? "处理中…"
          : "上传 " + Math.round(e.loaded / e.total * 100) + "%";
      };
      xhr.onload = function () {
        var d = {};
        try { d = JSON.parse(xhr.responseText) || {}; } catch (e) {}
        if (!d.ok) return fail(new Error(d.error || "上传失败"));
        var saved = after < before ? " · " + mb(before) + "→" + mb(after) : "";
        toast("传好了，" + d.n + " 张" + saved);
        closeUpload();
        setTab("mine", "works");
      };
      xhr.onerror = function () { fail(new Error("网络断了，重试一下")); };
      xhr.send(fd);
    }

    step(0);
  };

  // ── tab / 滚动 ────────────────────────────────────────
  function setTab(name, sub) {
    S.tab = name;
    if (sub) S.sub = sub;
    document.querySelectorAll(".tabs button").forEach(function (b) {
      b.classList.toggle("on", b.dataset.tab === name);
    });
    renderSubtabs();
    renderTools();
    load(true);
  }

  function setSub(name) {
    S.sub = name;
    renderSubtabs();
    renderTools();
    load(true);
  }

  function renderSubtabs() {
    var box = $("subtabs");
    box.classList.toggle("on", S.tab === "mine");
    box.querySelectorAll("button").forEach(function (b) {
      b.classList.toggle("on", b.dataset.sub === S.sub);
    });
  }

  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.onclick = function () { setTab(b.dataset.tab); };
  });
  document.querySelectorAll("#subtabs button").forEach(function (b) {
    b.onclick = function () { setSub(b.dataset.sub); };
  });

  var sentinel = document.createElement("div");
  document.querySelector("main").appendChild(sentinel);
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) load(false); });
    }, { rootMargin: "600px" }).observe(sentinel);
  }

  // 深链接：/gallery#w=35 打开某个作品集；#pub / #mine / #favs / #likes 直接切过去
  function fromHash() {
    var h = location.hash || "";
    if (h === "#mine") { setTab("mine", "works"); return; }
    if (h === "#favs") { setTab("mine", "favs"); return; }
    if (h === "#likes") { setTab("mine", "likes"); return; }
    if (h === "#pub") { setTab("pub"); return; }
    if (h === "#owner") { setTab("owner"); return; }
    var m = /^#w=(\d+)$/.exec(h);
    if (m) openWork(parseInt(m[1], 10));
  }
  window.addEventListener("hashchange", fromHash);

  // 首屏先按 hash 定 tab，避免「先请求站长、再切我的」跑两遍
  (function () {
    var h = location.hash || "";
    if (h === "#pub") S.tab = "pub";
    else if (h === "#mine" || h === "#favs" || h === "#likes") S.tab = "mine";
    if (h === "#favs") S.sub = "favs";
    else if (h === "#likes") S.sub = "likes";
    document.querySelectorAll(".tabs button").forEach(function (b) {
      b.classList.toggle("on", b.dataset.tab === S.tab);
    });
    renderSubtabs();
  })();
  // 排版沿用上次选的（两列 / 单列），默认两列
  (function () {
    var m = "2";
    try { m = localStorage.getItem("gal_layout") || "2"; } catch (e) {}
    setLayout(m);
  })();
  load(true);
  setTimeout(fromHash, 600);
})();
</script>
</body>
</html>
