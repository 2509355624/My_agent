<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>工作台</title>
<script>
  // 首屏前置定主题，避免先白后黑的闪色。
  (function () {
    var t = localStorage.getItem("ws_theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="stylesheet" href="css/tokens.css?v=20261127i">
<link rel="stylesheet" href="css/base.css?v=20261127m">
<link rel="stylesheet" href="css/chat.css?v=20261128h">
<link rel="stylesheet" href="css/pill.css?v=20261127k">
<link rel="stylesheet" href="css/sheet.css?v=20261128h">
<link rel="stylesheet" href="css/gallery.css?v=20261128i">
<link rel="stylesheet" href="css/comic.css?v=20261128i">
<link rel="stylesheet" href="css/create.css?v=20261127i">
<link rel="stylesheet" href="css/me.css?v=20261127i">
<link rel="stylesheet" href="css/composer.css?v=20261128g">
<link rel="stylesheet" href="css/viewer-1.css?v=20261128j">
<link rel="stylesheet" href="css/desk-1.css?v=20261128h">
</head>
<body>

<div class="app app-chat">
  <div class="stack" id="stack">
    <!-- 根视图：只有消息区和输入栏，没有顶栏也没有底栏 -->
    <section class="view view-root">
      <div class="chat-scroll" id="chat-scroll">
        <div class="chat-empty" id="chat-empty">
          <h1>想做什么？</h1>
          <p>说一句话，我帮你出图</p>
        </div>
      </div>

      <div class="composer" id="composer">
        <div class="composer-card">
          <!-- 漫画模式下才露出来的小标记，点 ✕ 退出 -->
          <div class="mode-tag" id="mode-tag" hidden>
            <span>漫画生成</span>
            <button class="mt-x" id="mode-clear" type="button" aria-label="退出漫画模式">✕</button>
          </div>

          <!-- 这一轮带上的参考图（画同款 / 相册上传都落这儿） -->
          <div class="ref-bar" id="ref-bar" hidden></div>

          <textarea id="say" rows="1" maxlength="20000"
                    placeholder="说说想画什么，或者点「引用」改上一张"
                    aria-label="创作内容"></textarea>

          <div class="composer-tools">
            <button class="icon-btn" id="btn-plus" type="button" aria-label="更多">＋</button>

            <div class="plus-menu" id="plus-menu" hidden>
              <!-- 两个平级入口：图片生成 / 漫画生成 -->
              <div class="pm-grid">
                <button class="pm-tile on" type="button" id="pick-img">
                  <span class="pm-ico">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                         stroke-linejoin="round">
                      <rect x="3.4" y="4.6" width="17.2" height="14.8" rx="3"/>
                      <circle cx="8.6" cy="9.6" r="1.7"/>
                      <path d="M4.2 17.2l4.6-4.4 3.4 3.2 3.6-3.8 4 4"/>
                    </svg>
                  </span>
                  <b>图片生成</b>
                  <small>说一句就出图</small>
                </button>
                <button class="pm-tile" type="button" id="pick-comic">
                  <span class="pm-ico">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                         stroke-linejoin="round">
                      <path d="M4 5.4A2.4 2.4 0 0 1 6.4 3h5.2v16H6.4A2.4 2.4 0 0 0 4 21z"/>
                      <path d="M20 5.4A2.4 2.4 0 0 0 17.6 3h-5.2v16h5.2A2.4 2.4 0 0 1 20 21z"/>
                    </svg>
                  </span>
                  <b>漫画生成</b>
                  <small>说句剧情，分页画</small>
                </button>
              </div>

              <!-- 同步 QQ（2026-11-27）：只有登录用户才露，默认绿着勾上。
                   出图后服务端往自己的 QQ 再发一份，手机上也能收到。
                   2026-11-27 从底行收进「＋」里：底行只留跟「发图」直接
                   相关的按钮，同步是附加动作，埋在面板里更清楚。 -->
              <button class="pm-sync on" id="tog-sync" type="button" hidden
                      aria-pressed="true" title="出图后同步发一份到你的 QQ">
                <span class="pms-txt">
                  <b>同步 QQ</b>
                  <small>出图后再发一份到手机 QQ</small>
                </span>
                <span class="pms-check" aria-hidden="true">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                       stroke="currentColor" stroke-width="3" stroke-linecap="round"
                       stroke-linejoin="round">
                    <path d="M4.6 12.6l4.6 4.6L19.4 6.6"/>
                  </svg>
                </span>
              </button>

              <div class="pm-row">
                <button type="button" id="pick-camera">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                       stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                    <path d="M4 8.5h2.6l1.4-2h8l1.4 2H20v10H4z"/><circle cx="12" cy="13" r="3.2"/>
                  </svg>
                  相机
                </button>
                <button type="button" id="pick-album">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                       stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                    <rect x="3.5" y="5" width="17" height="14" rx="2.5"/>
                    <path d="M3.8 16l4.4-4.2 3.2 3 3.4-3.6 5.4 5"/>
                  </svg>
                  相册
                </button>
              </div>
            </div>

            <div class="chip-row">
              <div class="chips">
                <button class="chip" type="button" data-chip="gallery">AI 创作</button>
                <button class="chip" type="button" data-chip="style">
                  画风 <span class="chip-sub" id="skill-name">…</span>
                </button>
                <button class="chip" type="button" data-chip="comic">我的漫画</button>
              </div>

              <!-- 直达生图（2026-11-27）：原样提示词跑一张，不经过 AI。
                   从「＋」里搬到底行，顶掉原来「同步 QQ」的位置——它跟
                   「AI 发送」都是发图，并排摆着才看得出是两种发送方式；
                   差别写在 title 里，不靠用户猜。 -->
              <button class="direct-btn" id="btn-direct" type="button" disabled
                      title="直达生图：原样提示词跑一张，不经过 AI">直达生图</button>
            </div>

            <!-- 主发送：交给大大怪改写提示词后出图。「直达」在「＋」里。 -->
            <button class="send-btn" id="btn-send" type="button" disabled
                    title="交给大大怪改写提示词后出图">AI 发送</button>
          </div>
        </div>

        <input type="file" id="file-camera" accept="image/*" capture="environment" hidden>
        <input type="file" id="file-album" accept="image/*" hidden>
      </div>
    </section>
  </div>
</div>

<!-- 画风抽屉：50 多个渠道横不过来，做成滚动列表 -->
<div class="sheet" id="style-sheet" hidden>
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-head">
      <span>画风 <span class="sub">选一个设为默认</span></span>
      <button class="sheet-x" type="button" data-close aria-label="关闭">✕</button>
    </div>
    <div class="style-list" id="style-list"></div>
    <button class="style-more" id="style-more" type="button" hidden>▾ 展开全部</button>
  </div>
</div>

<script src="js/api.js?v=20261127i"></script>
<script src="js/store.js?v=20261127i"></script>
<script src="js/gen.js?v=20261127i"></script>
<script src="js/shot.js?v=20261128g"></script>
<script src="js/scroll.js?v=20261127i"></script>
<script src="js/card.js?v=20261127r"></script>
<script src="js/gen_flow.js?v=20261127s"></script>
<script src="js/direct.js?v=20261127i"></script>
<script src="js/redraw.js?v=20261127i"></script>
<script src="js/imgcache.js?v=20261127i"></script>
<script src="js/views.js?v=20261127o"></script>
<script src="js/hide.js?v=20261127i"></script>
<script src="js/gallery_shell.js?v=20261127q"></script>
<script src="js/gallery_load.js?v=20261127i"></script>
<script src="js/gallery.js?v=20261127i"></script>
<script src="js/comic.js?v=20261127i"></script>
<script src="js/create.js?v=20261127i"></script>
<script src="js/me.js?v=20261127i"></script>
<script src="js/ref.js?v=20261127t"></script>
<script src="js/archive.js?v=20261127i"></script>
<script src="js/stack.js?v=20261127q"></script>
<script src="js/chat.js?v=20261127t"></script>
<script src="js/visitor.js?v=20261127i"></script>
<script src="js/sync.js?v=20261127i"></script>
<!-- 桌面端图片查看器（M1）：独立一层，只在 ≥900px 接管 .shot 的点击，
     手机上仍走 shot.js 的原地放大。放在最后，等 Gen / Shot 都就位。 -->
<script src="js/viewer-1.js?v=20261128i"></script>
<!-- 桌面右栏（M2）：宽屏才生效，窄屏只是 DOM 里一个 display:none 的壳 -->
<script src="js/desk-1.js?v=20261128g"></script>

<script>
  (function () {
    /* 顺序有讲究：stack.init 要先给 history 打底，chat.init 在里面会
       重放存档里的消息卡片、给画风的选中态取名字，必须先拿到栈壳。
       visitor 放最后：它要摘的就是上面那几位建出来的节点。 */
    WSStack.init();
    WSChat.init();
    WSCreate.init();
    WSVisitor.load();
    WSSync.init();
  })();
</script>
</body>
</html>
