<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漫画工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%237c5cff'/></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f; --bg-elev: #12121a; --bg-input: #1a1a24;
    --border: #2a2a3a; --border-soft: #1f1f2e;
    --text: #e8e8f0; --text-dim: #8888a0; --text-mute: #555570;
    --accent: #7c5cff; --success: #4ade80; --error: #f87171;
    --warn: #fbbf24; --info: #4fc3f7; --radius: 12px; --radius-sm: 8px;
  }
  html, body { background: var(--bg); color: var(--text);
    font-family: "SF Mono", "JetBrains Mono", "Consolas", "Microsoft YaHei", monospace;
    font-size: 14px; min-height: 100%; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 12px 0 20px; }
  .topbar h1 { font-size: 17px; font-weight: 500; }
  .topbar .spacer { flex: 1; }
  a.back { color: var(--text-dim); text-decoration: none; font-size: 13px; }
  a.back:hover { color: var(--accent); }
  .card { background: var(--bg-elev); border: 1px solid var(--border-soft);
    border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; font-weight: 500; color: var(--text-dim); margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input, textarea, select {
    background: var(--bg-input); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius-sm); padding: 8px 10px; font: inherit; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { width: 100%; min-height: 220px; line-height: 1.6; resize: vertical; }
  .btn { background: var(--bg-input); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--radius-sm); padding: 8px 14px; cursor: pointer; font: inherit; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .btn.danger { color: var(--error); }
  #jobbar { display: none; padding: 8px 12px; border-radius: var(--radius-sm);
    background: var(--bg-input); border: 1px solid var(--border); font-size: 13px;
    color: var(--info); margin-bottom: 12px; }
  #jobbar.err { color: var(--error); border-color: var(--error); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .slot { background: var(--bg-input); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
  .slot .head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
  .slot .no { font-size: 15px; font-weight: 500; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid; }
  .b-pending  { color: var(--text-mute); border-color: var(--text-mute); }
  .b-rendered { color: var(--info);     border-color: var(--info); }
  .b-done     { color: var(--success);  border-color: var(--success); }
  .b-error    { color: var(--error);    border-color: var(--error); }
  .slot .seed { margin-left: auto; font-size: 11px; color: var(--text-mute); }
  .slot .imgs { display: flex; gap: 1px; background: var(--border-soft); }
  .slot .imgs div { flex: 1; min-height: 160px; background: var(--bg-elev);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-mute); font-size: 11px; }
  .slot img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .slot .ops { display: flex; gap: 6px; padding: 8px 10px; flex-wrap: wrap; }
  .slot .err { color: var(--error); font-size: 11px; padding: 0 10px 8px; word-break: break-all; }
  .slot .lbl { color: var(--text-dim); font-size: 11px; padding: 0 10px 8px; }
  .empty { color: var(--text-mute); font-size: 13px; padding: 24px; text-align: center; }
  .slot img.zoomable { cursor: zoom-in; }
  #zoom { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9);
    z-index: 30; align-items: center; justify-content: center; cursor: zoom-out; }
  #zoom img { max-width: 94vw; max-height: 94vh; }
  .slot .manual { padding: 0 10px 8px; }
  .slot .manual textarea { min-height: 48px; font-size: 12px; line-height: 1.5;
    padding: 6px 8px; }
  .mrow { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .mrow select, .slot .ops select { padding: 4px 6px; font-size: 12px; }
  .slot .peek { margin-top: 6px; }
  .slot .peek .ptip { color: var(--text-dim); font-size: 11px; line-height: 1.6;
    margin-bottom: 4px; }
  .slot .peek textarea { min-height: 104px; font-size: 12px; line-height: 1.5;
    padding: 6px 8px; }
  label.file { position: relative; overflow: hidden; }
  label.file input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--bg-input); border: 1px solid var(--accent); color: var(--text);
    padding: 10px 18px; border-radius: var(--radius-sm); display: none; z-index: 9; max-width: 80%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>🎬 漫画工作台</h1>
    <span class="spacer"></span>
    <a class="back" href="/">← 回对话</a>
  </div>

  <div class="card">
    <h2>① 需求 → 编剧出剧本</h2>
    <div class="row" style="margin-bottom:10px">
      <textarea id="brief" rows="3" style="flex:1;min-width:220px" placeholder="视角: 哥哥
主角: 妹妹
剧情: 下雨天兄妹俩在公交站躲雨……（前两行是硬约束：视角=镜头后的「我」，男性→pov、女性→female_pov；主角=画面里唯一入画的人）"></textarea>
      <input id="character" style="width:130px" placeholder="角色名（可选）">
      <input id="panels" type="number" min="1" max="30" value="10" style="width:70px" title="格数">
    </div>
    <div class="row" style="margin-bottom:10px">
      <span style="color:var(--text-dim);font-size:12px">编剧模型</span>
      <select id="prov" style="width:140px" onchange="loadModels()" title="用哪家模型写剧本"></select>
      <select id="model" style="width:200px" title="写剧本用的具体模型（留空 = 该家默认）"></select>
      <span class="spacer" style="flex:1"></span>
      <button class="btn primary" id="btnScript" onclick="genScript()">生成剧本</button>
    </div>
    <textarea id="script" style="display:none" spellcheck="false"></textarea>
    <div id="fixPanel" style="display:none;margin-top:10px"></div>
    <div class="row" id="scriptOps" style="display:none;margin-top:10px">
      <span style="color:var(--text-dim);font-size:12px">剧本可直接改字（场景行/台词行都行），改完点确认开跑按改过的跑</span>
      <span class="spacer" style="flex:1"></span>
      <button class="btn" id="btnRefix" onclick="refix()" title="以编剧原稿为底，重跑一遍内容补正">🩹 重新补正</button>
      <button class="btn" id="btnSave" onclick="saveScript(false)">只保存</button>
      <button class="btn primary" id="btnStart" onclick="saveScript(true)">确认开跑（渲染全部场景图）</button>
    </div>
  </div>

  <div class="card">
    <h2>② 槽位 · 逐格生成与修补</h2>
    <div style="color:var(--text-dim);font-size:12px;margin-bottom:10px">
      点图可放大看细节。每格能手输一句「要 Qwen 改什么」——源图是这一格**当前成品**，
      所以可以一次次往上改（改坏了点「加气泡」从底图重画，底图不动）。
      「📎 传底图」用来顶替你手跑好的底图。
    </div>
    <div id="jobbar"></div>
    <div class="row" id="bubbleAllRow" style="display:none;margin-bottom:12px">
      <button class="btn primary" id="btnBubbleAll" onclick="bubbleAll()">🫧 一键加气泡（全部待加格）</button>
      <a class="btn" id="btnZip" style="text-decoration:none" href="#">📦 下载成品 zip</a>
      <span id="progress" style="color:var(--text-dim);font-size:12px"></span>
    </div>
    <div id="grid" class="grid"><div class="empty">还没有任务——先在上面生成剧本</div></div>
  </div>
</div>
<div id="zoom" onclick="zoomClose()"><img alt=""></div>
<div id="toast"></div>

<script>
let TASK = null;          // 任务 id（C<日期>-<序号>）
let TIMER = null;
let SCRIPT_JOB = null;    // 正在跑的编剧任务 id（编剧是后台 agent，轮询取结果）
let PROVIDERS = [];       // /api/providers 拉回来的候选家（编剧模型下拉）

function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  t.style.borderColor = isErr ? 'var(--error)' : 'var(--accent)';
  clearTimeout(t._h);
  t._h = setTimeout(() => t.style.display = 'none', 3500);
}

async function api(path, body) {
  const opt = body ? {method: 'POST', headers: {'Content-Type': 'application/json'},
                      body: JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  const d = await r.json().catch(() => ({ok: false, error: '响应不是 JSON'}));
  if (!d.ok) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}

function setBusy(b, phase) {
  // 编剧任务独立于渲染任务，但它跑的时候同样要锁住按钮——否则每 2 秒一轮的
  // 槽位刷新会调 setBusy(false)，把「生成剧本」重新启用（用户能重复点，
  // 一重复就是两个 agent 在并发烧 token）。
  const busy = b || !!SCRIPT_JOB;
  for (const id of ['btnScript', 'btnSave', 'btnStart', 'btnBubbleAll', 'btnRefix'])
    document.getElementById(id).disabled = busy;
  document.querySelectorAll('.slot .ops button, .slot .ops select').forEach(x => x.disabled = busy);
  // 手动修复栏也要锁：跑一轮 Qwen 时再点一次就是两个后台任务抢同一格。
  document.querySelectorAll('.slot .mrow button, .slot .mrow select, .slot .mrow input[type=file]').forEach(
    x => x.disabled = busy);
  const bar = document.getElementById('jobbar');
  if (b) { bar.style.display = 'block'; bar.classList.remove('err');
           bar.textContent = '⏳ 正在' + (phase === 'bubble' ? '加气泡' : '渲染场景图') + '……页面每 2 秒自动刷新'; }
}

// ── 编剧模型下拉 ─────────────────────────────────────
// 候选由后端去问 provider 自己拿（模型 ID 会下线也会改名，写死的清单会慢慢
// 指向不存在的模型）。复用网页端同一套接口，不另造一份。

async function loadProviders() {
  try {
    const d = await (await fetch('/api/providers')).json();
    PROVIDERS = d.providers || [];
    const sel = document.getElementById('prov');
    sel.innerHTML = PROVIDERS.map(p =>
      '<option value="' + esc(p.id) + '">' + esc(p.label) + '</option>').join('');
    if (PROVIDERS.some(p => p.id === d.default)) sel.value = d.default;
    await loadModels();
  } catch (e) { /* 拉不到就留空，请求里不传 = 走后端默认 */ }
}

async function loadModels() {
  const pid = document.getElementById('prov').value;
  const meta = PROVIDERS.filter(p => p.id === pid)[0] || {};
  const sel = document.getElementById('model');
  sel.innerHTML = '<option value="">（' + esc(meta.label || pid) + ' 默认模型）</option>';
  try {
    const d = await (await fetch('/api/models?provider=' + encodeURIComponent(pid))).json();
    const ids = ((d && d.models) || [])
      .filter(m => !m.retiring)                 // 将退役的别占视野
      .map(m => m.id);
    if (ids.length) {
      sel.innerHTML = '<option value="">（默认：' + esc(ids[0]) + '）</option>'
        + ids.map(id => '<option value="' + esc(id) + '">' + esc(id) + '</option>').join('');
    }
  } catch (e) { /* 静默：留一个「默认模型」项，请求里不传 model 即可 */ }
}

async function genScript() {
  const brief = document.getElementById('brief').value.trim();
  if (!brief) { toast('先写需求（视角/主角/剧情）', true); return; }
  const btn = document.getElementById('btnScript');
  btn.disabled = true; btn.textContent = '编剧查库中…';
  try {
    const d = await api('/api/comic/script', {
      brief, panels: +document.getElementById('panels').value || 10,
      character: document.getElementById('character').value.trim(),
      provider: document.getElementById('prov').value,
      model: document.getElementById('model').value
    });
    SCRIPT_JOB = d.job;
    pollScript();
  } catch (e) {
    toast(e.message, true);
    finishScript();
  }
}

// 编剧是后台 agent（查库要跑十几轮 LLM，几分钟很正常），所以这里轮询而不是
// 干等一个请求——Flask 是单线程跑的，同步等待会把槽位刷新一起堵死。
async function pollScript() {
  if (!SCRIPT_JOB) return;
  let d;
  try { d = await api('/api/comic/script_status?job=' + SCRIPT_JOB); }
  catch (e) { toast(e.message, true); finishScript(); return; }

  if (d.state === 'running') {
    const log = d.log || [];
    const last = log.length ? log[log.length - 1] : '正在读规范…';
    document.getElementById('btnScript').textContent = '编剧查库中（' + last + '）';
    setTimeout(pollScript, 1200);
    return;
  }
  if (d.state === 'error') {
    toast('编剧失败：' + d.error, true);
    finishScript();
    return;
  }
  TASK = d.task;
  const ta = document.getElementById('script');
  ta.style.display = 'block'; ta.value = d.script;
  renderFix(d.fix);                       // 补正报告（编剧之后那一步）
  document.getElementById('scriptOps').style.display = 'flex';
  toast('剧本已生成：' + TASK);
  finishScript();
  refresh();
}

function finishScript() {
  SCRIPT_JOB = null;
  const btn = document.getElementById('btnScript');
  btn.disabled = false; btn.textContent = '生成剧本';
}

// ── 内容补正报告（编剧之后的独立一步）─────────────────────
// 补正是「编剧交稿 + 代码出问题清单（只做检测）→ 模型照清单补 → 直接采纳」。
// 这里负责把 fix.json 显示出来：采纳了改了什么；没采纳只有一种情形——补正模型
// 返回空 / 解析不出剧本 / 格号对不上，此时提示用户点「重新补正」重跑。
// 数据来自 status 里的 fix 字段（落盘在任务目录的 fix.json），刷新页面也还在。
const FIX_FAIL = {error: '调用失败', empty: '模型返回空',
                  unparseable: '返回的格式解析不出剧本', structure: '格号与原稿对不上'};
function renderFix(fix) {
  const box = document.getElementById('fixPanel');
  if (!fix) { box.style.display = 'none'; return; }
  const sig = JSON.stringify([fix.status, fix.adopted, fix.skipped, fix.diff,
                              fix.warnings, fix.audit, fix.at]);
  if (box.dataset.sig === sig) return;          // 没变就别重建，避免闪烁
  box.dataset.sig = sig; box.dataset.at = fix.at || '';
  box.style.display = 'block';

  const st = fix.status || '';
  const bits = [];
  if (fix.skipped)
    bits.push('<span class="badge b-done">无需补正</span> 代码判据没发现问题，没调用补正模型');
  else if (FIX_FAIL[st])
    bits.push('<span class="badge b-error">补正失败（' + FIX_FAIL[st] + '）</span> 剧本保持原稿');
  else if (st === 'nochange')
    bits.push('<span class="badge b-error">未改动</span> 补正模型把原稿原样交回');
  else if (fix.adopted)
    bits.push('<span class="badge b-done">已采纳</span> 补正后直接成为剧本（原稿存为 script_original.md）');
  else
    bits.push('<span class="badge b-error">未采纳</span> 剧本保持原样');

  let h = '<div style="border:1px solid var(--border);border-radius:8px;padding:10px">';
  h += '<div style="font-size:13px;margin-bottom:6px">🩹 内容补正（' + esc(fix.at || '')
     + '）：' + bits.join('') + '</div>';
  if (FIX_FAIL[st])
    h += '<div style="color:var(--error);font-size:13px;margin-top:6px;font-weight:500">'
       + '👉 请点上方「🩹 重新补正」重跑一次</div>';
  if (fix.issues && fix.issues.length)
    h += '<div style="color:var(--text-dim);font-size:12px">代码清单：'
       + fix.issues.length + ' 处</div>';
  if (fix.audit && fix.audit.length)
    h += '<div style="color:var(--text-dim);font-size:12px;margin-top:4px">'
       + '补正后代码判据仍报 ' + fix.audit.length + ' 处（仅供参考，不影响采纳）</div>';
  if (fix.warnings && fix.warnings.length)
    h += '<div style="color:var(--text-dim);font-size:12px;margin-top:4px">'
       + fix.warnings.map(esc).join('；') + '</div>';
  for (const d of (fix.diff || [])) {
    h += '<div style="margin-top:8px;font-size:12px">'
       + '<b>格 ' + esc(d.no) + '</b> · ' + (d.changed || []).map(esc).join('、') + '</div>';
    for (const k of (d.changed || [])) {
      h += '<div style="font-family:var(--mono,monospace);font-size:12px;'
         + 'color:var(--error);text-decoration:line-through;word-break:break-all">'
         + esc((d.before || {})[k]) + '</div>';
      h += '<div style="font-family:var(--mono,monospace);font-size:12px;'
         + 'color:var(--accent);word-break:break-all">' + esc((d.after || {})[k]) + '</div>';
    }
  }
  box.innerHTML = h + '</div>';
}

async function refix() {
  if (!TASK) return;
  const btn = document.getElementById('btnRefix');
  const box = document.getElementById('fixPanel');
  btn.disabled = true; btn.textContent = '补正中…';
  box.style.display = 'block';
  box.dataset.sig = ''; box.dataset.at = '';
  box.innerHTML = '<div style="color:var(--text-dim);font-size:12px">'
                + '🩹 正在以编剧原稿为底重跑补正（几秒到一分多钟，取决于模型）…</div>';
  try {
    await api('/api/comic/fix', {task: TASK,
      provider: document.getElementById('prov').value,
      model: document.getElementById('model').value});
    // 补正是后台线程（实测 9~80 秒），轮询到 fix.json 换了一份为止。
    // 拿 `at` 当指纹：它就是这次重跑的结果，跟旧的那份区分得开。
    for (let i = 0; i < 120; i++) {
      await new Promise(r => setTimeout(r, 2000));
      let s;
      try { s = await api('/api/comic/status?task=' + TASK); } catch (e) { break; }
      if (s.fix && s.fix.at && s.fix.at !== box.dataset.at) {
        renderFix(s.fix);
        // ⚠️ 必须把 textarea 里的正文刷新成补正后的——不然用户接着点「确认开跑」
        // 会把内存里的旧文本存回去，补正结果直接作废（见 script_text 端点注释）。
        try {
          const t = await api('/api/comic/script_text?task=' + TASK);
          if (t.script) document.getElementById('script').value = t.script;
        } catch (e) { console.warn(e); }
        const bad = !!FIX_FAIL[s.fix.status];
        toast(bad ? ('补正失败：' + FIX_FAIL[s.fix.status] + '，请点「重新补正」重跑')
                  : (s.fix.adopted ? '补正已采纳'
                                   : (s.fix.status === 'nochange'
                                      ? '补正模型没改动任何一处'
                                      : '补正未改动，见下方说明')), bad);
        break;
      }
      if (!s.running) break;              // 跑完了却没有新报告 = 后台出错
    }
  } catch (e) {
    toast(e.message, true);
    box.style.display = 'none';
  } finally {
    btn.disabled = false; btn.textContent = '🩹 重新补正';
  }
}

async function saveScript(andRun) {
  const btn = document.getElementById('btnStart');
  try {
    await api('/api/comic/save', {task: TASK, script: document.getElementById('script').value});
    if (!andRun) { toast('剧本已保存'); return; }
    await api('/api/comic/start', {task: TASK});
    setBusy(true, 'scene');
    toast('已开跑：逐格渲染场景图（anima线条）');
    poll();
  } catch (e) { toast(e.message, true); }
}

const STATE_CN = {pending: '排队', rendered: '待加气泡', done: '完成'};

function renderSlot(p) {
  const badge = p.error ? '<span class="badge b-error">出错</span>'
    : '<span class="badge b-' + p.state + '">' + (STATE_CN[p.state] || p.state) + '</span>';
  const img = (url, alt, which) => url
    ? '<img class="zoomable" loading="lazy" src="' + url + '&t=' + Date.now()
      + '" onclick="zoomOpen(this.src, \'' + p.no + '\', \'' + which + '\')">'
    : alt;
  const ops = [];
  // 失败格必须也能重跑（2026-10-12）。场景渲染挂掉的格**停在 pending**，
  // 原来这条条件 `!== 'pending'` 正好把它挡在门外 —— 它是整个界面上唯一
  // 没有任何操作按钮的格子，底下还写着「排队中…」，看上去像在排队。
  // 加上 `|| p.error` 后：带错的格一律给重跑按钮，真在排队的格（无 error）
  // 才显示「排队中…」。
  if (p.state !== 'pending' || p.error)
    ops.push('<button class="btn small" onclick="rerender(\'' + p.no + '\')">🔁 换种子重跑</button>');
  if (p.state === 'rendered')
    ops.push('<button class="btn small" onclick="bubble(\'' + p.no + '\')">🫧 加气泡</button>');
  if (p.state === 'done')
    ops.push('<button class="btn small" onclick="bubble(\'' + p.no + '\')">↩️ 从底图重画</button>');
  // 画法开关，只给「有第二句台词」的格——别的格没有第二个气泡可画。
  // 默认「一遍画完」：2026-10-11 起两个气泡+旁白一次交付，省掉一次 50~70 秒。
  // 「分开画」是退路：某格一遍画崩了就切回来单独重跑（走原来的两遍老路）。
  if (p.bubble2 && p.state !== 'pending')
    ops.push('<select class="meth" id="meth-' + p.no + '" title="有第二句台词的格：一遍画完更快，画崩了再切分开画">'
      + '<option value="0">一遍画完</option>'
      + '<option value="1">分开画</option>'
      + '</select>');
  return '<div class="slot"><div class="head"><span class="no">格 ' + p.no + '</span>'
    + badge + '<span class="seed">' + (p.seed != null ? 'seed ' + p.seed : '') + '</span></div>'
    + '<div class="imgs"><div>' + img(p.scene_url, '场景图未生成', 'scene') + '</div>'
    + '<div>' + img(p.final_url, '气泡未加', 'final') + '</div></div>'
    + labelHtml(p)
    + (p.error ? '<div class="err">' + esc(p.error) + '</div>' : '')
    + '<div class="ops">' + (ops.join('') || '<span style="color:var(--text-mute);font-size:11px">排队中…</span>') + '</div>'
    + manualHtml(p) + '</div>';
}

// 手动修复栏：手输指令 → 跑一遍 Qwen（源图＝这一格**当前成品**，可累积着改）
// ＋ 传底图顶替这一格的 raw ＋ 「完整提示词」框（看清并手改原样发给 qwen 的文字）。
// 一格一个铺在卡片里（用户拍板要内联，不要弹面板）。
function manualHtml(p) {
  const open = !!_peekOpen[p.no];
  return '<div class="manual">'
    + '<textarea class="mins" spellcheck="false" placeholder="手输一句要 Qwen 改什么，例：把「松手啦，疼。」这几个字重画清楚"></textarea>'
    + '<div class="mrow">'
    + '<button class="btn small" onclick="manualRun(\'' + p.no + '\')">✍️ 跑 Qwen</button>'
    + '<select class="mden" title="改字用小强度（只重画那几处）；整格重来用大强度">'
    + '<option value="0.35">改字·轻</option>'
    + '<option value="0.60" selected>标准</option>'
    + '<option value="0.80">重画·强</option>'
    + '</select>'
    + '<button class="btn small" onclick="peekToggle(\'' + p.no + '\')">'
    + (open ? '🔽 收起提示词' : '🔍 完整提示词') + '</button>'
    + '<label class="btn small file" title="你在别处跑好的底图，传进来顶替这一格的底图">📎 传底图'
    + '<input type="file" accept="image/*" onchange="uploadScene(\'' + p.no + '\', this)"></label>'
    + '</div>'
    + (open ? peekHtml(p) : '')
    + '</div>';
}

// 「完整提示词」框：把**原样发给 qwen 的那段文字**摊开给人看并改。
// 预填的是后端 bubble_prompt() 的输出（一字不差，见 /api/comic/prompt）。
//
// ⚠️ 它重跑时源图是这一格的**干净底图**（raw），不是当前成品——预填那段文字
// 是「请新增一个对话框」，在已经有气泡的成品上再跑一次会叠出第二个气泡。
// 想累积着改字（源图＝成品）就用上面的手输指令那条路。
function peekHtml(p) {
  return '<div class="peek">'
    + '<div class="ptip">下面这段就是原样发给 Qwen 的文字，可以直接改。'
    + '「用这段重画」拿这一格的<b>干净底图</b>当源图（不含已画的字），'
    + '所以不会叠出第二个气泡。</div>'
    + '<textarea class="mpeek" spellcheck="false" placeholder="点下面的「取回系统拼装」拉取，或自己整段写"></textarea>'
    + '<div class="mrow">'
    + '<button class="btn small" onclick="peekReset(\'' + p.no + '\')">↺ 取回系统拼装</button>'
    + '<button class="btn small" onclick="peekRun(\'' + p.no + '\')">🎬 用这段从底图重画</button>'
    + '</div></div>';
}

// 旁白：一格可以有多条（剧本里 `标签1:` `标签2:`…，后端用 \n 拼在一行里）。
// 块内换行会触发整格重建（下面逐格 diff 只比 p.label 这个字符串），图片不在
// 旁白 DOM 里，所以重建不会闪图。
function labelHtml(p) {
  const lines = String(p.label || '').split('\n').filter(x => x.trim());
  if (!lines.length) return '';
  return '<div class="lbl">' + lines.map((x, i) =>
    '标签' + (i + 1) + ': ' + esc(x)).join('<br>') + '</div>';
}

const _slots = {};   // {no: {sig, el}} —— 逐格 diff，状态没变就不碰 DOM（不闪图）
const _manual = {};  // {no: 手输的指令} —— 状态一变这一格就会重建，输入框内容
                     // 若不另存就会没；跑完一次 Qwen 想接着调必须留住。
const _method = {};  // {no: '0'|'1'} 这一格的画法（一遍画完 / 分开画）——同上，
                     // 重建后不填回来就会悄悄弹回默认值。
const _promptText = {};  // {no: 完整提示词框里的文字}（也算用户手改后的版本）——
                         // 同上，这一格的 DOM 会因图片 rev 变化而重建，不存就会被
                         // 2 秒一次的状态轮询冲掉。
const _peekOpen = {};    // {no: true} 这一格的提示词框展开着吗。
let _zoom = null;    // {no, which} 当前放大的那张图 —— 手动跑 Qwen 是在原文件上
                     // 覆盖，放大层不跟着换的话，人盯着放大图会以为根本没重跑。

function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

async function refresh() {
  if (!TASK) return;
  let d;
  try { d = await api('/api/comic/status?task=' + TASK); }
  catch (e) { console.warn(e); return; }
  renderFix(d.fix);          // 重新补正后靠这个 2 秒轮询把报告刷出来
  const grid = document.getElementById('grid');
  if (!d.panels.length) {
    if (grid.dataset.empty !== '1') { grid.innerHTML = '<div class="empty">剧本里没解析到格子</div>'; grid.dataset.empty = '1'; }
    return;
  }
  grid.dataset.empty = '';
  // 格子集合变了（剧本编辑增删格）→ 缓存和 DOM 全部重建
  const nos = d.panels.map(p => p.no).sort().join(',');
  if (Object.keys(_slots).sort().join(',') !== nos) {
    for (const k of Object.keys(_slots)) delete _slots[k];
    grid.innerHTML = '';
  }
  for (const p of d.panels) {
    // 签名=影响展示的全部字段；没变就跳过这一格——图片不会重新加载，页面不闪。
    // `rev` 是图片文件本身的指纹（mtime+大小）：手动跑 Qwen 是**就地覆盖成品**，
    // state/seed/url 全都不变，当初只比这些字段时新图永远刷不出来。
    const sig = [p.state, p.error, p.seed, p.scene_url, p.final_url, p.rev,
                 p.label, p.bubble, p.bubble2].join('|');
    const cached = _slots[p.no];
    if (cached && cached.sig === sig) continue;
    const el = document.createElement('div');
    el.innerHTML = renderSlot(p);
    const node = el.firstElementChild;
    node.dataset.no = p.no;
    // 手输的指令存在 _manual 里再填回来：状态一变这一格就整块重建，不填回去
    // 的话跑完一次 Qwen 输入框就空了，没法接着调第二个字。
    const ta = node.querySelector('.mins');
    if (ta) {
      ta.value = _manual[p.no] || '';
      ta.addEventListener('input', () => { _manual[p.no] = ta.value; });
    }
    // 完整提示词框同理。第一次展开（还没有内容）才去后端拉一次系统拼装——
    // 拉回来立刻存进 _promptText，之后重建就不会再打接口。
    const pk = node.querySelector('.mpeek');
    if (pk) {
      pk.value = _promptText[p.no] || '';
      pk.addEventListener('input', () => { _promptText[p.no] = pk.value; });
      if (!_promptText[p.no]) peekFetch(p.no, pk);
    }
    // 画法开关同理要存回来：不存的话跑到第二遍时它已经悄悄弹回「一遍画完」。
    const meth = node.querySelector('.meth');
    if (meth) {
      meth.value = _method[p.no] || '0';
      meth.addEventListener('change', () => { _method[p.no] = meth.value; });
    }
    if (cached && cached.el.parentNode) cached.el.replaceWith(node);
    else grid.appendChild(node);
    _slots[p.no] = {sig, el: node};
    // 正放大的那张图被重写了（刚跑完 Qwen）→ 放大层也换成新的
    if (_zoom && _zoom.no === p.no) {
      const u = _zoom.which === 'scene' ? p.scene_url : p.final_url;
      const zi = document.querySelector('#zoom img');
      if (u && zi) zi.src = u + '&t=' + Date.now();
    }
  }
  const bar = document.getElementById('jobbar');
  if (d.running) { setBusy(true, d.running); }
  else {
    setBusy(false);
    bar.style.display = d.job_error ? 'block' : 'none';
    if (d.job_error) { bar.classList.add('err'); bar.textContent = '✗ 后台任务失败：' + d.job_error; }
  }
  const done = d.panels.filter(p => p.state === 'done').length;
  const rendered = d.panels.filter(p => p.state === 'rendered').length;
  document.getElementById('progress').textContent =
    TASK ? ('进度：' + done + '/' + d.panels.length + ' 完成 · ' + rendered + ' 待加气泡') : '';
  document.getElementById('bubbleAllRow').style.display = 'flex';
  document.getElementById('btnBubbleAll').disabled = rendered === 0 || !!d.running;
  document.getElementById('btnZip').href = '/api/comic/download?task=' + TASK;
}

function poll() { clearTimeout(TIMER); TIMER = setTimeout(async () => { await refresh(); poll(); }, 2000); }

async function rerender(no) {
  try { await api('/api/comic/rerender', {task: TASK, no}); setBusy(true, 'scene'); toast('格 ' + no + ' 换种子重跑中'); }
  catch (e) { toast(e.message, true); }
}

async function bubble(no) {
  // 这一格的画法开关：p.bubble2 为空的格没有这个下拉，按默认（一遍画完）走。
  const sel = document.getElementById('meth-' + no);
  const split = !!(sel && sel.value === '1');
  try {
    await api('/api/comic/bubble', {task: TASK, no, split});
    setBusy(true, 'bubble');
    toast('格 ' + no + ' 加气泡中（qwen 图生图，' + (split ? '分开画' : '一遍画完') + '）');
  } catch (e) { toast(e.message, true); }
}

async function bubbleAll() {
  try { await api('/api/comic/bubble', {task: TASK, no: 'all'}); setBusy(true, 'bubble'); toast('批量加气泡中'); }
  catch (e) { toast(e.message, true); }
}

// 点图放大看细节——「哪几个字糊了」得先看清才写得出指令。
function zoomOpen(src, no, which) {
  _zoom = {no, which};
  const d = document.getElementById('zoom');
  d.querySelector('img').src = src;
  d.style.display = 'flex';
}
function zoomClose() { _zoom = null; document.getElementById('zoom').style.display = 'none'; }

// 手动跑 Qwen：源图＝这一格当前成品，所以可以一次次往上改。
async function manualRun(no) {
  const slot = document.querySelector('.slot[data-no="' + no + '"]');
  const ta = slot && slot.querySelector('.mins');
  const sel = slot && slot.querySelector('select.mden');
  const prompt = ta ? ta.value.trim() : '';
  if (!prompt) { toast('先写一句要 Qwen 改什么', true); return; }
  _manual[no] = ta.value;
  try {
    await api('/api/comic/manual', {task: TASK, no, prompt,
                                    denoise: sel ? sel.value : ''});
    setBusy(true, 'bubble');
    toast('格 ' + no + ' 手动跑 Qwen 中（源图＝当前成品）');
  } catch (e) { toast(e.message, true); }
}

// ── 「完整提示词」框：显示并手改原样发给 qwen 的文字 ──────────────
// 展开/收起。改 _slots[no].sig 是**故意**的：刷新循环只在签名变了才重建这一格，
// 而展开与否不在签名里（它在客户端状态里），所以直接把签名打脏逼它重建一次。
function peekToggle(no) {
  _peekOpen[no] = !_peekOpen[no];
  const c = _slots[no];
  if (c) c.sig = null;
  refresh();
}

function _peekSplit(no) {
  const sed = document.getElementById('meth-' + no);
  return !!(sed && sed.value === '1');
}

// 拉取后端拼装好的那段文字。split 跟着界面上的画法下拉走——一格有没有第二句
// 台词，拼出来的是两套模板，不跟就会「看到的是 A、跑的是 B」。
async function peekFetch(no, el) {
  const slot = document.querySelector('.slot[data-no="' + no + '"]');
  const ta = el || (slot && slot.querySelector('.mpeek'));
  if (!ta) return;
  try {
    const d = await api('/api/comic/prompt?task=' + TASK + '&no=' + no
                        + '&split=' + (_peekSplit(no) ? 1 : 0));
    _promptText[no] = d.prompt || '';
    ta.value = _promptText[no];
  } catch (e) { toast(e.message, true); }
}

async function peekReset(no) {
  _promptText[no] = '';                    // 清掉才好重新拉（peekFetch 会填回去）
  await peekFetch(no);
  toast('已取回系统拼装的提示词');
}

// 用框里的文字重画这一格。源图＝干净底图（raw），所以是「从零加字」。
async function peekRun(no) {
  const slot = document.querySelector('.slot[data-no="' + no + '"]');
  const ta = slot && slot.querySelector('.mpeek');
  const prompt = ta ? ta.value.trim() : '';
  if (!prompt) { toast('提示词是空的——先点「取回系统拼装」或自己写一段', true); return; }
  _promptText[no] = ta.value;
  try {
    await api('/api/comic/bubble', {task: TASK, no, prompt,
                                    split: _peekSplit(no)});
    setBusy(true, 'bubble');
    toast('格 ' + no + ' 用你改过的提示词重画中（源图＝干净底图）');
  } catch (e) { toast(e.message, true); }
}

async function uploadScene(no, input) {
  const f = input.files && input.files[0];
  input.value = '';                      // 清掉才能连传同一个文件两次
  if (!f) return;
  const fd = new FormData();
  fd.append('task', TASK); fd.append('no', no); fd.append('file', f);
  try {
    const r = await fetch('/api/comic/upload', {method: 'POST', body: fd});
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.ok === false) throw new Error(d.error || ('HTTP ' + r.status));
    toast('格 ' + no + ' 底图已替换，接着点「加气泡」');
  } catch (e) { toast(e.message, true); }
  await refresh();
}

poll();
loadProviders();
</script>
</body>
</html>
