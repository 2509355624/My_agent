<div class="app">
  <div class="header">

      <div class="logo">A</div>
      <div>
        <div class="title">个人 Agent</div>
      </div>
      <span class="model-badge" id="modelBadge">加载中...</span>
    </div>
    <div class="header-actions">
      <button class="btn danger" onclick="clearChat()">清空会话</button>
    </div>
  </div>

  <div class="main-body">
    <!-- 侧边栏：文档库 -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>📚 文档库</span>
        <button class="icon-btn-sm" onclick="toggleSidebar()">✕</button>
      </div>
      <div class="sidebar-upload">
        <input type="file" id="fileUpload" style="display:none" onchange="uploadFile()">
        <button class="btn" style="width:100%" onclick="document.getElementById('fileUpload').click()">
          ⬆ 上传文档
        </button>
      </div>
      <div class="doc-list" id="docList">
        <div class="doc-empty">加载中...</div>
      </div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- 聊天主区域 -->
    <div class="chat-area">
      <div class="messages" id="messages">
        <div class="empty" id="emptyState">
          <div class="empty-icon">⚡</div>
          <div class="empty-text">开始对话吧</div>
          <div class="empty-hint">多行内容直接粘贴，Ctrl+Enter 发送</div>
          <div class="tool-list">
            <div class="tool-chip"><span class="dot"></span>generate_image</div>
            <div class="tool-chip"><span class="dot"></span>web_search</div>
            <div class="tool-chip"><span class="dot"></span>read_document</div>
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <textarea
            id="inputBox"
            placeholder="输入消息，支持多行粘贴..."
            rows="1"
          ></textarea>
          <div class="input-actions">
            <span class="hint">Ctrl+Enter 发送</span>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');
const emptyState = document.getElementById('emptyState');
const modelBadge = document.getElementById('modelBadge');

let isLoading = false;

// Auto-resize textarea
inputBox.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 300) + 'px';
});

// Ctrl+Enter to send
inputBox.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    sendMessage();
  }
});

// Load history on page load
window.addEventListener('DOMContentLoaded', function() {
  loadHistory();
  loadDocuments();
});

// ─── Sidebar ────────────────────────────────────────

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('open');
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

async function loadDocuments() {
  try {
    const res = await fetch('/api/documents');
    const data = await res.json();
    const listEl = document.getElementById('docList');

    if (!data.files || data.files.length === 0) {
      listEl.innerHTML = '<div class="doc-empty">暂无文档<br>上传后即可让 AI 阅读</div>';
      return;
    }

    listEl.innerHTML = '';
    data.files.forEach(f => {
      const item = document.createElement('div');
      item.className = 'doc-item';
      item.innerHTML = `
        <div class="doc-item-name" style="padding-right:24px;position:relative;">
          ${escapeHtml(f.name)}
          <button class="doc-delete-btn" onclick="event.stopPropagation(); deleteDoc('${encodeURIComponent(f.name)}')" title="删除">✕</button>
        </div>
        <div class="doc-item-meta" onclick="quickAskAboutDoc('${escapeHtml(f.name).replace(/'/g, "\\'")}')">${formatSize(f.size)} · ${f.lines} 行</div>
      `;
      listEl.appendChild(item);
    });
  } catch (e) {
    document.getElementById('docList').innerHTML = '<div class="doc-empty">加载失败</div>';
  }
}

async function uploadFile() {
  const input = document.getElementById('fileUpload');
  if (!input.files || input.files.length === 0) return;

  const file = input.files[0];
  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/api/documents/upload', {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    if (data.ok) {
      loadDocuments();
    } else {
      alert('上传失败: ' + (data.error || '未知错误'));
    }
  } catch (e) {
    alert('上传失败: ' + e.message);
  }
  input.value = '';
}

function quickAskAboutDoc(filename) {
  toggleSidebar();
  inputBox.value = '帮我读一下 ' + filename + '，总结核心内容';
  inputBox.style.height = 'auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 300) + 'px';
  inputBox.focus();
}

async function deleteDoc(filename) {
  if (!confirm('确定删除这个文档吗？')) return;
  try {
    const res = await fetch('/api/documents/' + filename, {
      method: 'DELETE'
    });
    const data = await res.json();
    if (data.ok) {
      loadDocuments();
    } else {
      alert('删除失败: ' + (data.error || '未知错误'));
    }
  } catch (e) {
    alert('删除失败: ' + e.message);
  }
}

// 解析 markdown 文本中的工具调用块，返回按顺序的片段数组
// [{type:'text', text}, {type:'tool', name, args}]
function splitToolBlocks(content) {
  const items = [];
  const re = /\[\[TOOL:(\w+)\]\]/g;
  let pos = 0;
  let m;
  while ((m = re.exec(content)) !== null) {
    if (m.index > pos) items.push({ type: 'text', text: content.substring(pos, m.index) });
    // 解析 JSON 参数（花括号配对，兼容省略 [[/TOOL]]）
    let name = m[1];
    let used = 0;
    let rest = content.substring(m[0].length + m.index);
    let trimmed = rest.replace(/^\s*/, (s) => { used = s.length; return ''; });
    let args = {};
    if (trimmed.startsWith('{')) {
      let depth = 0, endIdx = -1;
      for (let i = 0; i < trimmed.length; i++) {
        if (trimmed[i] === '{') depth++;
        else if (trimmed[i] === '}') { depth--; if (depth === 0) { endIdx = i + 1; break; } }
      }
      if (endIdx > 0) {
        try { args = JSON.parse(trimmed.substring(0, endIdx)); } catch (e) { args = { raw: trimmed.substring(0, endIdx) }; }
        used += endIdx;
      }
    }
    // 跳过关闭标签
    let after = content.substring(m.index + m[0].length + used).replace(/^\s*/, '');
    if (after.startsWith('[[/TOOL]]')) used += (content.length - (m.index + m[0].length + used)) - after.length + '[[/TOOL]]'.length;
    items.push({ type: 'tool', name, args });
    pos = m.index + m[0].length + used;
    re.lastIndex = pos;
  }
  if (pos < content.length) items.push({ type: 'text', text: content.substring(pos) });
  return items;
}

async function loadHistory() {
  try {
    const res = await fetch('/api/history');
    const data = await res.json();
    modelBadge.textContent = data.model;

    if (data.messages.length > 0) {
      emptyState.style.display = 'none';
      data.messages.forEach(msg => {
        if (msg.role === 'user') {
          appendMessage('user', msg.content);
        } else if (msg.role === 'assistant') {
          // 用统一解析器拆分正文与工具块（兼容省略 [[/TOOL]]）
          const parts = splitToolBlocks(msg.content);
          for (const part of parts) {
            if (part.type === 'text' && part.text.trim()) {
              appendMessage('assistant', part.text);
            } else if (part.type === 'tool') {
              addToolCall(part.name, part.args);
            }
          }
        } else if (msg.role === 'tool_result') {
          addToolResult(msg.tool_name || 'tool', msg.content);
        }
      });
      scrollToBottom();
    }
  } catch (e) {
    modelBadge.textContent = '连接失败';
  }
}

async function sendMessage() {
  const text = inputBox.value.trim();
  if (!text || isLoading) return;

  isLoading = true;
  sendBtn.disabled = true;
  emptyState.style.display = 'none';

  // Append user message
  appendMessage('user', text);
  inputBox.value = '';
  inputBox.style.height = 'auto';
  scrollToBottom();

  // Add loading indicator
  const loadingId = addLoading();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });

    if (!res.ok) throw new Error('请求失败');

    const data = await res.json();

    // Remove loading
    removeLoading(loadingId);

    // Process events
    let lastAssistantBubble = null;
    for (const event of data.events) {
      if (event.type === 'assistant') {
        lastAssistantBubble = appendMessage('assistant', event.content);
      } else if (event.type === 'tool_call') {
        addToolCall(event.name, event.args);
      } else if (event.type === 'tool_result') {
        addToolResult(event.name, event.result);
      }
    }

    scrollToBottom();
  } catch (e) {
    removeLoading(loadingId);
    appendMessage('assistant', '❌ 错误: ' + e.message);
    scrollToBottom();
  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    inputBox.focus();
  }
}

function appendMessage(role, content) {
  const msg = document.createElement('div');
  msg.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '我' : 'AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (role === 'assistant') {
    // assistant 回复渲染 markdown
    const md = document.createElement('div');
    md.className = 'md';
    md.innerHTML = renderMarkdown(content) || '<p></p>';
    bubble.appendChild(md);
  } else {
    // user 消息保持纯文本
    const pre = document.createElement('pre');
    pre.textContent = content;
    bubble.appendChild(pre);
  }

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  messagesEl.appendChild(msg);

  return bubble;
}

// ─── Markdown 渲染（纯 JS，无依赖）──────────────────
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function inlineMd(text) {
  // 行内语法：code ➜ 加粗 ➜ 斜体 ➜ 链接
  let s = escapeHtml(text);
  // 行内代码（先处理，避免污染其他语法）
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  // 链接 [text](url)
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // 加粗 **text**
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // 斜体 *text*
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  return s;
}

function renderMarkdown(md) {
  if (!md) return '';
  const lines = md.replace(/\r\n/g, '\n').split('\n');
  const html = [];
  let i = 0;
  let inCodeBlock = false;
  let codeBuffer = [];
  let listBuffer = [];   // {type: 'ul'|'ol', items: []}
  let listType = null;

  function flushList() {
    if (!listType) return;
    const tag = listType; // 'ul' or 'ol'
    html.push('<' + tag + '>');
    for (const item of listBuffer) {
      html.push('<li>' + inlineMd(item) + '</li>');
    }
    html.push('</' + tag + '>');
    listBuffer = [];
    listType = null;
  }

  function flushCode() {
    if (!inCodeBlock) return;
    // 去除首尾空行
    while (codeBuffer.length && codeBuffer[0].trim() === '') codeBuffer.shift();
    while (codeBuffer.length && codeBuffer[codeBuffer.length - 1].trim() === '') codeBuffer.pop();
    html.push('<pre><code>' + escapeHtml(codeBuffer.join('\n')) + '</code></pre>');
    codeBuffer = [];
    inCodeBlock = false;
  }

  for (; i < lines.length; i++) {
    const line = lines[i];

    // 代码块围栏 ``` 或 ~~~
    if (/^\s*(```|~~~)/.test(line)) {
      flushList();
      if (inCodeBlock) {
        flushCode();
      } else {
        inCodeBlock = true;
      }
      continue;
    }
    if (inCodeBlock) {
      codeBuffer.push(line);
      continue;
    }

    // 空行时冲刷 list 和当前段落
    if (line.trim() === '') {
      flushList();
      continue;
    }

    // 标题
    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading) {
      flushList();
      const level = heading[1].length;
      html.push('<' + 'h' + level + '>' + inlineMd(heading[2]) + '</h' + level + '>');
      continue;
    }

    // 分隔线
    if (/^\s*([-*_])\s*\1\s*\1[\s\1-*_]*$/.test(line)) {
      flushList();
      html.push('<hr>');
      continue;
    }

    // 表格
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].includes('-')) {
      flushList();
      // 收集整个表格直到不匹配
      const tableLines = [line.trim()];
      i++;
      const headerRow = tableLines[0];
      i++; // 跳过分隔行
      const bodyRows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        bodyRows.push(lines[i].trim());
        i++;
      }
      i--; // for 循环会 +1

      function parseRow(row) {
        // 去掉首尾 |
        let r = row.trim();
        if (r.startsWith('|')) r = r.slice(1);
        if (r.endsWith('|')) r = r.slice(0, -1);
        return r.split('|').map(function(c) { return c.trim(); });
      }

      const headers = parseRow(headerRow);
      html.push('<table><thead><tr>' + headers.map(function(h) { return '<th>' + inlineMd(h) + '</th>'; }).join('') + '</tr></thead><tbody>');
      for (const br of bodyRows) {
        const cells = parseRow(br);
        html.push('<tr>' + cells.map(function(c) { return '<td>' + inlineMd(c) + '</td>'; }).join('') + '</tr>');
      }
      html.push('</tbody></table>');
      continue;
    }

    // 无序/有序列表
    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      const type = ol ? 'ol' : 'ul';
      if (listType !== type) {
        flushList();
        listType = type;
      }
      listBuffer.push((ul ? ul[1] : ol[1]));
      continue;
    }

    // 引用块
    if (/^\s*>\s?/.test(line)) {
      flushList();
      const quoteLines = [];
      let j = i;
      while (j < lines.length && /^\s*>\s?(.*)$/.test(lines[j])) {
        const m = lines[j].match(/^\s*>\s?(.*)$/);
        quoteLines.push(m[1]);
        j++;
      }
      html.push('<blockquote>' + inlineMd(quoteLines.join('\n')) + '</blockquote>');
      i = j - 1;
      continue;
    }

    // 普通段落（连续合并）
    flushList();
    const paraLines = [line];
    while (i + 1 < lines.length && lines[i + 1].trim() !== '' &&
           !/^(#{1,6})\s+/.test(lines[i + 1]) &&
           !/^\s*(```|~~~)/.test(lines[i + 1]) &&
           !/^\s*\|.*\|\s*$/.test(lines[i + 1]) &&
           !/^\s*>\s?/.test(lines[i + 1]) &&
           !/^\s*[-*+]\s+/.test(lines[i + 1]) &&
           !/^\s*\d+[.)]\s+/.test(lines[i + 1]) &&
           !/^\s*([-*_])\s*\1\s*\1/.test(lines[i + 1])) {
      paraLines.push(lines[i + 1]);
      i++;
    }
    html.push('<p>' + inlineMd(paraLines.join('\n')) + '</p>');
  }

  flushList();
  flushCode();

  return html.join('\n');
}

function addLoading() {
  const msg = document.createElement('div');
  msg.className = 'msg assistant';
  msg.id = 'loading-' + Date.now();

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = 'AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  bubble.appendChild(typing);

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  messagesEl.appendChild(msg);
  scrollToBottom();

  return msg.id;
}

function removeLoading(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function addToolCall(name, args) {
  const msg = document.createElement('div');
  msg.className = 'msg assistant';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '⚙';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.style.background = 'var(--tool-bg)';
  bubble.style.borderColor = 'var(--tool-border)';

  const block = document.createElement('div');
  block.className = 'tool-block';

  const header = document.createElement('div');
  header.className = 'tool-header';
  header.innerHTML = `
    <span class="tool-icon">⚡</span>
    <span class="tool-name">${name}</span>
    <span class="tool-args">${JSON.stringify(args)}</span>
  `;

  const result = document.createElement('div');
  result.className = 'tool-result';
  result.id = 'tool-result-' + Date.now();
  result.innerHTML = '<span class="label">执行中...</span>';

  block.appendChild(header);
  block.appendChild(result);
  bubble.appendChild(block);
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  messagesEl.appendChild(msg);
  scrollToBottom();
}

function addToolResult(name, result) {
  // Find the last tool result placeholder
  const results = document.querySelectorAll('.tool-result');
  const last = results[results.length - 1];
  if (last && last.querySelector('.label').textContent === '执行中...') {
    // Extract text and image URLs
    const urlRegex = /(https?:\/\/[^\s]+\.(?:png|jpg|jpeg|gif|webp|bmp))/gi;
    const imageUrls = result.match(urlRegex) || [];
    const textWithoutUrls = result.replace(urlRegex, '').trim();
    
    let html = `<span class="label">✓ 完成</span>`;
    if (textWithoutUrls) {
      html += `<span style="margin-left:8px;">${escapeHtml(textWithoutUrls)}</span>`;
    }
    
    if (imageUrls.length > 0) {
      const gridClass = imageUrls.length > 1 ? 'image-grid' : '';
      html += `<div class="${gridClass}">`;
      for (const url of imageUrls) {
        html += `<img src="${url}" class="generated-image" onclick="window.open('${url}', '_blank')" alt="generated image" loading="lazy">`;
      }
      html += `</div>`;
    }
    
    last.innerHTML = html;
  }
  scrollToBottom();
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function clearChat() {
  if (!confirm('确定清空所有对话记录？')) return;
  try {
    await fetch('/api/clear', { method: 'POST' });
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyState);
    emptyState.style.display = 'flex';
  } catch (e) {
    alert('清空失败: ' + e.message);
  }
}
