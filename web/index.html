<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人 Agent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --bg-elev: #12121a;
    --bg-input: #1a1a24;
    --border: #2a2a3a;
    --border-soft: #1f1f2e;
    --text: #e8e8f0;
    --text-dim: #8888a0;
    --text-mute: #555570;
    --accent: #7c5cff;
    --accent-glow: rgba(124, 92, 255, 0.3);
    --user-bg: #1e1a2e;
    --user-border: #3d2d6b;
    --assistant-bg: #14141c;
    --tool-bg: #0f1218;
    --tool-border: #2a3545;
    --tool-name: #4fc3f7;
    --success: #4ade80;
    --error: #f87171;
    --radius: 12px;
    --radius-sm: 8px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "SF Mono", "JetBrains Mono", "Fira Code", "Consolas", "Microsoft YaHei", monospace;
    font-size: 14px;
    line-height: 1.7;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(124, 92, 255, 0.15), transparent),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(79, 195, 247, 0.08), transparent);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.15s;
  }
  .icon-btn:hover {
    color: var(--text);
    background: var(--bg-elev);
  }

  .icon-btn-sm {
    background: none;
    border: none;
    color: var(--text-mute);
    font-size: 14px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .icon-btn-sm:hover {
    color: var(--text);
  }

  /* Main body layout */
  .main-body {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* Sidebar */
  .sidebar {
    position: fixed;
    top: 0;
    left: -320px;
    width: 280px;
    height: 100vh;
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    z-index: 100;
    display: flex;
    flex-direction: column;
    transition: left 0.25s ease;
  }
  .sidebar.open {
    left: 0;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    border-bottom: 1px solid var(--border-soft);
    font-weight: 600;
    font-size: 14px;
  }

  .sidebar-upload {
    padding: 12px;
    border-bottom: 1px solid var(--border-soft);
  }

  .doc-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .doc-empty {
    color: var(--text-mute);
    font-size: 12px;
    text-align: center;
    padding: 20px 10px;
  }

  .doc-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 4px;
  }
  .doc-item:hover {
    background: var(--bg-input);
  }
  .doc-item-name {
    font-size: 13px;
    color: var(--text);
    margin-bottom: 2px;
    word-break: break-all;
  }
  .doc-item-meta {
    font-size: 11px;
    color: var(--text-mute);
    cursor: pointer;
  }

  .doc-delete-btn {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-mute);
    font-size: 12px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    opacity: 0.6;
    transition: all 0.15s;
  }
  .doc-delete-btn:hover {
    color: var(--error);
    opacity: 1;
    background: rgba(248, 113, 113, 0.1);
  }

  .sidebar-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 99;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .sidebar-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #4fc3f7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 14px;
    color: #fff;
    box-shadow: 0 0 20px var(--accent-glow);
  }

  .title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .model-badge {
    font-size: 11px;
    color: var(--text-mute);
    background: var(--bg-elev);
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  /* 顶栏 agent 下拉：与 model-badge 同高，不抢视觉重心 */
  .agent-select {
    font-size: 11px;
    color: inherit;
    background: var(--bg-elev);
    padding: 3px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    max-width: 140px;
    cursor: pointer;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .btn {
    background: var(--bg-elev);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    transition: all 0.15s ease;
  }

  .btn:hover {
    color: var(--text);
    border-color: var(--accent);
    background: rgba(124, 92, 255, 0.1);
  }

  .btn.danger:hover {
    color: var(--error);
    border-color: var(--error);
    background: rgba(248, 113, 113, 0.1);
  }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg {
    margin-bottom: 20px;
    display: flex;
    gap: 12px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    flex-direction: row-reverse;
  }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    flex-shrink: 0;
  }

  .msg.user .avatar {
    background: linear-gradient(135deg, #7c5cff, #a78bfa);
    color: #fff;
  }

  .msg.assistant .avatar {
    background: linear-gradient(135deg, #4fc3f7, #7c5cff);
    color: #fff;
  }

  .bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: var(--radius);
    position: relative;
  }

  .msg.user .bubble {
    background: var(--user-bg);
    border: 1px solid var(--user-border);
    border-top-right-radius: 4px;
  }

  .msg.assistant .bubble {
    background: var(--assistant-bg);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  .bubble pre {
    white-space: pre-wrap;
    word-wrap: break-word;
    font-family: inherit;
    font-size: inherit;
    line-height: inherit;
    margin: 0;
  }

  /* ── AI 回复的复制按钮 ── */
  .msg-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 8px;
  }

  .copy-btn, .edit-btn {
    font-family: inherit;
    font-size: 12px;
    line-height: 1;
    padding: 4px 9px;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.15s, color 0.15s, border-color 0.15s;
  }

  .copy-btn:hover, .edit-btn:hover {
    opacity: 1;
    color: var(--text);
    border-color: var(--accent);
  }

  /* 复制成功/失败的短暂反馈态 */
  .copy-btn.copied {
    opacity: 1;
    color: var(--success);
    border-color: var(--success);
  }

  .copy-btn.failed {
    opacity: 1;
    color: var(--error);
    border-color: var(--error);
  }

  /* 编辑态里的「发送」常亮，跟「取消」区分开 */
  .edit-btn.primary {
    opacity: 1;
    color: var(--accent);
    border-color: var(--accent);
  }

  .edit-btn.primary:hover {
    color: #fff;
    background: var(--accent);
  }

  /* 原地编辑用的输入框：接替原来的 <pre>，宽度跟气泡一致、高度随内容长 */
  .edit-area {
    display: block;
    width: 100%;
    min-width: 220px;
    box-sizing: border-box;
    font-family: inherit;
    font-size: inherit;
    line-height: inherit;
    color: var(--text);
    background: var(--bg-elev);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 6px 8px;
    margin: 0;
    resize: vertical;
    outline: none;
  }

  /* Markdown 渲染样式 */
  .md { font-size: 14px; line-height: 1.7; word-wrap: break-word; }
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
    margin: 18px 0 10px;
    line-height: 1.3;
    color: var(--text);
    font-weight: 700;
  }
  .md h1 { font-size: 1.5em; border-bottom: 1px solid var(--border-soft); padding-bottom: 6px; }
  .md h2 { font-size: 1.3em; border-bottom: 1px solid var(--border-soft); padding-bottom: 4px; }
  .md h3 { font-size: 1.15em; }
  .md h4 { font-size: 1.05em; }
  .md h5, .md h6 { font-size: 1em; }
  .md p { margin: 8px 0; }
  .md ul, .md ol { margin: 8px 0; padding-left: 24px; }
  .md ul { list-style: disc; }
  .md ol { list-style: decimal; }
  .md li { margin: 3px 0; }
  .md li > ul, .md li > ol { margin: 2px 0; }
  .md strong { color: var(--text); font-weight: 700; }
  .md em { color: var(--text-dim); }
  .md blockquote {
    margin: 10px 0;
    padding: 6px 14px;
    border-left: 3px solid var(--accent);
    background: rgba(124, 92, 255, 0.06);
    color: var(--text-dim);
    border-radius: 0 6px 6px 0;
  }
  .md blockquote p { margin: 4px 0; }
  .md code {
    background: var(--bg-input);
    border: 1px solid var(--border-soft);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 0.9em;
    font-family: "SF Mono", "JetBrains Mono", "Fira Code", "Consolas", monospace;
    color: #f0a0ff;
  }
  .md pre {
    background: var(--bg-input);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin: 10px 0;
    overflow-x: auto;
  }
  .md pre code {
    background: none;
    border: none;
    padding: 0;
    color: var(--text-dim);
    font-size: 0.9em;
  }
  .md a {
    color: var(--tool-name);
    text-decoration: none;
  }
  .md a:hover { text-decoration: underline; }
  .md hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 14px 0;
  }
  .md table {
    border-collapse: collapse;
    margin: 10px 0;
    width: 100%;
    font-size: 13px;
    display: block;
    overflow-x: auto;
  }
  .md th, .md td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
    white-space: pre-wrap;
  }
  .md th {
    background: rgba(124, 92, 255, 0.1);
    color: var(--text);
    font-weight: 600;
  }
  .md tr:nth-child(even) td {
    background: rgba(255, 255, 255, 0.02);
  }

  /* Tool call group (collapsible) */
  .tool-group {
    width: 100%;
  }

  .tool-group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(79, 195, 247, 0.08);
    border: 1px solid var(--tool-border);
    border-radius: var(--radius-sm);
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }

  .tool-group-header:hover {
    background: rgba(79, 195, 247, 0.14);
  }

  .tg-arrow {
    color: var(--text-mute);
    font-size: 10px;
    transition: transform 0.15s;
  }

  .tool-group.open .tg-arrow {
    transform: rotate(90deg);
  }

  .tg-title {
    color: var(--tool-name);
    font-weight: 600;
  }

  .tg-status {
    margin-left: auto;
    color: var(--success);
    font-size: 11px;
  }

  .tool-group-body {
    display: none;
    margin-top: 6px;
  }

  .tool-group.open .tool-group-body {
    display: block;
  }

  .tool-entry {
    background: var(--tool-bg);
    border: 1px solid var(--tool-border);
    border-radius: var(--radius-sm);
    margin-bottom: 6px;
    overflow: hidden;
  }

  .tool-entry:last-child {
    margin-bottom: 0;
  }

  .tool-entry-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    font-size: 12px;
    background: rgba(79, 195, 247, 0.05);
  }

  .tool-icon {
    color: var(--tool-name);
    font-size: 12px;
  }

  .tool-entry-head .tool-name {
    color: var(--tool-name);
    font-weight: 600;
  }

  .tool-args {
    color: var(--text-mute);
    font-size: 11px;
    margin-left: auto;
    max-width: 55%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tool-result {
    padding: 6px 10px;
    color: var(--text-dim);
    font-size: 12px;
    word-break: break-all;
  }

  .tool-result .label {
    color: var(--success);
    font-weight: 600;
    margin-right: 8px;
  }

  .tool-group-images {
    margin-top: 8px;
  }

  /* 思考过程折叠块：与工具组同构（默认收起），长思考不会刷屏 */
  .think-group {
    width: 100%;
  }

  .think-group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: var(--tool-bg);
    border: 1px solid var(--tool-border);
    border-radius: var(--radius-sm);
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }

  .think-group-header:hover {
    background: rgba(167, 139, 250, 0.14);
  }

  .think-group.open .tg-arrow {
    transform: rotate(90deg);
  }

  .think-title {
    color: #a78bfa;
    font-weight: 600;
  }

  .think-status {
    margin-left: auto;
    color: var(--text-mute);
    font-size: 11px;
  }

  .think-group-body {
    display: none;
    margin-top: 6px;
    max-height: 320px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
    line-height: 1.6;
    color: var(--text-dim);
    border-left: 2px solid var(--tool-border);
    padding-left: 10px;
  }

  .think-group.open .think-group-body {
    display: block;
  }

  .generated-image {
    margin-top: 12px;
    border-radius: 8px;
    max-width: 100%;
    max-height: 400px;
    object-fit: contain;
    border: 1px solid var(--border);
    cursor: zoom-in;
    transition: transform 0.2s ease;
  }

  .generated-image:hover {
    transform: scale(1.02);
  }

  .image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px;
    margin-top: 12px;
  }

  .image-grid .generated-image {
    max-height: 200px;
    width: 100%;
  }

  /* ── 图片灯箱：点击放大 + 左右翻页（替代原先跳新标签页）── */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(6, 6, 10, 0.92);
    backdrop-filter: blur(4px);
  }

  .lightbox.open {
    display: flex;
  }

  .lightbox-img {
    max-width: 92vw;
    max-height: 86vh;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    user-select: none;
    cursor: default;
  }

  .lb-btn {
    position: absolute;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    color: var(--text);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
    font-family: inherit;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }

  .lb-btn:hover {
    background: rgba(255, 255, 255, 0.2);
  }

  /* 到第一张 / 最后一张时按钮变灰，不循环 —— 边界一眼可见 */
  .lb-btn:disabled {
    opacity: 0.2;
    cursor: default;
  }

  .lb-btn:disabled:hover {
    background: rgba(255, 255, 255, 0.08);
  }

  .lb-prev { left: 2.5vw; top: 50%; transform: translateY(-50%); }
  .lb-next { right: 2.5vw; top: 50%; transform: translateY(-50%); }
  .lb-close { top: 16px; right: 16px; width: 38px; height: 38px; font-size: 16px; }

  .lb-counter {
    position: absolute;
    z-index: 1;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    color: var(--text-dim);
    background: rgba(255, 255, 255, 0.08);
    user-select: none;
  }

  /* Input area */
  .input-area {
    padding: 16px 0 20px;
    border-top: 1px solid var(--border-soft);
    flex-shrink: 0;
  }

  .input-wrapper {
    position: relative;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .input-wrapper:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  textarea {
    width: 100%;
    min-height: 60px;
    max-height: 300px;
    padding: 12px 14px;
    padding-right: 100px;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
    resize: none;
    outline: none;
    overflow-y: auto;
  }

  textarea::placeholder {
    color: var(--text-mute);
  }

  textarea::-webkit-scrollbar { width: 4px; }
  textarea::-webkit-scrollbar-track { background: transparent; }
  textarea::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .input-actions {
    position: absolute;
    right: 8px;
    bottom: 8px;
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .hint {
    font-size: 11px;
    color: var(--text-mute);
    margin-right: 4px;
  }

  .send-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.15s ease;
  }

  .send-btn:hover {
    background: #8b6dff;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px var(--accent-glow);
  }

  .send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* Loading indicator */
  .typing {
    display: flex;
    gap: 6px;
    padding: 4px 0;
  }

  .typing span {
    width: 9px;
    height: 9px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: typing 1.4s infinite ease-in-out both;
  }

  .typing-label {
    margin-top: 6px;

  }

  .typing span:nth-child(1) { animation-delay: -0.32s; }

  @keyframes typing {
    0%, 80%, 100% { transform: scale(0.7); opacity: 0.55; }

  }

  /* Empty state */
  .empty {
    flex: 1;

  .tool-list {

  .tool-chip {

  /* ── 右侧模型设置面板 ── */
  .sidebar.right {

  .side-select,

  /* 预设模型：始终可见、可点击的候选按钮（原生 datalist 会按当前值过滤，坑） */
  .model-chips {

  .icon-btn:hover,button.img-btn:hover {

  .input-actions .hint { margin-left: 6px; }
  .msg.user .user-img {

  .msg.user .user-img img {

    border-radius: 10px;

  /* ── 小说阅读模式（番茄小说风格整段排版）── */
  .toggle-read.active {
    background: var(--accent);
    color: #fff;
  }
  body.novel-mode .chat-area {
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  body.novel-mode .messages {
    padding: 28px 6px;
  }
  body.novel-mode .msg {
    display: block;
    margin-bottom: 6px;
  }
  body.novel-mode .msg .avatar {

  body.novel-mode .msg .bubble {
    max-width: 100% !important;

    border: none !important;

  /* 助手回复 → 小说正文：整段、宽松行距、首行缩进、两端对齐 */

  /* ── 移动端响应式（手机 / iPad 竖屏）── */
  @media (max-width: 768px) {

</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-left">
      <button class="icon-btn" onclick="toggleSidebar()" title="文档库">📁</button>
      <button class="icon-btn" onclick="toggleModelPanel()" title="模型设置">⚙</button>
      <div class="logo">A</div>
      <div>
        <div class="title">个人 Agent</div>
      </div>
      <select id="agentSelect" class="agent-select" onchange="onAgentChange(this.value)" title="切换 agent（各自独立的会话与工具集）"></select>
      <span class="model-badge" id="modelBadge">加载中...</span>
    </div>
    <div class="header-actions">
      <button class="btn toggle-read" id="readModeBtn" onclick="toggleReadMode()">📖 阅读</button>
      <button class="btn danger" onclick="clearChat()">清空会话</button>
    </div>
  </div>

  <div class="main-body">
    <!-- 侧边栏：文档库 -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span>📚 文档库</span>
        <button class="icon-btn-sm" onclick="toggleSidebar()">✕</button>
      </div>
      <div class="sidebar-upload">
        <input type="file" id="fileUpload" style="display:none" onchange="uploadFile()">
        <button class="btn" style="width:100%" onclick="document.getElementById('fileUpload').click()">
          ⬆ 上传文档
        </button>
      </div>
      <div class="doc-list" id="docList">
        <div class="doc-empty">加载中...</div>
      </div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- 右侧面板：模型设置 -->
    <div class="sidebar right" id="modelPanel">
      <div class="sidebar-header">
        <span>⚙ 模型设置</span>
        <button class="icon-btn-sm" onclick="toggleModelPanel()">✕</button>
      </div>
      <div class="side-form">
        <div class="side-hint">选择对话使用的模型提供商，切换后立即生效。</div>

        <div class="form-group">
          <label>AI Provider</label>
          <select id="provider" class="side-select" onchange="onProviderChange()">
            <option value="">加载中...</option>
          </select>
        </div>

        <div id="modelGroup"></div>

        <button class="btn" style="width:100%" onclick="refreshModels(true)">🔄 刷新模型列表</button>
      </div>
    </div>
    <div class="sidebar-overlay" id="modelOverlay" onclick="toggleModelPanel()"></div>

    <!-- 聊天主区域 -->
    <div class="chat-area">
      <div class="messages" id="messages">
        <div class="empty" id="emptyState">
          <div class="empty-icon">⚡</div>
          <div class="empty-text">开始对话吧</div>
          <div class="empty-hint">多行内容直接粘贴，Ctrl+Enter 发送</div>
          <div class="tool-list">
            <div class="tool-chip"><span class="dot"></span>generate_image</div>
            <div class="tool-chip"><span class="dot"></span>web_search</div>
            <div class="tool-chip"><span class="dot"></span>read_document</div>
          </div>
        </div>
      </div>

      <div class="input-area">
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="onPickImage(event)">
        <div class="input-preview" id="imagePreview" style="display:none">
          <span class="preview-tag">📷 图片已选</span>
          <img id="previewImg" alt="图片预览">
          <span class="remove-img" onclick="removeImage()">✕</span>
        </div>
        <div class="input-wrapper">
          <textarea
            id="inputBox"
            placeholder="输入消息，支持多行粘贴..."
            rows="1"
          ></textarea>
          <div class="input-actions">
            <button class="img-btn" id="imgBtn" onclick="fileInput.click()" title="发送图片给 AI 看">📷</button>
            <span class="hint">Ctrl+Enter 发送</span>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');
const emptyState = document.getElementById('emptyState');
const modelBadge = document.getElementById('modelBadge');
const readModeBtn = document.getElementById('readModeBtn');

// ─── 小说阅读模式切换（localStorage 记忆）──────────────
function setReadMode(on) {
  document.body.classList.toggle('novel-mode', on);
  localStorage.setItem('novelMode', on ? '1' : '0');
  readModeBtn.textContent = on ? '💬 气泡' : '📖 阅读';
  readModeBtn.classList.toggle('active', on);
}
function toggleReadMode() {
  setReadMode(!document.body.classList.contains('novel-mode'));
}

let isLoading = false;
let pendingImage = null;   // 待发送图片 dataURL
let currentAgent = '';     // 当前 agent id：决定会话文件、人设、工具与 skills 白名单
let currentAbort = null;   // 当前请求的中断控制器，切换 agent 时用来掐断正在跑的流

// ─── agent 切换 ─────────────────────────────────────
// 每个 agent 有独立的会话文件与工具/skills 白名单，所以切换时必须：
// 掐断正在跑的流 → 清空消息区 → 按新 agent 重新拉历史。

async function loadAgents() {
  const sel = document.getElementById('agentSelect');
  let list = [];
  let def = '';
  try {
    const res = await fetch('/api/agents');
    const data = await res.json();
    list = data.agents || [];
    def = data.default || '';
  } catch (e) {
    // 列表拿不到时也要把历史拉出来，不能让页面空着
    loadHistory();
    return;
  }

  if (!list.length) {
    sel.style.display = 'none';
    loadHistory();
    return;
  }

  sel.innerHTML = list.map(a =>
    '<option value="' + escapeHtml(a.id) + '" title="' + escapeHtml(a.description || '') + '">'
    + escapeHtml(a.name || a.id) + '</option>'
  ).join('');

  // 优先用上次选的（存在且仍在列表里），否则用后端默认
  const saved = localStorage.getItem('agentId');
  currentAgent = (saved && list.some(a => a.id === saved)) ? saved
    : (list.some(a => a.id === def) ? def : list[0].id);
  sel.value = currentAgent;
  loadHistory();
}

function onAgentChange(agentId) {
  if (!agentId || agentId === currentAgent) return;

  // 正在生成回答：直接掐断，而不是等它跑完（本地模型可能跑一分钟）
  if (currentAbort) {
    currentAbort.abort();
    currentAbort = null;
  }

  currentAgent = agentId;
  localStorage.setItem('agentId', agentId);

  // 先把残留的思考块 / 工具分组收尾写进 DOM（马上会被清掉），再清空消息区，
  // 否则收尾动作会把残余元素插到空状态之后。
  flushThinkBlock();
  flushToolGroup();
  messagesEl.innerHTML = '';
  messagesEl.appendChild(emptyState);
  emptyState.style.display = 'flex';
  loadHistory();
}

// ─── 传图给 AI 看 ───────────────────────────────────
function onPickImage(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  e.target.value = '';
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      // 压缩到最长边 1536，控住请求体大小（deepseek 内联上限 48MiB）
      const max = 1536;
      let w = img.width, h = img.height;
      const scale = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      pendingImage = c.toDataURL('image/jpeg', 0.85);
      document.getElementById('previewImg').src = pendingImage;
      document.getElementById('imagePreview').style.display = 'flex';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function removeImage() {
  pendingImage = null;
  document.getElementById('imagePreview').style.display = 'none';
}

// 带图发送：走与纯文本同一条流式 agent 循环，只是在 payload 里多带一个 image。
// 之前这里打的是 /api/vision——那是"单次非流式问答"，模型看完图想调工具也没人
// 执行，对话就停在一句"我先看看生图 Skill……"上。现在图片随本轮请求进入 agent
// 循环，看图 → 读 skill → 生成图 能一条链走完。
async function sendWithImage(text) {
  const imgUrl = pendingImage;
  appendMessage('user', text ? text : '（发送了一张图片）', imgUrl);
  pendingImage = null;
  document.getElementById('imagePreview').style.display = 'none';
  inputBox.value = '';
  inputBox.style.height = 'auto';
  scrollToBottom();

  await streamChat(text, null, imgUrl);
}

// 当前选中的模型提供商与模型（随每次请求传入后端）
let providersMeta = [];   // {id, label, model, base_url}
let currentProvider = null;
let currentModel = '';

// Auto-resize textarea
inputBox.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 300) + 'px';
});

// Ctrl+Enter to send
inputBox.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    sendMessage();
  }
});

// Load history on page load
window.addEventListener('DOMContentLoaded', function() {
  setReadMode(localStorage.getItem('novelMode') === '1');
  loadProviders();
  loadAgents();     // 先拿到 agent 列表，再由它触发 loadHistory（读当前 agent 的会话）
  loadDocuments();
});

// ─── Sidebar ────────────────────────────────────────

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('open');
}

// ─── 模型设置面板 ────────────────────────────────────

function toggleModelPanel() {
  const panel = document.getElementById('modelPanel');
  const overlay = document.getElementById('modelOverlay');
  panel.classList.toggle('open');
  overlay.classList.toggle('open');
}

// 各提供商的候选模型列表（ollama 由后端实时拉取）
const MODEL_PRESETS = {
  volc: ['deepseek-v4-flash-ga-260731', 'deepseek-v4-flash-260425', 'deepseek-v4-pro-ga-260813'],
  doubao: ['doubao-1-5-thinking-pro-250615', 'doubao-seed-2-0-mini-260428', 'doubao-1-5-pro-250615'],
  deepseek: ['deepseek-chat', 'deepseek-reasoner', 'deepseek-flash']
};

function updateModelBadge(label, model) {
  modelBadge.textContent = (label && model) ? label + ' · ' + model : (model || '未知模型');
}

async function loadProviders() {
  try {
    const res = await fetch('/api/providers');
    const data = await res.json();
    providersMeta = data.providers || [];

    const sel = document.getElementById('provider');
    sel.innerHTML = providersMeta.map(p =>
      '<option value="' + escapeHtml(p.id) + '">' + escapeHtml(p.label) + '</option>'
    ).join('');

    // 默认选中后端配置的 provider
    const def = data.default;
    sel.value = providersMeta.some(p => p.id === def) ? def : (providersMeta[0] && providersMeta[0].id);
    currentProvider = sel.value;
    const cfg = providersMeta.find(p => p.id === currentProvider);
    currentModel = (cfg && cfg.model) || '';
    onProviderChange();
  } catch (e) {
    modelBadge.textContent = '模型加载失败';
  }
}

function onProviderChange() {
  const sel = document.getElementById('provider');
  currentProvider = sel.value;
  const cfg = providersMeta.find(p => p.id === currentProvider);
  // 切换到新提供商时，模型重置为该提供商的默认值，避免残留上一个提供商的模型导致误发
  if (cfg) {
    currentModel = cfg.model || '';
    renderModelGroup(currentProvider, cfg, currentModel);
  }
}

function renderModelGroup(provider, cfg, selectedModel) {
  const group = document.getElementById('modelGroup');

  // base_url 只读展示（后端以 .env 配置为准）
  let baseNote = '';
  if (cfg && cfg.base_url) {
    baseNote = '<div class="baseurl-note">' + escapeHtml(cfg.base_url) + '</div>';
  }

  if (provider === 'ollama') {
    group.innerHTML =
      '<div class="form-group">' +
        '<label>本地模型</label>' +
        '<select id="model" class="side-select" disabled onchange="onModelSelect(this.value)">' +
          '<option>正在检测 Ollama…</option>' +
        '</select>' +
        baseNote +
      '</div>';
    fetchOllamaModels(selectedModel);
    return;
  }

  const presets = MODEL_PRESETS[provider] || (cfg && cfg.model ? [cfg.model] : []);
  // 预设按钮：始终全部可见，避免原生 datalist「按当前值过滤」导致只看到一项
  const chips = presets.map(function(m) {
    const active = (m === selectedModel) ? ' active' : '';
    return '<button type="button" class="model-chip' + active + '"' +
      ' data-model="' + escapeAttr(m) + '"' +
      ' onclick="pickModel(this.getAttribute(\'data-model\'))">' +
      escapeHtml(m) + '</button>';
  }).join('');

  group.innerHTML =
    '<div class="form-group">' +
      '<label>模型 / 接入点ID</label>' +
      '<input id="model" class="side-input" value="' + escapeAttr(selectedModel) + '"' +
        ' oninput="onModelSelect(this.value)" autocomplete="off" spellcheck="false" placeholder="模型ID 或 ep-xxxx 接入点ID">' +
      '<div class="model-chips" id="modelChips">' + chips + '</div>' +
      baseNote +
    '</div>';
}

// 点击预设模型按钮：填入输入框 + 高亮 + 刷新徽标
function pickModel(model) {
  const input = document.getElementById('model');
  if (input) input.value = model;
  onModelSelect(model);
}

function onModelSelect(value) {
  currentModel = value;
  // 同步预设按钮高亮（手动输入也生效）
  document.querySelectorAll('#modelChips .model-chip').forEach(function(el) {
    el.classList.toggle('active', el.getAttribute('data-model') === value);
  });
  updateModelBadge((providersMeta.find(p => p.id === currentProvider) || {}).label, currentModel);
}

async function fetchOllamaModels(selectedModel) {
  const sel = document.getElementById('model');
  const cfg = providersMeta.find(p => p.id === 'ollama');
  const baseUrl = (cfg && cfg.base_url) || '';
  try {
    const res = await fetch('/api/models?baseUrl=' + encodeURIComponent(baseUrl));
    const data = await res.json();
    let opts;
    if (res.ok && data.ok && data.models.length > 0) {
      const chosen = selectedModel && data.models.some(m => m.name === selectedModel) ? selectedModel : data.models[0].name;
      currentModel = chosen;
      opts = data.models.map(m =>
        '<option value="' + escapeHtml(m.name) + '"' + (m.name === chosen ? ' selected' : '') + '>' +
        escapeHtml(m.name) + '</option>'
      ).join('');
    } else {
      opts = '<option value="">（未检测到模型，请先 ollama pull）</option>';
    }
    sel.innerHTML = opts;
    sel.disabled = false;
    updateModelBadge(cfg ? cfg.label : 'Ollama', currentModel);
  } catch (e) {
    sel.innerHTML = '<option value="">（无法连接 Ollama）</option>';
    sel.disabled = false;
    updateModelBadge(cfg ? cfg.label : 'Ollama', currentModel);
  }
}

function refreshModels(manual) {
  if (currentProvider !== 'ollama') {
    if (manual) alert('仅 Ollama 本地需要刷新模型列表');
    return;
  }
  const cfg = providersMeta.find(p => p.id === 'ollama');
  renderModelGroup('ollama', cfg, currentModel);
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

async function loadDocuments() {
  try {
    const res = await fetch('/api/documents');
    const data = await res.json();
    const listEl = document.getElementById('docList');

    if (!data.files || data.files.length === 0) {
      listEl.innerHTML = '<div class="doc-empty">暂无文档<br>上传后即可让 AI 阅读</div>';
      return;
    }

    listEl.innerHTML = '';
    data.files.forEach(f => {
      const item = document.createElement('div');
      item.className = 'doc-item';
      item.innerHTML = `
        <div class="doc-item-name" style="padding-right:24px;position:relative;">
          ${escapeHtml(f.name)}
          <button class="doc-delete-btn" onclick="event.stopPropagation(); deleteDoc('${encodeURIComponent(f.name)}')" title="删除">✕</button>
        </div>
        <div class="doc-item-meta" onclick="quickAskAboutDoc('${escapeHtml(f.name).replace(/'/g, "\\'")}')">${formatSize(f.size)} · ${f.lines} 行</div>
      `;
      listEl.appendChild(item);
    });
  } catch (e) {
    document.getElementById('docList').innerHTML = '<div class="doc-empty">加载失败</div>';
  }
}

async function uploadFile() {
  const input = document.getElementById('fileUpload');
  if (!input.files || input.files.length === 0) return;

  const file = input.files[0];
  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/api/documents/upload', {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    if (data.ok) {
      loadDocuments();
    } else {
      alert('上传失败: ' + (data.error || '未知错误'));
    }
  } catch (e) {
    alert('上传失败: ' + e.message);
  }
  input.value = '';
}

function quickAskAboutDoc(filename) {
  toggleSidebar();
  inputBox.value = '帮我读一下 ' + filename + '，总结核心内容';
  inputBox.style.height = 'auto';

async function deleteDoc(filename) {
  if (!confirm('确定删除这个文档吗？')) return;
  try {
    const res = await fetch('/api/documents/' + encodeURIComponent(filename), {
      method: 'DELETE'
    });
    const data = await res.json();
    if (data.ok) {
      loadDocuments();
    } else {
      alert('删除失败: ' + (data.error || '未知错误'));
    }
  } catch (e) {
    alert('删除失败: ' + e.message);
  }
}

// 解析 markdown 文本中的工具调用块，返回按顺序的片段数组
// [{type:'text', text}, {type:'tool', name, args}]
function splitToolBlocks(content) {
  const items = [];
  const re = /\[\[TOOL:(\w+)\]\]/g;
  let pos = 0;
  let m;
  while ((m = re.exec(content)) !== null) {
    if (m.index > pos) items.push({ type: 'text', text: content.substring(pos, m.index) });
    // 解析 JSON 参数（花括号配对，兼容省略 [[/TOOL]]）
    let name = m[1];
    let used = 0;
    let rest = content.substring(m[0].length + m.index);
    let trimmed = rest.replace(/^\s*/, (s) => { used = s.length; return ''; });
    let args = {};
    if (trimmed.startsWith('{')) {
      let depth = 0, endIdx = -1;
      for (let i = 0; i < trimmed.length; i++) {
        if (trimmed[i] === '{') depth++;
        else if (trimmed[i] === '}') { depth--; if (depth === 0) { endIdx = i + 1; break; } }
      }
      if (endIdx > 0) {
        try { args = JSON.parse(trimmed.substring(0, endIdx)); } catch (e) { args = { raw: trimmed.substring(0, endIdx) }; }
        used += endIdx;
      }
    }
    // 跳过关闭标签
    let after = content.substring(m.index + m[0].length + used).replace(/^\s*/, '');
    if (after.startsWith('[[/TOOL]]')) used += (content.length - (m.index + m[0].length + used)) - after.length + '[[/TOOL]]'.length;
    items.push({ type: 'tool', name, args });
    pos = m.index + m[0].length + used;
    re.lastIndex = pos;
  }
  if (pos < content.length) items.push({ type: 'text', text: content.substring(pos) });
  return items;
}

async function loadHistory() {
  try {
    const res = await fetch('/api/history?agent=' + encodeURIComponent(currentAgent || ''));
    const data = await res.json();

    if (data.messages.length > 0) {
      emptyState.style.display = 'none';
      data.messages.forEach(msg => {
        if (msg.role === 'user') {
          flushToolGroup();
          appendMessage('user', msg.content);
        } else if (msg.role === 'assistant') {
          // 用统一解析器拆分正文与工具块（兼容省略 [[/TOOL]]）
          const parts = splitToolBlocks(msg.content);
          for (const part of parts) {
            if (part.type === 'text' && part.text.trim()) {
              flushToolGroup();
              appendMessage('assistant', part.text);
            } else if (part.type === 'tool') {
              addToolCall(part.name, part.args);
            }
          }
        } else if (msg.role === 'tool_result') {
          addToolResult(msg.tool_name || 'tool', msg.content);
        }
      });
      flushToolGroup();
      scrollToBottom();
    }
  } catch (e) {
    modelBadge.textContent = '连接失败';
  }
}

async function sendMessage() {
  const text = inputBox.value.trim();
  if (pendingImage) { sendWithImage(text); return; }
  if (!text || isLoading) return;

  emptyState.style.display = 'none';

  // Append user message
  appendMessage('user', text);
  inputBox.value = '';
  inputBox.style.height = 'auto';
  scrollToBottom();

  await streamChat(text, null);
}

// 发起一轮对话并把流式事件渲染出来。editUserIndex 非空时表示这是
// 「编辑第 k 条用户消息后重发」——后端会先截断到那一条之前再开始。
// image 非空时表示本轮带图（dataURL）：后端只在第 1 轮把它以多模态形式
// 下发给模型，图片本体不写进会话历史。
async function streamChat(text, editUserIndex, image) {
  if (isLoading) return;
  isLoading = true;
  sendBtn.disabled = true;

  // Add loading indicator
  // 注意：后端流里的第一个事件是 'user'（回声，不渲染），它到达时模型往往
  // 还在思考。所以只有真正渲染出内容的事件（正文/工具调用）才算"首事件"，
  // 否则 loading 会在 0.0s 就被移除，用户面对长时间空白。
  const loadingId = addLoading();
  let gotFirstEvent = false;
  const markFirstRenderable = () => {
    if (!gotFirstEvent) {
      gotFirstEvent = true;
      removeLoading(loadingId);
    }
  };

  const ac = new AbortController();
  currentAbort = ac;
  try {
    const payload = {
      message: text,
      provider: currentProvider,
      model: currentModel,
      agent: currentAgent
    };
    // 编辑重发：告诉后端从第几条用户消息处重新开始
    if (editUserIndex) payload.edit_user_index = editUserIndex;
    // 带图：图片只在本轮有效，不进会话文件
    if (image) payload.image = image;

    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: ac.signal,
      body: JSON.stringify(payload)
    });

    if (!res.ok) throw new Error('请求失败');

    // 流式读取 NDJSON：后端每产生一个事件就推一行，前端边收边渲染，
    // 本地模型跑几十秒时也能看到工具调用逐条出现。
    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      let nl;
      while ((nl = buf.indexOf('\n')) !== -1) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line) continue;

        let ev;
        try {
          ev = JSON.parse(line);
        } catch (parseErr) {
          continue;
        }

        if (ev.type === 'reasoning') {
          // 思考开始流出就代表 AI 在干活了，撤掉等待动画，交给折叠块做实时反馈
          markFirstRenderable();
          appendReasoning(ev.content);
        } else if (ev.type === 'assistant') {
          markFirstRenderable();
          // 出现新正文时，先收尾上一组思考/工具折叠条
          flushThinkBlock();
          flushToolGroup();
          appendMessage('assistant', ev.content);
          scrollToBottom();
        } else if (ev.type === 'tool_call') {
          markFirstRenderable();
          flushThinkBlock();
          addToolCall(ev.name, ev.args);
          scrollToBottom();
        } else if (ev.type === 'tool_result') {
          markFirstRenderable();
          flushThinkBlock();
          addToolResult(ev.name, ev.result);
          scrollToBottom();
        }
      }
    }

    flushThinkBlock();
    flushToolGroup();
    // 一个事件都没收到（静默返回）时兜底移除加载态
    if (!gotFirstEvent) removeLoading(loadingId);
    scrollToBottom();
  } catch (e) {
    // 流中断也要收尾，别让折叠条永远停在"执行中"
    flushThinkBlock();
    flushToolGroup();
    if (e.name === 'AbortError') {
      // 切换 agent 或用户主动中断：不是错误，静默收尾
      appendMessage('assistant', '（已中断）');
    } else {
      appendMessage('assistant', '❌ 错误: ' + e.message);
      // 编辑重发时界面已经先把后面清掉了：服务端若拒绝（索引对不上等），
      // 以磁盘为准重画一遍，别让界面停在一个历史里不存在的状态。
      if (editUserIndex) reloadMessages();
    }
    scrollToBottom();
  } finally {
    removeLoading(loadingId);
    isLoading = false;
    sendBtn.disabled = false;
    if (currentAbort === ac) currentAbort = null;
    inputBox.focus();
  }
}

// 兜底：把可见正文里的 [[TOOL:name]]{...}[[/TOOL]] 工具块剔除，
// 防止任何历史残留/旁路把原始工具调用当作正文显示。
// 与 splitToolBlocks 相同的块识别规则（兼容省略关闭标签）。幂等。
function stripToolMarkup(text) {
  if (!text) return text;
  const re = /\[\[TOOL:([A-Za-z0-9_]+)\]\]/g;
  let out = '';
  let last = 0;
  let m;
  while ((m = re.exec(text)) !== null) {
    out += text.substring(last, m.index);
    let idx = m.index + m[0].length;
    let rest = text.substring(idx);
    const lead = rest.match(/^\s*/)[0];
    idx += lead.length;
    rest = rest.substring(lead.length);
    if (rest.startsWith('{')) {
      let depth = 0, end = -1;
      for (let i = 0; i < rest.length; i++) {
        if (rest[i] === '{') depth++;
        else if (rest[i] === '}') { depth--; if (depth === 0) { end = i + 1; break; } }
      }
      if (end > 0) idx += end;
    }
    const afterLead = text.substring(idx).match(/^\s*/)[0];
    idx += afterLead.length;
    if (text.substring(idx).startsWith('[[/TOOL]]')) idx += '[[/TOOL]]'.length;
    last = idx;
    re.lastIndex = idx;
  }
  out += text.substring(last);
  return out;
}

function appendMessage(role, content, imageDataURL) {
  const msg = document.createElement('div');
  msg.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '我' : 'AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (imageDataURL) {
    const pic = document.createElement('div');
    pic.className = 'user-img';
    const im = document.createElement('img');
    im.src = imageDataURL;
    bindLightbox(im);
    pic.appendChild(im);
    bubble.appendChild(pic);
  }

  if (role === 'assistant') {
    // assistant 回复渲染 markdown（先剔除可能残留的 [[TOOL:...]] 原始工具块）
    const mdSource = stripToolMarkup(content) || '';
    const md = document.createElement('div');
    md.className = 'md';
    md.innerHTML = renderMarkdown(mdSource) || '<p></p>';
    bubble.appendChild(md);
    // 复制按钮复制的就是这份渲染前的 Markdown 原文：
    // 表格、--- 分割线、代码块在 DOM 里选中复制会丢结构，这里给一条保真的路子。
    bubble.appendChild(buildCopyButton(mdSource));
  } else {
    // user 消息保持纯文本
    const pre = document.createElement('pre');
    pre.textContent = content;
    bubble.appendChild(pre);
    // 带图的消息不给编辑入口：图片数据不进历史（只留一行占位文本），
    // 编辑重发会让图凭空消失，容易被当成丢数据。
    if (!imageDataURL) bubble.appendChild(buildEditButton(bubble));
  }

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  messagesEl.appendChild(msg);

  return bubble;
}

// ─── 复制 AI 回复（Markdown 原文）──────────────────
// 按钮复制的是渲染前的 Markdown 源文本：在 DOM 里手动选中复制时，
// --- 分割线、表格、代码块这些会丢结构或漏字符，这里给一条保真的路子。
function buildCopyButton(mdText) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-actions';

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'copy-btn';
  btn.textContent = '复制';
  btn.title = '复制这条回复的 Markdown 原文';

  btn.addEventListener('click', async () => {
    const ok = await copyText(mdText);
    btn.classList.toggle('copied', ok);
    btn.classList.toggle('failed', !ok);
    btn.textContent = ok ? '已复制' : '复制失败';
    clearTimeout(btn._resetTimer);
    btn._resetTimer = setTimeout(() => {
      btn.classList.remove('copied', 'failed');
      btn.textContent = '复制';
    }, 1500);
  });

  wrap.appendChild(btn);
  return wrap;
}

// 优先用 Clipboard API；它只在安全上下文（https / localhost）存在，
// 用户若改用局域网 IP 访问就回退到 textarea + execCommand。
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      // 落到下面的回退
    }
  }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

// ─── 编辑用户消息并重发 ──────────────────────────────
// 会话是一条线，不是一棵树：编辑第 k 条用户消息，就是从它这里重新开始，
// 它之后的问答全部作废——那些内容都在回应被改掉的那一句，留着会让模型
// 看到自相矛盾的上下文（比如"再狠一点"被改成"再温柔点"，后面却还答着
// 狠话版）。后端按同一个口径截断（edit_user_index），两边一致。
function buildEditButton(bubble) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-actions';

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'edit-btn';
  btn.textContent = '重新编辑';
  btn.title = '编辑这条消息，并从这里重新开始';
  btn.addEventListener('click', () => enterEditMode(bubble, wrap));

  wrap.appendChild(btn);
  return wrap;
}

// 这条消息是第几条用户消息。每次现算，不缓存索引：屏幕上第几个「我」的气泡，
// 就是后端第几条 role=="user"。不能拿 DOM 顺序当数组下标——后端数组里还混着
// assistant / tool_result，而且一次提问可能拆出多个 assistant 气泡。
function userIndexOf(msgEl) {
  return Array.from(messagesEl.querySelectorAll('.msg.user')).indexOf(msgEl) + 1;
}

function enterEditMode(bubble, actionsEl) {
  // 正在流式生成时不让改：一边输出一边重绘会打架
  if (isLoading || bubble.querySelector('.edit-area')) return;

  const msgEl = bubble.closest('.msg');
  const pre = bubble.querySelector('pre');
  if (!msgEl || !pre) return;

  const original = pre.textContent;
  const originalBtn = actionsEl.firstChild;

  const ta = document.createElement('textarea');
  ta.className = 'edit-area';
  ta.value = original;
  pre.style.display = 'none';
  bubble.insertBefore(ta, pre);

  // 高度跟着内容长，长消息不用在小框里滚
  const autoGrow = () => {
    ta.style.height = 'auto';
    ta.style.height = (ta.scrollHeight + 2) + 'px';
  };
  ta.addEventListener('input', autoGrow);
  autoGrow();
  ta.focus();
  ta.setSelectionRange(original.length, original.length);

  const exit = () => {
    ta.remove();
    pre.style.display = '';
    actionsEl.innerHTML = '';
    actionsEl.appendChild(originalBtn);
  };

  const sendBtnEl = document.createElement('button');
  sendBtnEl.type = 'button';
  sendBtnEl.className = 'edit-btn primary';
  sendBtnEl.textContent = '发送';
  sendBtnEl.addEventListener('click',
    () => commitEdit(bubble, ta, actionsEl, msgEl, pre));

  const cancelEl = document.createElement('button');
  cancelEl.type = 'button';
  cancelEl.className = 'edit-btn';
  cancelEl.textContent = '取消';
  cancelEl.addEventListener('click', exit);

  // Ctrl/Cmd + Enter 发送，Esc 取消；单独的 Enter 仍是换行。
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      commitEdit(bubble, ta, actionsEl, msgEl, pre);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      exit();
    }
  });

  actionsEl.innerHTML = '';
  actionsEl.appendChild(cancelEl);
  actionsEl.appendChild(sendBtnEl);
}

async function commitEdit(bubble, ta, actionsEl, msgEl, pre) {
  if (isLoading) return;
  const text = ta.value.trim();
  if (!text) { ta.focus(); return; }

  const userIndex = userIndexOf(msgEl);

  // 先在界面上清掉这条之后的内容，再按新内容重新开始（后端同步截断）
  truncateAfter(msgEl);
  ta.remove();
  pre.textContent = text;
  pre.style.display = '';
  actionsEl.innerHTML = '';

  await streamChat(text, userIndex);
}

// 删掉这条消息之后的所有节点（思考块、工具折叠条、后续问答都在里面）。
// 折叠块靠模块级变量记着"当前那一条"，那些节点马上要没了，一并复位，
// 否则后续收尾会往已移除的元素上写状态。
function truncateAfter(msgEl) {
  let node = msgEl.nextSibling;
  while (node) {
    const next = node.nextSibling;
    if (node !== emptyState) messagesEl.removeChild(node);
    node = next;
  }
  activeThink = null;
  activeToolGroup = null;
}

// 丢掉界面上的消息，按磁盘上的历史重画一遍（服务端是唯一事实源）
async function reloadMessages() {
  flushThinkBlock();
  flushToolGroup();
  activeThink = null;
  activeToolGroup = null;
  messagesEl.innerHTML = '';
  messagesEl.appendChild(emptyState);
  emptyState.style.display = 'flex';
  await loadHistory();
}

// ─── Markdown 渲染（纯 JS，无依赖）──────────────────
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// 写入 HTML 属性时用：额外转义双引号（escapeHtml 不处理引号）
function escapeAttr(text) {
  return String(text == null ? '' : text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function inlineMd(text) {
  // 行内语法：code ➜ 加粗 ➜ 斜体 ➜ 链接
  let s = escapeHtml(text);
  // 行内代码（先处理，避免污染其他语法）
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  // 链接 [text](url)
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // 加粗 **text**
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // 斜体 *text*
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  return s;
}

function renderMarkdown(md) {
  if (!md) return '';
  const lines = md.replace(/\r\n/g, '\n').split('\n');
  const html = [];
  let i = 0;
  let inCodeBlock = false;
  let codeBuffer = [];
  let listBuffer = [];   // {type: 'ul'|'ol', items: []}
  let listType = null;

  function flushList() {
    if (!listType) return;
    const tag = listType; // 'ul' or 'ol'
    html.push('<' + tag + '>');
    for (const item of listBuffer) {
      html.push('<li>' + inlineMd(item) + '</li>');
    }
    html.push('</' + tag + '>');
    listBuffer = [];
    listType = null;
  }

  function flushCode() {
    if (!inCodeBlock) return;
    // 去除首尾空行
    while (codeBuffer.length && codeBuffer[0].trim() === '') codeBuffer.shift();
    while (codeBuffer.length && codeBuffer[codeBuffer.length - 1].trim() === '') codeBuffer.pop();
    html.push('<pre><code>' + escapeHtml(codeBuffer.join('\n')) + '</code></pre>');
    codeBuffer = [];
    inCodeBlock = false;
  }

  for (; i < lines.length; i++) {
    const line = lines[i];

    // 代码块围栏 ``` 或 ~~~
    if (/^\s*(```|~~~)/.test(line)) {
      flushList();
      if (inCodeBlock) {
        flushCode();
      } else {
        inCodeBlock = true;
      }
      continue;
    }
    if (inCodeBlock) {
      codeBuffer.push(line);
      continue;
    }

    // 空行时冲刷 list 和当前段落
    if (line.trim() === '') {
      flushList();
      continue;
    }

    // 标题
    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading) {
      flushList();
      const level = heading[1].length;
      html.push('<' + 'h' + level + '>' + inlineMd(heading[2]) + '</h' + level + '>');
      continue;
    }

    // 分隔线
    if (/^\s*([-*_])\s*\1\s*\1[\s\1-*_]*$/.test(line)) {
      flushList();
      html.push('<hr>');
      continue;
    }

    // 表格
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].includes('-')) {
      flushList();
      // 收集整个表格直到不匹配
      const tableLines = [line.trim()];
      i++;
      const headerRow = tableLines[0];
      i++; // 跳过分隔行
      const bodyRows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        bodyRows.push(lines[i].trim());
        i++;
      }
      i--; // for 循环会 +1

      function parseRow(row) {
        // 去掉首尾 |
        let r = row.trim();
        if (r.startsWith('|')) r = r.slice(1);
        if (r.endsWith('|')) r = r.slice(0, -1);
        return r.split('|').map(function(c) { return c.trim(); });
      }

      const headers = parseRow(headerRow);
      html.push('<table><thead><tr>' + headers.map(function(h) { return '<th>' + inlineMd(h) + '</th>'; }).join('') + '</tr></thead><tbody>');
      for (const br of bodyRows) {
        const cells = parseRow(br);
        html.push('<tr>' + cells.map(function(c) { return '<td>' + inlineMd(c) + '</td>'; }).join('') + '</tr>');
      }
      html.push('</tbody></table>');
      continue;
    }

    // 无序/有序列表
    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      const type = ol ? 'ol' : 'ul';
      if (listType !== type) {
        flushList();
        listType = type;
      }
      listBuffer.push((ul ? ul[1] : ol[1]));
      continue;
    }

    // 引用块
    if (/^\s*>\s?/.test(line)) {
      flushList();
      const quoteLines = [];
      let j = i;
      while (j < lines.length && /^\s*>\s?(.*)$/.test(lines[j])) {
        const m = lines[j].match(/^\s*>\s?(.*)$/);
        quoteLines.push(m[1]);
        j++;
      }
      html.push('<blockquote>' + inlineMd(quoteLines.join('\n')) + '</blockquote>');
      i = j - 1;
      continue;
    }

    // 普通段落（连续合并）
    flushList();
    const paraLines = [line];
    while (i + 1 < lines.length && lines[i + 1].trim() !== '' &&
           !/^(#{1,6})\s+/.test(lines[i + 1]) &&
           !/^\s*(```|~~~)/.test(lines[i + 1]) &&
           !/^\s*\|.*\|\s*$/.test(lines[i + 1]) &&
           !/^\s*>\s?/.test(lines[i + 1]) &&
           !/^\s*[-*+]\s+/.test(lines[i + 1]) &&
           !/^\s*\d+[.)]\s+/.test(lines[i + 1]) &&
           !/^\s*([-*_])\s*\1\s*\1/.test(lines[i + 1])) {
      paraLines.push(lines[i + 1]);
      i++;
    }
    html.push('<p>' + inlineMd(paraLines.join('\n')) + '</p>');
  }

  flushList();
  flushCode();

  return html.join('\n');
}

let loadingTimer = null;

function addLoading() {
  const msg = document.createElement('div');
  msg.className = 'msg assistant';
  msg.id = 'loading-' + Date.now();

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = 'AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';

  // 带计时文字：本地模型首字延迟可达几十秒，光有动画看不出"还活着"
  const label = document.createElement('div');
  label.className = 'typing-label';
  const t0 = Date.now();
  const tick = () => {
    label.textContent = '正在思考… 已等待 ' + Math.round((Date.now() - t0) / 1000) + ' 秒';
  };
  tick();
  loadingTimer = setInterval(tick, 1000);

  bubble.appendChild(typing);
  bubble.appendChild(label);

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  messagesEl.appendChild(msg);
  scrollToBottom();

  return msg.id;
}

function removeLoading(id) {
  if (loadingTimer) {
    clearInterval(loadingTimer);
    loadingTimer = null;
  }
  const el = document.getElementById(id);
  if (el) el.remove();
}

// ─── 思考过程折叠块 ─────────────────────────────────
// 思考内容(reasoning)边收边追加，默认收起，标题上显示「思考中… / 已思考 N 字」。
// 一次回答里可能思考多轮（每次工具调用后又想一遍），所以遇到正文/工具事件就
// 收尾，下一个 reasoning 事件会开一个新的折叠块。
let activeThink = null;

function flushThinkBlock() {
  if (!activeThink) return;
  const t = activeThink;
  t.statusEl.textContent = '✓ 已思考 ' + t.text.length + ' 字';
  activeThink = null;
}

function appendReasoning(text) {
  if (!text) return;
  let t = activeThink;
  if (!t) {
    const msg = document.createElement('div');
    msg.className = 'msg assistant';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '思';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.style.background = 'var(--tool-bg)';
    bubble.style.borderColor = 'var(--tool-border)';

    const group = document.createElement('div');
    group.className = 'think-group';

    const header = document.createElement('div');
    header.className = 'think-group-header';
    header.innerHTML = '<span class="tg-arrow">▶</span>' +
      '<span class="think-title">思考过程</span>' +
      '<span class="think-status">思考中…</span>';
    header.addEventListener('click', function() {
      group.classList.toggle('open');
    });

    const body = document.createElement('div');
    body.className = 'think-group-body';

    group.appendChild(header);
    group.appendChild(body);
    bubble.appendChild(group);
    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);

    // 只在新建折叠块时滚一次：思考是逐 token 到达的，每帧都滚会把
    // 正在回看历史的用户强行拽到底部。
    scrollToBottom();

    t = activeThink = {
      text: '',
      body: body,
      statusEl: header.querySelector('.think-status')
    };
  }
  t.text += text;
  // 用 textContent 而非 innerHTML：思考内容里出现尖括号时不会被当标签解析
  t.body.textContent = t.text;
  t.statusEl.textContent = '思考中… ' + t.text.length + ' 字';
}

// ─── 工具调用折叠组 ─────────────────────────────────
// 连续的 tool_call / tool_result 归为一组，渲染成一条可展开的折叠条；
// 默认收起，只显示「已调用 N 个工具 + 状态」，展开才能看到每个调用的细节。
let activeToolGroup = null;

function flushToolGroup() {
  if (!activeToolGroup) return;
  const g = activeToolGroup;
  // 收尾时仍有未收到结果的调用（历史记录缺结果等边缘情况）
  for (const p of g.pending) {
    p.res.innerHTML = '<span class="label">✓ 完成</span>';
  }
  g.pending = [];
  g.statusEl.textContent = '✓ 全部完成';
  activeToolGroup = null;
}

function getToolGroup() {
  if (activeToolGroup) return activeToolGroup;

  const msg = document.createElement('div');
  msg.className = 'msg assistant';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '⚙';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.style.background = 'var(--tool-bg)';
  bubble.style.borderColor = 'var(--tool-border)';

  const group = document.createElement('div');
  group.className = 'tool-group';

  const header = document.createElement('div');
  header.className = 'tool-group-header';
  header.innerHTML = '<span class="tg-arrow">▶</span><span class="tg-title"></span><span class="tg-status">执行中...</span>';
  header.addEventListener('click', function() {
    group.classList.toggle('open');
  });

  const body = document.createElement('div');
  body.className = 'tool-group-body';

  const imagesEl = document.createElement('div');
  imagesEl.className = 'tool-group-images';

  group.appendChild(header);
  group.appendChild(body);
  group.appendChild(imagesEl);
  bubble.appendChild(group);
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  messagesEl.appendChild(msg);

  activeToolGroup = {
    header, body, imagesEl,
    titleEl: header.querySelector('.tg-title'),
    statusEl: header.querySelector('.tg-status'),
    count: 0,
    pending: []
  };
  return activeToolGroup;
}

function addToolCall(name, args) {
  const g = getToolGroup();
  g.count++;
  g.titleEl.textContent = '已调用 ' + g.count + ' 个工具';

  const entry = document.createElement('div');
  entry.className = 'tool-entry';

  const head = document.createElement('div');
  head.className = 'tool-entry-head';
  head.innerHTML =
    '<span class="tool-icon">⚡</span>' +
    '<span class="tool-name">' + escapeHtml(name) + '</span>' +
    '<span class="tool-args">' + escapeHtml(JSON.stringify(args)) + '</span>';

  const res = document.createElement('div');
  res.className = 'tool-result';
  res.innerHTML = '<span class="label">执行中...</span>';

  entry.appendChild(head);
  entry.appendChild(res);
  g.body.appendChild(entry);
  g.pending.push({ res: res });
  scrollToBottom();
}

function addToolResult(name, result) {
  const g = activeToolGroup;
  const pending = (g && g.pending.length) ? g.pending.shift() : null;

  // Extract text and image URLs（兼容带任意 host/不带 host，统一归一化为相对路径，
  // 让历史里原有 localhost 旧记录在手机等其它端也能用当前站点 origin 加载）
  const imgRe = /((?:https?:\/\/[^\s\/]+)?\/api\/image\/[^\s]+\.(?:png|jpg|jpeg|gif|webp|bmp))/gi;
  const imageUrls = (result.match(imgRe) || []).map(u => u.replace(/^https?:\/\/[^\/]+/, ''));
  const textWithoutUrls = result.replace(imgRe, '').trim();

  if (pending) {
    let html = '<span class="label">✓ 完成</span>';
    if (textWithoutUrls) {
      html += '<span>' + escapeHtml(textWithoutUrls) + '</span>';
    }
    pending.res.innerHTML = html;
  }

  // 图片例外：不收进折叠区，直接展示在折叠条下方，收起状态也能看到
  if (g && imageUrls.length > 0) {
    const grid = document.createElement('div');
    if (imageUrls.length > 1) grid.className = 'image-grid';
    for (const url of imageUrls) {
      const img = document.createElement('img');
      img.src = url;
      img.className = 'generated-image';
      img.alt = 'generated image';
      img.loading = 'lazy';
      // 点击在当前页面放大（灯箱内可左右翻页），不再跳新标签页
      bindLightbox(img);
      grid.appendChild(img);
    }
    g.imagesEl.appendChild(grid);
  }
  scrollToBottom();
}

// ─── 图片灯箱：点击放大 + 左右翻页 ──────────────────
// 图集范围 = 整个会话里所有可点击放大的图，按出现顺序（即时间顺序）排成一列。
// 点开任意一张，灯箱就从它自己的位置起步；左右翻页可以一路翻完整场会话，
// 跨轮次、跨批次都能连着看。AI 生成的图和用户自己发的图在同一个序列里，
// 因为它们本来就在同一条会话流上（用户图通常只有零星几张，不影响观感）。
let lightboxEl = null;
let lightboxState = { list: [], index: 0 };

function buildLightbox() {
  if (lightboxEl) return lightboxEl;

  const box = document.createElement('div');
  box.className = 'lightbox';

  const img = document.createElement('img');
  img.className = 'lightbox-img';
  img.alt = '图片预览';
  img.draggable = false;
  img.addEventListener('click', (e) => e.stopPropagation());

  const mkBtn = (cls, text, title) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'lb-btn ' + cls;
    b.textContent = text;
    b.title = title;
    return b;
  };

  const prev = mkBtn('lb-prev', '‹', '上一张（←）');
  const next = mkBtn('lb-next', '›', '下一张（→）');
  const close = mkBtn('lb-close', '✕', '关闭（Esc）');
  const counter = document.createElement('div');
  counter.className = 'lb-counter';

  prev.addEventListener('click', (e) => { e.stopPropagation(); stepLightbox(-1); });
  next.addEventListener('click', (e) => { e.stopPropagation(); stepLightbox(1); });
  close.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
  // 点图片以外的遮罩区域即关闭
  box.addEventListener('click', () => closeLightbox());

  box.appendChild(img);
  box.appendChild(prev);
  box.appendChild(next);
  box.appendChild(close);
  box.appendChild(counter);
  document.body.appendChild(box);

  box._img = img;
  box._prev = prev;
  box._next = next;
  box._counter = counter;
  lightboxEl = box;
  return box;
}

// 整个会话的图集：DOM 顺序即出现顺序。每次点击时现取，所以刚生成的新图
// 会自动进入序列，不需要额外维护索引。
function sessionImages() {
  return Array.from(messagesEl.querySelectorAll('.generated-image, .user-img img'));
}

function bindLightbox(img) {
  img.addEventListener('click', (e) => {
    e.stopPropagation();
    const list = sessionImages();
    const at = list.indexOf(img);
    openLightbox(list, at < 0 ? 0 : at);
  });
}

function openLightbox(list, index) {
  if (!list || !list.length) return;
  const box = buildLightbox();
  lightboxState = {
    list: list,
    index: Math.max(0, Math.min(index, list.length - 1))
  };
  renderLightbox();
  box.classList.add('open');
}

function renderLightbox() {
  const box = lightboxEl;
  if (!box) return;
  const list = lightboxState.list;
  const index = lightboxState.index;
  const cur = list[index];
  if (!cur) return;

  box._img.src = cur.src;

  const multi = list.length > 1;
  box._prev.style.display = multi ? 'flex' : 'none';
  box._next.style.display = multi ? 'flex' : 'none';
  box._prev.disabled = index <= 0;
  box._next.disabled = index >= list.length - 1;

  box._counter.textContent = (index + 1) + ' / ' + list.length;
  box._counter.style.display = multi ? 'block' : 'none';
}

function stepLightbox(delta) {
  const target = lightboxState.index + delta;
  if (target < 0 || target >= lightboxState.list.length) return;
  lightboxState.index = target;
  renderLightbox();
}

function closeLightbox() {
  if (lightboxEl) lightboxEl.classList.remove('open');
}

// ← → 翻页、Esc 关闭。用捕获阶段接管，避免被输入框的 keydown 吃掉；
// 灯箱没打开时直接返回，不干扰任何既有按键行为。
document.addEventListener('keydown', function(e) {
  if (!lightboxEl || !lightboxEl.classList.contains('open')) return;
  if (e.key === 'Escape') {
    closeLightbox();
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    stepLightbox(-1);
  } else if (e.key === 'ArrowRight') {
    e.preventDefault();
    stepLightbox(1);
  }
}, true);

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function currentAgentName() {
  const sel = document.getElementById('agentSelect');
  const opt = sel && sel.selectedOptions && sel.selectedOptions[0];
  return (opt && opt.textContent) || currentAgent || '当前 agent';
}

async function clearChat() {
  if (!confirm('确定清空「' + currentAgentName() + '」的所有对话记录？')) return;
  try {
    await fetch('/api/clear', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agent: currentAgent })
    });
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyState);
    emptyState.style.display = 'flex';
  } catch (e) {
    alert('清空失败: ' + e.message);
  }
}
