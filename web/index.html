<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {

  /* Tool call display */

  .tool-result .label {

  .generated-image {
    margin-top: 12px;
    border-radius: 8px;
    max-width: 100%;
    max-height: 400px;
    object-fit: contain;
    border: 1px solid var(--border);

    transition: transform 0.2s ease;

  .generated-image:hover {
    transform: scale(1.02);

  .image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px;
    margin-top: 12px;
  }

  .image-grid .generated-image {
    max-height: 200px;
    width: 100%;
  }

  /* Input area */
  .input-area {
    padding: 16px 0 20px;
    border-top: 1px solid var(--border-soft);
    flex-shrink: 0;
  }

  .input-wrapper {
    position: relative;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .input-wrapper:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  textarea {
    width: 100%;
    min-height: 60px;
    max-height: 300px;
    padding: 12px 14px;
    padding-right: 100px;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.6;
    resize: none;
    outline: none;
    overflow-y: auto;
  }

  textarea::placeholder {
    color: var(--text-mute);
  }

  textarea::-webkit-scrollbar { width: 4px; }
  textarea::-webkit-scrollbar-track { background: transparent; }
  textarea::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .input-actions {
    position: absolute;
    right: 8px;

    display: flex;
    gap: 6px;
    align-items: center;
  }

  .hint {
    font-size: 11px;
    color: var(--text-mute);
    margin-right: 4px;
  }

  .send-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 7px 16px;

    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.15s ease;
  }

  .send-btn:hover {
    background: #8b6dff;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px var(--accent-glow);

  .send-btn:disabled {

  /* Loading indicator */
  .typing {

  /* Empty state */
  .empty {

  }

    font-size: 48px;

    font-size: 14px;

    font-size: 12px;

  }

    display: flex;
    gap: 8px;

    flex-wrap: wrap;
    justify-content: center;
  }

  .tool-chip {
    padding: 6px 12px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 11px;
    color: var(--text-dim);
  }

  .tool-chip .dot {

    width: 6px;

    margin-right: 6px;
  }
</style>

<body>
<div class="app">
  <div class="header">
    <div class="header-left">
      <div class="logo">A</div>
      <div>
        <div class="title">个人 Agent</div>
      </div>
      <span class="model-badge" id="modelBadge">加载中...</span>
    </div>
    <div class="header-actions">
      <button class="btn danger" onclick="clearChat()">清空会话</button>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty" id="emptyState">
      <div class="empty-icon">⚡</div>
      <div class="empty-text">开始对话吧</div>
      <div class="empty-hint">多行内容直接粘贴，Ctrl+Enter 发送</div>
      <div class="tool-list">
        <div class="tool-chip"><span class="dot"></span>generate_image</div>
        <div class="tool-chip"><span class="dot"></span>get_time</div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea
        id="inputBox"
        placeholder="输入消息，支持多行粘贴..."
        rows="1"
      ></textarea>
      <div class="input-actions">
        <span class="hint">Ctrl+Enter 发送</span>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
      </div>
    </div>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');
const emptyState = document.getElementById('emptyState');
const modelBadge = document.getElementById('modelBadge');

let isLoading = false;

// Auto-resize textarea
inputBox.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 300) + 'px';
});

// Ctrl+Enter to send
inputBox.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    sendMessage();
  }
});

// Load history on page load
window.addEventListener('DOMContentLoaded', loadHistory);

async function loadHistory() {
  try {
    const res = await fetch('/api/history');
    const data = await res.json();
    modelBadge.textContent = data.model;

    if (data.messages.length > 0) {
      emptyState.style.display = 'none';
      data.messages.forEach(msg => {
        if (msg.role === 'user') {
          appendMessage('user', msg.content);
        } else if (msg.role === 'assistant') {
          // Check if there's a tool call in the reply
          const toolMatch = msg.content.match(/\[\[TOOL:(\w+)\]\]([\s\S]*?)\[\[\/TOOL\]\]/);
          if (toolMatch) {
            const beforeText = msg.content.substring(0, toolMatch.index).trim();
            if (beforeText) {
              appendMessage('assistant', beforeText);
            }
            // Render tool call block (result will be filled by the next tool_result message)
            try {
              const args = JSON.parse(toolMatch[2].trim());
              addToolCall(toolMatch[1], args);
            } catch (e) {
              addToolCall(toolMatch[1], { raw: toolMatch[2].trim() });
            }
            const afterText = msg.content.substring(toolMatch.index + toolMatch[0].length).trim();
            if (afterText) {
              appendMessage('assistant', afterText);
            }
          } else {
            appendMessage('assistant', msg.content);
          }
        } else if (msg.role === 'tool_result') {
          addToolResult(msg.tool_name || 'tool', msg.content);
        }
      });
      scrollToBottom();
    }
  } catch (e) {
    modelBadge.textContent = '连接失败';
  }
}

async function sendMessage() {
  const text = inputBox.value.trim();
  if (!text || isLoading) return;

  isLoading = true;
  sendBtn.disabled = true;
  emptyState.style.display = 'none';

  // Append user message
  appendMessage('user', text);
  inputBox.value = '';
  inputBox.style.height = 'auto';
  scrollToBottom();

  // Add loading indicator
  const loadingId = addLoading();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });

    if (!res.ok) throw new Error('请求失败');

    const data = await res.json();

    // Remove loading
    removeLoading(loadingId);

    // Process events
    let lastAssistantBubble = null;
    for (const event of data.events) {
      if (event.type === 'assistant') {
        // Check if there's a tool call in the reply — if so, render as tool block
        const toolMatch = event.content.match(/\[\[TOOL:(\w+)\]\]([\s\S]*?)\[\[\/TOOL\]\]/);
        if (toolMatch) {
          // Extract text before tool call
          const beforeText = event.content.substring(0, toolMatch.index).trim();
          if (beforeText) {
            lastAssistantBubble = appendMessage('assistant', beforeText);
          }
          // Tool call is shown as separate block — handled by tool_call event
          // But we need to show the rest of the text after tool result
          const afterText = event.content.substring(toolMatch.index + toolMatch[0].length).trim();
          if (afterText) {
            lastAssistantBubble = appendMessage('assistant', afterText);
          }
        } else {
          lastAssistantBubble = appendMessage('assistant', event.content);
        }
      } else if (event.type === 'tool_call') {
        addToolCall(event.name, event.args);
      } else if (event.type === 'tool_result') {
        addToolResult(event.name, event.result);
      }
    }

    scrollToBottom();
  } catch (e) {
    removeLoading(loadingId);
    appendMessage('assistant', '❌ 错误: ' + e.message);
    scrollToBottom();
  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    inputBox.focus();
  }
}

function appendMessage(role, content) {
  const msg = document.createElement('div');
  msg.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '我' : 'AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  const pre = document.createElement('pre');
  pre.textContent = content;
  bubble.appendChild(pre);

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  messagesEl.appendChild(msg);

  return bubble;
}

function addLoading() {
  const msg = document.createElement('div');
  msg.className = 'msg assistant';
  msg.id = 'loading-' + Date.now();

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = 'AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  bubble.appendChild(typing);

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  messagesEl.appendChild(msg);
  scrollToBottom();

  return msg.id;
}

function removeLoading(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function addToolCall(name, args) {
  const msg = document.createElement('div');
  msg.className = 'msg assistant';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '⚙';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.style.background = 'var(--tool-bg)';
  bubble.style.borderColor = 'var(--tool-border)';

  const block = document.createElement('div');
  block.className = 'tool-block';

  const header = document.createElement('div');
  header.className = 'tool-header';
  header.innerHTML = `
    <span class="tool-icon">⚡</span>
    <span class="tool-name">${name}</span>
    <span class="tool-args">${JSON.stringify(args)}</span>
  `;

  const result = document.createElement('div');
  result.className = 'tool-result';
  result.id = 'tool-result-' + Date.now();
  result.innerHTML = '<span class="label">执行中...</span>';

  block.appendChild(header);
  block.appendChild(result);
  bubble.appendChild(block);
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  messagesEl.appendChild(msg);
  scrollToBottom();
}

function addToolResult(name, result) {
  // Find the last tool result placeholder
  const results = document.querySelectorAll('.tool-result');
  const last = results[results.length - 1];
  if (last && last.querySelector('.label').textContent === '执行中...') {
    // Extract text and image URLs
    const urlRegex = /(https?:\/\/[^\s]+\.(?:png|jpg|jpeg|gif|webp|bmp))/gi;
    const imageUrls = result.match(urlRegex) || [];
    const textWithoutUrls = result.replace(urlRegex, '').trim();
    
    let html = `<span class="label">✓ 完成</span>`;
    if (textWithoutUrls) {
      html += `<span style="margin-left:8px;">${escapeHtml(textWithoutUrls)}</span>`;
    }
    
    if (imageUrls.length > 0) {
      const gridClass = imageUrls.length > 1 ? 'image-grid' : '';
      html += `<div class="${gridClass}">`;
      for (const url of imageUrls) {
        html += `<img src="${url}" class="generated-image" onclick="window.open('${url}', '_blank')" alt="generated image" loading="lazy">`;
      }
      html += `</div>`;
    }
    
    last.innerHTML = html;
  }
  scrollToBottom();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function clearChat() {
  if (!confirm('确定清空所有对话记录？')) return;
  try {
    await fetch('/api/clear', { method: 'POST' });
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyState);
    emptyState.style.display = 'flex';
  } catch (e) {
    alert('清空失败: ' + e.message);
  }
}
</script>
</body>
</html>
