<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色扮演 · 查看台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%23f472b6'/></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f; --bg-elev: #12121a; --bg-input: #1a1a24;
    --border: #2a2a3a; --border-soft: #1f1f2e;
    --text: #e8e8f0; --text-dim: #8888a0; --text-mute: #555570;
    --accent: #f472b6; --accent-dim: #6d2a48;
    --ok: #4ade80; --err: #f87171; --warn: #fbbf24;
    --r: 10px; --rs: 7px;
    /* 字号缩放系数（2026-11-09 用户要求）：全站 19 处 font-size 都写成
       calc(px * var(--fs))，A- / A+ 只动这一个变量。存 localStorage，
       不跟账号走——换浏览器回到 1 是接受的。 */
    --fs: 1;
  }
  html, body { background: var(--bg); color: var(--text); height: 100%;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: calc(13px * var(--fs)); overflow: hidden; }
  .app { display: grid; grid-template-columns: 360px 1fr; height: 100vh; }

  /* 左栏 */
  .side { border-right: 1px solid var(--border-soft); display: flex;
    flex-direction: column; min-height: 0; background: var(--bg-elev); }
  .side-head { padding: 12px 14px; border-bottom: 1px solid var(--border-soft); }
  .side-head h1 { font-size: calc(14px * var(--fs)); font-weight: 600; display: flex;
    align-items: center; gap: 8px; }
  .side-head .cnt { font-size: calc(11px * var(--fs)); color: var(--text-mute); font-weight: 400; }
  .filters { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .chip { background: var(--bg-input); border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 20px; padding: 3px 10px;
    font-size: calc(11px * var(--fs)); cursor: pointer; }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  /* 游客查看管理员（2026-11-08）：只有这里加进去的 QQ 能登录 /guest-view */
  .gv-admins { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .gv-h { font-size: calc(11px * var(--fs)); color: var(--text-mute); margin-bottom: 6px; }
  .gv-list { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .gv-tag { font-size: calc(11px * var(--fs)); padding: 2px 7px; border-radius: 10px;
    background: var(--bg-input); border: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer; }
  .gv-tag:hover { border-color: #b05050; color: #ff8080; }
  .gv-add { display: flex; gap: 6px; }
  .gv-add input { flex: 1; min-width: 0; padding: 5px 9px; font: inherit;
    font-size: calc(12px * var(--fs)); color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: 6px; outline: none; }
  .gv-add input:focus { border-color: var(--accent); }
  .side-list { flex: 1; overflow-y: auto; padding: 6px; }
  .row { padding: 9px 11px; border-radius: var(--rs); cursor: pointer;
    margin-bottom: 2px; border: 1px solid transparent; }
  .row:hover { background: var(--bg-input); }
  .row.on { background: var(--bg-input); border-color: var(--accent-dim); }
  .row .l1 { display: flex; align-items: center; gap: 6px; }
  .row .tag { font-size: calc(10px * var(--fs)); padding: 1px 6px; border-radius: 8px;
    border: 1px solid var(--border); color: var(--text-mute); }
  .row .tag.g { color: var(--warn); border-color: #6b5218; }
  .row .tag.w { color: #4fc3f7; border-color: #1e4a5c; }
  .row .tag.v { color: var(--accent); border-color: var(--accent-dim); }
  .row .nm { font-size: calc(12.5px * var(--fs)); flex: 1; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .row .l2 { font-size: calc(11px * var(--fs)); color: var(--text-mute); margin-top: 3px;
    display: flex; gap: 8px; }
  .row.on .nm { color: var(--accent); }

  /* 右栏 */
  .main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .top { padding: 11px 16px; border-bottom: 1px solid var(--border-soft);
    display: flex; align-items: center; gap: 10px; min-height: 48px; }
  .top .who { font-size: calc(14px * var(--fs)); font-weight: 600; }
  .top .meta { font-size: calc(11px * var(--fs)); color: var(--text-mute); }
  .top .sp { flex: 1; }
  .btn { background: var(--bg-input); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--rs); padding: 6px 12px;
    font: inherit; font-size: calc(12px * var(--fs)); cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  /* 「角色卡管理」是链接不是按钮（2026-11-05）：去 /characters 改卡面文案 / 背景。 */
  a.btn { text-decoration: none; display: inline-flex; align-items: center; }
  .btn.danger:hover { border-color: var(--err); color: var(--err); }
  .auto { font-size: calc(11.5px * var(--fs)); color: var(--text-mute); display: flex;
    align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  .auto input { accent-color: var(--accent); cursor: pointer; }
  .auto.on { color: var(--accent); }

  .log { flex: 1; overflow-y: auto; padding: 18px; display: flex;
    flex-direction: column; gap: 12px; }
  .msg { max-width: 74%; }
  .msg.u { align-self: flex-end; }
  .msg.a { align-self: flex-start; }
  .msg .b { padding: 10px 14px; border-radius: var(--r); line-height: 1.75;
    white-space: pre-wrap; word-break: break-word; }
  .msg.u .b { background: var(--accent-dim); }
  .msg.a .b { background: var(--bg-elev); border: 1px solid var(--border-soft); }
  /* 台词高亮（2026-11-09 用户要求）：回看是一整屏散文，她说出口的话夹在叙述里
     很难扫。颜色与扮演页同一套黄荧光，只圈引号内的字，旁白不吃色。 */
  .msg .b .dlg { background: rgba(251, 191, 36, .16); color: #ffdf8a;
    padding: 0 3px; border-radius: 4px; box-decoration-break: clone;
    -webkit-box-decoration-break: clone; }
  /* 心声：独立成段、行首带 〔心声〕 的那一行吃粉荧光，标签本身不显示。
     2026-11-09 起和扮演页一致——以前这里把记号剥了就剩纯文本，看着像旁白。 */
  .msg .b .mono { background: rgba(237, 147, 177, .16); color: #f4c0d1;
    padding: 1px 5px; border-radius: 4px; box-decoration-break: clone;
    -webkit-box-decoration-break: clone; }
  .msg .m { font-size: calc(10.5px * var(--fs)); color: var(--text-mute); margin-top: 3px; }
  .empty { color: var(--text-mute); text-align: center; padding: 80px 20px;
    font-size: calc(13px * var(--fs)); line-height: 2; }
  .note { margin: 0 18px 10px; padding: 10px 14px; background: var(--bg-elev);
    border-left: 2px solid var(--accent); border-radius: var(--rs);
    font-size: calc(12px * var(--fs)); color: var(--text-dim); line-height: 1.7; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--bg-input); border: 1px solid var(--border);
    padding: 8px 16px; border-radius: 18px; font-size: calc(12.5px * var(--fs)); opacity: 0;
    transition: opacity .2s; pointer-events: none; z-index: 99; }
  .toast.on { opacity: 1; }
  .toast.err { border-color: var(--err); color: var(--err); }
  /* 实时刷新：未读小圆点 / 新消息浮标（2026-11-06） */
  .row .dot { width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); flex: none; }
  .jump { position: fixed; right: 34px; bottom: 26px; z-index: 20;
    background: var(--accent-dim); border: 1px solid var(--accent);
    color: var(--text); border-radius: 18px; padding: 7px 14px;
    font: inherit; font-size: calc(12px * var(--fs)); cursor: pointer; display: none;
    box-shadow: 0 4px 16px rgba(0,0,0,.45); }
  .jump:hover { background: var(--accent); color: #1a0d14; }
  /* 角色卡详情弹层（2026-11-09 用户要求）：点「演 XXX」看玩家用的到底是哪张卡。
     官方卡和玩家自建卡走同一个入口（`/api/persona_admin/card?card_id=`），
     归属写在 id 里，所以这里不用先知道「是谁的会话」。 */
  .cMask { position: fixed; inset: 0; background: rgba(0, 0, 0, .62);
    display: none; align-items: center; justify-content: center; z-index: 60;
    padding: 16px; }
  .cMask.on { display: flex; }
  .cBox { width: min(680px, 100%); max-height: 88vh; overflow-y: auto;
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: var(--r); padding: 16px 18px; }
  .cBox h3 { font-size: calc(15px * var(--fs)); margin-bottom: 2px; }
  .cWho { font-size: calc(11px * var(--fs)); color: var(--text-mute);
    margin-bottom: 12px; }
  .cWho b { color: var(--accent); font-weight: 500; }
  .cSec { margin-bottom: 12px; }
  .cSec .t { font-size: calc(11px * var(--fs)); color: var(--text-dim);
    margin-bottom: 4px; letter-spacing: .3px; }
  .cSec .v { font-size: calc(12.5px * var(--fs)); color: var(--text);
    line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  .cSec .v.mute { color: var(--text-mute); }
  .cRow { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 12px; }
  .cRow span { font-size: calc(11.5px * var(--fs)); color: var(--text-dim); }
  .cClose { margin-top: 6px; }
  .row .card.link { text-decoration: underline dotted; cursor: pointer; }
  .row .card.link:hover { color: var(--accent); }
  .fsCtl { display: flex; align-items: center; gap: 4px; }
  .fsCtl b { font-size: calc(11px * var(--fs)); color: var(--text-mute);
    font-weight: 400; min-width: 34px; text-align: center; }
  /* 代充计费（2026-11-10）：站主手动登记 QQ + 金额，看余额与逐笔明细。
     没有在线支付、没有有效期；这一屏只做「记一笔」和「看账」。 */
  .bMask { position: fixed; inset: 0; background: rgba(0, 0, 0, .62);
    display: none; align-items: center; justify-content: center;
    z-index: 70; padding: 16px; }
  .bMask.on { display: flex; }
  .bBox { width: min(900px, 100%); max-height: 90vh; overflow-y: auto;
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: var(--r); padding: 16px 18px; }
  .bBox h3 { font-size: calc(15px * var(--fs)); margin-bottom: 6px; }
  .bTip { font-size: calc(11px * var(--fs)); color: var(--text-mute);
    line-height: 1.75; margin-bottom: 12px; }
  .bForm { display: flex; gap: 8px; flex-wrap: wrap;
    align-items: center; margin-bottom: 14px; }
  .bForm input { padding: 6px 10px; font: inherit;
    font-size: calc(12px * var(--fs)); color: var(--text);
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 6px; outline: none; }
  .bForm input:focus { border-color: var(--accent); }
  .bForm .qq { width: 130px; } .bForm .amt { width: 110px; }
  .bForm .nt { flex: 1; min-width: 150px; }
  .bTbl { width: 100%; border-collapse: collapse;
    font-size: calc(11.5px * var(--fs)); }
  .bTbl th, .bTbl td { padding: 6px 8px; text-align: left; white-space: nowrap;
    border-bottom: 1px solid var(--border-soft); color: var(--text-dim); }
  .bTbl th { color: var(--text-mute); font-weight: 500; }
  .bTbl td b { color: var(--text); font-weight: 600; }
  .bTbl td .lnk { color: var(--accent); cursor: pointer;
    text-decoration: underline dotted; }
  .bSub { font-size: calc(12px * var(--fs)); color: var(--text-dim);
    margin: 14px 0 6px; }
  .bEmpty { color: var(--text-mute); padding: 14px 2px;
    font-size: calc(12px * var(--fs)); }
  .bFoot { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="side-head">
      <h1>角色扮演 <span class="cnt" id="cnt">加载中…</span></h1>
      <!-- 小说模式是另一套记录（世界书 + 第三人称正文），不混进这份会话列表；
            入口放在这里，是因为「谁玩过什么」都从这一个台子进（2026-11-12）。 -->
      <div class="filters">
        <a class="chip" href="/novel_admin" target="_blank"
           style="text-decoration:none;display:inline-block"
           title="小说记录：谁写了什么小说 —— 按 QQ 列出所有世界书，点开看整本正文（只读）">小说模式查看 →</a>
      </div>
      <div class="filters" id="filters">
        <button class="chip on" data-k="all">全部</button>
        <button class="chip" data-k="网页">网页</button>
        <button class="chip" data-k="游客">游客</button>
        <button class="chip" data-k="私聊">QQ私聊</button>
        <button class="chip" data-k="群聊">QQ群聊</button>
      </div>
      <!-- 游客会话查看的管理员名单（2026-11-08）：只有这里加进去的 QQ
           才能登录 /guest-view。名单存在 state/guest_admins.json。 -->
      <div class="gv-admins">
        <div class="gv-h">游客查看 · 管理员 <span id="gvCnt"></span></div>
        <div class="gv-list" id="gvList"></div>
        <div class="gv-add">
          <input id="gvQq" inputmode="numeric" placeholder="QQ 号"
                 onkeydown="if(event.key==='Enter')gvAdd()">
          <button class="chip" id="gvAddBtn" onclick="gvAdd()">加</button>
        </div>
      </div>
    </div>
    <div class="side-list" id="list"></div>
  </aside>

  <main class="main">
    <div class="top">
      <span class="who" id="who">选一个会话</span>
      <span class="meta" id="meta"></span>
      <span class="sp"></span>
      <!-- 字号缩放（2026-11-09 用户要求）：整站 19 处 font-size 都吃 --fs 系数，
           这两个按钮只动那一个变量。A 是复位（点一下回 100%）。 -->
      <span class="fsCtl" title="字号缩放，存在这台浏览器里">
        <button class="btn" id="fsDown">A-</button>
        <b id="fsVal">100%</b>
        <button class="btn" id="fsUp">A+</button>
        <button class="btn" id="fsReset" title="恢复 100%">A</button>
      </span>
      <a class="btn" href="/characters" title="改角色卡详情文案、换默认/角色背景">角色卡管理</a>
      <button class="btn" id="btnBilling" title="登记代充、看余额和逐笔用量">代充计费</button>
      <label class="auto"><input type="checkbox" id="auto"> 自动刷新</label>
      <button class="btn" id="refresh">刷新</button>
      <!-- 「这张卡」（2026-11-09）：当前会话演的那张卡的详情。左栏那行也能点，
           顶栏这个是给「已经打开对话、想看她是谁」用的。 -->
      <button class="btn" id="btnCard" style="display:none">这张卡</button>
      <button class="btn danger" id="del" style="display:none">删除</button>
    </div>
    <div class="note" id="note" style="display:none"></div>
    <div class="log" id="log">
      <div class="empty">左边点一个人<br>看他跟角色聊了什么</div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<button class="jump" id="jump">↓ 新消息</button>

<!-- 角色卡详情（2026-11-09）：点左栏「演 XXX」或顶栏「这张卡」都会弹这里。
     玩家自建卡和官方卡同一个视图——字段全给，站主要看得全才判断得了。 -->
<div class="cMask" id="cardMask">
  <div class="cBox">
    <h3 id="cdName">角色卡</h3>
    <div class="cWho" id="cdWho"></div>
    <div id="cdBody"></div>
    <button class="btn cClose" id="cdClose">关闭</button>
  </div>
</div>

<!-- 代充计费（2026-11-10）：群友转钱 → 站主在这里敲一笔 → 余额到账。
     纯余额、不过期；真实扣费按官方价目表在 llm 采集点逐笔落 usage 流水。 -->
<div class="bMask" id="billingMask">
  <div class="bBox" role="dialog" aria-modal="true" aria-labelledby="bTitle">
    <h3 id="bTitle">代充计费 · 查看台</h3>
    <div class="bTip">
      群友转钱之后在这里登记「QQ + 金额」即可，余额不过期、用完为止。
      只有中转站连不上、落到站主付费的官方 DeepSeek 时才扣余额；免费中转和
      玩家自带的 Key 只记 token 不记钱。价格表在 <code>config/persona_billing.json</code>，
      按官方高峰 / 闲时口径，改价目表不用重启。
    </div>
    <div class="bForm">
      <input class="qq" id="bQq" inputmode="numeric" placeholder="QQ 号">
      <input class="amt" id="bAmt" inputmode="decimal" value="5" placeholder="金额（元）">
      <input class="nt" id="bNote" placeholder="备注：微信转账 / 群友红包…">
      <button class="btn" id="bAdd">登记充值</button>
      <button class="btn" id="bCsvAll">导出全部 CSV</button>
    </div>
    <div class="bSub">已登记账号 <span id="bCnt"></span> · <span id="bPrice"></span></div>
    <div id="bAccounts" style="overflow-x:auto"></div>
    <div class="bSub">逐笔明细 <span id="bWho"></span></div>
    <div id="bRows" style="overflow-x:auto"><div class="bEmpty">点上面一行的 QQ 看这个人的逐笔记录。</div></div>
    <div class="bFoot">
      <button class="btn" id="bCsvOne">导出这个人 CSV</button>
      <button class="btn" id="bRefresh">刷新</button>
      <button class="btn" id="bClose">关闭</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let ALL = [], FILTER = "all", CUR = null;
const AUTO_KEY = "persona_admin_auto";
const UNREAD = new Set();        // 自动刷新期间轮次涨过的会话
let PREV = {}, FIRST_LOAD = true, JUMP_N = 0;

// 5 分钟内显示相对时间，更早的用服务端的「11-06 20:08」，跨天更好认
function relTime(sec, fallback) {
  if (!sec) return fallback || "";
  const s = Math.max(0, Date.now() / 1000 - sec);
  if (s < 10) return "刚刚";
  if (s < 60) return Math.floor(s) + " 秒前";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  return fallback || "";
}
function hideJump() { JUMP_N = 0; $("jump").style.display = "none"; }
function atBottom() {
  const l = $("log");
  return l.scrollHeight - l.scrollTop - l.clientHeight < 80;
}
function toBottom() {
  $("log").scrollTop = $("log").scrollHeight;
  hideJump();
}
$("jump").onclick = toBottom;

// ── 字号缩放（2026-11-09 用户要求）───────────────────────
// 全站 19 处 font-size 都是 `calc(px * var(--fs))`，所以这四个按钮只改
// `--fs` 一个系数。存 localStorage，不跟账号走（换浏览器/清缓存回到 100%）。
const FS_KEY = "persona_admin_fs";
const FS_MIN = 0.8, FS_MAX = 1.8, FS_STEP = 0.1;

function applyFs(v) {
  let n = Number(v);
  if (!isFinite(n)) n = 1;
  n = Math.max(FS_MIN, Math.min(FS_MAX, Math.round(n * 100) / 100));
  document.documentElement.style.setProperty("--fs", String(n));
  $("fsVal").textContent = Math.round(n * 100) + "%";
  return n;
}

function saveFs(n) {
  try { localStorage.setItem(FS_KEY, String(n)); } catch (e) { /* 隐私模式忽略 */ }
}

function stepFs(delta) { applyFs(curFs() + delta); }

function curFs() {
  const raw = getComputedStyle(document.documentElement)
    .getPropertyValue("--fs").trim();
  const n = Number(raw);
  return isFinite(n) && n > 0 ? n : 1;
}

(function initFs() {
  let saved = 1;
  try {
    const raw = localStorage.getItem(FS_KEY);
    if (raw !== null) saved = raw;
  } catch (e) { /* 读不到就用默认 */ }
  applyFs(saved);
})();
$("fsDown").onclick = () => { stepFs(-FS_STEP); saveFs(curFs()); };
$("fsUp").onclick = () => { stepFs(FS_STEP); saveFs(curFs()); };
$("fsReset").onclick = () => { applyFs(1); saveFs(1); };
// 键盘也给了：Ctrl/Cmd + 滚轮在浏览器里是缩放整页（会连布局一起挤），
// 这里用 +/- 调本控件的字号，不抢浏览器的快捷键。
document.addEventListener("keydown", function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && /INPUT|TEXTAREA/.test(t.tagName)) return;
  if (e.key === "+" || e.key === "=") { stepFs(FS_STEP); saveFs(curFs()); }
  else if (e.key === "-" || e.key === "_") { stepFs(-FS_STEP); saveFs(curFs()); }
  else if (e.key === "0") { applyFs(1); saveFs(1); }
});

// ── 角色卡详情（2026-11-09）──────────────────────────────
// 玩家自建卡的归属就写在 id 里，所以后端 `get_card()` 一个入口就能查
// 官方卡和任何人的自建卡——这里只管展示，不猜是谁的。

function cdSec(title, text) {
  const d = document.createElement("div");
  d.className = "cSec";
  const t = document.createElement("div");
  t.className = "t";
  t.textContent = title;
  const v = document.createElement("div");
  v.className = "v" + (text ? "" : " mute");
  v.textContent = text || "（没填）";
  d.appendChild(t);
  d.appendChild(v);
  return d;
}

function renderCard(d) {
  const c = d.card || {};
  $("cdName").textContent = c.name || "（没名字）";
  const who = document.createElement("div");
  if (d.owner) {
    who.innerHTML = "<b></b>";
    who.querySelector("b").textContent = "玩家自建 · QQ " + d.owner;
    const rest = document.createTextNode("　只这个本人看得到");
    who.appendChild(rest);
  } else {
    who.textContent = "官方角色卡";
  }
  $("cdWho").textContent = "";
  $("cdWho").appendChild(who);
  const body = $("cdBody");
  body.innerHTML = "";
  [["她真正的名字", c.charName], ["描述", c.description],
   ["性格", c.personality], ["演出指令 system", c.systemPrompt],
   ["示例对话", c.exampleDialogue], ["开场白", c.opening],
   ["她的房间", c.room], ["长相 tag", c.appearancePrompt],
   ["服装 tag", c.outfitPrompt], ["头像", c.avatar]].forEach(function (p) {
    body.appendChild(cdSec(p[0], p[1]));
  });
  const row = document.createElement("div");
  row.className = "cRow";
  // 起点这行（2026-11-09）：新线一律建成 v2，那里「关系级 / 冲动数值」
  // 两个字段根本不参与判定，照旧显示等于骗站主。所以主写法是 v2 四条轴；
  // 只有这张卡真的配了非零的 v1 起点才补一段标明「仅 v1 老线」。
  // 注意别用「字段在不在」判标尺——`_norm_card` 给每张卡都补齐了 v2 键。
  const v1Bits = [];
  if ((Number(c.start_level) || 0) > 0) v1Bits.push("关系 " + Number(c.start_level) + " 级");
  if ((Number(c.start_arousal) || 0) > 0) v1Bits.push("冲动 " + Number(c.start_arousal));
  const v1Start = v1Bits.length ? "（仅 v1 老线：" + v1Bits.join(" · ") + "）" : "";
  [["起点", "好感 " + (c.start_value === null || c.start_value === undefined ? "默认" : c.start_value)
     + " · 表白 " + (Number(c.start_confess) || 0)
     + " · 病娇 " + (Number(c.start_yandere) || 0)
     + " · " + (c.start_together ? "已在一起" : "未在一起")
     + " · 冲动 " + (Number(c.start_arousal_tier) || 0) + " 档" + v1Start],
   ["怀孕玩法", c.pregnancyEnabled === false ? "关" : "开"],
   ["角色 LoRA", c.char_lora || "（站主没挂）"],
   ["状态", c.hidden ? "已下架" : "在册"]].forEach(function (p) {
    const s = document.createElement("span");
    s.textContent = p[0] + "：" + p[1];
    row.appendChild(s);
  });
  body.appendChild(row);
}

async function showCard(cid, label) {
  cid = String(cid || "").trim();
  if (!cid) { toast("这条会话没记卡 id（老数据），看不出是哪张卡", true); return; }
  $("cardMask").classList.add("on");
  $("cdName").textContent = label || "角色卡";
  $("cdWho").textContent = "";
  $("cdBody").innerHTML = '<div class="v mute">读取中…</div>';
  try {
    const d = await api("/api/persona_admin/card?card_id=" + encodeURIComponent(cid));
    renderCard(d);
  } catch (e) {
    $("cdBody").innerHTML = "";
    $("cdBody").appendChild(cdSec("读不到", e.message || "未知错误"));
  }
}
function closeCard() {
  $("cardMask").classList.remove("on");
}
$("cdClose").onclick = closeCard;
$("cardMask").addEventListener("click", function (e) {
  if (e.target === $("cardMask")) closeCard();
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") closeCard();
});

async function api(p, opt) {
  const r = await fetch(p, opt);
  let d;
  try { d = await r.json(); } catch (e) { d = { ok: false, error: "返回不是 JSON" }; }
  if (!r.ok || d.ok === false) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}

function toast(t, err) {
  const el = $("toast");
  el.textContent = t;
  el.className = "toast on" + (err ? " err" : "");
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = "toast"; }, 2600);
}

function tagClass(kind) {
  return kind === "游客" ? "v" : kind === "网页" ? "w"
       : kind === "群聊" ? "g" : "";
}

function render() {
  const box = $("list");
  const keep = box.scrollTop;        // 别让 5 秒一轮把左栏滚动位置打断
  box.innerHTML = "";
  const rows = ALL.filter(r => FILTER === "all" || r.short === FILTER);
  if (!rows.length) {
    box.innerHTML = '<div class="empty" style="padding:30px 10px">没有匹配的会话</div>';
    return;
  }
  rows.forEach(r => {
    const el = document.createElement("div");
    el.className = "row" + (CUR && CUR.key === r.key && CUR.source === r.source ? " on" : "");
    el.innerHTML =
      '<div class="l1"><span class="tag ' + tagClass(r.kind) + '"></span>' +
      (UNREAD.has(r.key + "|" + r.source) ? '<span class="dot"></span>' : '') +
      '<span class="nm"></span></div>' +
      '<div class="l2"><span class="card"></span><span class="st"></span>' +
      '<span class="tm"></span></div>';
    el.querySelector(".tag").textContent = r.short;
    el.querySelector(".nm").textContent = r.label;
    const cd = el.querySelector(".card");
    cd.textContent = r.card ? ("演 " + r.card) : "";
    if (r.card_id) {
      // 「演 XXX」点下去看这张卡的详情（2026-11-09 用户要求）。
      // stopPropagation：不然同一会跟着开——玩家想知道的是「她是谁」，不是重开对话。
      cd.classList.add("link");
      cd.title = "看这张角色卡的内容";
      cd.onclick = function (e) {
        e.stopPropagation();
        showCard(r.card_id, r.card);
      };
    }
    el.querySelector(".st").textContent = r.turns + " 轮";
    el.querySelector(".tm").textContent = relTime(r.mtime, r.mtime_text) || r.mtime_text || "";
    el.onclick = () => open(r);
    box.appendChild(el);
  });
  box.scrollTop = keep;
  $("cnt").textContent = "共 " + ALL.length + " 个会话";
}

function setNote(text) {
  const n = $("note");
  if (text) { n.textContent = "【之前的事】" + text; n.style.display = ""; }
  else { n.style.display = "none"; }
}

async function open(r) {
  CUR = r;
  UNREAD.delete(r.key + "|" + r.source);
  hideJump();
  render();
  $("who").textContent = r.label;
  $("meta").textContent = r.short + " · " + r.turns + " 轮 · " + r.mtime_text;
  $("del").style.display = "";
  const log = $("log");
  log.innerHTML = '<div class="empty">读取中…</div>';
  try {
    const d = await api("/api/persona_admin/detail?key=" +
      encodeURIComponent(r.key) + "&source=" + encodeURIComponent(r.source));
    $("who").textContent = d.label + (d.card ? ("　" + d.card) : "");
    $("meta").textContent = r.short + " · " + r.turns + " 轮 · " +
      (d.mtime_text || r.mtime_text);
    // 顶栏「这张卡」：detail 接口现在连 card_id 一起回（老 state 没有就藏起来）
    $("btnCard").style.display = d.card_id ? "" : "none";
    $("btnCard").onclick = () => showCard(d.card_id, d.card);
    setNote(d.note);
    renderMessages(d);
    log.scrollTop = 0;
  } catch (e) {
    log.innerHTML = '<div class="empty">读取失败：' + e.message + '</div>';
    toast(e.message, true);
  }
}

async function load() {
  try {
    const d = await api("/api/persona_admin/list");
    ALL = d.sessions || [];
    const now = {};
    ALL.forEach(r => {
      const id = r.key + "|" + r.source;
      now[id] = r.turns;
      if (!FIRST_LOAD && PREV[id] !== undefined && r.turns > PREV[id]) UNREAD.add(id);
    });
    PREV = now;
    FIRST_LOAD = false;
    if (CUR) {
      CUR = ALL.find(r => r.key === CUR.key && r.source === CUR.source) || CUR;
      $("meta").textContent = CUR.short + " · " + CUR.turns + " 轮 · " +
        (relTime(CUR.mtime, CUR.mtime_text) || CUR.mtime_text || "");
    }
    $("cnt").textContent = "共 " + ALL.length + " 个会话";
    render();
  } catch (e) { toast(e.message, true); }
}

// ── 自动刷新（2026-11-06 改）──────────────────────────────
// 服务端没有缓存，每次调用都现读磁盘，所以拉一次就是最新。
// 默认开、开关记本地；后台标签照拉；详情只把多出来的消息追加到末尾，
// 不清空重绘，滚动位置不动；没贴着底时给一个「N 条新消息」浮标。
let AUTO_T = null;
function setAuto(on, remember) {
  if (AUTO_T) { clearInterval(AUTO_T); AUTO_T = null; }
  $("auto").checked = on;
  $("auto").parentNode.classList.toggle("on", on);
  if (remember) { try { localStorage.setItem(AUTO_KEY, on ? "1" : "0"); } catch (e) {} }
  if (!on) return;
  AUTO_T = setInterval(async () => {
    await load();
    await refreshCurrent();
  }, 5000);
}

async function refreshCurrent() {
  if (!CUR) return;
  try {
    const d = await api("/api/persona_admin/detail?key=" +
      encodeURIComponent(CUR.key) + "&source=" + encodeURIComponent(CUR.source));
    const msgs = d.messages || [];
    const shown = $("log").querySelectorAll(".msg").length;
    if (msgs.length === shown) return;      // 条数没变就别动 DOM
    const stick = atBottom();
    if (msgs.length < shown || !shown) {    // 回退 / 首次从空态来消息：整块重画
      renderMessages(d);
      if (stick) toBottom();
      return;
    }
    const frag = document.createDocumentFragment();
    msgs.slice(shown).forEach(m => frag.appendChild(makeMsg(m)));
    $("log").appendChild(frag);
    if (stick) toBottom();                 // 正贴着底就继续跟到最新
    else {
      JUMP_N += msgs.length - shown;
      const b = $("jump");
      b.textContent = "↓ " + JUMP_N + " 条新消息";
      b.style.display = "";
    }
  } catch (e) { /* 自动刷新失败静默跳过，下一轮再试 */ }
}

// 台词/心声高亮（2026-11-09）。和扮演页 `fmtDlg` 同一条规矩：**先整体转义，
// 再在转义后的文本上包 span**——正则只认转义后的引号，不对原始文本放行任何
// HTML，所以这里用 innerHTML 也不比原来的 textContent 多出注入面。
function fmtDlg(text) {
  const esc = String(text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  // 心声：行首 〔心声〕 整行吃粉色，标记本身不显示（后台不需要看元数据）。
  return esc
    .replace(/^〔心声〕[ \t]*[:：]?[ \t]*([^\n]*)/gm,
             '<span class="mono">$1</span>')
    .replace(/(&quot;[\s\S]*?&quot;|“[\s\S]*?”|「[^」]*」)/g,
             '<span class="dlg">$1</span>');
}

function makeMsg(m) {
  const el = document.createElement("div");
  el.className = "msg " + (m.role === "user" ? "u" : "a");
  el.innerHTML = '<div class="b"></div><div class="m"></div>';
  el.querySelector(".b").innerHTML = fmtDlg(m.text || "");
  if (m.role === "assistant" && m.mood) {
    el.querySelector(".m").textContent =
      m.mood + " " + (m.intensity || 0) + (m.state ? ("　" + m.state) : "");
  }
  return el;
}

function renderMessages(d) {
  const log = $("log");
  const msgs = d.messages || [];
  log.innerHTML = "";
  if (!msgs.length) {
    log.innerHTML = '<div class="empty">这个会话没有消息</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  msgs.forEach(m => frag.appendChild(makeMsg(m)));
  log.appendChild(frag);
}

$("auto").onchange = (e) => {
  setAuto(e.target.checked, true);
  toast(e.target.checked ? "每 5 秒自动刷新" : "已停止自动刷新");
};

  FILTER = b.dataset.k;

  render();

    load();

// ─── 游客查看管理员名单（2026-11-08）──────────────
// 只有名单里的 QQ 能登录 /guest-view；验证码走 QQ 私聊。
async function gvLoad() {
  const box = $("gvList");
  if (!box) return;
  try {
    const r = await fetch("/api/persona_admin/admins");
    const d = await r.json();
    const ids = d.ids || [];
    $("gvCnt").textContent = ids.length ? "(" + ids.length + ")" : "（空）";
    box.innerHTML = "";
    if (!ids.length) {
      box.innerHTML = '<span class="gv-tag" style="cursor:default">还没有</span>';
      return;
    }
    ids.forEach(qq => {
      const t = document.createElement("span");
      t.className = "gv-tag";
      t.textContent = qq;
      t.title = "点一下移除";
      t.onclick = async () => {
        if (!confirm("移除管理员 " + qq + "？")) return;
        await fetch("/api/persona_admin/admins/" + qq, { method: "DELETE" });
        gvLoad();
      };
      box.appendChild(t);
    });
  } catch (e) {
    box.innerHTML = '<span class="gv-tag" style="cursor:default">读不到</span>';
  }
}

async function gvAdd() {
  const qq = ($("gvQq").value || "").trim();
  if (!/^\d{5,12}$/.test(qq)) return toast("QQ 号格式不对");
  try {
    const r = await fetch("/api/persona_admin/admins", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ qq }),
    });
    const d = await r.json();
    if (!d.ok) return toast(d.error || "加失败");
    $("gvQq").value = "";
    gvLoad();
    toast("已加入");
  } catch (e) {
    toast("加失败：" + e.message);
  }
}

// ── 代充计费（2026-11-10）─────────────────────────────
// 只读表格 + 手动登记。身份由 5174 本机直连决定，这里没有支付、没有倒计时。
let BILL_CUR = "";

function billEsc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

async function billAccounts() {
  try {
    const d = await api("/api/persona_admin/billing");
    $("bCnt").textContent = "(" + d.total + ")";
    $("bPrice").textContent = "付费模型 " + billEsc(d.paid_model) +
      (d.peak_now ? " · 现在高峰价" : " · 现在闲时价");
    const rows = d.accounts || [];
    if (!rows.length) {
      $("bAccounts").innerHTML = '<div class="bEmpty">还没登记过代充。' +
        "填上面的 QQ 和金额，点「登记充值」就会建账。</div>";
      return;
    }
    const head = "<tr><th>QQ</th><th>余额</th><th>累计充值</th>" +
      "<th>已花费</th><th>充值次数</th><th>最近活动</th></tr>";
    const body = rows.map(r =>
      "<tr><td><span class=\"lnk\" data-bq=\"" + billEsc(r.qq) + "\">" +
      billEsc(r.qq) + "</span></td><td><b>¥" + billEsc(r.balance_text) +
      "</b></td><td>¥" + billEsc(r.recharged_text) + "</td><td>¥" +
      billEsc(r.spent_text) + "</td><td>" + Number(r.times || 0) +
      "</td><td>" + billEsc(r.updated_text) + "</td></tr>").join("");
    $("bAccounts").innerHTML = '<table class="bTbl"><thead>' + head +
      "</thead><tbody>" + body + "</tbody></table>";
  } catch (e) {
    toast("余额列表读不出来：" + e.message, true);
  }
}

async function billRows() {
  if (!BILL_CUR) return;
  $("bWho").textContent = "· " + BILL_CUR;
  try {
    const d = await api("/api/persona_admin/billing/detail?qq=" +
      encodeURIComponent(BILL_CUR) + "&days=30");
    const rows = d.rows || [];
    if (!rows.length) {
      $("bRows").innerHTML = '<div class="bEmpty">最近 30 天没有逐笔记录。</div>';
      return;
    }
    const head = "<tr><th>时间</th><th>渠道</th><th>模型</th><th>时段</th>" +
      "<th>命中</th><th>未命中</th><th>输出</th><th>金额(元)</th><th>会话</th></tr>";
    const names = { free: "免费中转", paid: "站主代充", custom: "自带模型" };
    const body = rows.map(r =>
      "<tr><td>" + billEsc(r.date) + " " + billEsc(r.time) + "</td><td>" +
      billEsc(names[r.channel] || "其他") + "</td><td>" + billEsc(r.model) +
      "</td><td>" + (r.peak ? "高峰" : "闲时") + "</td><td>" +
      Number(r.hit || 0) + "</td><td>" + Number(r.miss || 0) + "</td><td>" +
      Number(r.out || 0) + "</td><td>" + (Number(r.cost || 0) / 1e6).toFixed(6) +
      "</td><td>" + billEsc(r.session) + "</td></tr>").join("");
    $("bRows").innerHTML = '<table class="bTbl"><thead>' + head +
      "</thead><tbody>" + body + "</tbody></table>";
  } catch (e) {
    toast("明细读不出来：" + e.message, true);
  }
}

async function billRecharge() {
  const qq = ($("bQq").value || "").trim();
  const amount = ($("bAmt").value || "").trim();
  if (!/^\d{5,12}$/.test(qq)) return toast("QQ 号格式不对", true);
  try {
    const d = await api("/api/persona_admin/billing/recharge", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ qq, amount, note: $("bNote").value || "" }),
    });
    $("bNote").value = "";
    BILL_CUR = qq;
    toast("已登记：余额 ¥" + d.balance_text);
    billAccounts();
    billRows();
  } catch (e) {
    toast("登记失败：" + e.message, true);
  }
}

async function billDownload(qq) {
  let p = "/api/persona_admin/billing/export.csv?days=90";
  if (qq) p += "&qq=" + encodeURIComponent(qq);
  try {
    const r = await fetch(p);
    const text = await r.text();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(
      new Blob([text], { type: "text/csv;charset=utf-8" }));
    a.download = "代充明细_" + (qq || "全部") + "_" +
      new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  } catch (e) {
    toast("导出失败：" + e.message, true);
  }
}

function billOpen() {
  $("billingMask").classList.add("on");
  billAccounts();
  if (BILL_CUR) billRows();
}
function billClose() {
  $("billingMask").classList.remove("on");
}
$("btnBilling").onclick = billOpen;
$("bClose").onclick = billClose;
$("bRefresh").onclick = () => { billAccounts(); if (BILL_CUR) billRows(); };
$("bAdd").onclick = billRecharge;
$("bCsvAll").onclick = () => billDownload("");
// 没选人时 BILL_CUR 是空串，直接传过去会变成「导出全部」——按钮写着
// 「这个人」却把所有人倒出来，容易误点。宁可提示一句，不发那个请求。
$("bCsvOne").onclick = () => {
  if (!BILL_CUR) { toast("先点上面一行的 QQ 选一个人"); return; }
  billDownload(BILL_CUR);
};
$("bNote").onkeydown = e => { if (e.key === "Enter") billRecharge(); };
$("bAccounts").addEventListener("click", e => {
  const a = e.target.closest("[data-bq]");
  if (a) { BILL_CUR = a.getAttribute("data-bq"); billRows(); }
});
$("billingMask").addEventListener("click", e => {
  if (e.target === $("billingMask")) billClose();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") billClose();
});
</script>
</body>
</html>
