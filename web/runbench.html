<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>跑图台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='4' width='24' height='24' rx='6' fill='%23ff6ba9'/><circle cx='16' cy='13' r='5' fill='%23fff'/><path d='M6 26c2-5 5-7 10-7s8 2 10 7z' fill='%23fff'/></svg>">
<style>
  html, body { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0a0a0f; --elev:#12121a; --input:#1a1a24; --border:#2a2a3a;
    --text:#e8e8f0; --dim:#8888a0; --mute:#555570;
    --accent:#ff6ba9; --accent2:#7c5cff; --success:#4ade80; --error:#f87171;
    --r:14px;
  }
  html,body{min-height:100%;background:var(--bg);color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;}
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px calc(44px + env(safe-area-inset-bottom));}
  header{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  header .back{margin-left:auto;color:var(--dim);font-size:12px;text-decoration:none;}
  header .back:hover{color:var(--accent);}
  header h1{font-size:18px;font-weight:600;}
  header .tag{font-size:11px;color:var(--accent);border:1px solid var(--accent);
    border-radius:20px;padding:2px 9px;opacity:.9;}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px;}

  /* Tab 切换 */
  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border);}
  .tab{flex:1;padding:12px 8px;border:0;background:none;color:var(--dim);
    font-size:15px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;
    transition:.15s;white-space:nowrap;}
  .tab.on{color:var(--text);border-bottom-color:var(--accent);}
  .tab .cnt{font-size:11px;color:var(--mute);margin-left:4px;font-weight:400;}

  /* 卡片网格 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:14px;}
  @media(max-width:380px){.grid{grid-template-columns:repeat(2,1fr);gap:10px;}}
  .card{background:var(--elev);border:1px solid var(--border);border-radius:var(--r);
    overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column;}
  .card:hover{border-color:var(--accent);}
  .card .thumb{position:relative;width:100%;aspect-ratio:3/4;background:var(--input);
    overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .card .thumb img{width:100%;height:100%;object-fit:cover;}
  .card .thumb .ph{color:var(--mute);font-size:12px;text-align:center;padding:10px;
    line-height:1.4;}
  .card .thumb .ph b{display:block;color:var(--dim);font-size:15px;margin-bottom:4px;}
  .card .cloud{position:absolute;top:8px;left:8px;background:#0008;color:#7cc7ff;
    font-size:10px;padding:2px 7px;border-radius:20px;}
  .card .meta{padding:10px 11px 12px;display:flex;flex-direction:column;gap:3px;}
  .card .name{font-size:14px;font-weight:700;letter-spacing:.3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .desc{font-size:11.5px;color:var(--dim);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  /* 出图按钮：卡片本体不点弹窗（避免上下滑动误触），要出图点这个按钮 */
  .card .go{margin:0 11px 12px;padding:9px 0;border:0;border-radius:9px;
    background:var(--accent);
    color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;letter-spacing:1px;}
  .card .go:active{opacity:.85;}

  .empty{padding:50px 20px;text-align:center;color:var(--mute);font-size:14px;line-height:1.8;}
  .empty b{color:var(--dim);}

  /* 弹框 */
  .mask{position:fixed;inset:0;background:#000c;display:none;align-items:center;
    justify-content:center;z-index:200;padding:20px;}
  .mask.on{display:flex;}
  .dlg{background:var(--elev);border:1px solid var(--border);border-radius:var(--r);
    padding:20px;width:100%;max-width:480px;max-height:86vh;overflow:auto;}
  .dlg .dtitle{font-size:16px;font-weight:700;margin-bottom:4px;}
  .dlg .dsub{font-size:12.5px;color:var(--dim);margin-bottom:14px;line-height:1.6;}
  .dlg textarea{width:100%;min-height:110px;resize:vertical;background:var(--input);
    border:1px solid var(--border);border-radius:11px;color:var(--text);
    padding:12px;font-size:15px;font-family:inherit;line-height:1.6;outline:none;}
  .dlg textarea:focus{border-color:var(--accent);}
  /* 提示词框上方的小工具条（右侧粘贴按钮） */
  .pbar{display:flex;justify-content:flex-end;margin:2px 0 6px;}
  .pbar button{background:var(--input);border:1px solid var(--border);color:var(--dim);
    border-radius:8px;padding:5px 13px;font-size:12.5px;cursor:pointer;
    font-family:inherit;transition:.15s;}
  .pbar button:hover{border-color:var(--accent);color:var(--text);}
  .pbar button:active{opacity:.8;}
  .dlg .acts{display:flex;gap:10px;margin-top:14px;}
  .btn{flex:1;padding:13px;border:0;border-radius:12px;font-size:15px;font-weight:700;
    color:#fff;cursor:pointer;background:var(--accent);
    transition:.15s;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.ghost{background:var(--input);border:1px solid var(--border);color:var(--dim);
    font-weight:500;}

  /* ── 上传图片区 ── */
  .up{display:flex;align-items:center;gap:12px;margin-bottom:12px;
    padding:11px;border:1px dashed var(--border);border-radius:11px;cursor:pointer;
    transition:.15s;}
  .up:hover{border-color:var(--accent);}
  .up .box{width:58px;height:58px;border-radius:9px;background:var(--input);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    flex:0 0 auto;font-size:24px;color:var(--mute);}
  .up .box img{width:100%;height:100%;object-fit:cover;}
  .up .txt{font-size:13px;color:var(--dim);line-height:1.6;}
  .up .txt b{color:var(--text);}
  .up .rm{display:none;margin-left:auto;flex:0 0 auto;background:var(--input);
    border:1px solid var(--border);color:var(--dim);border-radius:7px;
    padding:4px 10px;font-size:12px;cursor:pointer;}
  .up .rm.on{display:inline-block;}

  /* ── 弹窗内绿色成功提示条 ── */
  .ok-bar{display:none;margin-top:14px;padding:12px 14px;border-radius:11px;
    border:1px solid var(--success);background:rgba(74,222,128,.1);
    color:var(--text);font-size:14px;line-height:1.6;}
  .ok-bar.show{display:block;}
  .ok-bar b{color:var(--success);}
  .ok-bar .err{color:var(--error);}

  .status{margin-top:14px;text-align:center;color:var(--dim);font-size:14px;min-height:22px;}
  .status.err{color:var(--error);} .status.ok{color:var(--success);}
  .hidden{display:none!important;}

  /* 2026-11-17：弹窗输入框 16px，避免 iOS 聚焦放大。 */
  @media (max-width: 640px) {
    .dlg textarea { font-size: 16px; }
    .wrap { padding: 14px 12px 30px; }
  }

  /* ── 连续多图（2026-11-25 用户拍板）─────────────────────
     两级结构：顶部 Tab「官方渠道 / 连续多图」，进多图后再一行小切换
     「一图多风 / 五图各画」。手机端一律单列，格子靠 aspect-ratio 撑高度，
     不用写死像素——写死在不同 DPR 上会歪。 */
  .seg{display:flex;gap:8px;margin:0 0 14px;}
  .seg button{flex:1;padding:10px 6px;border:1px solid var(--border);
    background:var(--elev);color:var(--dim);border-radius:11px;font-size:13.5px;
    font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;
    white-space:nowrap;}
  .seg button.on{border-color:var(--accent);color:var(--text);
    background:rgba(255,107,169,.12);}

  .bhelp{font-size:12.5px;color:var(--dim);line-height:1.7;margin:0 0 12px;}
  .bhelp b{color:var(--text);}

  /* 全部同第一款：横跨整条的高亮大按钮，压在 5 宫格正上方。
     手机端要够大够好点（用户要求「大大的高亮的」），所以上下 padding 给足，
     副标题一行小字解释点了会发生什么。 */
  .sameall{display:block;width:100%;margin:0 0 12px;padding:14px 16px;
    border-radius:12px;font-size:15px;font-weight:700;line-height:1.45;
    border:1px solid var(--accent);color:#fff;
    background:linear-gradient(135deg,rgba(255,107,169,.95),rgba(255,107,169,.62));
    box-shadow:0 4px 16px rgba(255,107,169,.28);}
  .sameall:active{transform:translateY(1px);box-shadow:0 2px 8px rgba(255,107,169,.24);}
  .sameall .sub{display:block;font-size:12px;font-weight:400;
    color:rgba(255,255,255,.82);margin-top:3px;}

  /* 一次性提示条：居中偏上，操作后 1.6 秒自动消失，不挡点击 */
  #flashTip{position:fixed;left:50%;top:18%;transform:translate(-50%,-8px);
    z-index:99;max-width:86vw;padding:14px 20px;border-radius:14px;
    background:rgba(34,197,94,.96);color:#fff;font-size:14.5px;font-weight:600;
    line-height:1.55;text-align:center;box-shadow:0 10px 32px rgba(0,0,0,.28);
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;}
  #flashTip.on{opacity:1;transform:translate(-50%,0);}

  /* 五个格子：桌面两列（第一个跨两列当参考图），手机单列 */
  .slots{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
    margin-bottom:14px;}
  .slots .slot.full{grid-column:1 / -1;}
  @media(max-width:640px){ .slots{grid-template-columns:1fr;} }

  .slot{position:relative;border:1px solid var(--border);border-radius:13px;
    background:var(--elev);overflow:hidden;display:flex;flex-direction:column;}
  .slot .pic{position:relative;width:100%;aspect-ratio:4/3;background:var(--input);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    overflow:hidden;}
  .slot.full .pic{aspect-ratio:16/10;}
  .slot .pic img{width:100%;height:100%;object-fit:cover;display:block;}
  .slot .pic .hint{text-align:center;color:var(--mute);font-size:12.5px;
    line-height:1.6;padding:8px;}
  .slot .pic .hint b{display:block;font-size:22px;color:var(--dim);
    font-weight:400;margin-bottom:2px;}
  .slot .no{position:absolute;top:8px;left:8px;width:22px;height:22px;
    border-radius:50%;background:#000a;color:#fff;font-size:12px;
    display:flex;align-items:center;justify-content:center;font-weight:700;}
  /* 右上角小叉：只有传了图才出现，点它才删（用户明确：点小叉才删） */
  .slot .x{position:absolute;top:6px;right:6px;width:26px;height:26px;
    border-radius:50%;border:0;background:#000a;color:#fff;font-size:15px;
    line-height:1;cursor:pointer;display:none;align-items:center;
    justify-content:center;font-family:inherit;}
  .slot.has .x{display:flex;}
  .slot .x:active{background:var(--error);}
  /* 绿勾：进度提示，不是准入门槛 */
  .slot .ok{position:absolute;inset:0;background:rgba(74,222,128,.16);
    display:none;align-items:center;justify-content:center;font-size:34px;
    color:var(--success);pointer-events:none;}
  .slot.done .ok{display:flex;}
  .slot .sel{padding:8px 9px;border-top:1px solid var(--border);}
  .slot .sel select{width:100%;background:var(--input);border:1px solid var(--border);
    border-radius:9px;color:var(--text);padding:9px 8px;font-size:13px;
    font-family:inherit;outline:none;appearance:none;
    -webkit-appearance:none;}
  .slot .sel select:focus{border-color:var(--accent);}
  .slot .sel select:disabled{opacity:.5;}

  .brow{display:flex;gap:10px;margin-bottom:12px;}
  .brow .btn{padding:12px;font-size:14px;}
  .bbar{display:flex;gap:10px;}
  .bstatus{margin-top:12px;text-align:center;font-size:14px;color:var(--dim);
    min-height:22px;line-height:1.7;}
  .bstatus.ok{color:var(--success);} .bstatus.err{color:var(--error);}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>跑图台</h1>
    <span class="tag">点卡片出图</span>
    <a class="back" href="/">← 回首页</a>
  </header>
  <p class="sub">点卡片，写一句需求，出图发回 QQ。</p>

  <!-- 顶部只有两个选项（2026-11-25 用户拍板：把「我的预设」整个删掉，
       「之前随心配其实没人用……自定义预设根本没人存」） -->
  <div class="tabs">
    <button class="tab on" data-tab="channel">官方渠道 <span class="cnt" id="cntChannel"></span></button>
    <button class="tab" data-tab="batch">连续多图</button>
  </div>

  <div class="grid" id="channelGrid"></div>

  <!-- 我的预设：入口已下线，整块注释（对应的渲染与 Tab 判定也一并注释）。
       代码留着，要恢复就把这里和 app/features/bench/web.py 里预设那条判定
       一起放开。 -->
  <!--
  <div class="grid hidden" id="presetGrid"></div>
  -->

  <!-- ── 连续多图面板 ───────────────────────────────── -->
  <div class="hidden" id="batchPanel">
    <div class="seg" id="modeSeg">
      <button class="on" data-mode="same">一图多风</button>
      <button data-mode="each">五图各画</button>
      <button data-mode="text">文生图五连</button>
    </div>
    <p class="bhelp" id="bHelp"></p>

    <!-- 全部同第一款：**只在五图各画 / 文生图五连里出现**，位置在图片格正上方、
         做成醒目的高亮整条按钮。用户原话：「放在五图各画的那个开头上面，第一个
         图头顶那边，一个大大的那个标记的一个大大的高亮的按钮」。一图多风里没有
         这个按钮——那个玩法本来就要求 5 个不同渠道，铺成同一个毫无意义。 -->
    <button class="btn sameall hidden" id="btnSame">
      全部同第一款 <span class="sub">点一下，全部格子都用第一格的渠道</span>
    </button>

    <div class="slots" id="slots"></div>

    <!-- 需求框**只有文生图五连才有**（2026-11-25 用户拍板）：
         - 一图多风：本身就是「反推图片、跑 5 个不同渠道」，不需要写字，删掉。
         - 五图各画：每格上传图片，靠识图反推，也不需要写字。
         - 文生图五连：没有图可反推，一句话必填，5 家渠道各画一张。 -->
    <div id="promptWrap" class="hidden">
      <div class="pbar"><button type="button" id="btnPasteB">粘贴</button></div>
      <textarea id="bPrompt" placeholder="写一句你想画的内容，几个渠道各画一张…（必填）"
        style="width:100%;min-height:88px;resize:vertical;background:var(--input);
        border:1px solid var(--border);border-radius:11px;color:var(--text);
        padding:12px;font-size:15px;font-family:inherit;line-height:1.6;outline:none;"></textarea>
    </div>

    <div class="bbar">
      <button class="btn" id="btnBatchGo">一键开跑</button>
    </div>
    <div class="bstatus" id="bStatus"></div>
  </div>

  <div class="status" id="status"></div>
</div>

<!-- 「全部同第一款」这类操作的一次性提示条：居中浮一层，1.6 秒自动消失，
     不挡操作（pointer-events:none）。用户要求「必须弹出来这样一个提示」。 -->
<div id="flashTip"></div>

<!-- 出图弹框 -->
<div class="mask" id="mask">
  <div class="dlg">
    <div class="dtitle" id="dTitle"></div>
    <div class="dsub" id="dSub"></div>
    <div class="up" id="upBox" title="上传一张图，反推出提示词再画">
      <div class="box" id="upPreview">＋</div>
      <div class="txt" id="upTxt"><b>上传一张图（可选）</b><br>上传后会自动反推这张图的提示词，再按你的需求出图</div>
      <button class="rm" id="upRm">移除</button>
    </div>
    <div class="pbar"><button type="button" id="btnPaste">粘贴</button></div>
    <textarea id="dPrompt" placeholder="写一句你想画的内容…"></textarea>
    <div class="ok-bar" id="okBar"></div>
    <div class="acts">
      <button class="btn ghost" id="dCancel">取消</button>
      <button class="btn" id="dGo">出图</button>
    </div>
  </div>
</div>
<input type="file" id="upFile" accept="image/*" style="display:none">
<input type="file" id="bFile" accept="image/*" style="display:none">

<script>
(function(){
  "use strict";
  var K = new URLSearchParams(location.search).get("k") || "";
  var curTab = "channel";
  var curPick = null;    // {kind, name, label}
  var curImage = "";     // 上传图的 data URL（缩略图，已压缩）
  var allChannels = [];  // /api/runbench/check 回来的渠道列表（批量格子用）
  var busy = false;

  var $ = function(id){ return document.getElementById(id); };
  var st = $("status");
  function say(msg, cls){ st.className = "status " + (cls||""); st.innerHTML = msg; }

  function asJson(r, fallback){
    if(r.ok) return r.json();
    return r.text().then(function(t){
      var msg = fallback || "没成功，请重试";
      try{ var j = JSON.parse(t); if(j && j.error) msg = j.error; }catch(_){}
      throw new Error(msg);
    });
  }

  // ── 渲染卡片 ──────────────────────────────
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

  function coverHtml(url, has, name, sub){
    if(has) return '<img loading="lazy" decoding="async" src="'+esc(url)+'" alt="'+esc(name)+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'
      + '<div class="ph" style="display:none"><b>'+esc(name)+'</b>'+esc(sub)+'</div>';
    return '<div class="ph"><b>'+esc(name)+'</b>'+esc(sub)+'</div>';
  }

  function renderChannels(list){
    var g = $("channelGrid"); g.innerHTML = "";
    if(!list || !list.length){
      g.innerHTML = '<div class="empty">还没有可用的生图渠道。<br><b>检查 ComfyUI 是否在线。</b></div>';
      return;
    }
    list.forEach(function(c){
      var el = document.createElement("div");
      el.className = "card";
      el.innerHTML =
        '<div class="thumb">' + (c.cloud ? '<span class="cloud">云端</span>' : '') +
          coverHtml(c.cover, c.has_cover, c.label, "还没设封面") +
        '</div>' +
        '<div class="meta"><div class="name">'+esc(c.label)+'</div>' +
        (c.summary ? '<div class="desc">'+esc(c.summary)+'</div>' : '') +
        '</div>' +
        '<button class="go">出图</button>';
      // 只有点「出图」按钮才弹窗；卡片本体可点击查看、也可只滑动不误触
      el.querySelector(".go").addEventListener("click", function(ev){
        ev.stopPropagation();
        openDlg("channel", c.id, c.label, c.summary);
      });
      g.appendChild(el);
    });
  }

  // 我的预设（已下线，2026-11-25）：整块注释。渲染逻辑留着是为了将来要恢复
  // 时不用重写——它依赖的 j.presets 后端还在返回。
  /*
  function renderPresets(list){
    var g = $("presetGrid"); g.innerHTML = "";
    if(!list || !list.length){
      g.innerHTML = '<div class="empty">还没有存过预设。<br><b>在 QQ 里玩「随心配」出图后，发 /存预设 名字 就能存。</b></div>';
      return;
    }
    list.forEach(function(p){
      var el = document.createElement("div");
      el.className = "card";
      var sub = p.n_model + " 底模 · " + p.n_lora + " LoRA" + (p.seed!=null ? " · seed "+p.seed : "");
      el.innerHTML =
        '<div class="thumb">' + coverHtml(p.cover, p.has_cover, p.name, "还没封面") + '</div>' +
        '<div class="meta"><div class="name">'+esc(p.name)+'</div>' +
        '<div class="desc">'+esc(sub)+'</div></div>' +
        '<button class="go">出图</button>';
      el.querySelector(".go").addEventListener("click", function(ev){
        ev.stopPropagation();
        openDlg("preset", p.name, p.name, sub);
      });
      g.appendChild(el);
    });
  }
  */

  // ── Tab 切换 ──────────────────────────────
  document.querySelectorAll(".tab").forEach(function(b){
    b.addEventListener("click", function(){
      document.querySelectorAll(".tab").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      curTab = b.getAttribute("data-tab");
      $("channelGrid").classList.toggle("hidden", curTab !== "channel");
      // 我的预设那格已注释掉，这里不再 toggle presetGrid。
      $("batchPanel").classList.toggle("hidden", curTab !== "batch");
      if(curTab === "batch") buildSlots();
    });
  });

  // ─── 连续多图 ────────────────────────────────
  // 两个玩法：
  //   same（一图多风）：一张参考图 + 一份需求 + 最多 5 个渠道，参考图只反推一次
  //   each（五图各画）：最多 5 张图，每张自己选渠道，没有提示词框
  // 渠道选择存 localStorage（用户要求），键里带令牌前缀——换个令牌（换个会话）
  // 就是另一套选择，不会把 A 会话的偏好带进 B 会话。
  var bMode = "same";
  var bSlots = [];       // [{img:"", skill:"", done:false}]
  var bBusy = false;
  var bBid = "";
  var bTimer = null;
  var LSKEY = "runbench.batch.v1:" + (K ? K.slice(-12) : "anon");

  function loadPref(){
    try{ var o = JSON.parse(localStorage.getItem(LSKEY) || "{}"); return (o && typeof o === "object") ? o : {}; }
    catch(_){ return {}; }
  }
  function savePref(){
    try{
      localStorage.setItem(LSKEY, JSON.stringify({
        mode: bMode,
        skills: bSlots.map(function(s){ return s.skill || ""; })
      }));
    }catch(_){ /* 隐私模式下 localStorage 会抛，忽略即可 */ }
  }

  function chanOptions(cur){
    var opts = ['<option value="">选渠道</option>'];
    (allChannels || []).forEach(function(c){
      opts.push('<option value="'+esc(c.id)+'"'+(c.id===cur?' selected':'')+'>'
        + esc(c.label) + '</option>');
    });
    return opts.join("");
  }

  // 渠道是否被别的格子占用 → 恒 false（2026-11-26 用户拍板「抽卡」全放开）。
  // 同一个提示词或同一张图连跑 5 次同一渠道、种子各不同，是明确需求，三种玩法
  // 一律放行。保留这个函数只是因为置灰 / change 兜底都调它；永不置灰、永不拦。
  function usedBy(skill, idx){
    return false;
  }

  function slotCount(){ return 5; }

  function buildSlots(){
    var pref = loadPref();
    if(!bSlots.length){
      for(var i=0;i<slotCount();i++){
        bSlots.push({ img:"", skill:"", done:false });
      }
      // 一图多风的第一个格子默认 silver（用户要求），其余留空
      if(bMode === "same") bSlots[0].skill = "silver";
      // 五图各画：格子各自的渠道从 localStorage 恢复
      var saved = pref.skills || [];
      if(bMode === "each"){
        for(var j=0;j<bSlots.length;j++){
          if(saved[j]) bSlots[j].skill = saved[j];
        }
      }
    }
    renderSlots();
  }

  function renderSlots(){
    var host = $("slots");
    // 一图多风只有一个参考图位置：把图片格收敛成一个，其余格子只留渠道。
    // 文生图五连根本没有图（纯提示词），一个图片格都不画。
    var showPic = (bMode === "each");
    host.innerHTML = "";
    bSlots.forEach(function(s, i){
      var el = document.createElement("div");
      el.className = "slot" + (showPic ? "" : " full") + (s.img ? " has" : "")
                   + (s.done ? " done" : "");
      var pic = "";
      if(showPic || (bMode === "same" && i === 0)){
        pic = '<div class="pic" data-i="'+i+'">'
          + '<span class="no">'+(i+1)+'</span>'
          + (s.img ? '<img src="'+s.img+'" alt="">'
                   : '<div class="hint"><b>＋</b>点这里传图</div>')
          + '<button class="x" data-x="'+i+'" title="删掉这张">✕</button>'
          + '<div class="ok">✓</div>'
          + '</div>';
      }
      // 一图多风里第一格（参考图）的渠道也单独选
      el.innerHTML = pic
        + '<div class="sel"><select data-s="'+i+'">'+chanOptions(s.skill)+'</select></div>';
      host.appendChild(el);
    });
    // 选过的渠道在别处置灰（选了也不生效，不如直接禁掉）。
    // ⚠️ 必须跳过**本格自己当前选中的那个值**：禁用一个 select 的当前选中项，
    // 浏览器会直接把 value 清成空——用户看到的是「我刚选的渠道自己变没了」。
    // 本格自己的值由 `bSlots[idx].skill` 决定，不靠 option 的 disabled 表达。
    host.querySelectorAll("select").forEach(function(sel){
      var idx = parseInt(sel.getAttribute("data-s"), 10);
      var mine = bSlots[idx] ? bSlots[idx].skill : "";
      sel.querySelectorAll("option").forEach(function(o){
        if(o.value && o.value !== mine && usedBy(o.value, idx)){
          o.disabled = true;
        }
      });
      // 兜底：把 select 的当前值**显式对齐**到 bSlots。原来只靠 HTML 里的
      // `selected` 属性让浏览器自己选，一旦浏览器那边没认（option 被置灰、
      // 值不在列表里、或者整片重建时机不对），界面停在一个和 bSlots 不一样
      // 的值上——用户看到的就是「点了全部同第一款，一栏都没变」。
      // 这里直接按数据赋值，改了什么就一定显示什么。
      if(mine){
        var opts = sel.querySelectorAll("option"), has = false;
        for(var j=0;j<opts.length;j++){
          if(opts[j].value === mine){ has = true; break; }
        }
        if(has) sel.value = mine;
      }
    });
  }

  $("modeSeg").addEventListener("click", function(e){
    var b = e.target.closest("button[data-mode]");
    if(!b || bBusy) return;
    var m = b.getAttribute("data-mode");
    if(m === bMode) return;
    bMode = m;
    $("modeSeg").querySelectorAll("button").forEach(function(x){
      x.classList.toggle("on", x.getAttribute("data-mode") === m);
    });
    // 切玩法时清掉「已完成」状态和多余的图（一图多风只留第一张）
    bSlots.forEach(function(s){ s.done = false; });
    if(m === "same"){
      for(var i=1;i<bSlots.length;i++) bSlots[i].img = "";
      // 重复渠道照单全跑（2026-11-26「抽卡」）：从「五图各画」切过来时 5 格
      // 全是同一个渠道也保留，那正是「一张图连跑 5 次同渠道」的意思。
      if(!bSlots[0].skill) bSlots[0].skill = "silver";
    } else if(m === "text"){
      // 文生图五连不要图：切过来时把格子里残留的图清掉，免得看着像「上传了
      // 却不发」。渠道保留（用户刚选的不用重选）。
      for(var j=0;j<bSlots.length;j++) bSlots[j].img = "";
    }
    syncModeUI();
    renderSlots();
    savePref();
  });

  function syncModeUI(){
    var same = bMode === "same";
    // 需求框只有文生图五连才有
    $("promptWrap").classList.toggle("hidden", bMode !== "text");
    // 「全部同第一款」只在五图各画 / 文生图五连出现：一图多风本来就要求
    // 各格不同渠道，铺成同一个会立刻被服务端整单拒掉，按钮摆在那儿只会误导。
    $("btnSame").classList.toggle("hidden", same);
    $("bHelp").innerHTML = same
      ? "<b>一张参考图 + 几个渠道</b>：传一张图，选几个渠道就出几张——图只反推一次，不用写需求。每个格子不能用同一个渠道。"
      : (bMode === "text"
        ? "<b>一句话，几家渠道各画一张</b>：写下需求、选渠道，没选渠道的格子直接跳过（选 3 个就跑 3 张）。同一个渠道可以画多张。"
        : "<b>上传几张图就跑几张</b>：每格单独选渠道，不用写需求——直接识图反推出提示词再画。同一个渠道可以画多张。");
    $("bPrompt").placeholder = "写一句你想画的内容，几个渠道各画一张…（必填）";
  }

  // ── 弹框 ──────────────────────────────
  function openDlg(kind, name, label, sub){
    curPick = {kind:kind, name:name, label:label};
    $("dTitle").textContent = label;
    $("dSub").textContent = (kind === "channel"
      ? (sub ? sub + " · " : "") + "写一句中文需求，或传一张图反推提示词，出图自动发回你的 QQ。"
      : (sub ? sub + " · " : "") + "写一句提示词，按这套配方出图。");
    $("dPrompt").value = "";
    resetUp();
    hideOkBar();
    $("mask").classList.add("on");
    $("dPrompt").focus();
  }
  function closeDlg(){
    $("mask").classList.remove("on");
    curPick = null; curImage = "";
  }
  $("dCancel").addEventListener("click", closeDlg);
  $("mask").addEventListener("click", function(e){ if(e.target === $("mask")) closeDlg(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && $("mask").classList.contains("on")) closeDlg();
  });

  // ── 上传图（压缩成缩略图，绝不上传原图） ──
  var UP_LONG = 960;   // 长边压到 960px，原图不出本机
  function resetUp(){
    curImage = "";
    $("upPreview").innerHTML = "＋";
    $("upTxt").innerHTML = "<b>上传一张图（可选）</b><br>上传后会自动反推这张图的提示词，再按你的需求出图";
    $("upRm").classList.remove("on");
  }
  function readAndCompress(file){
    // 读文件 → Canvas 等比压到长边 960px → data URL(JPEG)。原图字节根本不上传。
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight;
      var scale = Math.min(1, UP_LONG / Math.max(w, h));
      var nw = Math.max(1, Math.round(w * scale));
      var nh = Math.max(1, Math.round(h * scale));
      var cv = document.createElement("canvas");
      cv.width = nw; cv.height = nh;
      cv.getContext("2d").drawImage(img, 0, 0, nw, nh);
      URL.revokeObjectURL(url);
      curImage = cv.toDataURL("image/jpeg", 0.85);
      $("upPreview").innerHTML = '<img src="'+curImage+'" alt="预览">';
      $("upTxt").innerHTML = "<b>已选图（缩略图 " + nw + "×" + nh + "）</b><br>会自动反推这张图的提示词";
      $("upRm").classList.add("on");
    };
    img.onerror = function(){ URL.revokeObjectURL(url); showOkBar("这张图读不出来，换一张", false); };
    img.src = url;
  }
  $("upBox").addEventListener("click", function(){ $("upFile").click(); });
  $("upFile").addEventListener("change", function(){
    var f = this.files && this.files[0];
    if(f) readAndCompress(f);
    this.value = "";
  });
  $("upRm").addEventListener("click", function(ev){ ev.stopPropagation(); resetUp(); });

  function showOkBar(html, ok){
    var b = $("okBar");
    b.className = "ok-bar show" + (ok ? "" : " err");
    b.innerHTML = html;
  }
  function hideOkBar(){ $("okBar").className = "ok-bar"; $("okBar").innerHTML = ""; }

  // ── 粘贴按钮（手机上长按选「粘贴」太费劲，点一下直接填） ──
  function fillPrompt(t){
    var ta = $("dPrompt");
    t = (t || "").replace(/^\s+|\s+$/g, "");
    if(!t){ showOkBar("剪贴板里没有文字，先复制一段提示词再来", false); return; }
    var cur = ta.value.replace(/^\s+|\s+$/g, "");
    ta.value = cur ? cur + " " + t : t;     // 框里已有内容就接在后面，不覆盖你写好的
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    hideOkBar();
  }
  $("btnPaste").addEventListener("click", function(){
    if(navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(fillPrompt).catch(function(){
        $("dPrompt").focus();
        showOkBar("浏览器没给剪贴板权限，长按输入框选「粘贴」就行", false);
      });
    } else {
      $("dPrompt").focus();
      showOkBar("这个浏览器不支持一键粘贴，长按输入框选「粘贴」就行", false);
    }
  });

  // ── 出图 ──────────────────────────────
  $("dGo").addEventListener("click", function(){
    if(busy || !curPick) return;
    var prompt = $("dPrompt").value.trim();
    if(!prompt && !curImage){ showOkBar("先写一句想画的内容，或传一张图", false); return; }
    busy = true; $("dGo").disabled = true;
    hideOkBar();
    fetch("/api/runbench/gen", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({k:K, kind:curPick.kind, name:curPick.name,
                           prompt:prompt, image:curImage})
    })
      .then(function(r){ return asJson(r, "提交没成功，请再点一次"); })
      .then(function(j){
        if(!j.ok) throw new Error(j.error || "提交失败");
        // 弹窗内绿色提示条：已成功提交，等一下自动发到 QQ
        showOkBar("<b>✅ 已成功提交</b> 等一下就会自动发到你的 QQ（私聊收原图、群里直接出图）。可以关掉这个弹窗，不用守着。", true);
        $("dGo").disabled = false; busy = false;
      })
      .catch(function(e){
        showOkBar("<b>出图失败：</b>" + e.message, false);
        busy=false; $("dGo").disabled=false;
      });
  });

  // ── 批量：格子交互 ─────────────────────────
  // 用事件委托挂在容器上：格子会被 renderSlots 整片重建，逐个绑会漏。
  var bPickIdx = -1;
  $("slots").addEventListener("click", function(e){
    var x = e.target.closest("[data-x]");
    if(x){                       // 右上角小叉：点它才删（用户明确要求）
      e.stopPropagation();
      var xi = parseInt(x.getAttribute("data-x"), 10);
      bSlots[xi].img = ""; bSlots[xi].done = false;
      renderSlots();
      return;
    }
    var p = e.target.closest(".pic");
    if(p && !bBusy){
      bPickIdx = parseInt(p.getAttribute("data-i"), 10);
      $("bFile").click();
    }
  });
  $("slots").addEventListener("change", function(e){
    var sel = e.target.closest("select[data-s]");
    if(!sel) return;
    var idx = parseInt(sel.getAttribute("data-s"), 10);
    var v = sel.value;
    if(v && usedBy(v, idx)){
      // 理论上选不到（已置灰），兜底再挡一次
      setBStatus("「" + v + "」已经被别的格子用过了，换一个", true);
      renderSlots();
      return;
    }
    bSlots[idx].skill = v;
    savePref();
    renderSlots();      // 重画一遍：把新占用的渠道在别处置灰
  });

  // 传图：压成缩略图（长边 960），原图不出本机
  var bImgCache = [];   // 复用一个 Image 对象，避免连传 5 张时堆积
  $("bFile").addEventListener("change", function(){
    var f = this.files && this.files[0];
    this.value = "";
    if(!f || bPickIdx < 0) return;
    var idx = bPickIdx;
    var img = new Image();
    var url = URL.createObjectURL(f);
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight;
      var scale = Math.min(1, UP_LONG / Math.max(w, h));
      var nw = Math.max(1, Math.round(w * scale));
      var nh = Math.max(1, Math.round(h * scale));
      var cv = document.createElement("canvas");
      cv.width = nw; cv.height = nh;
      cv.getContext("2d").drawImage(img, 0, 0, nw, nh);
      URL.revokeObjectURL(url);
      bSlots[idx].img = cv.toDataURL("image/jpeg", 0.85);
      bSlots[idx].done = false;
      renderSlots();
      setBStatus("");
    };
    img.onerror = function(){
      URL.revokeObjectURL(url);
      setBStatus("这张图读不出来，换一张", true);
    };
    img.src = url;
  });

  // 全部同第一款：把第一格的渠道铺到其余所有格子。
  // 「全部同第一款」在五图各画 / 文生图五连里出现（一图多风那边整条按钮是
  // 隐藏的），这两个玩法里重复渠道合法，所以就是一路铺满。
  //
  // 2026-11-25 修：原来开头一句 `if(bBusy || bMode !== "each") return;` 是**静默
  // 返回**——条件不成立就什么都不做、也不吭声，用户在界面上看到的就是「点了
  // 没反应，也没有提示」。现在每种没铺成的情况都说话；**铺成功必须弹一个明显
  // 的提示**（用户原话：「必须弹出来这样一个提示，已全部同第一款」），而不是
  // 只在状态行里飘一行小字。
  $("btnSame").addEventListener("click", function(){
    if(bBusy){ setBStatus("这批还在跑，等它跑完再铺", true); return; }
    if(bMode === "same"){
      setBStatus("「全部同第一款」只在「五图各画」「文生图五连」里用，先切过去", true);
      return;
    }
    var first = bSlots[0].skill;
    if(!first){ setBStatus("先把第一格的渠道选了，再铺", true); return; }
    var n = 0;
    for(var i=1;i<bSlots.length;i++){
      if(bSlots[i].skill === first) continue;   // 已经是这个渠道就不算改动
      bSlots[i].skill = first;
      n++;
    }
    var label = chanLabel(first);
    setBStatus("✅ 已全部同第一款：全部 " + bSlots.length + " 格都是「"
               + label + "」（刚改了 " + n + " 格）");
    savePref();
    renderSlots();
    // 状态行之外再弹一个，保证「点了没反应」这种情况彻底消失。
    flashTip(n
      ? "已全部同第一款<br>全部 " + bSlots.length + " 格都改成「" + label + "」（改了 " + n + " 格）"
      : "全部 " + bSlots.length + " 格已经是「" + label + "」了");
  });

  function chanLabel(id){
    for(var i=0;i<(allChannels||[]).length;i++){
      if(allChannels[i].id === id) return allChannels[i].label;
    }
    return id;
  }

  // 一闪而过的居中提示条（不是 alert，不挡操作，1.6 秒自动消失）。
  var tipTimer = null;
  function flashTip(html){
    var el = $("flashTip");
    if(!el) return;
    el.innerHTML = html;
    el.classList.add("on");
    if(tipTimer) clearTimeout(tipTimer);
    tipTimer = setTimeout(function(){ el.classList.remove("on"); }, 1600);
  }

  function setBStatus(msg, isErr){
    var el = $("bStatus");
    el.className = "bstatus" + (isErr ? " err" : "");
    el.innerHTML = msg || "";
  }

  // 一图多风的粘贴按钮（跟单图那个同口径，手机上长按选粘贴太费劲）
  $("btnPasteB").addEventListener("click", function(){
    var ta = $("bPrompt");
    function fill(t){
      t = (t || "").replace(/^\s+|\s+$/g, "");
      if(!t){ setBStatus("剪贴板里没有文字", true); return; }
      ta.value = ta.value ? (ta.value.trim() + " " + t) : t;
      setBStatus("");
    }
    if(navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(fill).catch(function(){
        ta.focus(); setBStatus("浏览器没给剪贴板权限，长按输入框选「粘贴」就行", true);
      });
    } else {
      ta.focus(); setBStatus("这个浏览器不支持一键粘贴，长按输入框选「粘贴」就行", true);
    }
  });

  // ── 一键开跑 ───────────────────────────────
  // **一个接口收整单**（不让前端 for 循环发 5 次）：服务端串行识图、识完一张
  // 立刻入队一张，全部入队后发一条合并回执。这里拿到批次号就能退出——
  // 绿勾只是进度提示，不是「必须留在这儿」的门槛。
  $("btnBatchGo").addEventListener("click", function(){
    if(bBusy) return;
    var prompt = $("bPrompt").value.trim();
    var items = [];
    if(bMode === "same"){
      if(!bSlots[0].img){ setBStatus("先传一张参考图", true); return; }
      // 一图多风**没有需求框**（用户 2026-11-25 删掉）：这个玩法就是「反推
      // 这张图，跑 5 个不同渠道」，出图全靠反推出来的提示词。
      // 参考图**只发一份**（挂在第一项上），服务端负责铺给所有渠道。发 5 份
      // 同样的 data URL 会让请求体白白翻 5 倍，手机上更明显。
      var ref = bSlots[0].img;
      bSlots.forEach(function(s, i){
        if(s.skill) items.push({ skill:s.skill, image: i === 0 ? ref : "" });
      });
      if(!items.length){ setBStatus("至少选一个渠道", true); return; }
      if(!items[0].image){        // 第一格没选渠道时，把参考图挪到第一个有效项
        items[0].image = ref;
      }
    } else if(bMode === "text"){
      // 文生图五连：没有图可反推，所以提示词必填。没选渠道的格子直接跳过
      // （选 3 个就跑 3 张，选 2 个就跑 2 张）。
      if(!prompt){ setBStatus("写一句提示词再开跑", true); $("bPrompt").focus(); return; }
      bSlots.forEach(function(s){
        if(s.skill) items.push({ skill:s.skill, image:"" });
      });
      if(!items.length){ setBStatus("至少选一个渠道", true); return; }
    } else {
      bSlots.forEach(function(s){
        if(s.img) items.push({ skill:s.skill, image:s.img });
      });
      if(!items.length){ setBStatus("先上传图片", true); return; }
      var noSkill = items.filter(function(x){ return !x.skill; });
      if(noSkill.length){ setBStatus("还有格子没选渠道", true); return; }
    }
    // 重复渠道三种玩法一律放行（2026-11-26「抽卡」）：同一个渠道跑 5 张、
    // 只有种子不同是明确需求，前端不再拦，服务端也不再拦。

    bBusy = true;
    $("btnBatchGo").disabled = true;
    $("btnBatchGo").textContent = "提交中…";
    bSlots.forEach(function(s){ s.done = false; });
    renderSlots();

    fetch("/api/runbench/gen-many", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ k:K, mode:bMode, prompt:prompt, items:items })
    })
      .then(function(r){ return asJson(r, "提交没成功，请重试"); })
      .then(function(j){
        if(!j.ok) throw new Error(j.error || "提交失败");
        bBid = j.bid;
        setBStatus("已提交 " + j.count + " 张，正在一张张排队，<b>可以退出这个页面</b>。");
        startBatchPoll();
      })
      .catch(function(e){
        setBStatus("提交失败：" + e.message, true);
        bBusy = false; restoreGo();
      });
  });

  function restoreGo(){
    $("btnBatchGo").disabled = false;
    $("btnBatchGo").textContent = "一键开跑";
  }

  // 轮询批次进度：拿到 queued 就照着打绿勾。**这张表只用来显示进度**，
  // 服务端该推的任务在提交那一刻就已经开始推了，关掉页面不影响。
  function startBatchPoll(){
    stopBatchPoll();
    var tries = 0;
    bTimer = setInterval(function(){
      tries++;
      fetch("/api/runbench/batch?k=" + encodeURIComponent(K)
            + "&bid=" + encodeURIComponent(bBid))
        .then(function(r){ return r.json(); })
        .then(function(j){
          if(!j.ok) throw new Error(j.error || "查不到进度");
          var q = j.queued || 0;
          for(var i=0;i<bSlots.length;i++){
            if(i < q) bSlots[i].done = true;
          }
          renderSlots();
          if(j.state === "done"){
            stopBatchPoll();
            setBStatus("✅ " + j.total + " 张都进队列了，画好一张发一张，可以退出。");
            bBusy = false; restoreGo();
          } else if(j.state === "error"){
            stopBatchPoll();
            setBStatus("没跑成：" + (j.error || "再试一次"), true);
            bBusy = false; restoreGo();
          } else if(tries > 120){    // 4 分钟还没完 → 别再轮了
            stopBatchPoll();
            bBusy = false; restoreGo();
          } else {
            setBStatus("已经排上 " + q + " / " + j.total + " 张…可以退出，后台接着跑。");
          }
        })
        .catch(function(){
          if(tries > 8){ stopBatchPoll(); bBusy = false; restoreGo(); }
        });
    }, 2000);
  }
  function stopBatchPoll(){
    if(bTimer){ clearInterval(bTimer); bTimer = null; }
  }

  // ── 初始化 ──────────────────────────────
  fetch("/api/runbench/check?k=" + encodeURIComponent(K))
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j.ok){ say(j.error || "链接无效，回 QQ 再发一次 /跑图台", "err"); return; }
      allChannels = j.channels || [];
      renderChannels(j.channels);
      // renderPresets(j.presets);   // 我的预设已下线（2026-11-25）
      $("cntChannel").textContent = (j.channels||[]).length;
      // $("cntPreset").textContent = (j.presets||[]).length;
      // 连续多图的格子依赖渠道列表，等列表回来再建
      var pref = loadPref();
      if(pref.mode === "each" || pref.mode === "same" || pref.mode === "text") bMode = pref.mode;
      $("modeSeg").querySelectorAll("button").forEach(function(x){
        x.classList.toggle("on", x.getAttribute("data-mode") === bMode);
      });
      syncModeUI();
      if(curTab === "batch") buildSlots();
      say("");
    })
    .catch(function(){ say("连不上服务器，检查网络后刷新", "err"); });
})();
</script>
</body>
</html>
