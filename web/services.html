<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务总控</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%234ade80'/></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --bg-elev: #12121a;
    --bg-input: #1a1a24;
    --border: #2a2a3a;
    --border-soft: #1f1f2e;
    --text: #e8e8f0;
    --text-dim: #8888a0;
    --text-mute: #555570;
    --accent: #7c5cff;
    --success: #4ade80;
    --error: #f87171;
    --warn: #fbbf24;
    --radius: 12px;
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "SF Mono", "JetBrains Mono", "Fira Code", "Consolas", "Microsoft YaHei", monospace;
    font-size: 13px;
    line-height: 1.7;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 48px; }

  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  h1 { font-size: 18px; font-weight: 500; }
  .sub { color: var(--text-mute); font-size: 12px; }
  header .spacer { flex: 1; }
  a.back { color: var(--text-dim); font-size: 13px; text-decoration: none; }
  a.back:hover { color: var(--accent); }

  .toolbar { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .summary { color: var(--text-dim); font-size: 13px; }
  .summary b { font-weight: 500; }
  .summary b.ok { color: var(--success); }
  .summary b.bad { color: var(--error); }
  .toggle { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 12px; cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--accent); cursor: pointer; }
  .refresh-note { color: var(--text-mute); font-size: 12px; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--bg-elev); border: 1px solid var(--border-soft);
    border-radius: var(--radius); padding: 14px 16px;
  }
  .card.dead { border-color: rgba(248, 113, 113, 0.35); }

  .card-head { display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 10px; }
  .dot.ok { background: var(--success); box-shadow: 0 0 6px rgba(74, 222, 128, 0.5); }
  .dot.bad { background: var(--error); }
  .dot.unk { background: var(--text-mute); }
  .name { font-size: 14px; font-weight: 500; }
  .port { color: var(--text-mute); font-size: 12px; border: 1px solid var(--border); border-radius: 6px; padding: 0 6px; }
  .card-head .spacer { flex: 1; }
  .age { color: var(--text-mute); font-size: 12px; }

  .desc { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  .detail { color: var(--text-mute); font-size: 12px; margin-top: 2px; word-break: break-all; }
  .detail.bad { color: var(--error); }

  .logbox { margin-top: 10px; border-top: 1px solid var(--border-soft); padding-top: 8px; }
  .loghead { display: flex; align-items: baseline; gap: 8px; cursor: pointer; user-select: none; }
  .loghead .lbl { color: var(--text-dim); font-size: 12px; }
  .loghead .path { color: var(--text-mute); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; direction: rtl; text-align: left; }
  .loghead .chev { color: var(--text-mute); font-size: 11px; }
  pre.log {
    margin-top: 6px; background: var(--bg-input); border: 1px solid var(--border-soft);
    border-radius: 8px; padding: 8px 10px; font-size: 11.5px; line-height: 1.6;
    color: var(--text-dim); max-height: 84px; overflow: hidden auto; white-space: pre-wrap; word-break: break-all;
    transition: max-height 0.15s;
  }
  .logbox.open pre.log { max-height: 420px; }
  pre.log .err { color: var(--error); }
  pre.log .warn { color: var(--warn); }

  .footer { margin-top: 20px; color: var(--text-mute); font-size: 12px; }
  .banner { background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.35); color: var(--error); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; font-size: 12px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>服务总控</h1>
    <span class="sub">一页看全部常驻服务 · 替代一堆 cmd 窗口</span>
    <span class="spacer"></span>
    <a class="back" href="/">返回首页</a>
  </header>

  <div class="banner" id="banner">接口请求失败——5174 本身可能挂了，那就只能回去看窗口了。</div>

  <div class="toolbar">
    <span class="summary" id="summary">加载中…</span>
    <span class="spacer"></span>
    <label class="toggle"><input type="checkbox" id="autorefresh" checked> 自动刷新（5 秒）</label>
    <span class="refresh-note" id="lastfetch">—</span>
  </div>

  <div class="grid" id="grid"></div>

  <div class="footer">
    日志来源：Agent/适配层/看门狗读项目 logs/ 目录；ComfyUI 读它自己的 user/comfyui_8188.log（路径在 .env 的 COMFYUI_LOG）。
    点卡片日志区可展开/收起。看门狗判据同启动脚本：看 WATCHDOG 窗口在不在。
  </div>
</div>

<script>
(function () {
  var grid = document.getElementById('grid');
  var summary = document.getElementById('summary');
  var banner = document.getElementById('banner');
  var lastfetch = document.getElementById('lastfetch');
  var auto = document.getElementById('autorefresh');
  var openBoxes = {};
  var timer = null;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function ageText(sec) {
    if (sec == null) return '';
    if (sec < 60) return sec + ' 秒前';
    if (sec < 3600) return Math.floor(sec / 60) + ' 分钟前';
    if (sec < 86400) return Math.floor(sec / 3600) + ' 小时前';
    return Math.floor(sec / 86400) + ' 天前';
  }

  function render(data) {
    var svcs = (data && data.services) || [];
    var ok = 0, total = 0;
    var html = '';
    svcs.forEach(function (s) {
      total++;
      var live = s.online === true;
      if (live) ok++;
      var dotCls = live ? 'ok' : (s.online === false ? 'bad' : 'unk');
      var deadCls = s.online === false ? ' dead' : '';
      var log = s.log || {};
      var logOk = log.ok && (log.lines || []).length;
      var boxOpen = openBoxes[s.id] ? ' open' : '';
      var logHtml = '<div class="logbox' + boxOpen + '" data-id="' + esc(s.id) + '">' +
        '<div class="loghead"><span class="lbl">日志</span>' +
        '<span class="path">' + esc(log.path || '（无日志文件）') + '</span>' +
        '<span class="age">' + (log.age == null ? '' : ageText(log.age) + '更新') + '</span>' +
        '<span class="chev">' + (logOk ? '▼' : '') + '</span></div>' +
        (logOk
          ? '<pre class="log">' + esc((log.lines || []).join('\n')) + '</pre>'
          : '<div class="detail" style="margin-top:6px">' +
            (log.path ? '日志文件不存在或读不到' : '该服务无日志文件（输出只在它自己的窗口里）') + '</div>') +
        '</div>';
      html += '<div class="card' + deadCls + '">' +
        '<div class="card-head">' +
        '<span class="dot ' + dotCls + '"></span>' +
        '<span class="name">' + esc(s.name) + '</span>' +
        (s.port ? '<span class="port">:' + esc(s.port) + '</span>' : '') +
        '<span class="spacer"></span>' +
        '<span class="age">' + (live ? (log.age == null ? '' : '日志 ' + ageText(log.age)) : '') + '</span>' +
        '</div>' +
        '<div class="desc">' + esc(s.desc) + '</div>' +
        '<div class="detail' + (live ? '' : ' bad') + '">' + esc(s.detail) + '</div>' +
        logHtml +
        '</div>';
    });
    grid.innerHTML = html;
    summary.innerHTML = '在线 <b class="' + (ok === total ? 'ok' : 'bad') + '">' + ok + '</b> / ' + total +
      (ok === total ? ' · 全部正常' : ' · 有服务掉了');
    lastfetch.textContent = '更新于 ' + new Date().toLocaleTimeString();
  }

  function fetchAll() {
    fetch('/api/services', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { banner.style.display = 'none'; render(d); })
      .catch(function (e) { banner.style.display = 'block'; lastfetch.textContent = '刷新失败 ' + e.message; });
  }

  grid.addEventListener('click', function (e) {
    var head = e.target.closest ? e.target.closest('.loghead') : null;
    if (!head) return;
    var box = head.parentElement;
    var id = box.getAttribute('data-id');
    openBoxes[id] = !openBoxes[id];
    box.classList.toggle('open', openBoxes[id]);
  });

  auto.addEventListener('change', function () {
    if (timer) { clearInterval(timer); timer = null; }
    if (auto.checked) { fetchAll(); timer = setInterval(fetchAll, 5000); }
  });

  fetchAll();
  timer = setInterval(fetchAll, 5000);
})();
</script>
</body>
</html>
