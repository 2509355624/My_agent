<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人设卡池</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%23d4537e'/></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a0f;
    --bg-elev: #12121a;
    --bg-input: #1a1a24;
    --border: #2a2a3a;
    --border-soft: #1f1f2e;
    --text: #e8e8f0;
    --text-dim: #8888a0;
    --text-mute: #555570;
    --accent: #d4537e;
    --ok: #4ade80;
    --err: #f87171;
    --radius: 10px;
  }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.7;
  }
  .wrap { height: 100vh; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    background: var(--bg-elev);
  }
  header h1 { font-size: 15px; font-weight: 500; }
  header .hint { color: var(--text-dim); font-size: 13px; flex: 1; min-width: 240px; }
  button {
    background: var(--bg-input); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger:hover { border-color: var(--err); color: var(--err); }
  #status { font-size: 13px; color: var(--text-dim); min-width: 60px; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }

  /* 默认聊天背景（2026-11-05）：站主在这里换全局默认图；
     每张卡下面还有一块「这张卡的默认背景」，优先级是 账号 > 卡 > 全局。 */
  .bg-global {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    background: var(--bg-elev);
  }
  .bg-thumb {
    width: 120px; height: 68px; flex: none; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg-input);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; color: var(--text-mute); font-size: 12px;
  }
  .bg-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bg-info { flex: 1; min-width: 0; }
  .bg-title { font-size: 13px; color: var(--text); }
  .bg-sub { font-size: 12px; color: var(--text-mute); margin-top: 3px; }
  .bg-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .bg-edit { display: flex; gap: 12px; align-items: flex-start; }
  .bg-edit .bg-thumb { width: 150px; height: 84px; }

  .body { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 260px; flex-shrink: 0; border-right: 1px solid var(--border);
    overflow-y: auto; padding: 12px;
  }
  .card-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: var(--radius); cursor: pointer;
    border: 1px solid transparent; margin-bottom: 6px;
  }
  .card-item:hover { background: var(--bg-elev); }
  .card-item.on { background: var(--bg-elev); border-color: var(--accent); }
  .card-item .av {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    background: var(--bg-input); display: flex; align-items: center;
    justify-content: center; font-size: 16px; overflow: hidden;
  }
  .card-item .av img { width: 100%; height: 100%; object-fit: cover; }
  .card-item .nm { font-size: 14px; }
  .card-item .ds { font-size: 12px; color: var(--text-mute); }
  .card-item .txt { min-width: 0; }
  .card-item .nm, .card-item .ds {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  main { flex: 1; overflow-y: auto; padding: 22px 26px; min-width: 0; }
  .empty { color: var(--text-mute); padding: 40px 0; text-align: center; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  .field .tip { font-size: 12px; color: var(--text-mute); margin-top: 5px; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; background: var(--bg-input); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
    font-family: inherit; font-size: 13px; line-height: 1.7; resize: vertical;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
  }
  textarea.big { min-height: 180px; }
  textarea.mid { min-height: 96px; }
  .row { display: flex; gap: 16px; }
  .row > .field { flex: 1; }
  .foot {
    display: flex; gap: 10px; align-items: center;
    padding-top: 8px; border-top: 1px solid var(--border-soft); margin-top: 8px;
  }
  .foot .spacer { flex: 1; }
  .badge {
    display: inline-block; font-size: 12px; color: var(--text-mute);
    background: var(--bg-input); border-radius: 6px; padding: 2px 8px; margin-right: 6px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>角色扮演管理</h1>
    <div class="hint">
      角色卡的详情文案、默认背景都在这里管理。群里发「<b>#角色扮演</b>」看清单，发「<b>#角色名</b>」让它演那个角色，发「<b>#出戏</b>」变回生图机器人。
    </div>
    <button id="btnNew">＋ 新建</button>
    <button id="btnSave" class="primary">保存</button>
    <span id="status"></span>
  </header>

  <div class="bg-global">
    <div class="bg-thumb" id="bgDefaultThumb">默认</div>
    <div class="bg-info">
      <div class="bg-title">默认聊天背景</div>
      <div class="bg-sub" id="bgDefaultState">读取中…</div>
    </div>
    <div class="bg-actions">
      <button type="button" id="btnBgDefault">上传默认背景</button>
      <button type="button" class="danger" id="btnBgDefaultReset">恢复内置</button>
    </div>
    <input type="file" id="fileBgDefault" accept="image/*"
           hidden onchange="uploadDefaultBg(this)">
  </div>

  <div class="body">
    <aside id="list"></aside>
    <main id="pane"></main>
  </div>
</div>

<script>
// 距离层级的默认叫法（和后端 config/affection_tiers.json 对齐）。
// 卡片可以用「六级的叫法」覆盖，骨科/青梅/同事这类关系直接改名。
const LEVEL_NAMES = ["隔得很远", "点头之交", "说得上话", "说得进心里",
                     "靠得很近", "不分彼此"];
const $ = (id) => document.getElementById(id);
let cards = [];
let cur = -1;
let DEFAULT_BG = { default: null, builtin: null };

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function say(msg, cls) {
  const el = $("status");
  el.textContent = msg || "";
  el.className = cls || "";
  // 失败原因要留够时间看清：以前 3 秒就消失，用户只看到「好像传不上去」。
  if (msg) setTimeout(() => { if (el.textContent === msg) say(""); },
                      cls === "err" ? 8000 : 3000);
}

async function readJson(r) {
  try { return await r.json(); }
  catch (e) {
    return { ok: false,
             error: "服务端返回的不是 JSON（HTTP " + r.status + "）" };
  }
}

async function load() {
  try {
    const r = await fetch("/api/characters");
    const d = await readJson(r);
    if (d.ok === false) throw new Error(d.error || "读卡库失败");
    cards = d.cards || [];
    if (cur >= cards.length) cur = cards.length - 1;
    render();
  } catch (e) {
    say("读卡库失败：" + e, "err");
  }
  loadDefaultBg();
}

// ── 全局默认背景 ──────────────────────────────────────────
// 优先级：账号自己换的 > 这张卡 > 全局默认 > 内置兜底图。
// 这里管的只有「全局默认」这一层；每张卡自己的背景在右边详情里。

async function loadDefaultBg() {
  try {
    const r = await fetch("/api/persona_admin/background/default");
    const d = await readJson(r);
    if (!d.ok) { renderDefaultBg(); return; }
    DEFAULT_BG.default = d.default || null;
    DEFAULT_BG.builtin = d.builtin || null;
    renderDefaultBg();
  } catch (e) {
    $("bgDefaultState").textContent = "读取默认背景失败";
  }
}

function renderDefaultBg() {
  const d = DEFAULT_BG.default || {};
  const b = DEFAULT_BG.builtin || {};
  const box = $("bgDefaultThumb");
  const thumb = d.thumb || d.url || b.thumb || b.url || "";
  box.innerHTML = thumb ? '<img src="' + esc(thumb) + '" alt="">' : "默认";
  const state = $("bgDefaultState");
  if (d.exists) {
    state.textContent = "正在用你上传的默认背景";
    $("btnBgDefaultReset").style.display = "";
  } else {
    $("btnBgDefaultReset").style.display = "none";
    state.textContent = b.exists
      ? "目前是内置兜底图（web/assets/chat_bg_default）"
      : "还没有默认背景：上传一张，或放一张 web/assets/chat_bg_default.jpg";
  }
}

async function uploadDefaultBg(input) {
  const f = input.files && input.files[0];
  input.value = "";
  if (!f) return;
  const fd = new FormData();
  fd.append("file", f);
  try {
    const r = await fetch("/api/persona_admin/background/default", {
      method: "POST", body: fd,
    });
    const d = await readJson(r);
    if (!d.ok) { say(d.error || "上传失败", "err"); return; }
    DEFAULT_BG.default = d.background || {};
    renderDefaultBg();
    say("默认背景已更新", "ok");
  } catch (e) {
    say("上传失败：" + e, "err");
  }
}

async function resetDefaultBg() {
  if (!confirm("删掉上传的默认背景，回到内置兜底图？")) return;
  try {
    const r = await fetch("/api/persona_admin/background/default", {
      method: "DELETE" });
    const d = await readJson(r);
    if (!d.ok) { say(d.error || "恢复失败", "err"); return; }
    DEFAULT_BG.default = d.default || null;
    DEFAULT_BG.builtin = d.builtin || DEFAULT_BG.builtin;
    renderDefaultBg();
    say("已恢复内置默认", "ok");
  } catch (e) {
    say("恢复失败：" + e, "err");
  }
}

function render() {
  const list = $("list");
  if (!cards.length) {
    list.innerHTML = '<div class="empty">还没有卡</div>';
  } else {
    list.innerHTML = cards.map((c, i) => {
      const av = (c.avatar || "").startsWith("/") || (c.avatar || "").startsWith("http")
        ? '<img src="' + esc(c.avatar) + '" alt="">'
        : esc(c.avatar || (c.name || "?").slice(0, 1));
      const sub = c.description || c.personality || "";
      return '<div class="card-item' + (i === cur ? " on" : "") + '" onclick="pick(' + i + ')">'
        + '<div class="av">' + av + '</div>'
        + '<div class="txt"><div class="nm">' + esc(c.name || "(无名)") + (c.hidden ? '　<em style="font-style:normal;font-size:11px;opacity:.65">[已下架]</em>' : '') + '</div>'
        + '<div class="ds">' + esc(sub) + '</div></div></div>';
    }).join("");
  }
  renderPane();
}

function renderPane() {
  const pane = $("pane");
  if (cur < 0 || !cards[cur]) {
    pane.innerHTML = '<div class="empty">左边选一张卡，或者新建一张</div>';
    return;
  }
  const c = cards[cur];
  const bg = c.background || {};
  const bgThumb = (bg.exists && (bg.thumb || bg.url))
    ? '<img src="' + esc(bg.thumb || bg.url) + '" alt="">'
    : '<span>' + (c.id ? "这张卡没设背景" : "先保存这张卡") + '</span>';
  const bgText = bg.exists
    ? "正在用这张卡的背景"
    : (c.id ? "这张卡没有单独背景，会用上面的全局默认" : "新卡先保存，拿到 id 后才能传背景");
  pane.innerHTML = `
    <div class="row">
      <div class="field">
        <label>名字（群里就发 #这个名字）</label>
        <input type="text" id="f_name" value="${esc(c.name)}">
      </div>
      <div class="field" style="max-width:170px">
        <label>头像（emoji 或图片地址）</label>
        <input type="text" id="f_avatar" value="${esc(c.avatar)}">
      </div>
    </div>
    <div class="field">
      <label>一句话说明（列清单时给它配这行）</label>
      <input type="text" id="f_desc" value="${esc(c.description)}">
    </div>
    <div class="field">
      <label>性格标签（只是给卡池页看的，不参与对话）</label>
      <input type="text" id="f_personality" value="${esc(c.personality)}">
    </div>
    <div class="field">
      <label>人设正文</label>
      <textarea class="big" id="f_system">${esc(c.systemPrompt)}</textarea>
      <div class="tip">这一段就是它的身份、性格和说话方式——扮演态的系统提示词里只有这个，没有别的规矩。</div>
    </div>
    <div class="field">
      <label>外观固定块（英文自然语言，一句）</label>
      <textarea class="mid" id="f_appearance">${esc(c.appearancePrompt)}</textarea>
      <div class="tip">发色 / 发型 / 瞳色 / 体型这类不变的特征，写成**一句连贯英文**，以 <code>an adult woman with …</code> 开头。<br>
        例：<code>an adult woman with waist-length silver hair in twin tails, clear blue eyes, pale skin and a slim adult build</code><br>
        不要写标签串（<code>1girl, solo, silver hair</code>）、质量词（<code>masterpiece, best quality</code>）、<code>sfw</code> 或权重语法（<code>(tag:1.2)</code>）——漫画编剧读的是自然语言，标签串会被原样塞进画面描述，出来的是「the masterpiece, best quality, 1girl …」这种句子。动作 / 场景 / 表情由角色按剧情写，这里只写不变的特征。</div>
    </div>
    <div class="field">
      <label>服饰（英文自然语言，可留空）</label>
      <textarea class="mid" id="f_outfit">${esc(c.outfitPrompt)}</textarea>
      <div class="tip">常服装扮，同样用自然语言写（<code>a loose white shirt and grey shorts</code>）。跟外观固定块一起拼进画面；留空就只按外观固定块画。</div>
    </div>
    <div class="field">
      <label>房间与私物（可留空，中文）</label>
      <textarea class="mid" id="f_room">${esc(c.room || "")}</textarea>
      <div class="tip">她房间里有什么、藏了什么。只在**你离开她视线、进她房间**时当素材用（比如：书桌、没关严的抽屉、衣柜里没拆标的泳衣、压在枕头下的速写本）。留空就由她按人设临场编，只是每次可能不一样。</div>
    </div>
    <div class="field">
      <label>状态下的她（四段自由文本，可留空）</label>
      <div class="tip" style="margin-bottom:6px">给编剧 AI 看的：数值高了之后她会怎么变。**不是阈值**，不要写「到 80 就怎样」，写她的表现。留空就让编剧按性格临场推。</div>
      <div style="display:grid;gap:6px">
        <textarea class="mid" id="f_sb_submit" placeholder="屈服高时：嘴上不再顶，但会用沉默/眼神保留自尊……">${esc((c.stateBehavior || {}).submit || "")}</textarea>
        <textarea class="mid" id="f_sb_corrupt" placeholder="堕落高时：开始给自己找理由，但被提到某件事会突然停住……">${esc((c.stateBehavior || {}).corrupt || "")}</textarea>
        <textarea class="mid" id="f_sb_affection" placeholder="好感高时：主动但不承认，用别扭的方式关心……">${esc((c.stateBehavior || {}).affection || "")}</textarea>
        <textarea class="mid" id="f_sb_suspicion" placeholder="戒备高时：笑着套话，回答很圆，不把真话放表面……">${esc((c.stateBehavior || {}).suspicion || "")}</textarea>
      </div>
    </div>
    <div class="field">
      <label>攻略起点（可留空）</label>
      <div style="display:flex;gap:10px;align-items:center">
        <select id="f_start_level" style="flex:1">
          ${[0, 1, 2, 3, 4, 5].map(i =>
            `<option value="${i}" ${(c.start_level | 0) === i ? "selected" : ""}>第 ${i} 级 · ${LEVEL_NAMES[i]}</option>`
          ).join("")}
        </select>
        <input type="number" id="f_start_value" min="-50" max="50"
               placeholder="初始好感" style="width:120px"
               value="${c.start_value == null ? "" : esc(c.start_value)}">
      </div>
      <div class="tip">她一开始就在哪一步。留空就是陌生人从第 0 级开始。无血缘妹妹这类可以选第 2 级、初始好感 12——一上来就是「熟」，不用从陌生人重新爬。初始好感留空就卡在这一级的门槛上。</div>
    </div>
    <div class="field">
      <label>六级的叫法（可留空，逗号分隔）</label>
      <input type="text" id="f_level_names"
             placeholder="妹妹,依赖你的妹妹,会跟你撒娇的妹妹,只对你这样的妹妹"
             value="${esc((c.level_names || []).join(","))}">
      <div class="tip">覆盖默认的「${LEVEL_NAMES.join(" / ")}」。填几个算几个，没填的用默认名。骨科、青梅、同事这类关系直接在这里改叫法。</div>
    </div>
    <div class="field">
      <label>参考图（可留空）</label>
      <input type="text" id="f_ref" value="${esc(c.referenceImage)}">
    </div>
    <div class="field">
      <label style="display:flex;gap:8px;align-items:center;cursor:pointer">
        <input type="checkbox" id="f_hidden" ${(c.hidden ? "checked" : "")} style="width:16px;height:16px">
        <span>暂下架（不在选人列表和 QQ 名单出现；卡和数据都保留，取消勾选即恢复）</span>
      </label>
    </div>
    <div class="field">
      <label style="display:flex;gap:8px;align-items:center;cursor:pointer">
        <input type="checkbox" id="f_preg" ${(c.pregnancyEnabled === false ? "" : "checked")} style="width:16px;height:16px">
        <span>启用怀孕玩法（仅成年角色）</span>
      </label>
      <div class="tip">默认开启。关掉后这条线不会记录内射，也不会有怀孕/孩子状态；新增非成年角色或不想玩这条线的卡，取消勾选。</div>
    </div>
    <div class="field">
      <label>这张卡的默认聊天背景（留空就用上面的全局默认）</label>
      <div class="bg-edit">
        <div class="bg-thumb">${bgThumb}</div>
        <div style="flex:1;min-width:0">
          <div class="tip" style="margin:0 0 8px">${bgText}</div>
          <div class="bg-actions">
            ${c.id ? '<button type="button" onclick="pickCardBg()">上传这张卡的背景</button>' : ""}
            ${bg.exists ? '<button type="button" class="danger" onclick="clearCardBg()">清除</button>' : ""}
          </div>
          <input type="file" id="f_bg_file" accept="image/*"
                 hidden onchange="uploadCardBg(this)">
        </div>
      </div>
      <div class="tip">优先级：账号自己设的 &gt; 这张卡 &gt; 全局默认 &gt; 内置图。上传后马上生效，不用点保存；游客只看得到卡和全局这两层。</div>
    </div>
    <div class="foot">
      <span class="badge">id: ${esc(c.id || "待生成")}</span>
      <span class="spacer"></span>
      <button class="danger" onclick="del()">删除这张卡</button>
    </div>`;
}

function collect() {
  if (cur < 0 || !cards[cur]) return;
  const c = cards[cur];
  c.name = $("f_name").value.trim();
  c.avatar = $("f_avatar").value.trim();
  c.description = $("f_desc").value.trim();
  c.personality = $("f_personality").value.trim();
  c.systemPrompt = $("f_system").value.trim();
  c.appearancePrompt = $("f_appearance").value.trim();
  c.outfitPrompt = $("f_outfit").value.trim();
  c.room = $("f_room").value.trim();
  c.stateBehavior = {
    submit: $("f_sb_submit").value.trim(),
    corrupt: $("f_sb_corrupt").value.trim(),
    affection: $("f_sb_affection").value.trim(),
    suspicion: $("f_sb_suspicion").value.trim(),
  };
  c.start_level = parseInt($("f_start_level").value, 10) || 0;
  const sv = $("f_start_value").value.trim();
  // 留空要传 null（不是 0）——后端靠 null 判断「没填，卡在这一级门槛上」
  c.start_value = sv === "" ? null : Math.max(-50, Math.min(50, parseInt(sv, 10) || 0));
  c.level_names = $("f_level_names").value.split(",").map(x => x.trim()).filter(Boolean);
  c.referenceImage = $("f_ref").value.trim();
  c.hidden = $("f_hidden").checked;
  c.pregnancyEnabled = $("f_preg").checked;
}

function pick(i) {
  collect();
  cur = i;
  render();
}

function add() {
  collect();
  cards.push({
    id: "", name: "新角色", description: "", avatar: "",
    personality: "", systemPrompt: "", appearancePrompt: "",
    outfitPrompt: "", room: "", referenceImage: "",
    stateBehavior: { submit: "", corrupt: "", affection: "", suspicion: "" },
    start_level: 0, start_value: null, level_names: [],
    background: { url: "", thumb: "", version: 0, exists: false },
    pregnancyEnabled: true,
  });
  cur = cards.length - 1;
  render();
  $("f_name").focus();
  $("f_name").select();
}

function del() {
  const c = cards[cur];
  if (!c) return;
  if (c.name && !confirm("删掉「" + c.name + "」？正在演它的会话会自动变回生图机器人。")) return;
  cards.splice(cur, 1);
  if (cur >= cards.length) cur = cards.length - 1;
  render();
}

// ── 每张卡的默认背景 ──────────────────────────────────────
// 走管理接口（只给站主）；上传/清除都直接落盘，不经过「保存」。

function pickCardBg() {
  const inp = $("f_bg_file");
  if (inp) inp.click();
}

async function uploadCardBg(input) {
  const f = input.files && input.files[0];
  input.value = "";
  if (!f || cur < 0 || !cards[cur]) return;
  collect();
  const cid = cards[cur].id;
  if (!cid) { say("先保存这张卡（新卡还没有 id）", "err"); return; }
  const fd = new FormData();
  fd.append("file", f);
  try {
    const r = await fetch("/api/persona_admin/background/card/" + encodeURIComponent(cid), {
      method: "POST", body: fd,
    });
    const d = await readJson(r);
    if (!d.ok) { say(d.error || "上传失败", "err"); return; }
    cards[cur].background = d.background || {};
    render();
    say("这张卡的背景已更新", "ok");
  } catch (e) {
    say("上传失败：" + e, "err");
  }
}

async function clearCardBg() {
  if (cur < 0 || !cards[cur]) return;
  collect();
  const cid = cards[cur].id;
  if (!cid) return;
  if (!confirm("清掉这张卡的背景？它会回落到全局默认。")) return;
  try {
    const r = await fetch("/api/persona_admin/background/card/" + encodeURIComponent(cid), {
      method: "DELETE",
    });
    const d = await readJson(r);
    if (!d.ok) { say(d.error || "清除失败", "err"); return; }
    cards[cur].background = d.background || {};
    render();
    say("已清除，回落到全局默认", "ok");
  } catch (e) {
    say("清除失败：" + e, "err");
  }
}

async function save() {
  collect();
  const bad = cards.findIndex((c) => !c.name);
  if (bad >= 0) {
    cur = bad;
    render();
    say("第 " + (bad + 1) + " 张卡还没写名字", "err");
    return;
  }
  try {
    const r = await fetch("/api/characters", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cards }),
    });
    const d = await readJson(r);
    if (!d.ok) { say(d.error || "保存失败", "err"); return; }
    cards = d.cards || [];
    render();
    say("已保存", "ok");
  } catch (e) {
    say("保存失败：" + e, "err");
  }
}

$("btnNew").onclick = add;
$("btnSave").onclick = save;
$("btnBgDefault").onclick = () => $("fileBgDefault").click();
$("btnBgDefaultReset").onclick = resetDefaultBg;
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); }
});
window.addEventListener("beforeunload", collect);
load();
</script>
</body>
</html>
