<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>游客会话 · 只读</title>
<style>
  :root {
    --bg: #0a0a0f; --bg-elev: #12121a; --bg-input: #1a1a24;
    --border: #262633; --text: #e6e6ee; --text-dim: #8b8b9e;
    --accent: #9d7bff; --accent-dim: #2a2140;
    --fs: 15px;            /* 字号基准，A- / A+ 改它 */
    --rs: 8px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: var(--fs)/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }

  /* ── 登录 ─────────────────────────────── */
  #login {
    display: flex; align-items: center; justify-content: center;
    height: 100%; padding: 20px;
  }
  .box {
    width: min(380px, 100%); background: var(--bg-elev);
    border: 1px solid var(--border); border-radius: 14px; padding: 26px 22px;
  }
  .box h1 { font-size: 1.15em; margin: 0 0 6px; }
  .box p { color: var(--text-dim); font-size: .82em; margin: 0 0 18px; line-height: 1.6; }
  .box input {
    width: 100%; padding: 11px 13px; margin-bottom: 10px;
    font: inherit; color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--rs); outline: none;
  }
  .box input:focus { border-color: var(--accent); }
  .box button {
    width: 100%; padding: 11px; margin-top: 4px; font: inherit;
    color: #fff; background: var(--accent); border: 0; border-radius: var(--rs);
    cursor: pointer;
  }
  .box button:disabled { opacity: .5; cursor: default; }
  .box button.ghost {
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--border); margin-top: 8px;
  }
  #msg { min-height: 20px; font-size: .82em; color: #ff8080; margin-top: 10px; }
  #msg.ok { color: #7ee0a8; }

  /* ── 主界面 ───────────────────────────── */
  #app { display: none; height: 100%; flex-direction: column; }
  #app.on { display: flex; }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    background: var(--bg-elev); flex: 0 0 auto;
    padding-top: calc(10px + env(safe-area-inset-top));
  }
  header h1 { font-size: 1em; margin: 0; flex: 1; font-weight: 500; }
  .ibtn {
    background: var(--bg-input); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: var(--rs);
    padding: 6px 10px; font: inherit; font-size: .85em; cursor: pointer;
  }
  .ibtn:active { background: var(--accent-dim); color: var(--accent); }
  #backBtn { display: none; }

  main { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 320px; flex: 0 0 auto; overflow-y: auto;
    border-right: 1px solid var(--border); background: var(--bg);
  }
  section { flex: 1; overflow-y: auto; padding: 16px 18px 60px; }

  /* 会话行 */
  .row {
    padding: 11px 14px; border-bottom: 1px solid #1b1b25;
    cursor: pointer; font-size: .88em;
  }
  .row:active, .row.on { background: var(--bg-input); }
  .row .who { color: var(--accent); }
  .row .meta { color: var(--text-dim); font-size: .82em; margin-top: 2px; }

  /* 消息 */
  .m { margin-bottom: 14px; display: flex; }
  .m.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%; padding: 9px 13px; border-radius: 12px;
    background: var(--bg-elev); border: 1px solid var(--border);
    white-space: pre-wrap; word-break: break-word;
  }
  .m.user .bubble { background: var(--accent-dim); border-color: #3a2d5c; }
  .tag {
    font-size: .72em; color: var(--text-dim); margin-top: 6px;
    border-top: 1px dashed var(--border); padding-top: 5px;
  }
  .empty { color: var(--text-dim); text-align: center; padding: 40px 0; font-size: .9em; }

  /* ── 手机 ─────────────────────────────── */
  @media (max-width: 820px) {
    aside { width: 100%; border-right: 0; }
    section { display: none; padding: 12px 12px 60px; }
    body.detail-on aside { display: none; }
    body.detail-on section { display: block; }
    body.detail-on #backBtn { display: inline-block; }
    .bubble { max-width: 88%; }
  }
</style>
</head>
<body>

<!-- 登录 -->
<div id="login">
  <div class="box">
    <h1>游客会话查看</h1>
    <p>只读。只列出游客会话，不含网页 / 私聊 / 群聊。<br>
       需要管理员 QQ 号，验证码会私聊发给你。</p>
    <input id="qq" inputmode="numeric" autocomplete="username"
           placeholder="管理员 QQ 号">
    <button id="sendBtn">发送验证码</button>
    <input id="code" inputmode="numeric" autocomplete="one-time-code"
           maxlength="6" placeholder="6 位验证码">
    <button id="verifyBtn">登录</button>
    <div id="msg"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="app">
  <header>
    <button class="ibtn" id="backBtn">← 列表</button>
    <h1 id="title">游客会话</h1>
    <button class="ibtn" id="fsDown" title="字号变小">A−</button>
    <button class="ibtn" id="fsUp" title="字号变大">A+</button>
    <button class="ibtn" id="logoutBtn">退出</button>
  </header>
  <main>
    <aside id="list"><div class="empty">加载中…</div></aside>
    <section id="detail"><div class="empty">左边选一条会话</div></section>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const FS_KEY = "gv_fs";
let CUR = "";            // 当前打开的 key
let ROWS = [];

// ── 字号 ──────────────────────────────
function applyFs(px) {
  px = Math.max(12, Math.min(22, px));
  document.documentElement.style.setProperty("--fs", px + "px");
  try { localStorage.setItem(FS_KEY, px); } catch (e) {}
  return px;
}
function curFs() {
  try { return parseInt(localStorage.getItem(FS_KEY), 10) || 15; }
  catch (e) { return 15; }
}
$("fsDown").onclick = () => applyFs(curFs() - 1);
$("fsUp").onclick = () => applyFs(curFs() + 1);

// ── 登录 ──────────────────────────────
function say(t, ok) {
  const m = $("msg");
  m.textContent = t || "";
  m.className = ok ? "ok" : "";
}
async function post(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(d.error || d.message || ("HTTP " + r.status));
  return d;
}
$("sendBtn").onclick = async () => {
  const qq = ($("qq").value || "").trim();
  if (!/^\d{5,12}$/.test(qq)) return say("QQ 号格式不对");
  $("sendBtn").disabled = true;
  say("");
  try {
    const d = await post("/gv/send", { qq });
    say(d.message || "验证码已发送，注意 QQ 私聊", true);
    $("code").focus();
  } catch (e) {
    say(e.message || "发送失败");
  } finally {
    setTimeout(() => { $("sendBtn").disabled = false; }, 3000);
  }
};
$("verifyBtn").onclick = async () => {
  const qq = ($("qq").value || "").trim();
  const code = ($("code").value || "").trim();
  if (!qq || !code) return say("QQ 和验证码都要填");
  say("");
  try {
    await post("/gv/verify", { qq, code });
    enterApp();
  } catch (e) {
    say(e.message || "验证失败");
  }
};
$("code").addEventListener("keydown", e => {
  if (e.key === "Enter") $("verifyBtn").click();
});

$("logoutBtn").onclick = async () => {
  try { await post("/logout", {}); } catch (e) {}
  location.reload();
};

// ── 列表 ──────────────────────────────
function fmt(sec) {
  if (!sec) return "";
  const d = new Date(sec * 1000);
  const p = n => String(n).padStart(2, "0");
  return (d.getMonth() + 1) + "-" + p(d.getDate()) + " " +
         p(d.getHours()) + ":" + p(d.getMinutes());
}
async function loadList() {
  const box = $("list");
  box.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const r = await fetch("/gv/list");
    if (r.status === 401) { location.reload(); return; }
    const d = await r.json();
    ROWS = d.sessions || [];
    if (!ROWS.length) {
      box.innerHTML = '<div class="empty">还没有游客会话</div>';
      return;
    }
    box.innerHTML = "";
    ROWS.forEach(s => {
      const el = document.createElement("div");
      el.className = "row";
      el.dataset.key = s.key;
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = s.label || ("游客 " + String(s.key).slice(0, 8));
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = [s.card, (s.turns || 0) + " 轮", fmt(s.mtime)]
        .filter(Boolean).join(" · ");
      el.appendChild(who);
      el.appendChild(meta);
      el.onclick = () => openRow(s.key, el);
      box.appendChild(el);
    });
  } catch (e) {
    box.innerHTML = '<div class="empty">读不到：' + e.message + "</div>";
  }
}

// ── 详情 ──────────────────────────────
async function openRow(key, el) {
  CUR = key;
  document.querySelectorAll(".row.on").forEach(x => x.classList.remove("on"));
  if (el) el.classList.add("on");
  document.body.classList.add("detail-on");
  const box = $("detail");
  box.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const r = await fetch("/gv/detail?key=" + encodeURIComponent(key));
    if (r.status === 401) { location.reload(); return; }
    const d = await r.json();
    if (!d.ok) {
      box.innerHTML = '<div class="empty">' + (d.error || "读不到") + "</div>";
      return;
    }
    box.innerHTML = "";
    (d.messages || []).forEach(m => {
      const wrap = document.createElement("div");
      wrap.className = "m " + (m.role === "user" ? "user" : "ai");
      const b = document.createElement("div");
      b.className = "bubble";
      b.textContent = m.text || "";
      if (m.role === "assistant" && (m.mood || m.state)) {
        const t = document.createElement("div");
        t.className = "tag";
        t.textContent = [m.mood ? (m.mood + " " + (m.intensity || "")) : "",
                         m.state || ""].filter(Boolean).join(" · ");
        b.appendChild(t);
      }
      wrap.appendChild(b);
      box.appendChild(wrap);
    });
    if (!(d.messages || []).length)
      box.innerHTML = '<div class="empty">这条会话没有记录</div>';
    box.scrollTop = 0;
  } catch (e) {
    box.innerHTML = '<div class="empty">读不到：' + e.message + "</div>";
  }
}
$("backBtn").onclick = () => {
  document.body.classList.remove("detail-on");
  $("title").textContent = "游客会话";
};

// ── 启动 ──────────────────────────────
async function enterApp() {
  $("login").style.display = "none";
  $("app").classList.add("on");
  applyFs(curFs());
  await loadList();
}
(async function init() {
  applyFs(curFs());
  try {
    const r = await fetch("/gv/me");
    const d = await r.json();
    if (d.admin) return enterApp();
  } catch (e) {}
  $("login").style.display = "flex";
})();
</script>
</body>
</html>
