<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>游客会话 · 只读</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0f; --bg-elev: #12121a; --bg-input: #1a1a24;
    --border: #262633; --text: #e6e6ee; --text-dim: #8b8b9e;
    --text-mute: #5c5c70;
    --accent: #9d7bff; --accent-dim: #2a2140;
    --fs: 15px;
    --rs: 10px;
    --drawer-w: min(84vw, 330px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: var(--fs)/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  button { font: inherit; }

  /* ── 登录 ─────────────────────────────── */
  #login { display: flex; align-items: center; justify-content: center;
           height: 100%; padding: 20px; }
  .box { width: min(380px, 100%); background: var(--bg-elev);
         border: 1px solid var(--border); border-radius: 16px; padding: 26px 22px; }
  .box h1 { font-size: 1.12em; margin: 0 0 6px; letter-spacing: .02em; }
  .box p { color: var(--text-dim); font-size: .8em; margin: 0 0 18px; line-height: 1.65; }
  .box input { width: 100%; padding: 12px 13px; margin-bottom: 10px;
    font: inherit; color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--rs); outline: none; }
  .box input:focus { border-color: var(--accent); }
  .box button { width: 100%; padding: 12px; margin-top: 2px; color: #fff;
    background: var(--accent); border: 0; border-radius: var(--rs); cursor: pointer; }
  .box button:disabled { opacity: .45; }
  #msg { min-height: 18px; font-size: .8em; color: #ff8a8a; margin-top: 10px; }
  #msg.ok { color: #7ee0a8; }

  /* ── 框架 ─────────────────────────────── */
  #app { display: none; height: 100%; flex-direction: column; }
  #app.on { display: flex; }

  header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; padding-top: calc(8px + env(safe-area-inset-top));
    background: rgba(18,18,26,.92); border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px); z-index: 30;
  }
  header h1 { flex: 1; margin: 0; font-size: .95em; font-weight: 500;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ibtn { background: transparent; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 9px; font-size: .82em; cursor: pointer; }
  .ibtn:active { background: var(--accent-dim); color: var(--accent); }
  #menuBtn { display: none; font-size: 1em; padding: 5px 10px; }

  main { flex: 1; display: flex; min-height: 0; position: relative; }

  /* ── 列表 ─────────────────────────────── */
  aside {
    width: 300px; flex: 0 0 auto; overflow-y: auto;
    border-right: 1px solid var(--border);
    background: var(--bg-elev);
    -webkit-overflow-scrolling: touch;
  }
  .listhead {
    padding: 9px 14px 7px; font-size: .72em; color: var(--text-mute);
    letter-spacing: .06em; text-transform: uppercase;
    position: sticky; top: 0; background: var(--bg-elev); z-index: 2;
  }
  /* 日期筛选：只按「最后活动时间」过滤，不改后端排序 */
  .filters { display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 8px 10px; border-bottom: 1px solid var(--border);
    background: var(--bg-elev); font-size: .78em; }
  .filters label { color: var(--text-dim); }
  .filters input[type="date"] {
    flex: 1; min-width: 118px; padding: 5px 7px; font: inherit;
    color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: 7px; outline: none; }
  .filters input[type="date"]:focus { border-color: var(--accent); }
  .filters .cnt { color: var(--text-mute); white-space: nowrap; }
  .filters .ibtn { padding: 4px 8px; font-size: .9em; }
  .row {
    display: flex; align-items: stretch; gap: 0;
    padding: 12px 14px 12px 12px; cursor: pointer;
    border-bottom: 1px solid #1b1b25; position: relative;
  }
  .row::before {
    content: ""; position: absolute; left: 0; top: 10px; bottom: 10px;
    width: 3px; border-radius: 2px; background: transparent;
  }
  .row.on { background: var(--bg-input); }
  .row.on::before { background: var(--accent); }
  .row:active { background: var(--bg-input); }
  .row .body { flex: 1; min-width: 0; }
  .row .who { font-size: .9em; color: var(--text);
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { font-size: .76em; color: var(--text-dim); margin-top: 3px; }
  .row .n { flex: 0 0 auto; align-self: center; margin-left: 8px;
            font-size: .72em; color: var(--text-mute);
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 20px; padding: 2px 8px; }

  /* ── 详情 ─────────────────────────────── */
  section { flex: 1; overflow-y: auto; padding: 16px 16px 70px;
            -webkit-overflow-scrolling: touch; }
  .m { display: flex; margin-bottom: 13px; }
  .m.user { justify-content: flex-end; }
  .bubble { max-width: 76%; padding: 10px 13px; border-radius: 14px;
    background: var(--bg-elev); border: 1px solid var(--border);
    white-space: pre-wrap; word-break: break-word; }
  .m.user .bubble { background: var(--accent-dim); border-color: #3a2d5c; }
  .tag { font-size: .74em; color: var(--text-dim); margin-top: 7px;
         border-top: 1px dashed var(--border); padding-top: 6px; }
  .empty { color: var(--text-dim); text-align: center; padding: 48px 0; font-size: .88em; }

  /* 详情顶部的小标题（手机上知道在看谁） */
  .dhead { display: none; align-items: center; gap: 8px;
           padding: 0 0 12px; border-bottom: 1px solid var(--border);
           margin-bottom: 14px; }
  .dhead .t { flex: 1; font-size: .86em; color: var(--text-dim); }

  /* 遮罩 */
  #mask { display: none; position: fixed; inset: 0; z-index: 25;
          background: rgba(0,0,0,.55); backdrop-filter: blur(2px); }

  /* ── 手机：抽屉 ─────────────────────────── */
  @media (max-width: 820px) {
    #menuBtn { display: inline-block; }
    aside {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: var(--drawer-w);
      transform: translateX(-102%);
      transition: transform .24s cubic-bezier(.2,.8,.2,1);
      z-index: 26; border-right: 1px solid var(--border);
      padding-top: env(safe-area-inset-top);
      box-shadow: 12px 0 32px rgba(0,0,0,.55);
    }
    body.drawer aside { transform: none; }
    body.drawer #mask { display: block; }
    /* 详情占满 */
    section { display: block; padding: 12px 12px 70px; }
    .dhead { display: flex; }
    .bubble { max-width: 86%; }
    /* 打开详情时收起抽屉 */
    body.detail #menuBtn { display: inline-block; }
  }
</style>
</head>
<body>

<!-- 登录 -->
<div id="login">
  <div class="box">
    <h1>游客会话查看</h1>
    <p>只读。只列出游客会话，不含网页 / 私聊 / 群聊。<br>
       需要管理员 QQ 号，验证码会私聊发给你。</p>
    <input id="qq" inputmode="numeric" autocomplete="username"
           placeholder="管理员 QQ 号">
    <button id="sendBtn">发送验证码</button>
    <input id="code" inputmode="numeric" autocomplete="one-time-code"
           maxlength="6" placeholder="6 位验证码">
    <button id="verifyBtn">登录</button>
    <div id="msg"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="app">
  <header>
    <button class="ibtn" id="menuBtn" aria-label="会话列表">☰</button>
    <h1 id="title">游客会话</h1>
    <button class="ibtn" id="fsDown" title="字号变小">A−</button>
    <button class="ibtn" id="fsUp" title="字号变大">A+</button>
    <button class="ibtn" id="exportBtn" title="把当前会话导出成 Markdown" disabled>导出</button>
    <button class="ibtn" id="logoutBtn">退出</button>
  </header>
  <main>
    <aside id="list">
      <div class="listhead">会话</div>
      <div class="filters">
        <label for="dayFilter">最后活动日</label>
        <input type="date" id="dayFilter" aria-label="按最后活动日期筛选">
        <span class="cnt" id="listCnt"></span>
        <button class="ibtn" id="clearDay" title="清除日期筛选">全部</button>
      </div>
      <div id="rows"><div class="empty">加载中…</div></div>
    </aside>
    <div id="mask"></div>
    <section id="detail">
      <div class="empty">左边选一条会话</div>
    </section>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const FS_KEY = "gv_fs";
let CUR = "";
let ALL = [];            // /gv/list 原始数据，筛选只在这份副本上做
let CUR_D = null;        // 当前打开的 detail，导出时直接复用
let CUR_META = null;     // 列表里那一行的元信息（label / card / turns）

// ── 字号 ──────────────────────────────
function applyFs(px) {
  px = Math.max(12, Math.min(22, px | 0));
  document.documentElement.style.setProperty("--fs", px + "px");
  try { localStorage.setItem(FS_KEY, px); } catch (e) {}
  return px;
}
function curFs() {
  try { return parseInt(localStorage.getItem(FS_KEY), 10) || 15; }
  catch (e) { return 15; }
}
$("fsDown").onclick = () => applyFs(curFs() - 1);
$("fsUp").onclick = () => applyFs(curFs() + 1);

// ── 抽屉 ──────────────────────────────
function openDrawer() { document.body.classList.add("drawer"); }
function closeDrawer() { document.body.classList.remove("drawer"); }
$("menuBtn").onclick = e => {
  e.stopPropagation();
  document.body.classList.contains("drawer") ? closeDrawer() : openDrawer();
};
$("mask").onclick = closeDrawer;

// ── 登录 ──────────────────────────────
function say(t, ok) {
  const m = $("msg");
  m.textContent = t || "";
  m.className = ok ? "ok" : "";
}
async function post(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(d.error || d.message || ("HTTP " + r.status));
  return d;
}
$("sendBtn").onclick = async () => {
  const qq = ($("qq").value || "").trim();
  if (!/^\d{5,12}$/.test(qq)) return say("QQ 号格式不对");
  $("sendBtn").disabled = true;
  say("");
  try {
    const d = await post("/gv/send", { qq });
    say(d.message || "验证码已发送，注意 QQ 私聊", true);
    $("code").focus();
  } catch (e) {
    say(e.message || "发送失败");
  } finally {
    setTimeout(() => { $("sendBtn").disabled = false; }, 3000);
  }
};
$("verifyBtn").onclick = async () => {
  const qq = ($("qq").value || "").trim();
  const code = ($("code").value || "").trim();
  if (!qq || !code) return say("QQ 和验证码都要填");
  say("");
  try {
    await post("/gv/verify", { qq, code });
    enterApp();
  } catch (e) {
    say(e.message || "验证失败");
  }
};
$("code").addEventListener("keydown", e => {
  if (e.key === "Enter") $("verifyBtn").click();
});
$("logoutBtn").onclick = async () => {
  try { await post("/logout", {}); } catch (e) {}
  location.reload();
};

// ── 列表 ──────────────────────────────
function fmt(sec) {
  if (!sec) return "";
  const d = new Date(sec * 1000);
  const p = n => String(n).padStart(2, "0");
  const today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  return (sameDay ? "" : (d.getMonth() + 1) + "-" + p(d.getDate()) + " ") +
         p(d.getHours()) + ":" + p(d.getMinutes());
}
// 本地时区的 YYYY-MM-DD，和 fmt() 口径一致；别用 toISOString（UTC 会差一天）
function dayKey(sec) {
  if (!sec) return "";
  const d = new Date(sec * 1000);
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function renderRows() {
  // #rows 会被整体清空；筛选控件在 .filters 里、标题在 header 里，都不受牵连
  const box = $("rows");
  const day = ($("dayFilter").value || "").trim();
  const rows = day ? ALL.filter(s => dayKey(s.mtime) === day) : ALL;
  $("listCnt").textContent = ALL.length ? (rows.length + " / " + ALL.length) : "";
  box.innerHTML = "";
  if (!rows.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = day ? "这一天没有会话" : "还没有游客会话";
    box.appendChild(e);
    return;
  }
  rows.forEach(s => {
      const el = document.createElement("div");
      el.className = "row";
      el.dataset.key = s.key;
      const body = document.createElement("div");
      body.className = "body";
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = s.label || ("游客 " + String(s.key).slice(0, 8));
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = [s.card, fmt(s.mtime)].filter(Boolean).join(" · ");
      body.appendChild(who);
      body.appendChild(meta);
      const n = document.createElement("div");
      n.className = "n";
      n.textContent = (s.turns || 0) + " 轮";
      el.appendChild(body);
      el.appendChild(n);
      el.onclick = () => openRow(s.key, el, s);
      box.appendChild(el);
    });
}
async function loadList() {
  const box = $("rows");
  box.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const r = await fetch("/gv/list");
    if (r.status === 401) { location.reload(); return; }
    const d = await r.json();
    ALL = d.sessions || [];
    renderRows();
  } catch (e) {
    box.innerHTML = '<div class="empty">读不到：' + e.message + "</div>";
  }
}
$("dayFilter").addEventListener("change", renderRows);
$("clearDay").onclick = () => { $("dayFilter").value = ""; renderRows(); };

// ── 详情 ──────────────────────────────
async function openRow(key, el, meta) {
  CUR = key;
  CUR_D = null;                       // 加载期间不许导出到上一条的陈旧数据
  CUR_META = meta || null;
  $("exportBtn").disabled = true;
  document.querySelectorAll(".row.on").forEach(x => x.classList.remove("on"));
  if (el) el.classList.add("on");
  document.body.classList.add("detail");
  closeDrawer();
  // 标题放 header，不再往 detail 里塞 —— 上一版把 `#dTitle` 写在 detail 内部，
  // 又被 `box.innerHTML = ...` 一起清掉，紧接着读它的 textContent 就炸了
  // （2026-11-08 用户截图：Cannot read properties of null）。
  $("title").textContent = meta
    ? [meta.label, meta.card, (meta.turns || 0) + " 轮"].filter(Boolean).join(" · ")
    : "会话";
  const box = $("detail");
  box.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const r = await fetch("/gv/detail?key=" + encodeURIComponent(key));
    if (r.status === 401) { location.reload(); return; }
    const d = await r.json();
    if (!d.ok) {
      box.innerHTML = '<div class="empty">' + (d.error || "读不到") + "</div>";
      return;
    }
    box.innerHTML = "";
    const frag = document.createDocumentFragment();
    (d.messages || []).forEach(m => {
      const wrap = document.createElement("div");
      wrap.className = "m " + (m.role === "user" ? "user" : "ai");
      const b = document.createElement("div");
      b.className = "bubble";
      b.textContent = m.text || "";
      if (m.role === "assistant" && (m.mood || m.state)) {
        const t = document.createElement("div");
        t.className = "tag";
        t.textContent = [m.mood ? (m.mood + " " + (m.intensity || "")) : "",
                         m.state || ""].filter(Boolean).join(" · ");
        b.appendChild(t);
      }
      wrap.appendChild(b);
      frag.appendChild(wrap);
    });
    box.appendChild(frag);
    if (!(d.messages || []).length)
      box.innerHTML = '<div class="empty">这条会话没有记录</div>';
    box.scrollTop = 0;
    CUR_D = d;
    $("exportBtn").disabled = false;
  } catch (e) {
    box.innerHTML = '<div class="empty">读不到：' + e.message + "</div>";
  }
}

// ── 导出（纯前端拼 Markdown，不新增接口）──────────────
// /gv/detail 已经给了 messages / note / state / card，够拼一份可读的存档；
// 让 5174 出文件反而要加接口 + 限流桶 + 鉴权，前端一个 Blob 就完事。
function escMd(s) {
  // 只把内容当纯文本：消息里出现 # / ``` 之类不该变成 markdown 结构。
  // 用缩进 + 反斜杠转义行首的标记字符，正文换行原样保留。
  return String(s || "").split("\n").map(line =>
    line.replace(/^(\s{0,3})(#{1,6}\s|>\s?|[-*+]\s|\d+\.\s|```)/,
                 "$1\\$2")).join("\n");
}
function buildMarkdown(d, meta) {
  const m = meta || {};
  const label = d.label || m.label || ("游客 " + String(d.key || "").slice(0, 8));
  const L = [];
  L.push("# " + label);
  L.push("");
  L.push("- 角色卡：" + (d.card || m.card || "—"));
  L.push("- 最后活动：" + (d.mtime_text || "—"));
  L.push("- 轮次：" + (m.turns != null ? m.turns :
    (d.messages || []).filter(x => x.role === "assistant").length));
  L.push("- 记录条数：" + (d.total != null ? d.total : (d.messages || []).length));
  L.push("- 会话 key：`" + String(d.key || "") + "`");
  L.push("- 导出时间：" + new Date().toLocaleString("zh-CN"));
  if (d.state) L.push("", "## 状态", "", escMd(d.state));
  if (d.note)  L.push("", "## 账本", "", escMd(d.note));
  L.push("", "---", "", "## 对话", "");
  const msgs = d.messages || [];
  if (!msgs.length) L.push("（没有记录）");
  msgs.forEach((x, i) => {
    const who = x.role === "user" ? "你" : (d.card || "她");
    L.push("### " + (i + 1) + " · " + who);
    L.push("");
    L.push(escMd(x.text));
    if (x.role === "assistant" && (x.mood || x.state)) {
      const tag = [x.mood ? (x.mood + " " + (x.intensity || "")) : "",
                   x.state || ""].filter(Boolean).join(" · ");
      L.push("", "> " + tag.replace(/\n/g, " "));
    }
    L.push("");
  });
  return L.join("\n");
}
$("exportBtn").onclick = () => {
  if (!CUR_D) return;
  const d = CUR_D;
  const label = d.label || (CUR_META && CUR_META.label) || String(d.key || "session");
  const safe = label.replace(/[\\/:*?"<>|\r\n]/g, "_").slice(0, 40);
  const stamp = dayKey(Date.now() / 1000);
  const name = "游客会话_" + safe + "_" + stamp + ".md";
  const blob = new Blob(["\ufeff" + buildMarkdown(d, CUR_META)],
                        { type: "text/markdown;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

// ── 启动 ──────────────────────────────
async function enterApp() {
  $("login").style.display = "none";
  $("app").classList.add("on");
  applyFs(curFs());
  await loadList();
}
(async function init() {
  applyFs(curFs());
  try {
    const r = await fetch("/gv/me");
    const d = await r.json();
    if (d.admin) return enterApp();
  } catch (e) {}
  $("login").style.display = "flex";
})();
</script>
</body>
</html>
