<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>游客会话 · 只读</title>
<style>
  :root {
    --bg: #0a0a0f; --bg-elev: #12121a; --bg-input: #1a1a24;
    --border: #262633; --text: #e6e6ee; --text-dim: #8b8b9e;
    --text-mute: #5c5c70;
    --accent: #9d7bff; --accent-dim: #2a2140;
    --fs: 15px;
    --rs: 10px;
    --drawer-w: min(84vw, 330px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: var(--fs)/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  button { font: inherit; }

  /* ── 登录 ─────────────────────────────── */
  #login { display: flex; align-items: center; justify-content: center;
           height: 100%; padding: 20px; }
  .box { width: min(380px, 100%); background: var(--bg-elev);
         border: 1px solid var(--border); border-radius: 16px; padding: 26px 22px; }
  .box h1 { font-size: 1.12em; margin: 0 0 6px; letter-spacing: .02em; }
  .box p { color: var(--text-dim); font-size: .8em; margin: 0 0 18px; line-height: 1.65; }
  .box input { width: 100%; padding: 12px 13px; margin-bottom: 10px;
    font: inherit; color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--rs); outline: none; }
  .box input:focus { border-color: var(--accent); }
  .box button { width: 100%; padding: 12px; margin-top: 2px; color: #fff;
    background: var(--accent); border: 0; border-radius: var(--rs); cursor: pointer; }
  .box button:disabled { opacity: .45; }
  #msg { min-height: 18px; font-size: .8em; color: #ff8a8a; margin-top: 10px; }
  #msg.ok { color: #7ee0a8; }

  /* ── 框架 ─────────────────────────────── */
  #app { display: none; height: 100%; flex-direction: column; }
  #app.on { display: flex; }

  header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; padding-top: calc(8px + env(safe-area-inset-top));
    background: rgba(18,18,26,.92); border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px); z-index: 30;
  }
  header h1 { flex: 1; margin: 0; font-size: .95em; font-weight: 500;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ibtn { background: transparent; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 9px; font-size: .82em; cursor: pointer; }
  .ibtn:active { background: var(--accent-dim); color: var(--accent); }
  #menuBtn { display: none; font-size: 1em; padding: 5px 10px; }

  main { flex: 1; display: flex; min-height: 0; position: relative; }

  /* ── 列表 ─────────────────────────────── */
  aside {
    width: 300px; flex: 0 0 auto; overflow-y: auto;
    border-right: 1px solid var(--border);
    background: var(--bg-elev);
    -webkit-overflow-scrolling: touch;
  }
  .listhead {
    padding: 9px 14px 7px; font-size: .72em; color: var(--text-mute);
    letter-spacing: .06em; text-transform: uppercase;
    position: sticky; top: 0; background: var(--bg-elev); z-index: 2;
  }
  .row {
    display: flex; align-items: stretch; gap: 0;
    padding: 12px 14px 12px 12px; cursor: pointer;
    border-bottom: 1px solid #1b1b25; position: relative;
  }
  .row::before {
    content: ""; position: absolute; left: 0; top: 10px; bottom: 10px;
    width: 3px; border-radius: 2px; background: transparent;
  }
  .row.on { background: var(--bg-input); }
  .row.on::before { background: var(--accent); }
  .row:active { background: var(--bg-input); }
  .row .body { flex: 1; min-width: 0; }
  .row .who { font-size: .9em; color: var(--text);
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { font-size: .76em; color: var(--text-dim); margin-top: 3px; }
  .row .n { flex: 0 0 auto; align-self: center; margin-left: 8px;
            font-size: .72em; color: var(--text-mute);
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 20px; padding: 2px 8px; }

  /* ── 详情 ─────────────────────────────── */
  section { flex: 1; overflow-y: auto; padding: 16px 16px 70px;
            -webkit-overflow-scrolling: touch; }
  .m { display: flex; margin-bottom: 13px; }
  .m.user { justify-content: flex-end; }
  .bubble { max-width: 76%; padding: 10px 13px; border-radius: 14px;
    background: var(--bg-elev); border: 1px solid var(--border);
    white-space: pre-wrap; word-break: break-word; }
  .m.user .bubble { background: var(--accent-dim); border-color: #3a2d5c; }
  .tag { font-size: .74em; color: var(--text-dim); margin-top: 7px;
         border-top: 1px dashed var(--border); padding-top: 6px; }
  .empty { color: var(--text-dim); text-align: center; padding: 48px 0; font-size: .88em; }

  /* 详情顶部的小标题（手机上知道在看谁） */
  .dhead { display: none; align-items: center; gap: 8px;
           padding: 0 0 12px; border-bottom: 1px solid var(--border);
           margin-bottom: 14px; }
  .dhead .t { flex: 1; font-size: .86em; color: var(--text-dim); }

  /* 遮罩 */
  #mask { display: none; position: fixed; inset: 0; z-index: 25;
          background: rgba(0,0,0,.55); backdrop-filter: blur(2px); }

  /* ── 手机：抽屉 ─────────────────────────── */
  @media (max-width: 820px) {
    #menuBtn { display: inline-block; }
    aside {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: var(--drawer-w);
      transform: translateX(-102%);
      transition: transform .24s cubic-bezier(.2,.8,.2,1);
      z-index: 26; border-right: 1px solid var(--border);
      padding-top: env(safe-area-inset-top);
      box-shadow: 12px 0 32px rgba(0,0,0,.55);
    }
    body.drawer aside { transform: none; }
    body.drawer #mask { display: block; }
    /* 详情占满 */
    section { display: block; padding: 12px 12px 70px; }
    .dhead { display: flex; }
    .bubble { max-width: 86%; }
    /* 打开详情时收起抽屉 */
    body.detail #menuBtn { display: inline-block; }
  }
</style>
</head>
<body>

<!-- 登录 -->
<div id="login">
  <div class="box">
    <h1>游客会话查看</h1>
    <p>只读。只列出游客会话，不含网页 / 私聊 / 群聊。<br>
       需要管理员 QQ 号，验证码会私聊发给你。</p>
    <input id="qq" inputmode="numeric" autocomplete="username"
           placeholder="管理员 QQ 号">
    <button id="sendBtn">发送验证码</button>
    <input id="code" inputmode="numeric" autocomplete="one-time-code"
           maxlength="6" placeholder="6 位验证码">
    <button id="verifyBtn">登录</button>
    <div id="msg"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="app">
  <header>
    <button class="ibtn" id="menuBtn" aria-label="会话列表">☰</button>
    <h1 id="title">游客会话</h1>
    <button class="ibtn" id="fsDown" title="字号变小">A−</button>
    <button class="ibtn" id="fsUp" title="字号变大">A+</button>
    <button class="ibtn" id="logoutBtn">退出</button>
  </header>
  <main>
    <aside id="list">
      <div class="listhead">会话</div>
      <div id="rows"><div class="empty">加载中…</div></div>
    </aside>
    <div id="mask"></div>
    <section id="detail">
      <div class="dhead">
        <span class="t" id="dTitle">选一条会话</span>
      </div>
      <div class="empty">左边选一条会话</div>
    </section>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const FS_KEY = "gv_fs";
let CUR = "";

// ── 字号 ──────────────────────────────
function applyFs(px) {
  px = Math.max(12, Math.min(22, px | 0));
  document.documentElement.style.setProperty("--fs", px + "px");
  try { localStorage.setItem(FS_KEY, px); } catch (e) {}
  return px;
}
function curFs() {
  try { return parseInt(localStorage.getItem(FS_KEY), 10) || 15; }
  catch (e) { return 15; }
}
$("fsDown").onclick = () => applyFs(curFs() - 1);
$("fsUp").onclick = () => applyFs(curFs() + 1);

// ── 抽屉 ──────────────────────────────
function openDrawer() { document.body.classList.add("drawer"); }
function closeDrawer() { document.body.classList.remove("drawer"); }
$("menuBtn").onclick = e => {
  e.stopPropagation();
  document.body.classList.contains("drawer") ? closeDrawer() : openDrawer();
};
$("mask").onclick = closeDrawer;

// ── 登录 ──────────────────────────────
function say(t, ok) {
  const m = $("msg");
  m.textContent = t || "";
  m.className = ok ? "ok" : "";
}
async function post(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(d.error || d.message || ("HTTP " + r.status));
  return d;
}
$("sendBtn").onclick = async () => {
  const qq = ($("qq").value || "").trim();
  if (!/^\d{5,12}$/.test(qq)) return say("QQ 号格式不对");
  $("sendBtn").disabled = true;
  say("");
  try {
    const d = await post("/gv/send", { qq });
    say(d.message || "验证码已发送，注意 QQ 私聊", true);
    $("code").focus();
  } catch (e) {
    say(e.message || "发送失败");
  } finally {
    setTimeout(() => { $("sendBtn").disabled = false; }, 3000);
  }
};
$("verifyBtn").onclick = async () => {
  const qq = ($("qq").value || "").trim();
  const code = ($("code").value || "").trim();
  if (!qq || !code) return say("QQ 和验证码都要填");
  say("");
  try {
    await post("/gv/verify", { qq, code });
    enterApp();
  } catch (e) {
    say(e.message || "验证失败");
  }
};
$("code").addEventListener("keydown", e => {
  if (e.key === "Enter") $("verifyBtn").click();
});
$("logoutBtn").onclick = async () => {
  try { await post("/logout", {}); } catch (e) {}
  location.reload();
};

// ── 列表 ──────────────────────────────
function fmt(sec) {
  if (!sec) return "";
  const d = new Date(sec * 1000);
  const p = n => String(n).padStart(2, "0");
  const today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  return (sameDay ? "" : (d.getMonth() + 1) + "-" + p(d.getDate()) + " ") +
         p(d.getHours()) + ":" + p(d.getMinutes());
}
async function loadList() {
  const box = $("rows");
  box.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const r = await fetch("/gv/list");
    if (r.status === 401) { location.reload(); return; }
    const d = await r.json();
    const rows = d.sessions || [];
    if (!rows.length) {
      box.innerHTML = '<div class="empty">还没有游客会话</div>';
      return;
    }
    box.innerHTML = "";
    rows.forEach(s => {
      const el = document.createElement("div");
      el.className = "row";
      el.dataset.key = s.key;
      const body = document.createElement("div");
      body.className = "body";
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = s.label || ("游客 " + String(s.key).slice(0, 8));
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = [s.card, fmt(s.mtime)].filter(Boolean).join(" · ");
      body.appendChild(who);
      body.appendChild(meta);
      const n = document.createElement("div");
      n.className = "n";
      n.textContent = (s.turns || 0) + " 轮";
      el.appendChild(body);
      el.appendChild(n);
      el.onclick = () => openRow(s.key, el, s);
      box.appendChild(el);
    });
  } catch (e) {
    box.innerHTML = '<div class="empty">读不到：' + e.message + "</div>";
  }
}

// ── 详情 ──────────────────────────────
async function openRow(key, el, meta) {
  CUR = key;
  document.querySelectorAll(".row.on").forEach(x => x.classList.remove("on"));
  if (el) el.classList.add("on");
  document.body.classList.add("detail");
  closeDrawer();
  if (meta) {
    $("dTitle").textContent = [meta.label, meta.card,
      (meta.turns || 0) + " 轮"].filter(Boolean).join(" · ");
  }
  const box = $("detail");
  box.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const r = await fetch("/gv/detail?key=" + encodeURIComponent(key));
    if (r.status === 401) { location.reload(); return; }
    const d = await r.json();
    if (!d.ok) {
      box.innerHTML = '<div class="empty">' + (d.error || "读不到") + "</div>";
      return;
    }
    box.innerHTML = '<div class="dhead"><span class="t" id="dTitle2"></span></div>';
    $("dTitle2").textContent = $("dTitle").textContent;
    const frag = document.createDocumentFragment();
    (d.messages || []).forEach(m => {
      const wrap = document.createElement("div");
      wrap.className = "m " + (m.role === "user" ? "user" : "ai");
      const b = document.createElement("div");
      b.className = "bubble";
      b.textContent = m.text || "";
      if (m.role === "assistant" && (m.mood || m.state)) {
        const t = document.createElement("div");
        t.className = "tag";
        t.textContent = [m.mood ? (m.mood + " " + (m.intensity || "")) : "",
                         m.state || ""].filter(Boolean).join(" · ");
        b.appendChild(t);
      }
      wrap.appendChild(b);
      frag.appendChild(wrap);
    });
    box.appendChild(frag);
    if (!(d.messages || []).length)
      box.innerHTML = '<div class="empty">这条会话没有记录</div>';
    box.scrollTop = 0;
  } catch (e) {
    box.innerHTML = '<div class="empty">读不到：' + e.message + "</div>";
  }
}

// ── 启动 ──────────────────────────────
async function enterApp() {
  $("login").style.display = "none";
  $("app").classList.add("on");
  applyFs(curFs());
  await loadList();
}
(async function init() {
  applyFs(curFs());
  try {
    const r = await fetch("/gv/me");
    const d = await r.json();
    if (d.admin) return enterApp();
  } catch (e) {}
  $("login").style.display = "flex";
})();
</script>
</body>
</html>
