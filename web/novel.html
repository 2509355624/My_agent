<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小说模式 · 丧尸末日</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%23f472b6'/></svg>">
<style>
/* 皮肤与 web/persona.html 同一套（2026-11-11）：变量、三栏宽度、.btn /
   .log / .composer / .side2 都照抄，不再另起一套配色。小说模式只是
   「第三个玩法」，不该看起来像另一个网站。
   ⚠️ persona.html 的样式是内嵌的，这里是它的基础皮肤副本；以后改配色
   两处要同步（不在 281KB 单文件里抽公共 CSS，是为了不碰 1v1 的样式表）。 */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #000; --bg-elev: #0e0e12; --bg-input: #17171f;
  --border: #26262f; --border-soft: #1a1a22;
  --text: #e6e6ec; --text-dim: #8a8a9a; --text-mute: #55556a;
  --accent: #f472b6; --accent-dim: #6d2a48;
  --ok: #4ade80; --err: #f87171; --warn: #fbbf24;
  --r: 12px; --rs: 8px;
}
html, body { background: var(--bg); color: var(--text); height: 100%;
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  font-size: 14px; -webkit-text-size-adjust: 100%; }
.app { display: flex; position: fixed; top: 0; right: 0; bottom: 0; left: 0;
  height: 100vh; height: 100dvh; height: var(--vh, 100dvh);
  touch-action: manipulation; }
.app > .side { flex: 0 0 230px; }
.app > .mid { flex: 1 1 auto; min-width: 0; }
.app > .side2 { flex: 0 0 288px; }
@supports (display: grid) {
  .app { display: grid; grid-template-columns: 230px 1fr 288px; }
  .app > .side, .app > .mid, .app > .side2 { flex: none; }
}
.side { border-right: 1px solid var(--border-soft); display: flex;
  flex-direction: column; min-height: 0; background: var(--bg-elev);
  overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.side-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: center; }
.side-head h1 { font-size: 14px; font-weight: 600; letter-spacing: .5px; }
.side-head .sp { flex: 1; }
.side-list { flex: 1; overflow-y: auto; padding: 10px 8px; }
.mid { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.top { padding: 10px 16px; border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: center; gap: 10px; min-height: 50px; }
.top .nm { font-size: 15px; font-weight: 600; }
.top .sp { flex: 1; }
.top a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.top a.btn:hover { border-color: var(--accent); color: var(--accent); }
.log { flex: 1; min-height: 0; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth;
  overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.composer { flex: none; border-top: 1px solid var(--border-soft);
  padding: 10px 12px; display: flex; align-items: center; gap: 8px; }
.composer textarea { flex: 1; background: var(--bg-input); color: var(--text);
  border: 1px solid var(--border-soft); border-radius: var(--rs); padding: 8px 10px; }
.composer textarea:focus { border-color: var(--accent); }
.btn { background: var(--bg-input); border: 1px solid var(--border); color: var(--text);
  border-radius: var(--rs); padding: 7px 12px; cursor: pointer; white-space: nowrap;
  font: inherit; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.pri { background: var(--accent-dim); border-color: var(--accent); }
.btn.pri:hover:not(:disabled) { background: var(--accent); color: #000; }
.btn.sm { padding: 5px 11px; font-size: 12px; }
.side2 { border-left: 1px solid var(--border-soft); padding: 14px;
  background: var(--bg-elev); overflow-y: auto; }
.st { margin-bottom: 16px; }
.st .k { font-size: 11px; color: var(--text-mute); margin-bottom: 3px; }
.st .v { font-size: 12.5px; line-height: 1.65; word-break: break-word; }

/* ─── 小说模式自己才有的几块（玩法列表 / 正文 / 事实卡）── */
.nv-sub { font-size: 11px; color: var(--text-mute); }
.nv-sec { margin-bottom: 18px; }
.nv-sec h3 { font-size: 11px; font-weight: 500; margin: 0 0 8px;
  color: var(--text-mute); letter-spacing: .04em; }
.nv-play { border: 1px solid var(--border-soft); border-radius: var(--rs);
  padding: 9px 10px; margin-bottom: 6px; cursor: pointer; background: var(--bg-input); }
.nv-play.on { border-color: var(--accent-dim); }
.nv-play b { display: block; font-weight: 500; font-size: 13px; }
.nv-play.on b { color: var(--accent); }
.nv-play span { display: block; font-size: 11px; color: var(--text-mute);
  margin-top: 3px; overflow-wrap: anywhere; }
.nv-world { font-size: 12px; padding: 8px 10px; border-radius: var(--rs);
  cursor: pointer; border: 1px solid transparent; overflow-wrap: anywhere; }
.nv-world:hover { background: var(--bg-input); }
.nv-world.on { background: var(--bg-input); border-color: var(--accent-dim); }
.nv-field { margin-bottom: 8px; }
.nv-field label { display: block; font-size: 11px; color: var(--text-dim);
  margin-bottom: 4px; }
.nv-field input, .nv-field select { width: 100%; padding: 7px 9px;
  border: 1px solid var(--border-soft); border-radius: var(--rs);
  background: var(--bg-input); color: var(--text); outline: none; font: inherit; }
.nv-field input:focus, .nv-field select:focus { border-color: var(--accent); }
.nv-empty { font-size: 12px; color: var(--text-mute); line-height: 1.7; }
.nv-note { background: rgba(244, 114, 182, .09); border-left: 3px solid var(--accent-dim);
  padding: 10px 12px; border-radius: 0 var(--rs) var(--rs) 0; font-size: 13px;
  overflow-wrap: anywhere; }
.nv-para { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px;
  line-height: 1.9; }
.nv-said { align-self: flex-end; max-width: 88%; background: var(--bg-input);
  border: 1px solid var(--border-soft); border-radius: var(--r);
  padding: 8px 11px; font-size: 12px; color: var(--text-dim);
  overflow-wrap: anywhere; }
.nv-ruling { font-size: 12px; color: var(--text-mute);
  border-top: 1px dashed var(--border); padding-top: 7px; overflow-wrap: anywhere; }
.nv-end { background: rgba(248, 113, 113, .1); border: 1px solid var(--err);
  color: var(--err); border-radius: var(--r); padding: 12px; overflow-wrap: anywhere; }
.nv-err { background: rgba(248, 113, 113, .1); border: 1px solid var(--err);
  color: var(--err); border-radius: var(--rs); padding: 8px 10px;
  font-size: 12px; margin: 10px 16px 0; overflow-wrap: anywhere; }
.nv-input { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 14px; }
.nv-input textarea { width: 100%; min-height: 78px; resize: vertical;
  padding: 9px 11px; font: inherit; }
.nv-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.nv-actions button { font-size: 12px; overflow-wrap: anywhere; max-width: 100%;
  text-align: left; white-space: normal; }
.nv-sendrow { display: flex; gap: 8px; align-items: center; }
.nv-sendrow .sp { flex: 1; }
.nv-card dl { margin: 0; }
.nv-card dt { font-size: 11px; color: var(--text-mute); margin-top: 11px; }
.nv-card dd { margin: 2px 0 0; font-size: 13px; overflow-wrap: anywhere; }
.nv-chip { display: inline-block; padding: 2px 8px; margin: 2px 4px 2px 0;
  border-radius: 14px; background: var(--bg-input); font-size: 12px;
  overflow-wrap: anywhere; }
.nv-card ul { margin: 4px 0 0; padding-left: 17px; font-size: 12px;
  overflow-wrap: anywhere; }
.nv-card li { margin-bottom: 3px; }
.nv-dead { background: rgba(251, 191, 36, .1); border: 1px solid var(--warn);
  border-radius: var(--rs); padding: 9px; font-size: 12px; color: var(--warn);
  overflow-wrap: anywhere; }
/* 窄屏改纵向文档流：宽屏那套 position:fixed 三栏在手机上会把内容裁掉 */
@media (max-width:900px){
  .app{display:block;position:static;height:auto;min-height:100dvh}
  .side,.mid,.side2{width:auto;min-height:0;max-height:none;overflow:visible;
    border:0;border-bottom:1px solid var(--border-soft)}
  .mid{min-height:70vh}
  .log{min-height:40vh}
  .side-list{overflow:visible}
  .nv-sub{display:none}
}
</style>
</head>
<body>
<div class="app">

  <aside class="side" id="nvLeft">
    <div class="side-head">
      <h1>小说模式</h1>
      <span class="sp"></span>
      <a class="btn sm" href="/persona" title="回到一对一角色扮演">← 扮演</a>
    </div>
    <div class="side-list">
      <div class="nv-sec">
        <h3>玩法</h3>
        <div id="nvPlayList"><div class="nv-empty">正在读玩法…</div></div>
      </div>
      <div class="nv-sec" id="nvNewBox">
        <h3>开一本新的</h3>
        <div class="nv-field"><label for="nvName">主角名字</label><input id="nvName" placeholder="给自己起个名字" maxlength="24"></div>
        <div class="nv-field"><label for="nvIdentity">开局身份</label><select id="nvIdentity"></select></div>
        <button class="btn pri" id="nvOpenBtn" style="width:100%">开场封样</button>
      </div>
      <div class="nv-sec">
        <h3>已有的世界</h3>
        <div id="nvWorldList"><div class="nv-empty">还没有开过</div></div>
      </div>
    </div>
  </aside>

  <main class="mid" id="nvMain">
    <div class="top">
      <span class="nm">丧尸末日</span>
      <span class="sp"></span>
      <span class="nv-sub">一个世界一条线 · 你是主角 · 世界书会记住已经探明的事</span>
      <a class="btn sm" href="/persona" title="返回角色扮演">← 角色扮演</a>
    </div>
    <div id="nvErr"></div>
    <div class="log" id="nvLog"><div class="nv-empty">左边选一个玩法，填好主角名字和身份，点「开场封样」。</div></div>
    <div class="composer nv-input" id="nvInputBox" style="display:none">
      <div class="nv-actions" id="nvActions"></div>
      <textarea id="nvText" placeholder="写下你打算做什么。想法可以天马行空，编剧会把它落成这一拍真正发生的事。"></textarea>
      <div class="nv-sendrow">
        <button class="btn pri" id="nvSendBtn">写下去</button>
        <button class="btn sm" id="nvRestartBtn">重开一本</button>
        <span class="sp"></span>
      </div>
    </div>
  </main>

  <aside class="side2 nv-card" id="nvRight">
    <div class="st"><div class="k">状态卡 · 只记事实，没有数值条</div></div>
    <div id="nvCard"><div class="nv-empty">开场之后这里会记：现在在哪、手上有什么、在场的人、做过的事。</div></div>
  </aside>

</div>
<script>
var nvWorldId = '';
var nvPlays = [];
var nvPlayId = '';
var nvBusy = false;
var nvEnded = false;

function nvEl(id){ return document.getElementById(id); }
function nvEsc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function nvErr(msg){
  nvEl('nvErr').innerHTML = msg ? '<div class="nv-err">' + nvEsc(msg) + '</div>' : '';
}
function nvBusySet(on){
  nvBusy = on;
  ['nvOpenBtn','nvSendBtn','nvRestartBtn'].forEach(function(id){
    var b = nvEl(id); if(b) b.disabled = on;
  });
  Array.prototype.forEach.call(nvEl('nvActions').querySelectorAll('button'), function(b){
    b.disabled = on || nvEnded;
  });
  if(nvEl('nvSendBtn')) nvEl('nvSendBtn').textContent = on ? '正在写…' : '写下去';
}
async function nvGet(path){
  var r = await fetch(path, {headers:{'Accept':'application/json'}});
  return await r.json();
}
async function nvPost(path, body){
  var r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
                             body:JSON.stringify(body || {})});
  return await r.json();
}
function nvTextList(rows){
  if(!rows || !rows.length) return '<span class="nv-empty">无</span>';
  return '<ul>' + rows.map(function(x){ return '<li>' + nvEsc(x) + '</li>'; }).join('') + '</ul>';
}
function nvChips(rows){
  if(!rows || !rows.length) return '<span class="nv-empty">空手</span>';
  return rows.map(function(x){ return '<span class="nv-chip">' + nvEsc(x) + '</span>'; }).join('');
}

function nvRenderPlays(plays){
  nvPlays = plays || [];
  var box = nvEl('nvPlayList');
  if(!nvPlays.length){ box.innerHTML = '<div class="nv-empty">没有找到玩法预设</div>'; return; }
  box.innerHTML = nvPlays.map(function(p){
    return '<div class="nv-play' + (p.id === nvPlayId ? ' on' : '') + '" data-id="' + nvEsc(p.id) + '">' +
           '<b>' + nvEsc(p.name) + '</b><span>' + nvEsc(p.tagline) + '</span></div>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.nv-play'), function(el){
    el.onclick = function(){ nvSelectPlay(el.getAttribute('data-id')); };
  });
  if(!nvPlayId) nvSelectPlay(nvPlays[0].id);
}
function nvSelectPlay(id){
  nvPlayId = id;
  var play = nvPlays.filter(function(p){ return p.id === id; })[0] || {};
  var sel = nvEl('nvIdentity');
  sel.innerHTML = (play.identity_choices || []).map(function(c){
    return '<option value="' + nvEsc(c.name) + '">' + nvEsc(c.name) + ' · ' + nvEsc(c.desc) + '</option>';
  }).join('');
  Array.prototype.forEach.call(nvEl('nvPlayList').querySelectorAll('.nv-play'), function(el){
    el.className = 'nv-play' + (el.getAttribute('data-id') === id ? ' on' : '');
  });
}
function nvRenderWorlds(worlds){
  var box = nvEl('nvWorldList');
  if(!worlds || !worlds.length){ box.innerHTML = '<div class="nv-empty">还没有开过</div>'; return; }
  box.innerHTML = worlds.map(function(w){
    return '<div class="nv-world' + (w.id === nvWorldId ? ' on' : '') + '" data-id="' + nvEsc(w.id) + '">' +
           nvEsc(w.name || '无名的人') + ' · 第 ' + nvEsc(w.chapter) + ' 章 · ' + nvEsc(w.place) +
           (w.ending ? ' · 已结束' : '') + '</div>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.nv-world'), function(el){
    el.onclick = function(){ nvLoadWorld(el.getAttribute('data-id')); };
  });
}
function nvRenderCard(s){
  if(!s){ nvEl('nvCard').innerHTML = '<div class="nv-empty">还没有世界书</div>'; return; }
  var p = s.player || {};
  var present = (s.present || []).map(function(c){
    return c.name + '（' + (c.relation || '未定') + '，' + (c.willing || '未定') + '）';
  });
  var route = s.route || {};
  var death = s.last_death;
  var html = '<dl>';
  html += '<dt>章节 · 本章目标</dt><dd>第 ' + nvEsc(s.chapter) + ' 章 · ' + nvEsc(s.chapter_goal || '暂无') + '</dd>';
  html += '<dt>主角</dt><dd>' + nvEsc(p.name) + ' · ' + nvEsc(p.identity) + '</dd>';
  html += '<dt>身份意味着什么</dt><dd>' + nvEsc(p.identity_desc || '普通人') + '</dd>';
  html += '<dt>现在在哪</dt><dd>' + nvEsc(p.place || '未知') + '</dd>';
  html += '<dt>身体状态</dt><dd>' + nvEsc(p.condition || '完好') + '</dd>';
  html += '<dt>手上拿着</dt><dd>' + nvChips(p.items) + '</dd>';
  html += '<dt>在场的人</dt><dd>' + nvChips(present) + '</dd>';
  html += '<dt>主角团里有过谁</dt><dd>' + nvChips((s.cast || []).map(function(c){ return c.name; })) + '</dd>';
  html += '<dt>当前路线</dt><dd>' + (route.goal ? nvEsc(route.goal) + '：' + nvEsc((route.nodes || []).join(' → ')) : '暂无') + '</dd>';
  html += '<dt>还没了结的事</dt><dd>' + nvTextList((s.events || []).map(function(e){ return e.trigger; })) + '</dd>';
  html += '<dt>最近做过的事</dt><dd>' + nvTextList(s.log) + '</dd>';
  html += '<dt>已经探明的固定事实</dt><dd>' + nvTextList((s.discovered || []).map(function(d){ return d.fact; })) + '</dd>';
  html += '</dl>';
  if(death){
    html += '<div class="nv-dead" style="margin-top:14px"><b>上一次怎么死的</b><br>' +
            nvEsc(death.cause) + '<br>地点：' + nvEsc(death.at) +
            ' · 身份：' + nvEsc(death.identity) + '</div>';
  }
  nvEl('nvCard').innerHTML = html;
}
function nvRenderHistory(hist, note, ending){
  var box = nvEl('nvLog');
  var html = note ? '<div class="nv-note">' + nvEsc(note) + '</div>' : '';
  (hist || []).forEach(function(row){
    if(row.role === 'user'){
      html += '<div class="nv-said">你的意图：' + nvEsc(row.content) + '</div>';
    } else {
      html += '<div class="nv-para">' + nvEsc(row.content) + '</div>';
    }
  });
  if(ending){
    html += '<div class="nv-end"><b>这一本结束了</b><br>' + nvEsc(ending.cause) +
            '<br>' + nvEsc(ending.summary) + '<br>人物归零，已经探明的固定事实会留下来。</div>';
  }
  box.innerHTML = html || '<div class="nv-empty">还没有正文</div>';
  box.scrollTop = box.scrollHeight;
}
function nvRenderActions(actions, enabled){
  var box = nvEl('nvActions');
  box.innerHTML = (actions || []).map(function(a){
    return '<button type="button" class="btn sm" data-text="' + nvEsc(a) + '">' + nvEsc(a) + '</button>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('button'), function(b){
    b.disabled = !enabled;
    b.onclick = function(){ nvSend(b.getAttribute('data-text')); };
  });
}
function nvApplyState(s, note){
  nvWorldId = s.id;
  nvEnded = !!s.ending;
  nvRenderCard(s);
  nvRenderHistory(s.history, note, s.ending);
  nvRenderActions(s.actions, !s.ending && !nvBusy);
  nvEl('nvInputBox').style.display = 'flex';
  nvEl('nvText').disabled = !!s.ending;
  nvGet('/api/novel/worlds').then(function(d){ nvRenderWorlds(d.worlds); }).catch(function(){});
}
async function nvBoot(){
  try{
    var d = await nvGet('/api/novel/plays');
    nvRenderPlays(d.plays);
    var w = await nvGet('/api/novel/worlds');
    nvRenderWorlds(w.worlds);
  }catch(e){ nvErr('读玩法失败：' + e.message); }
}
async function nvOpen(){
  if(nvBusy) return;
  nvErr(''); nvBusySet(true);
  try{
    var d = await nvPost('/api/novel/open', {
      play:nvPlayId, name:nvEl('nvName').value.trim(),
      identity:nvEl('nvIdentity').value
    });
    if(!d.ok){ nvErr(d.error); return; }
    nvApplyState(d.state, d.note);
  }catch(e){ nvErr('开场失败：' + e.message); }
  finally{ nvBusySet(false); }
}
async function nvLoadWorld(id){
  if(nvBusy) return;
  nvErr('');
  try{
    var d = await nvGet('/api/novel/state?id=' + encodeURIComponent(id));
    if(!d.ok){ nvErr(d.error); return; }
    nvApplyState(d.state, '');
  }catch(e){ nvErr('读取失败：' + e.message); }
}
async function nvSend(text){
  if(nvBusy || !nvWorldId) return;
  text = String(text || nvEl('nvText').value || '').trim();
  if(!text) return;
  nvErr(''); nvBusySet(true);
  nvEl('nvText').value = '';
  try{
    var d = await nvPost('/api/novel/turn', {id:nvWorldId, text:text});
    if(!d.ok){
      nvErr(d.error);
      if(d.state) nvApplyState(d.state, '');
      return;
    }
    nvApplyState(d.state, '');
  }catch(e){ nvErr('这一轮失败：' + e.message); }
  finally{ nvBusySet(false); }
}
async function nvRestart(){
  if(nvBusy || !nvWorldId) return;
  nvErr(''); nvBusySet(true);
  try{
    var d = await nvPost('/api/novel/restart', {id:nvWorldId});
    if(!d.ok){ nvErr(d.error); return; }
    nvApplyState(d.state, d.note);
  }catch(e){ nvErr('重开失败：' + e.message); }
  finally{ nvBusySet(false); }
}
nvEl('nvOpenBtn').onclick = nvOpen;
nvEl('nvSendBtn').onclick = function(){ nvSend(''); };
nvEl('nvRestartBtn').onclick = nvRestart;
nvEl('nvText').addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); nvSend(''); }
});
nvBoot();
</script>
</body>
</html>
