<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>角色扮演</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%23f472b6'/></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #000; --bg-elev: #0e0e12; --bg-input: #17171f;
    --border: #26262f; --border-soft: #1a1a22;
    --text: #e6e6ec; --text-dim: #8a8a9a; --text-mute: #55556a;
    --accent: #f472b6; --accent-dim: #6d2a48;
    --ok: #4ade80; --err: #f87171; --warn: #fbbf24;
    --r: 12px; --rs: 8px;
  }
  html, body { background: var(--bg); color: var(--text); height: 100%;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px; overflow: hidden; -webkit-text-size-adjust: 100%; }

  /* 视口高度要三重兜底（2026-11-03 群友反馈「看不到输入框」）：
     ① `position: fixed` + 四边 0 —— 最老也认，就算 height 全丢也能撑满
     ② `height: 100vh` —— 不支持 dvh 的浏览器用这个
     ③ `height: 100dvh` —— 支持的用它（手机地址栏收起时更准）

     `dvh` 是 Chrome 108（2022-09）才有的单位，QQ 内置浏览器和部分安卓
     WebView 太老不认。不认的话**整条声明被丢弃**，`.app` 没有高度，页面
     退回文档流 —— `.log` 的 `flex:1` 失效、一路撑高，`.composer` 被顶到
     视口外面，用户看到的就是「没有输入框」。 */
  .app { display: flex;        /* 老浏览器兜底：Chromium < 57 没有 grid */
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    height: 100vh; height: 100dvh;
    /* ④ 最后一道：手机软键盘弹出时视口会变矮，`vh` 不变、`dvh` 未必认，
       所以下面那段 JS 会量出真实可视高度写进 `--vh`。没跑 JS 就退回 dvh。 */
    height: var(--vh, 100dvh); }
  /* flex 兜底的栏宽（grid 生效时被下面的 @supports 覆盖回 auto） */
  .app > .side { flex: 0 0 230px; }
  .app > .mid { flex: 1 1 auto; min-width: 0; }
  .app > .side2 { flex: 0 0 288px; }
  @supports (display: grid) {
    .app { display: grid; grid-template-columns: 230px 1fr 288px; }
    .app > .side, .app > .mid, .app > .side2 { flex: none; }
  }

  /* ─── 左：角色 ─── */
  .side { border-right: 1px solid var(--border-soft); display: flex;
    flex-direction: column; min-height: 0; background: var(--bg-elev); }
  .side-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--border-soft);
    display: flex; align-items: center; }
  .side-head h1 { font-size: 14px; font-weight: 600; letter-spacing: .5px; }
  .side-head .sp { flex: 1; }
  .side-list { flex: 1; overflow-y: auto; padding: 6px; }
  .ci { padding: 9px 11px; border-radius: var(--rs); cursor: pointer;
    margin-bottom: 2px; border: 1px solid transparent; }
  .ci:hover { background: var(--bg-input); }
  .ci.on { background: var(--bg-input); border-color: var(--accent-dim); }
  .ci .nm { font-size: 13px; font-weight: 500; }
  .ci.on .nm { color: var(--accent); }
  .ci .ds { font-size: 11px; color: var(--text-mute); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-foot { padding: 8px; border-top: 1px solid var(--border-soft);
    display: flex; gap: 6px; }
  /* 三个按钮平分宽度（清空 / 出戏 / 自检）。老浏览器没有 gap，
     靠下面的 @supports 兜底补 margin。 */
  .side-foot > * { flex: 1; }
  .side-foot a.btn { display: flex; align-items: center;
    justify-content: center; }

  /* ─── 中：聊天 ─── */
  .mid { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .top { padding: 10px 16px; border-bottom: 1px solid var(--border-soft);
    display: flex; align-items: center; gap: 10px; min-height: 50px; }
  .top .burger { display: none; }
  .top .nm { font-size: 15px; font-weight: 600; }
  .top .live { font-size: 10px; color: var(--accent); border: 1px solid var(--accent-dim);
    padding: 1px 7px; border-radius: 9px; }
  .top .sp { flex: 1; }
  .quota { font-size: 11px; color: var(--warn); border: 1px solid #6b5218;
    padding: 2px 9px; border-radius: 10px; white-space: nowrap; }
  .quota.done { color: var(--err); border-color: #6b2020; }
  /* 回画廊（2026-11-03 用户要求）。做成主色边框，别让它混在一排灰按钮里。 */
  .top a.back { text-decoration: none; border-color: var(--border);
    color: var(--text-dim); }
  .top a.back:hover { border-color: var(--accent); color: var(--accent); }

  /* 右上角的模式开关（2026-11-03 用户报「登录后看不到切换开关」）。
     原来它躺在右栏「此刻」的 #affBox 里，而那个区块 `if (!a) display:none`——
     a 只有开过攻略模式才有。于是：想开攻略模式 → 得点按钮 → 按钮在区块里 →
     区块要开过攻略模式才显示。**入口被锁在自己打开的那道门里。**
     现在提到顶部常驻，用边框色区分两态（灰=自由，玫红=攻略）。 */
  .top .mode { border-color: var(--border); color: var(--text-dim); }
  .top .mode.on { border-color: #e8779c; color: #e8779c; }

  /* `min-height: 0` 不能省：flex 子项的 min-height 默认是 `auto`，内容一多
     它就不肯收缩，会把下面的 `.composer` 挤出可视区（老浏览器上尤其明显）。*/
  .log { flex: 1; min-height: 0; overflow-y: auto; padding: 16px;
    display: flex;
    flex-direction: column; gap: 12px; scroll-behavior: smooth; }

  .row { display: flex; }
  .row.u { justify-content: flex-end; }
  .bubble-wrap { max-width: min(76%, 720px); }
  .row.u .bubble-wrap { display: flex; flex-direction: column; align-items: flex-end; }
  .who { font-size: 11px; color: var(--text-mute); margin: 0 4px 3px; }
  .bubble { padding: 10px 14px; border-radius: var(--r); line-height: 1.72;
    white-space: pre-wrap; word-break: break-word; }
  .row.u .bubble { background: var(--accent-dim); border-bottom-right-radius: 4px; }
  .row.a .bubble { background: var(--bg-elev); border: 1px solid var(--border-soft);
    border-bottom-left-radius: 4px; }
  /* 这轮没发出去 → 原样重发的入口（超时/断流后不用重新打字） */
  .retryRow { display: flex; align-items: center; gap: 10px;
    margin: 6px 4px 0; font-size: 12px; color: var(--text-mute);
    flex-wrap: wrap; }
  .retryRow .btn { flex: none; }

  /* 图片区：**挂在气泡正下方**，不另起一行消息 */
  .pic { margin-top: 6px; border-radius: var(--r); overflow: hidden;
    border: 1px solid var(--border-soft); background: #0a0a0f; display: none; }
  .pic.show { display: block; }
  .pic img { display: block; width: 100%; height: auto; cursor: zoom-in; }
  .pic .ph { padding: 14px; font-size: 12px; color: var(--text-mute);
    text-align: center; }
  .pic .ph .dots::after { content: ""; animation: d 1.2s steps(4) infinite; }
  @keyframes d { 0%{content:"";} 25%{content:"·";} 50%{content:"··";}
    75%{content:"···";} }

  /* 气泡下方工具条 */
  .tools { display: flex; gap: 6px; margin: 5px 4px 0; opacity: 0;
    transition: opacity .15s; }
  .row.a:hover .tools, .row.a:focus-within .tools, .tools.always { opacity: 1; }
  @media (hover: none) { .tools { opacity: 1; } }
  .tb { background: transparent; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 14px; padding: 3px 10px; font-size: 11px; cursor: pointer;
    font-family: inherit; transition: all .12s; white-space: nowrap; }
  .tb:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .tb:disabled { opacity: .35; cursor: default; }

  .empty { color: var(--text-mute); text-align: center; padding: 70px 20px;
    font-size: 13px; line-height: 2; }

  /* 开场导读（2026-11-04）：新线第一屏先交代「现在是什么情况」，
     不然玩家打开就是空的，不知道怎么开口。灰色 = 系统说话，不是她说的。 */
  .intro { margin: 10px 2px 18px; padding: 12px 14px; border-radius: var(--rs);
    background: var(--bg-elev);
    border: 1px dashed var(--border);
    color: var(--text-dim); font-size: 13px; line-height: 1.85;
    white-space: pre-wrap; }
  .intro::before { content: "开场"; display: block; margin-bottom: 6px;
    font-size: 11px; letter-spacing: .12em; color: var(--text-mute); }

  /* `flex: none` 保证输入区不被压缩——它是这一页唯一的操作口。
     `padding-bottom` 走 `max()`：底部安全区（全面屏手势条、QQ 浏览器的
     返回栏）有多高就留多高，没有就退回原来的 10px。
     ⚠️ 要配合 meta 里的 `viewport-fit=cover` 才生效——不加那个，
     `env(safe-area-inset-bottom)` 恒为 0。 */
  .composer { flex: none; border-top: 1px solid var(--border-soft);
    padding: 10px 14px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { flex: 1; background: var(--bg-input); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--rs); padding: 11px 13px;
    font: inherit; line-height: 1.5; resize: none; min-height: 44px; max-height: 140px;
    outline: none; }
  .composer textarea:focus { border-color: var(--accent); }
  .btn { background: var(--bg-input); border: 1px solid var(--border); color: var(--text);
    border-radius: var(--rs); padding: 10px 16px; font: inherit; cursor: pointer;
    white-space: nowrap; transition: all .12s; }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.pri { background: var(--accent-dim); border-color: var(--accent); }
  .btn.pri:hover:not(:disabled) { background: var(--accent); color: #000; }
  .btn.sm { padding: 5px 11px; font-size: 12px; }

  /* ─── 右：状态 ─── */
  /* grid 项默认 min-height:auto，内容一多就把 .app 撑破——面板七行起，
     必须给 0 才轮得到 overflow-y:auto 生效（2026-11-04 深夜）。 */
  .side2 { border-left: 1px solid var(--border-soft); padding: 14px;
    overflow-y: auto; min-height: 0; background: var(--bg-elev); }
  /* 标题「此刻」已去掉（2026-11-04 深夜）：侧栏里第一个东西现在是状态
     面板本身，它的标题就是「状态 · 攻略模式」，再加一个总标题纯占高度。 */
  .st { margin-bottom: 16px; }
  .st .k { font-size: 11px; color: var(--text-mute); margin-bottom: 3px; }
  .st .v { font-size: 12.5px; line-height: 1.65; word-break: break-word; }
  .st .v.mood { color: var(--accent); }

  /* ─── 紧凑「此刻」区（2026-11-04 深夜）──
     心情/状态/轮次原来是三个独立小块，各占一段间距，把面板顶到屏幕外。
     现在挤成一块：标签在左、值在右，一行一个。 */
  .nowrow { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
  .nowrow .k { margin: 0; flex: none; }
  .nowrow .v { flex: 1 1 auto; text-align: right;
    font-variant-numeric: tabular-nums; }

  /* ─── 可折叠的「回忆」（2026-11-04 深夜）──
     小记能到上千字，展开就把下面的东西全挤出可视区。默认收起，
     标题那一行整行可点（手机上点得中），箭头转 90 度表示开着。 */
  .fold { margin-bottom: 10px; }
  .foldhead { display: flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 4px 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  .foldhead .k { margin: 0; flex: 1 1 auto; }
  .foldmark { font-size: 10px; color: var(--text-mute);
    transition: transform .18s; display: inline-block; }
  .fold.open .foldmark { transform: rotate(90deg); color: var(--accent); }
  /* 收起时用 max-height 而不是 display:none —— 后者会让高度瞬间跳变，
     抽屉里看起来像闪一下。展开上限给足，超出的自己滚。 */
  .foldbody { max-height: 0; overflow: hidden; color: var(--text-dim);
    transition: max-height .22s ease; }
  .fold.open .foldbody { max-height: 42vh; overflow-y: auto; }
  /* 侧栏数值（2026-11-04）：一行一个，右对齐好比较大小。 */
  .st .nums { margin-top: 5px; font-size: 12px; color: var(--text-mute); }
  .st .nums > div { display: flex; justify-content: space-between;
    line-height: 1.7; }
  .st .nums b { color: var(--text-dim); font-weight: 500;
    font-variant-numeric: tabular-nums; }
  .st .nums b.dn { color: var(--err); }
  /* 亲密度那一行（2026-11-04）：档名只说明「现在在哪」，这行说明「还差多远」。
     和 QQ 尾行同一套文案（后端 `_intimacy_label` 算好，前端不重算）。 */
  .st .gauge { margin-top: 5px; font-size: 12px; color: var(--text-dim);
    font-variant-numeric: tabular-nums; }
  .st .gauge.dn { color: var(--err); }
  .bar { height: 3px; background: var(--bg-input); border-radius: 2px;
    margin-top: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent);
    width: 0; transition: width .3s; }

  /* ─── 状态面板（2026-11-04 深夜）──
     用户的原话：「一列下来，每一行它都有对应的一个数值，对应当前的一个状态」。
     所以这里不是三根独立的条，是**一张表**：每行左边名字、右边「当前/门槛」，
     到了的打勾、当前那行高亮并挂左箭头、没到的灰掉。
     人的眼睛会去找「差几个」，这就是驱动力——不需要再加别的东西。 */
  .panel { margin-top: 2px; }
  .panel h3 { font-size: 11px; font-weight: 500; color: var(--text-mute);
    margin: 9px 0 3px; letter-spacing: .5px; }
  .panel h3:first-child { margin-top: 0; }
  /* 行高从 1.72 收到 1.6、字号 12 → 11.5（2026-11-04 深夜）：
     整张表 24 行，每行省 1px 就是 24px——侧栏一屏能多露出一整段。 */
  .prow { display: flex; align-items: baseline; gap: 5px;
    font-size: 11.5px; line-height: 1.6;
    font-variant-numeric: tabular-nums; }
  .prow .mk { width: 12px; flex: none; color: var(--text-mute); }
  .prow .nm { flex: 1 1 auto; color: var(--text-mute); }
  .prow .vl { flex: none; color: var(--text-mute); font-size: 11.5px; }
  /* 到了：名字恢复正常色，前面打勾 */
  .prow.reached .mk { color: #6fbf8a; }
  .prow.reached .nm { color: var(--text-dim); }
  /* 就在这一行：高亮 + 一个左箭头，一眼看到自己站在哪 */
  .prow.current .mk { color: var(--accent); }
  .prow.current .nm { color: var(--accent); font-weight: 600; }
  .prow.current .vl { color: var(--accent); }
  .prow.locked { opacity: .55; }
  .prow .req { color: #f0a35e; font-size: 11px; }
  /* 面板底部的结论句 */
  .pnote { margin-top: 8px; font-size: 11.5px; color: var(--text-mute);
    line-height: 1.6; }
  .pnote b { color: var(--accent); font-weight: 500; }

  /* ─── 攻略模式（好感度）── */
  /* 气泡下方的状态行：档位名是重点，增减跟着走一条 */
  .aff { font-size: 11.5px; color: var(--text-mute); margin-top: 5px;
    letter-spacing: .3px; width: 170px; max-width: 100%; }
  .aff b { color: var(--accent); font-weight: 500; }
  .aff .d { margin-left: 6px; }
  .aff .d.up { color: #e8779c; }
  .aff .d.dn { color: var(--err); }
  /* 气泡下方的两条细进度条（2026-11-04）：手机端没有右栏，状态得跟着
     她说的话走。玫红=走到哪一步，暖橙=此刻的气氛；气氛为 0 时只画一条，
     免得给人「气氛归零了很严重」的错觉。 */
  .aff .b { height: 3px; border-radius: 2px; margin-top: 4px; overflow: hidden;
    background: var(--bg-elev); }
  .aff .b > i { display: block; height: 100%; width: 0;
    transition: width .3s; }
  .aff .b.rel > i { background: #e8779c; }
  .aff .b.aro { height: 2px; }
  .aff .b.aro > i { background: #f0a35e; }
  /* 数值（2026-11-04）：条只给「位置」，数值给「变化」——玩家要的是看到
     数字往上跳那一下。一行一个，正数**不带加号**，只有负数才带负号。
     只在**最新一条**她的回复上展开（.cur），不然十几条叠下来整屏都是数字。 */
  .aff .nums { display: none; margin-top: 5px; font-size: 11.5px;
    line-height: 1.62; color: var(--text-mute); }
  .aff.cur .nums { display: block; }
  .aff .nums .n { display: flex; justify-content: space-between; gap: 12px; }
  /* 亲密度那一行（2026-11-04）：和 QQ 尾行同句，数字用等宽好比较。 */
  .aff .nums .g { color: var(--text-dim);
    font-variant-numeric: tabular-nums; }
  .aff .nums .g.dn { color: var(--err); }
  .aff .nums b { font-weight: 500; color: var(--text-dim);
    font-variant-numeric: tabular-nums; }
  .aff .nums b.dn { color: var(--err); }
  .aff.end { color: var(--err); }
  /* 结局的出口（2026-11-04）：进局子那一刻玩家容易以为「只能重新开始、
     存档要没了」，所以这个按钮要显眼——玫红实心、带呼吸光晕、占满气泡宽度。 */
  .aff.end { width: auto; min-width: 170px; }
  /* 按钮只在最新一条上出现（.cur）：结局之后每一轮都会挂着 ending，
     十几条各带一个按钮就成了刷屏。 */
  .aff .mercy { display: none; margin-top: 7px; padding: 9px 14px;
    font-family: inherit; font-size: 13px; font-weight: 600; white-space: nowrap;
    color: #fff; background: #e0457b; border: 0; border-radius: 8px;
    letter-spacing: .5px; cursor: pointer;
    animation: mercyPulse 1.9s ease-out infinite; }
  .aff.cur .mercy { display: inline-block; }
  .aff .mercy:hover { background: #c93a6c; }
  .aff .mercy:disabled { background: var(--bg-elev); color: var(--text-mute);
    animation: none; cursor: default; }
  @keyframes mercyPulse {
    0%   { box-shadow: 0 0 0 0 rgba(224,69,123,.5); }
    70%  { box-shadow: 0 0 0 9px rgba(224,69,123,0); }
    100% { box-shadow: 0 0 0 0 rgba(224,69,123,0); }
  }
  .affbar { position: relative; }
  .affbar > i { background: #e8779c; }
  /* 气氛用暖橙，和关系的玫红分开：同一屏上看得出是两个不同的东西 */
  .arobar > i { background: #f0a35e; }
  /* 兴奋用紫，和上面两条都区分开：它是「进行中的那一场」，不是常驻状态 */
  .exbar > i { background: #c96bd6; }
  .aff .b.ex > i { background: #c96bd6; }

  /* 图片放大 */
  .zoom { position: fixed; inset: 0; background: rgba(0,0,0,.94);
    display: none; align-items: center; justify-content: center; z-index: 200;
    cursor: zoom-out; padding: 20px; }
  .zoom.on { display: flex; }
  .zoom img { max-width: 100%; max-height: 100%; object-fit: contain; }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: var(--bg-input); border: 1px solid var(--border);
    padding: 9px 18px; border-radius: 20px; font-size: 13px; opacity: 0;
    transition: opacity .2s; pointer-events: none; z-index: 300; max-width: 80vw; }
  .toast.on { opacity: 1; }
  .toast.err { border-color: var(--err); color: var(--err); }

  /* ─── 清空存档（2026-11-04）───
     用户要求：红色感叹号警告 + 必须手打确认句。所以不用原生 confirm ——
     那个只能点「确定」，手滑一样过，等于没拦。
     注意 `.danger` 的颜色写死不跟主题走：这是唯一的破坏性按钮，它就该刺眼。 */
  .btn.danger { background: #7f1d1d; border-color: #b91c1c; color: #fecaca; }
  .btn.danger:hover:not(:disabled) { background: #b91c1c; border-color: #ef4444;
    color: #fff; }

  .wipeMask { display: none; position: fixed; inset: 0; z-index: 400;
    background: rgba(0,0,0,.72); align-items: center; justify-content: center;
    padding: 20px; }
  .wipeMask.on { display: flex; }
  .wipeBox { width: min(430px, 100%); background: var(--bg-elev);
    border: 1px solid #7f1d1d; border-radius: var(--r); padding: 20px;
    box-shadow: 0 18px 50px rgba(0,0,0,.6); }
  .wipeBox h3 { font-size: 16px; color: #f87171; margin-bottom: 10px; }
  .wipeBox .wtext { font-size: 13px; line-height: 1.8; color: var(--text-dim); }
  .wipeBox .wtext b { color: var(--text); }
  .wipeBox .wcode { margin: 12px 0 8px; padding: 9px 12px; font-size: 13px;
    color: #fca5a5; background: #1a0c0c; border: 1px dashed #7f1d1d;
    border-radius: var(--rs); user-select: all; text-align: center; }
  .wipeBox input { width: 100%; padding: 10px 12px; font: inherit; font-size: 13px;
    color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--rs); outline: none; }
  .wipeBox input:focus { border-color: #b91c1c; }
  .wipeBox .wbtns { display: flex; gap: 8px; margin-top: 14px; }
  .wipeBox .wbtns .btn { flex: 1; display: flex; justify-content: center; }

  /* ─── 自定义模型弹窗（2026-11-05）───────────────────────
     克隆 wipeMask 的壳：居中遮罩 + 430px 面板。区别是这里没有危险动作，
     所以不走红色系，用中性边框；三个输入框 + 测试/恢复/保存三个动作。 */
  .cmMask { display: none; position: fixed; inset: 0; z-index: 400;
    background: rgba(0,0,0,.72); align-items: center; justify-content: center;
    padding: 20px; }
  .cmMask.on { display: flex; }
  .cmBox { width: min(430px, 100%); background: var(--bg-elev);
    border: 1px solid var(--border); border-radius: var(--r); padding: 20px;
    box-shadow: 0 18px 50px rgba(0,0,0,.6);
    max-height: calc(100vh - 40px); overflow-y: auto; }
  .cmBox h3 { font-size: 16px; margin-bottom: 8px; }
  .cmBox .cmt { font-size: 12px; line-height: 1.7; color: var(--text-dim); }
  .cmBox .cmt b { color: var(--text); }
  .cmBox label { display: block; font-size: 12px; color: var(--text-dim);
    margin: 12px 0 4px; }
  .cmBox input { width: 100%; padding: 10px 12px; font: inherit; font-size: 13px;
    color: var(--text); background: var(--bg-input);
    border: 1px solid var(--border); border-radius: var(--rs); outline: none;
    box-sizing: border-box; }
  .cmBox input:focus { border-color: var(--border-h, var(--border)); }
  .cmBox .cmStatus { min-height: 18px; font-size: 12px; margin-top: 10px;
    line-height: 1.6; word-break: break-all; color: var(--text-dim); }
  .cmBox .cmStatus.ok { color: #4ade80; }
  .cmBox .cmStatus.err { color: #f87171; }
  .cmBox .wbtns { display: flex; gap: 8px; margin-top: 14px; }
  .cmBox .wbtns .btn { flex: 1; display: flex; justify-content: center; }
  /* 侧栏里「当前用的是谁」的一行小字。 */
  .cmNow { font-size: 11px; color: var(--text-dim); margin-top: 6px;
    line-height: 1.5; word-break: break-all; }
  /* 手机：输入框 16px 起——iOS Safari 聚焦字号小于 16px 会强行放大页面。 */
  @media (max-width: 1000px) {
    .cmBox input { font-size: 16px; }
  }

  /* 顶栏的「状态」按钮（2026-11-04 深夜）：默认不显示，只有窄屏
     （<=1000px）才在媒体查询里放出来。基类写死 none 是为了宽屏——
     宽屏有常驻右栏，再来个按钮就是重复入口。 */
  .top .stats-btn { display: none; }

  .mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    z-index: 90; }
  .mask.on { display: block; }

  /* ─── 窄屏：抽屉 ─── */
  @media (max-width: 1000px) { .app { grid-template-columns: 1fr; } }
  /* 状态面板在窄屏**不再藏起来**（2026-11-04 深夜改）：改为右侧抽屉，
     由顶栏那个「状态」按钮唤起。原来 `display:none` 等于手机用户根本
     看不到面板——而手机才是主要场景。 */
  @media (max-width: 1000px) {
    .side2 { position: fixed; right: 0; top: 0; bottom: 0; width: 300px;
      max-width: 86vw; z-index: 150;
      transform: translateX(100%); transition: transform .22s;
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: -8px 0 24px rgba(0,0,0,.35); }
    .side2.open { transform: none; }
    /* 顶栏的「状态」按钮只在窄屏出现——宽屏右栏一直开着，不需要它。
       ⚠️ 用 `.top .stats-btn` 提高优先级：JS 里为了「选没选角色」会写
       内联 `display:''`，内联样式压不过 `@media` 里的同名声明是**恰好**
       的巧合（内联空串 = 没设置），但显式用两条媒体查询更稳。 */
    .top .stats-btn { display: inline-block; }
    /* 抽屉打开时，点遮罩两边都能关。 */
  }
  @media (min-width: 1001px) { .top .stats-btn { display: none !important; } }
  @media (max-width: 1000px) {
    /* ⚠️ 2026-11-03 手机端抽屉灰色点不到角色：层叠上下文囚禁。
       `.app` 是 position:fixed，自己就是层叠上下文；`.side` 的 z-index
       无论抬多高都只在这堵墙**内部**有效，出不了墙。遮罩 `.mask` 若在
       body 层（墙外），z-index 90 就能盖住整棵 `.app`——之前把 100 抬到
       150 没用就是这个原因（CDP 实测卡片正中心命中 DIV#mask）。
       真修法：把 `.mask` 挪进 `.app`（见 HTML 里的注释），让遮罩和抽屉
       在同一个上下文里比。这里只负责抽屉本身的定位。 */
    .side { position: fixed; left: 0; top: 0; bottom: 0; width: 250px;
      z-index: 150; transform: translateX(-100%); transition: transform .22s;
      /* 抽屉底部也让出安全区 */
      padding-bottom: env(safe-area-inset-bottom); }
    .side.open { transform: none; }
    .top .burger { display: inline-block; }
    .bubble-wrap { max-width: 88%; }
    .log { padding: 12px; }
  }

  /* ─── 老浏览器兜底：flex 的 `gap` 要 Chromium 84（2020-07）───────
     QQ 内置浏览器走 X5 内核，版本常常低于这个线。不支持 `gap` 时元素会
     **贴在一起**（不是崩溃，是挤成一坨），输入框、出图按钮都没了间距。

     `@supports not (gap: 1rem)` 只在「认不得 gap」的浏览器里命中；
     支持 gap 的新浏览器完全不进入这里，保持原来干净的写法。

     用 `> * + *` 只给「第二个及以后」的元素加边距，第一个不加。 */
  @supports not (gap: 1rem) {
    .filters > * + * { margin-left: 6px; }
    .top > * + * { margin-left: 10px; }
    .tools > * + * { margin-left: 6px; }
    .composer > * + * { margin-left: 8px; }
    /* `.log` 是纵向排列，间距走 margin-top */
    .log > * + * { margin-top: 12px; }
  }
</style>
</head>
<body>
<div class="app">

  <aside class="side" id="side">
    <div class="side-head">
      <h1>角色</h1>
      <span class="sp"></span>
      <button class="btn sm" id="btnNew" title="去角色管理新建">＋</button>

  </aside>

  <main class="mid">
    <div class="top">
      <button class="btn sm burger" id="btnBurger">☰</button>
      <a class="btn sm back" id="btnGallery" href="/gallery"
         title="回到画廊">← 画廊</a>
      <!-- 「清空存档」不再放顶栏（2026-11-05 用户要求）：手机端塞在 ☰ 和
           画廊之间太挤，而且它是个低频危险动作，混在导航里容易误点。
           入口统一挪进右栏状态区（#affBox 里的 #btnAffRestart）——
           手机展开右侧抽屉才看得到，桌面右栏常驻。 -->

      <button class="btn sm mode" id="btnMode" style="display:none">自由模式</button>
      <!-- 「状态」：窄屏专用，点开右侧抽屉看面板（2026-11-04 深夜）。
           宽屏有这个按钮也不显示——右栏本来就一直开着。 -->
      <button class="btn sm stats-btn" id="btnStats"
              title="看她现在到哪一步了">状态</button>
      <a class="btn sm" id="btnLogin" style="display:none;text-decoration:none"
         href="/" title="登录后可以无限对话、还能出图">登录</a>

    </div>

      <div class="empty">左边点一个角色开始<br>或者直接用输入框说话</div>
    </div>

      <textarea id="inp" rows="1" placeholder="说点什么…"></textarea>

      <button class="btn pri" id="btnSend">发送</button>
    </div>
  </main>

  <aside class="side2" id="side2">
    <!-- 状态面板放**最上面**（2026-11-04 深夜）：玩家开侧栏第一眼要看到的
         就是「我现在卡在哪、还差多少」。以前它在心情/状态/回忆/轮次下面，
         手机抽屉里得往下滑才能看见——那是最该看见的一块，却被挤到了最底下。 -->
    <div class="st panel" id="panelBox" style="display:none">
      <div class="k" id="panelK">状态</div>
      <div id="panelBody"></div>
      <div class="pnote" id="panelNote"></div>
    </div>
    <!-- 心情 / 状态 / 轮次压成一块紧凑区：三个各占一行会把面板顶下去。 -->
    <div class="st" id="nowBox">
      <div class="nowrow"><span class="k">心情</span>
        <span class="v mood" id="sMood">—</span></div>
      <div class="bar"><i id="sBar"></i></div>
      <div class="nowrow"><span class="k">状态</span>
        <span class="v" id="sState">—</span></div>
      <div class="nowrow"><span class="k">轮次</span>
        <span class="v" id="sTurns">0</span></div>

        <span class="v" id="sDay">—</span></div>
    </div>
    <!-- 回忆改成可折叠（2026-11-04 深夜）：小记能长到上千字，展开就把面板
         挤出屏幕。默认收起，点标题展开；记一下展开状态，同一局里不用反复点。 -->
    <div class="st fold" id="noteBox">
      <div class="foldhead" id="noteHead" role="button" tabindex="0">
        <span class="k">回忆</span>
        <span class="foldmark" id="noteMark">▸</span>
      </div>
      <div class="v foldbody" id="sNote">—</div>

    <!-- 「清空存档」留最后：它是低频动作，不该占着最显眼的位置。 -->
    <div class="st" id="affBox" style="display:none">
      <button class="btn sm danger" id="btnAffRestart">❗ 清空存档</button>
    </div>
    <!-- 自定义模型（2026-11-05）放最底：自带 OpenAI 兼容接口。游客也能
         用——体验版之外「自带钥匙来玩」的口子。配置只存浏览器本地。 -->
    <div class="st" id="customBox">
      <button class="btn sm" id="btnCustom">自定义模型</button>
      <div class="cmNow" id="cmNow" style="display:none"></div>
    </div>
  </aside>

  <!-- 遮罩必须在 .app 里面！手机端「抽屉灰色点不到角色」的真因：
       .app 是 position:fixed，自己形成层叠上下文，.side 的 z-index 150
       只在这堵墙**内部**有效；遮罩原来放在 body 层，z-index 90 在墙外，
       于是墙外看 .app 整体是 auto——遮罩反而盖住整棵 .app（含抽屉）。
       把遮罩挪进来，它和抽屉就在同一个上下文里比：side(150) > mask(90)。
       zoom(200) / toast(300) 在 body 层，照旧压过一切，不受影响。 -->
  <div class="mask" id="mask"></div>
</div>

<div class="zoom" id="zoom"><img id="zoomImg" alt=""></div>
<div class="toast" id="toast"></div>

<!-- 自定义模型（2026-11-05）：自带 OpenAI 兼容接口。
     key 只存浏览器 localStorage，每轮聊天随请求发给后端临时用一次，
     后端不落盘。保存前可以先「测试链接」——走后端转发 ping 一条，
     报错原文直接回显（浏览器直连各家接口会被 CORS 拦，测试也必须走后端）。 -->
<div class="cmMask" id="cmMask">
  <div class="cmBox">
    <h3>自定义模型</h3>
    <div class="cmt">
      用你自己的 OpenAI 兼容接口和她聊天。配置只保存在<b>本机浏览器</b>里，
      每轮对话发给服务器临时用一次、用完即弃。挂了会直接报错，
      不会偷偷换回默认模型。
    </div>
    <label for="cmUrl">接口地址（如 https://api.deepseek.com/v1）</label>
    <input id="cmUrl" autocomplete="off" spellcheck="false"
           placeholder="https://…">
    <label for="cmModel">模型名</label>
    <input id="cmModel" autocomplete="off" spellcheck="false"
           placeholder="deepseek-chat">
    <label for="cmKey">API Key</label>
    <input id="cmKey" type="password" autocomplete="off" spellcheck="false"
           placeholder="sk-…">
    <div class="cmStatus" id="cmStatus"></div>
    <div class="wbtns">
      <button class="btn" id="cmTest">测试链接</button>
      <button class="btn" id="cmClear">恢复默认</button>

<!-- 「清空存档」二次确认（2026-11-04）。
     不用原生 confirm：那个只能点「确定」，手滑一样过。这里要玩家把确认句
     原样打一遍，打错一个字的按钮就是灰的。
     确认句和按钮状态只是前端的第一道；后端还会再校验一遍（防直接打接口）。 -->
<div class="wipeMask" id="wipeMask">
  <div class="wipeBox">
    <h3>❗ 清空存档</h3>
    <div class="wtext">
      这一步删掉就找不回来了。<br>
      会删掉<b>你和她的全部聊天记录</b>，好感、关系进度、气氛、成就、
      连续天数也一起清空。<br>

           placeholder="把上面这句原样打一遍">

      <button class="btn danger" id="wipeOk" disabled>确认删除</button>

<script>
const $ = id => document.getElementById(id);
const QQ = new URLSearchParams(location.search).get("qq") || "";
let card = null, busy = false, msgs = [];
// 开场导读（2026-11-04）：新线第一屏的灰色背景说明，由后端生成一次后缓存。
let INTRO = "";
// 用户气泡的临时序号（它们不挂图，不需要归档行号，只要 DOM id 唯一）。
let U_SEQ = 0;
// 更早的记录还能不能往回翻（`/api/persona/session` 的 `more`）。
let MORE_HIST = false, LOADING_MORE = false;
let CARD_MAP = {};      // id → 卡对象，给角色列表的事件委托用
let LAST_TAP = { id: "", t: 0 };   // 防手机端 touchend + click 重复触发
let ROLE = "member";     // member / guest
let GUEST_LEFT = 0;      // 游客还剩几轮
let AFF = null;          // 攻略模式状态（session/chat 带回来；null=没开过）

// ── 回画廊（2026-11-03）─────────────────────────────────
// 页面同时跑在 5175（群友页，有 /gallery）和 5174（本机，没有 /gallery）。
// 直接 `<a href="/gallery">` 在 5174 上会 404，所以点的时候先探一下：
//   能开 → 跳过去
//   打不开 → 退回 5175 的地址（从当前 host 推断），还不行就回首页
(function bindGalleryLink() {
  const a = $("btnGallery");
  if (!a) return;
  a.addEventListener("click", function (e) {
    e.preventDefault();
    const q = QQ ? ("?qq=" + encodeURIComponent(QQ)) : "";
    // 已经在 5175（有 /gallery）就直接走
    fetch("/gallery", { method: "HEAD" }).then(function (r) {
      if (r.ok) { location.href = "/gallery" + q; return; }
      // 5174 上：换端口试 5175，再不行回首页
      const h = location.hostname;
      if (location.port === "5174") {
        location.href = location.protocol + "//" + h + ":5175/gallery" + q;
      } else {
        location.href = "/" + q;
      }
    }).catch(function () {
      location.href = "/" + q;
    });
  });
})();

// ── 手机视口高度（2026-11-03）────────────────────────────
// 软键盘弹出时 `100vh` 不变，输入框会被键盘挡住。`visualViewport` 量的是
// **真正看得见的那块**，比 vh/dvh 都准。老浏览器没有这个 API，就静默跳过，
// CSS 里那两层 vh/dvh 兜底照样生效。
(function fitViewport() {
  const vv = window.visualViewport;
  if (!vv) return;
  const apply = () => {
    document.documentElement.style.setProperty("--vh", vv.height + "px");
  };
  apply();
  vv.addEventListener("resize", apply);
  vv.addEventListener("scroll", apply);
})();

// ── 请求 ──────────────────────────────────────────────
async function api(p, opt) {
  const u = p + (p.includes("?") ? "&" : "?") + "qq=" + encodeURIComponent(QQ);
  const r = await fetch(u, opt);
  let d;
  try { d = await r.json(); } catch (e) { d = { ok: false, error: "返回不是 JSON" }; }
  if (!r.ok || d.ok === false) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}
const post = (p, body) => api(p, {
  method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body || {}),
});

function toast(t, err) {
  const el = $("toast");
  el.textContent = t;
  el.className = "toast on" + (err ? " err" : "");
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = "toast"; }, 2800);
}

// ── 左栏 ──────────────────────────────────────────────
async function loadCards() {
  try {
    const d = await api("/api/persona/cards");
    const box = $("cards");
    box.innerHTML = "";
    const list = d.cards || [];
    console.log("[cards] 拿到", list.length, "张");
    if (!list.length) {
      box.innerHTML = '<div style="padding:20px;color:var(--text-mute);' +
        'text-align:center;font-size:12px">没有可选角色</div>';
      return;
    }
    CARD_MAP = {};                                // 给事件委托用
    list.forEach(c => {
      CARD_MAP[String(c.id)] = c;
      const el = document.createElement("div");
      el.className = "ci" + (card && card.id === c.id ? " on" : "");
      el.setAttribute("data-cid", c.id);          // 事件委托靠它认卡片
      el.innerHTML = '<div class="nm"></div><div class="ds"></div>';
      el.querySelector(".nm").textContent = c.name;
      el.querySelector(".ds").textContent = c.description || "";
      box.appendChild(el);
    });
  } catch (e) {
    console.error("[cards] 拉列表失败", e);
    toast("拉角色列表失败：" + e.message, true);
  }
}

async function pick(c) {
  // 诊断（2026-11-03）：用户报「点角色没反应」，但后端全正常。
  // 先把每次点击的状态打出来，出问题时一眼能看到卡在哪。
  console.log("[pick] 点击", c && c.name, "busy=", busy,
              "current=", card && card.name);
  if (busy) {
    console.warn("[pick] busy=true，被上一条请求挡着，忽略这次点击");
    toast("上一件事还没做完，稍等一下");
    return;
  }
  // 已经在演这个角色就别白跑一次请求
  if (card && card.id === c.id) {
    console.log("[pick] 已经是这个角色，直接关抽屉");
    closeDrawer();
    return;
  }
  busy = true;
  try {
    const d = await post("/api/persona/switch", { id: c.id });
    console.log("[pick] 切换成功", d);
    card = d.card;
    // 换角色 = 换一条会话线，画面缓存也要跟着清——不清的话会把上一个
    // 角色的图挂到新角色第一条回复下面（编号撞车）。
    clearPicStore();
    msgs = [];
    toast("现在是 " + c.name);
    closeDrawer();
    await loadSession();
  } catch (e) {
    console.error("[pick] 切换失败", e);
    toast("切换失败：" + e.message, true);
  }
  finally { busy = false; }
}

function clearPicStore() {
  try { localStorage.removeItem(picStore.key()); } catch (e) {}
}

// ── 中栏渲染 ──────────────────────────────────────────
// `id` 是气泡的 DOM 标识：助手那条用**归档行号**（`m.n`，稳定，聊多少轮都不变），
// 用户那条和「…」占位用临时串（它们不挂图，不需要稳定）。2026-11-04 之前这里
// 一律用数组下标，历史一压缩整体前移，图就自己跑到最新那条下面了。
function makeRow(m, id) {
  const row = document.createElement("div");
  row.className = "row " + (m.role === "user" ? "u" : "a");
  row.dataset.idx = id;

  const wrap = document.createElement("div");
  wrap.className = "bubble-wrap";

  const who = document.createElement("div");
  who.className = "who";
  who.textContent = m.role === "user" ? "你" : (card ? card.name : "她");
  wrap.appendChild(who);

  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = m.text;
  wrap.appendChild(b);

  // ★ 攻略模式（2026-11-03）：AI 回复下方的关系状态行
  if (m.role === "assistant" && m.aff) wrap.appendChild(affLine(m.aff));

  // ★ 图片容器：**就挂在气泡正下方**，不另起一行消息
  const pic = document.createElement("div");
  pic.className = "pic";
  pic.id = "pic-" + id;
  wrap.appendChild(pic);

  if (m.imageUrl) setPic(id, m.imageUrl);

  // ★ 工具条：出图 / 重新生图（**游客不显示**——体验版不能出图）
  if (m.role === "assistant" && ROLE !== "guest") {
    const tools = document.createElement("div");
    tools.className = "tools";

    const bShot = document.createElement("button");
    bShot.className = "tb";
    bShot.textContent = "出图";
    bShot.onclick = () => shoot(id, bShot);
    tools.appendChild(bShot);

    const bRe = document.createElement("button");
    bRe.className = "tb";
    bRe.textContent = "重新生图";
    bRe.style.display = m.imageUrl ? "" : "none";
    bRe.onclick = () => shoot(id, bRe, true);
    tools.appendChild(bRe);

    // ★ 回退（2026-11-04）：删掉这轮，好感/天数/心情退回这轮之前。
    // 每条她的回复都带这个按钮，但点了之后只在它是**最新一条**时生效——
    // 只支持一级，退不了更早的（后端也一样拦）。
    const bRb = document.createElement("button");
    bRb.className = "tb";
    bRb.textContent = "⏪ 回退";
    bRb.title = "撤掉这一轮（她的回复和你上一句话），好感退回这轮之前";
    bRb.onclick = () => rollbackLast();
    tools.appendChild(bRb);

    wrap.appendChild(tools);
    row._tools = tools;
    row._regen = bRe;
  }

  row.appendChild(wrap);
  return row;
}

// 攻略模式状态行（2026-11-03）：关系 + 气氛 + 数值 / 结局标记。
// 内容全部 textContent 填，不拼服务端原文，防注入。
function affLine(a) {
  const div = document.createElement("div");
  // 刷新后 `just_ended` 没了，但 `ending` 还在（get_session 挂的 status），
  // 所以两个都要认，否则一刷新按钮就消失。
  const kind = a.just_ended || a.ending;
  div.className = "aff" + (kind ? " end" : "");
  if (kind) {
    // 2026-11-04 晚：「毕业」结局退休（50 只是里程碑，不锁数值），
    // 现在只剩进局子这一条真结局。老档若还带着 graduated，照样显示，
    // 但不再给「再给我一次机会」——那不是翻车，是收场。
    const t = document.createElement("div");
    t.textContent = kind === "graduated" ? "🎓 已结局：毕业" : "🚨 已结局：进局子";
    div.appendChild(t);
    if (kind !== "graduated") div.appendChild(mercyBtn(a));
    return div;
  }
  // 2026-11-04 三次修订：`第 3 级 / 共 5 级` 也是行话，玩家不懂「级」在量什么。
  // 关系行只留关系叫什么，说法和 QQ 尾行完全一致：
  //   ❤ 关系 家里的人
  //   气氛 平静
  // 第四次修订（同日）：只给叫法还是不够——叫法本身会变（点头之交 → 说得上话
  // → 靠得很近），但玩家看不出「还差多远」，用户原话「不知道怎么触发后续
  // 剧情」。所以加回数字，但只加在 `.cur`（最新一条）上，且用**档内进度**
  // `21/30`，不是后台刻度。
  const g = a.intimacy || null;

  const rel = document.createElement("div");
  let s = "❤ 关系 " + (a.levelName || a.tierName || "");
  if (a.rose) s += " ↑";
  rel.textContent = s;
  div.appendChild(rel);

  // 气氛单独一行：越界那轮让位给「她退开了」，和 QQ 尾行同一套规则。
  const mood = document.createElement("div");
  let m = (a.cross === "hard") ? "她退开了"
        : (a.arousalName ? "气氛 " + a.arousalName : "");
  if (a.crossN > 0) m = m ? m + " · 被拒 " + a.crossN + " 次" : "被拒 " + a.crossN + " 次";
  if (m) mood.textContent = m;
  div.appendChild(mood);

  // 关系条：和右栏同一条进度（都走 intimacy.pct），只是缩小放到气泡下面。
  // 窄屏没有右栏，这一条就是玩家唯一能看见「离下一档还有多远」的地方。
  div.appendChild(miniBar("rel", g ? (g.pct | 0) : 0));
  // 气氛条：只在有气氛时才画。它是温度计不是进度条，归零不代表坏事。
  if (a.arousal > 0) div.appendChild(miniBar("aro", a.arousal));
  // 兴奋条（2026-11-04 晚）：只在「正在进行」时才画——它描述的是这一场里
  // 她到哪了，场景一停就没有意义，归零也不该显示成「她冷下来了」。
  if (a.excite > 0) div.appendChild(miniBar("ex", a.excite));

  // 数值（2026-11-04 用户要的）：一行一个，只在最新一条上展开（`.cur`，
  // 见 markLastAff）——十几条各带几行数字，整屏都是数，反而看不出
  // 「刚才那一下涨了」。
  const nums = document.createElement("div");
  nums.className = "nums";
  const gline = document.createElement("div");
  gline.className = "g" + ((a.value | 0) < 0 ? " dn" : "");
  gline.textContent = "亲密 " + (g && g.label ? g.label : (a.value | 0));
  nums.appendChild(gline);
  nums.appendChild(numLine("冲动", a.arousal | 0));
  if (a.excite > 0) {
    // 高潮值（2026-11-04 深夜，原「兴奋」）：和冲动不是一回事——
    // 冲动是「她此刻想不想做」，高潮值是「这一场里她到哪了」。
    // 一起报次数，玩家能看出还得几次就收场。
    const n = a.orgasms | 0, mx = a.orgasmMax | 0;
    nums.appendChild(numLine("高潮", (a.excite | 0) + (mx ? " · " + n + "/" + mx : "")));
  }
  div.appendChild(nums);
  return div;
}

// 「再给我一次机会」（2026-11-04）：进局子那一刻的显眼出口，每人 3 次。
// 效果和「切自由模式再切回攻略」完全一样（结局解除、好感往线内挪一格），
// 差别只在于它是明面上的、而且会扣次数。
function mercyBtn(a) {
  const b = document.createElement("button");
  b.className = "mercy";
  const max = (a && a.mercyMax) || 3;
  const left = (a && a.mercy != null) ? (a.mercy | 0) : max;
  if (left <= 0) {
    b.disabled = true;
    b.textContent = "三次机会都用完了";
    return b;
  }
  b.textContent = "再给我一次机会 " + left + "/" + max;
  b.addEventListener("click", async () => {
    b.disabled = true;
    try {
      const d = await post("/api/persona/affection/mercy", {});
      toast(d.reply || "她留下了");
      AFF = d.affection || AFF;
      renderAff(AFF);
      await loadSession();        // 重画聊天：结局那行的按钮要跟着消失
    } catch (e) {
      b.disabled = false;
      toast(e.message, true);
    }
  });
  return b;
}

function numLine(label, v) {
  const d = document.createElement("div");
  d.className = "n";
  const s = document.createElement("span");
  s.textContent = label;
  const b = document.createElement("b");
  b.textContent = String(v);
  if (typeof v === "number" && v < 0) b.className = "dn";
  d.appendChild(s);
  d.appendChild(b);
  return d;
}

// 只有最新一条她的回复展开数值，旧的收起来。渲染完统一调一次，
// 免得每加一条都要回头去改上一条的 class。
function markLastAff() {
  const log = $("log");
  if (!log) return;
  const all = log.querySelectorAll(".aff");
  for (let i = 0; i < all.length; i++) {
    all[i].classList.toggle("cur", i === all.length - 1);
  }
}

function miniBar(cls, pct) {
  const b = document.createElement("div");
  b.className = "b " + cls;
  const i = document.createElement("i");
  i.style.width = Math.max(0, Math.min(100, pct)) + "%";
  b.appendChild(i);
  return b;
}

// 侧栏的好感区块：数值 + 进度条。（模式开关在顶部 #btnMode，见 renderMode）
// **登录用户永远显示**——以前 a 为 null（从没开过攻略）时整块藏掉，
// 结果「开攻略模式」按钮只对开过的人可见，死锁：没开过的人找不到入口。
// 2026-11-03 晚：开关本身也挪到顶部常驻了（用户说「登录后右上角看不到切换开关」），
// 这里只留数值，避免同一个动作两个入口、文案还不一致。
// AFF 现在是不是攻略模式。
// `mode` 是权威字段；万一后端回包没带（历史 bug），用 `active` 兜底——
// 不能默认 false，否则一轮对话后整个控件会自己跳成「自由模式」。
function isRaid(a) { return !!a && (a.mode ? a.mode === "raid" : a.active !== false); }

// ── 状态面板渲染（2026-11-04 深夜）──
// 用户的原话：「一列下来，每一行它都有对应的一个数值，对应当前的一个状态」。
// 所以这里不做三根独立的小条，而是**一张竖表**：每行左边名字、右边
// 「当前/门槛」，到了的打勾、当前那行高亮并挂左箭头、没到的灰掉。
//
// 数据全部来自后端 `/api/persona/affection/panel`（`affection.panel()`），
// 前端**不重算任何门槛**——档位表在 config 里，前端再算一遍就会两边不一致。
//
// 刷新时机：每轮对话结束后拉一次；切角色/切模式也拉。它比 status 多请求
// 一次，但换来的是一张能一直盯着看的表，值。

let PANEL = null;          // 最近一次拉到的面板数据

const PANEL_ICON = { reached: "✔", current: "▶", locked: "·" };

// 一行：✔ 能抱了   42/20   冲动≥35
function panelRow(r, curValue, unit) {
  const d = document.createElement("div");
  d.className = "prow " + (r.state || "locked");
  const mk = document.createElement("span");
  mk.className = "mk";
  mk.textContent = PANEL_ICON[r.state] || "·";
  d.appendChild(mk);

  const nm = document.createElement("span");
  nm.className = "nm";
  nm.textContent = r.name || "—";
  d.appendChild(nm);

  const vl = document.createElement("span");
  vl.className = "vl";
  // 门槛 0 的那一级不写分数（写「42/0」像已经满了）
  if ((r.gate | 0) > 0) {
    if (r.state === "current") {
      vl.textContent = (curValue | 0) + "/" + (r.gate | 0) + (unit || "");
    } else {
      vl.textContent = "≥" + (r.gate | 0) + (unit || "");
    }
  }
  d.appendChild(vl);

  // 身体进度那一级还要额外报冲动门槛（双轴）
  if (r.arousalGate) {
    const req = document.createElement("span");
    req.className = "req";
    req.textContent = "冲" + r.arousalGate;
    d.appendChild(req);
  }
  return d;
}

function panelSection(title, rows, curValue, unit) {
  const wrap = document.createElement("div");
  const h = document.createElement("h3");
  h.textContent = title;
  wrap.appendChild(h);
  (rows || []).forEach(function (r) {
    wrap.appendChild(panelRow(r, curValue, unit));
  });
  return wrap;
}

// 把整张面板画进右栏。a 是旧的 status（用来判断模式），p 是面板。
function renderPanel(a, p) {
  const box = $("panelBox");
  const affBox = $("affBox");
  if (!box) return;
  if (!p) {
    box.style.display = "none";
    if (affBox) affBox.style.display = "none";
    return;
  }
  const raid = isRaid(a);
  box.style.display = "";
  // 游客攻略化（2026-11-05）：游客也看面板，但「清空存档」仍然不给——
  // 游客的存档 24 小时自动过期，手动删没有意义（后端对 wipe 也还是 403）。
  if (affBox) affBox.style.display = (raid && ROLE !== "guest") ? "" : "none";
  $("panelK").textContent = raid ? "状态 · 攻略模式"
    : (a ? "状态 · 已封存" : "状态 · 未开启");

  const body = $("panelBody");
  body.innerHTML = "";
  const v = p.value | 0;

  // 一、身体进度：七级，「还没碰过 → 要不够」。
  // 这一块是玩家最想看的——它直接回答「我们能不能做 / 到哪一步了」。
  body.appendChild(panelSection("身体进度", p.intimacy, v));

  // 二、感情（羁绊档位）：正向几档。负向是事故，不进面板。
  body.appendChild(panelSection("感情", p.tiers, v));

  // 三、冲动：此刻想不想做。每轮回落 15，所以它是会掉的——
  // 掉下去那段正是「得重新拱气氛」的玩法。
  body.appendChild(panelSection(
    "冲动 " + (p.arousal | 0) + "/100", p.arousals, p.arousal));

  // 四、高潮：常驻（和冲动/堕落/屈服一样，0 也画）。
  // 2026-11-05 修（用户：高潮值消失了）：原来只在 inScene 时画，场景一结束
  // 整块凭空不见——玩家分不清「收场了」和「界面坏了」。
  // 2026-11-05 再修（用户截图问「为什么右边没有高潮值」）：上一版仍留了
  // `inScene || 有值 || 有次数` 的门槛，于是**这一场还没开始**的存档
  // （excite=0、orgasms=0、scene=false）整块不画 —— 玩家看到的是
  // 冲动/堕落/屈服都在，唯独高潮凭空少一轴，像界面坏了。
  // 现在和其它三轴一样常驻：0 也写出来，用一句小字说明是「还没开始」，
  // 而不是靠「不显示」表达「没意义」。
  const exV = p.excite | 0;
  const exN = p.orgasms | 0;
  const sec = panelSection(
    "高潮 " + exV + "/100 · 第 " + exN
    + "/" + (p.orgasmMax | 0) + " 次", p.orgasms_rows, exV);
  if (!p.inScene) {
    const tip = document.createElement("div");
    tip.style.cssText = "font-size:11.5px;color:var(--text-mute);padding:2px 0 4px;";
    if (exV > 0 || exN > 0) {
      tip.textContent = "这一场已经收场了";
    } else {
      tip.textContent = "这一场还没开始（它记的是单场进度，收场就归零）";
    }
    sec.appendChild(tip);
  }
  body.appendChild(sec);

  // 五、堕落（2026-11-04 深夜）：常驻。0 的时候也画——
  // 这根轴是「她变成了什么样」，玩家要能一眼看到自己把它推到了哪。
  // 和冲动不同：冲动会自己回落，堕落不会。
  body.appendChild(panelSection(
    "堕落 " + (p.corrupt | 0) + "/100", p.corrupts, p.corrupt));

  // 六、屈服：和堕落并排但语义不同——这个会掉。
  body.appendChild(panelSection(
    "屈服 " + (p.submit | 0) + "/100", p.submits, p.submit));

  // 七、戒备（2026-11-05）：只有档名，不给数字——露数字会变成
  // 「刷警戒-消警戒」的循环攻略。坦然的时候不画，别让面板噪音变多。
  if (p.suspicionName && p.suspicionName !== "坦然") {
    const sus = document.createElement("div");
    sus.style.cssText = "font-size:12px;color:var(--text-dim);padding:6px 0 2px;";
    sus.innerHTML = "她的戒备：<b style=\"color:var(--text)\">"
      + p.suspicionName + "</b>——她对「你图什么」起了心思，"
      + "这阵子说什么都先过一遍脑子";
    body.appendChild(sus);
  }

  // 结论：还差什么。这一行是整块面板的落点——
  // 没有它，玩家看完一堆数字不知道该干嘛。
  const note = $("panelNote");
  if (p.ending) {
    note.innerHTML = "已经结局了。发「自由模式」能翻过这一页。";
  } else if (p.needValue || p.needArousal) {
    const parts = [];
    if (p.needValue) parts.push("感情还差 <b>" + p.needValue + "</b>");
    if (p.needArousal) parts.push("气氛还差 <b>" + p.needArousal + "</b>");
    note.innerHTML = "再往前一步：" + parts.join("、");
  } else {
    note.innerHTML = "两样都够了，<b>就差那一件事</b>。";
  }
}

// 拉一次面板。失败就静默——面板挂了不该挡住聊天。
// 游客攻略化（2026-11-05）：游客也有面板，不再提前返回。
async function refreshPanel() {
  try {
    const r = await fetch("/api/persona/affection/panel");
    const d = await r.json();
    if (d && d.ok) {
      PANEL = d.panel;
      renderAff(AFF);
      renderPanel(AFF, PANEL);
    }
  } catch (e) { /* 网络抖一下就算了，下一轮还会再拉 */ }
}

function renderAff(a) {
  renderMode();
  const box = $("affBox");
  const panelBox = $("panelBox");
  // 游客攻略化（2026-11-05）：好感、面板、尾行全给，唯独「清空存档」
  // 不给（游客线 24 小时自动过期，手动删没意义，后端也仍 403）。
  if (box) box.style.display = (ROLE !== "guest" && card) ? "" : "none";
  if (panelBox) panelBox.style.display = "";
  // 面板数据是异步来的；这里先用上次的渲染一次（避免闪空白），
  // 然后立刻拉新的。第一次进来 PANEL 是 null，就等 refreshPanel 填。
  renderPanel(a, PANEL);
  refreshPanel();
}

// 顶部的自由/攻略开关：两态都常驻，靠边框色区分（灰=自由，玫红=攻略）。
// 游客没有攻略模式（后端 affection_mode 里 403 挡住），直接不给看；
// 还没选角色时也不给看——后端会回「先选一个角色」。
function renderMode() {
  const b = $("btnMode");
  if (!b) return;
  const raid = isRaid(AFF);
  b.textContent = raid ? "攻略模式" : "自由模式";
  b.classList.toggle("on", raid);
  // 结局定格（2026-11-04）：结局之后点一下就是「翻过这一页」——切自由模式
  // 会解除结局、数值封存。切回攻略模式只会回一句「还停在结局」，等于死路，
  // 所以这里先把话说清楚。
  b.title = (AFF && AFF.ending)
    ? "这条线已经结局了。点一下切自由模式，把这一页翻过去接着聊（数值封存）"
    : (raid
       ? "现在按好感档位演；点一下切回自由模式（好感封存不清零）"
       : "现在只聊天；点一下开攻略模式（开始按档位算好感）");
  b.style.display = (ROLE === "guest" || !card) ? "none" : "";

  // 「状态」按钮（2026-11-04 深夜）：窄屏开右侧抽屉看面板。
  // 游客攻略化（2026-11-05）：游客也有面板，显隐只看选没选角色
  // （游客的 session 一直带卡，所以常显）。没选角色时不给。
  const s = $("btnStats");
  if (s) {
    const on = !!card;
    // 用 '' 而不是 'inline-block'：显示规则交给 CSS 的媒体查询，
    // 这里只管「该不该有」，别和窄屏判断抢。
    s.style.display = on ? "" : "none";
    if (!on) closeStats();
  }
}

function setPic(idx, url) {  const pic = $("pic-" + idx);
  if (!pic) return;
  // 2026-11-04：老版本存下来的地址带 Windows 反斜杠（`web\生图页\...`），
  // 浏览器那一段发不出取图请求。localStorage 里的旧值也走这里，顺手纠正。
  url = String(url || "").replace(/\\/g, "/");
  pic.innerHTML = "";
  pic.classList.add("show");
  const img = document.createElement("img");
  img.src = url;
  img.loading = "lazy";
  img.onclick = () => { $("zoomImg").src = url; $("zoom").classList.add("on"); };
  pic.appendChild(img);
  const row = document.querySelector('.row[data-idx="' + idx + '"]');
  if (row && row._regen) row._regen.style.display = "";
}

function setPicPending(idx, text) {
  const pic = $("pic-" + idx);
  if (!pic) return;
  pic.classList.add("show");
  pic.innerHTML = '<div class="ph"><span class="dots">' + text + '</span></div>';
}

function setPicError(idx, text) {
  const pic = $("pic-" + idx);
  if (!pic) return;
  pic.classList.add("show");
  pic.innerHTML = '<div class="ph" style="color:var(--err)">' + text + '</div>';
}

// ── 开场导读（2026-11-04）──────────────────────────────
// 新线（一点历史都没有）第一屏先说明「现在是什么情况」，再让玩家开口。
// 用户原话：「不然我就莫名其妙地开始了，都不知道怎么聊」。灰条是**系统**
// 说话，不是她说的，所以不复用气泡样式，也不进消息数组。
function renderIntro() {
  const log = $("log");
  const old = log.querySelector(".intro");
  if (old) old.remove();
  if (!INTRO) {
    if (!msgs.length) {
      log.innerHTML = '<div class="empty">还没开始<br>说句话试试</div>';
    }
    return;
  }
  const el = document.createElement("div");
  el.className = "intro";
  el.textContent = INTRO;
  log.insertBefore(el, log.firstChild);
}

async function ensureIntro() {
  if (msgs.length || !card) return;         // 有历史 / 没选角色：不需要开场
  if (!INTRO) {
    // 生成要一次 LLM 调用（2~4 秒），先给个占位，别让第一屏空着。
    INTRO = "正在铺开场…";
    renderIntro();
    try { INTRO = (await api("/api/persona/opening")).intro || ""; }
    catch (e) { INTRO = ""; }
  }
  renderIntro();
  const log = $("log");
  log.scrollTop = log.scrollHeight;
}

function renderAll(list) {
  msgs = list || [];
  const log = $("log");
  log.innerHTML = "";
  if (!msgs.length) {
    log.innerHTML = "";
    return;                 // 空屏交给 renderIntro：有导读就铺开场，没有才提示
  }
  msgs.forEach((m, i) => {
    const num = (typeof m.n === "number") ? m.n : null;
    log.appendChild(makeRow(m, num === null ? ("u" + i) : num));
    // 恢复已生成的图：key 是 `n<归档行号>`，不再用「第几条回复」——
    // 那个号每聊一轮就整体前移一位，图会挂到错的、甚至最新的气泡下面。
    if (m.role === "assistant" && num !== null) {
      const saved = picStore.get("n" + num);
      if (saved) setPic(num, saved);
    }
  });
  markLastAff();
  log.scrollTop = log.scrollHeight;
}

function renderState(s) {
  $("sMood").textContent = s.mood ? (s.mood + " " + s.intensity) : "—";
  $("sBar").style.width = Math.min(100, (s.intensity || 0) * 10) + "%";
  $("sState").textContent = s.state || "—";
  $("sNote").textContent = s.note || "—";
  $("sTurns").textContent = s.turns || 0;
  // 游戏内天数（2026-11-04）：只在回包带了 day 时刷新，别处传来的
  // 局部状态不带它，不能把已显示的天数抹掉。
  if (s.day) $("sDay").textContent = "第 " + s.day + " 天";
  // 收起的「回忆」看不出有没有内容——标题上标一个字，
  // 玩家知道点开有东西看，不用盲点。
  const mark = $("noteMark");
  const box = $("noteBox");
  if (mark && box && !box.classList.contains("open")) {
    mark.textContent = (s.note && s.note.trim()) ? "▸ ●" : "▸";
  }
}

// ── 回忆折叠（2026-11-04 深夜）──────────────────────────
// 小记能长到上千字，默认展开会把状态面板挤出屏幕。默认收起，
// 点标题展开；`localStorage` 记住选择，同一台设备上不用每局重开。
// 键盘也认（Enter / Space）——侧栏在桌面端是常驻的，只有鼠标能点会别扭。
(function bindNoteFold() {
  const head = $("noteHead");
  const box = $("noteBox");
  if (!head || !box) return;
  const KEY = "persona_note_open";
  try {
    if (localStorage.getItem(KEY) === "1") box.classList.add("open");
  } catch (e) { /* 隐私模式读不到就算了 */ }
  function toggle() {
    box.classList.toggle("open");
    const on = box.classList.contains("open");
    const mark = $("noteMark");
    if (mark) {
      mark.textContent = on ? "▾ ●" : ($("sNote").textContent.trim() !== "—"
                                       ? "▸ ●" : "▸");
    }
    try { localStorage.setItem(KEY, on ? "1" : "0"); } catch (e) {}
  }
  head.addEventListener("click", toggle);
  head.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
  });
})();

// ── 图片地址缓存（刷新后还能看到图）────────────────────
const picStore = {
  key: () => "persona_pics_" + (QQ || "local"),
  all() { try { return JSON.parse(localStorage.getItem(this.key()) || "{}"); }
          catch (e) { return {}; } },
  get(k) { return this.all()[k] || ""; },
  set(k, v) {
    const a = this.all(); a[k] = v;
    try { localStorage.setItem(this.key(), JSON.stringify(a)); } catch (e) {}
  },
};

// ── 会话 ──────────────────────────────────────────────
// 往回翻更早的记录（2026-11-04 用户要的「能回到看从开始到现在」）。
// 后端读的是 `persona_archive_*.jsonl`（只增不删），不是模型那 12 条窗口。
// 每页以最上面那条的归档行号为游标；插入时保持滚动位置，别让人一翻就跳。
async function loadEarlier() {
  if (LOADING_MORE || !MORE_HIST || !msgs.length) return;
  const first = msgs[0].n;
  if (typeof first !== "number") return;
  LOADING_MORE = true;
  const log = $("log");
  try {
    const d = await api("/api/persona/history?before=" + first);
    const rows = d.messages || [];
    if (rows.length) {
      const keep = log.scrollHeight - log.scrollTop;
      const frag = document.createDocumentFragment();
      rows.forEach(m => {
        frag.appendChild(makeRow(m, (typeof m.n === "number") ? m.n : ("u" + m.n)));
        if (m.role === "assistant" && typeof m.n === "number") {
          const saved = picStore.get("n" + m.n);
          if (saved) setPic(m.n, saved);
        }
      });
      log.insertBefore(frag, log.querySelector(".intro")
                             ? log.querySelector(".intro").nextSibling
                             : log.firstChild);
      msgs = rows.concat(msgs);
      log.scrollTop = log.scrollHeight - keep;   // 视觉上停在原地
    }
    MORE_HIST = !!d.more && rows.length > 0;
  } catch (e) {
    MORE_HIST = false;      // 拉不到就别再反复试，免得滚动时一直打接口
  } finally {
    LOADING_MORE = false;
  }
}

async function loadSession() {
  try {
    const d = await api("/api/persona/session");
    ROLE = d.role || "member";
    GUEST_LEFT = (d.remaining === undefined) ? -1 : d.remaining;
    card = d.card;
    $("curName").textContent = card ? card.name : "选一个角色";
    $("live").style.display = card ? "" : "none";
    renderQuota();
    INTRO = d.intro || "";     // 后端缓存的开场导读（清空存档后会变空）
    renderAll(d.messages || []);
    MORE_HIST = !!d.more;      // 归档里还有更早的，往上滚就翻
    renderState(d);
    AFF = d.affection || null;
    renderAff(AFF);
    ensureIntro();       // 新线：铺一段灰底说明当前情况（不阻塞上面的渲染）
    loadPics();          // 服务器映射恢复历史图（重登/换设备也能看到）
    await loadCards();
    applyRoleUI();
  } catch (e) { toast(e.message, true); }
}

function renderQuota() {
  const q = $("quota");
  if (ROLE !== "guest") { q.style.display = "none"; return; }
  q.style.display = "";
  q.className = "quota" + (GUEST_LEFT <= 0 ? " done" : "");
  q.textContent = GUEST_LEFT > 0
    ? ("体验版 剩 " + GUEST_LEFT + " 轮")
    : "体验版已用完";
}

function applyRoleUI() {
  const guest = ROLE === "guest";
  // 游客：隐藏「新建角色」（那是站主才有的事）
  $("btnNew").style.display = guest ? "none" : "";
  $("btnLogin").style.display = guest ? "" : "none";
  // 顶栏「清空存档」已删（2026-11-05）：入口挪进右栏 #affBox。
  // 用完 15 轮就锁输入框
  const done = guest && GUEST_LEFT <= 0;
  $("inp").disabled = done;
  $("btnSend").disabled = done;
  $("inp").placeholder = done
    ? "体验版玩完啦，点右上角登录继续"
    : "说点什么…";
}

// ── 发消息 ────────────────────────────────────────────
async function send() {
  const inp = $("inp");
  const text = inp.value.trim();
  if (!text || busy) return;
  if (!card) { toast("先选一个角色", true); return; }
  busy = true; inp.value = ""; inp.style.height = "auto";

  const log = $("log");
  const e = log.querySelector(".empty");
  if (e) e.remove();

  const idxU = msgs.length;
  msgs.push({ role: "user", text, n: null });
  log.appendChild(makeRow(msgs[idxU], "u" + (++U_SEQ)));
  await deliver(text, false);
}

// deliver：真正发一轮。send 和「重新发送」共用——重发不重复 push 用户
// 消息（它失败时**留在画面和 msgs 里**；服务端没记成功这一轮，重发不重账）。
async function deliver(text, isRetry) {
  busy = true;
  const log = $("log");
  const pending = makeRow({ role: "assistant", text: "…" }, "p" + Date.now());
  log.appendChild(pending);
  log.scrollTop = log.scrollHeight;

  try {
    // 自定义模型（2026-11-05）：存了配置就随每轮带给后端临时用一次；
    // 没带 = 老行为，走默认模型。
    const d = await post("/api/persona/chat",
                         CM ? { text, custom: CM } : { text });
    // 这一轮在归档里的行号（后端回包带的）。用它当气泡 id，图才挂得对位置——
    // 用数组下标的话，历史一压缩就整体前移，图会跑到最新那条下面。
    const nA = (d.n && typeof d.n.assistant === "number") ? d.n.assistant : null;
    msgs.push({ role: "assistant", text: d.reply, aff: d.affection || null, n: nA });
    pending.remove();
    const row = makeRow(msgs[msgs.length - 1],
                        nA === null ? ("a" + Date.now()) : nA);
    log.appendChild(row);
    markLastAff();          // 数值只留在最新那条上
    renderState({ mood: d.mood, intensity: d.intensity, state: d.state,
                  note: $("sNote").textContent,
                  turns: (+$("sTurns").textContent || 0) + 1 });
    if (d.affection) {
      AFF = d.affection;
      renderAff(AFF);
      if (AFF.just_ended) {
        toast(AFF.just_ended === "graduated"
          ? "🎓 恭喜毕业！" : "🚨 进局子了……发「再给我一次机会」或切自由模式", true);
      }
      // 里程碑（2026-11-04 晚）：和结局不是一回事，不用红字警告，
      // 也不给任何「怎么办」的出口——故事接着走。
      if (AFF.just_milestone) toast("💞 在一起了。故事还在往下走。");
    }
    if (ROLE === "guest" && d.remaining !== undefined) {
      GUEST_LEFT = d.remaining;
      renderQuota();
      applyRoleUI();
      if (GUEST_LEFT <= 2 && GUEST_LEFT > 0) {
        toast("体验版还剩 " + GUEST_LEFT + " 轮");
      }
    }
  } catch (err) {
    pending.remove();
    // 游客额度用完：后端回 403 + limit:true。这种没有「重发」的意义。
    const quotaGone = ROLE === "guest" && /体验版/.test(err.message);
    if (quotaGone) {
      GUEST_LEFT = 0;
      renderQuota();
      applyRoleUI();
    } else {
      // 超时 / 断流 / 她这轮没说话：用户消息留着，给一个原样重发的入口
      const retry = document.createElement("div");
      retry.className = "retryRow";
      const why = document.createElement("span");
      why.textContent = "这轮没发出去：" + err.message;
      const btn = document.createElement("button");
      btn.className = "btn sm";
      btn.textContent = "重新发送";
      btn.onclick = async () => {
        if (busy) return;
        retry.remove();
        await deliver(text, true);
      };
      retry.appendChild(why);
      retry.appendChild(btn);
      log.appendChild(retry);
    }
    toast(err.message, true);
  } finally {
    busy = false;
    log.scrollTop = log.scrollHeight;
  }
}

// ── 回退上一轮（2026-11-04）──────────────────────────
// 发错消息想重来：删掉她最后一条回复和你对应那句话，好感 / 游戏天数 /
// 心情状态退回这轮之前。只支持一级——只能退最新这轮。
// 成功后整页重拉 session：气泡、状态条、天数、图映射一次刷齐，
// 不做局部删减（归档行号复用，局部算号容易漏）。
async function rollbackLast() {
  if (busy || !card) return;
  const last = msgs[msgs.length - 1];
  if (!last || last.role !== "assistant") {
    toast("只能回退她最新那条回复", true);
    return;
  }
  busy = true;
  try {
    await post("/api/persona/rollback", {});
    toast("已回退，重新说吧");
    // 行号会被新一轮复用，浏览器的图缓存一并清掉，防止旧图挂新气泡
    clearPicStore();
    await loadSession();
  } catch (e) {
    toast("回退失败：" + e.message, true);
  } finally {
    busy = false;
  }
}

// ── 睡到明天（2026-11-04）────────────────────────────
// 推进游戏内一天，由她先开口。约定了「明天去做什么」的，第二天的开场
// 就是这件事；偶尔撞上随机事件（台风天之类）。不消耗输入框内容。
async function skipDay() {
  if (busy || !card) return;
  busy = true;
  const log = $("log");
  const pending = makeRow({ role: "assistant", text: "…" }, "p" + Date.now());
  log.appendChild(pending);
  log.scrollTop = log.scrollHeight;
  try {
    const d = await post("/api/persona/skip_day", CM ? { custom: CM } : {});
    const nA = (d.n && typeof d.n.assistant === "number") ? d.n.assistant : null;
    msgs.push({ role: "assistant", text: d.reply, aff: d.affection || null, n: nA });
    pending.remove();
    log.appendChild(makeRow(msgs[msgs.length - 1],
                            nA === null ? ("a" + Date.now()) : nA));
    markLastAff();
    renderState({ mood: d.mood, intensity: d.intensity, state: d.state,
                  note: $("sNote").textContent, day: d.day });
    if (d.affection) { AFF = d.affection; renderAff(AFF); }
    if (ROLE === "guest" && d.remaining !== undefined) {
      GUEST_LEFT = d.remaining; renderQuota(); applyRoleUI();
    }
  } catch (err) {
    pending.remove();
    toast("没跳成：" + err.message, true);
  } finally {
    busy = false;
    log.scrollTop = log.scrollHeight;
  }
}
// `n` 就是这条回复在**归档**里的行号（气泡的 DOM id 也是它）。后端按行号取
// 那一轮，历史压缩多少次都不会画错、也不会挂到别的气泡上（2026-11-04）。
// ── 出图：挂到**这条回复的气泡下方** ────────────────────
// `n` 就是这条回复在**归档**里的行号（气泡的 DOM id 也是它）。后端按行号取
// 那一轮，历史压缩多少次都不会画错、也不会挂到别的气泡上（2026-11-04）。
async function shoot(n, btn, isRegen) {
  if (btn) btn.disabled = true;
  if (typeof n !== "number") {
    toast("这一条还没落档，刷新一下再出图", true);
    if (btn) btn.disabled = false;
    return;
  }
  setPicPending(n, "在画了，横屏单图");
  try {
    // 告诉后端「画哪一条」——不传就是最后一轮
    await post("/api/persona/shot", { msgIndex: n });
    // 轮询，出完挂到这条气泡下面（认归档行号，顺序不会乱）
    for (let i = 0; i < 100; i++) {
      await new Promise(r => setTimeout(r, 3000));
      let st;
      try { st = await api("/api/persona/shot_status?n=" + n); }
      catch (e) { continue; }
      if (st.status === "done" && st.url) {
        setPic(n, st.url);
        picStore.set("n" + n, st.url);
        toast("画好了");
        return;
      }
      if (st.status === "failed") {
        setPicError(n, "出图失败：" + (st.error || "未知"));
        return;
      }
      // running 都算还在画。单张 CG 几十秒，提示换着来免得以为卡死
      if (i === 2) setPicPending(n, "正在画，几十秒就好");
      if (i === 10) setPicPending(n, "还在画，别急");
    }
    setPicError(n, "等太久了，刷新页面看看结果");
  } catch (e) {
    setPicError(n, e.message);
    toast(e.message, true);
  } finally {
    if (btn) btn.disabled = false;
  }
}

// ── 抽屉（窄屏）───────────────────────────────────────

// 按服务器映射恢复图（2026-11-03）：重登/换设备/清缓存后 localStorage 是
// 空的，但「哪条回复配哪页图」存在服务器上（/api/persona/comics），照着
// 拉一遍就行。picStore 继续当本地缓存用，两边互不冲突。
// 键是 `n<归档行号>`（2026-11-04）；老的 `ai<窗口序号>` 后端已经不回了。
async function loadPics() {
  let pics;
  try { pics = (await api("/api/persona/comics")).pics || {}; }
  catch (e) { return; }
  for (const k of Object.keys(pics)) {
    const n = parseInt(k.slice(1), 10);
    if (isNaN(n)) continue;
    const p = pics[k];
    // 新单张 CG（2026-11-04）：条目里直接带文件名，不用再查状态。
    // picStore 里存的是完整 URL（和轮询分支一致），这里补前缀。
    if (p && p.file) {
      const u = "/api/image/" + p.file;
      setPic(n, u);
      picStore.set("n" + n, u);
      continue;
    }
    if (!p || !p.sid || !p.page) continue;
    try {
      const st = await api("/api/persona/comic?sid=" + encodeURIComponent(p.sid)
                            + "&page=" + p.page);
      if (st.status === "done" && st.url) {
        setPic(n, st.url);
        picStore.set(k, st.url);
      }
    } catch (e) { /* 单张挂了不影响其他 */ }
  }
}

// ── 两个抽屉（2026-11-04 深夜）──────────────────────────
// 左边：角色列表（.side）。右边：状态面板（.side2，窄屏专用）。
// 两个共用同一张遮罩——它们不会同时开：开一个就先关另一个，
// 否则手机上两层抽屉叠着，点哪里都关不掉。
function openDrawer() {
  closeStats();                       // 左右互斥
  $("side").classList.add("open");
  $("mask").classList.add("on");
}
function closeDrawer() {
  $("side").classList.remove("open");
  // 左边关了才收遮罩——右边可能还开着（见 openStats 的互斥处理）
  if (!$("side2").classList.contains("open")) $("mask").classList.remove("on");
}
function openStats() {
  closeDrawer();
  $("side2").classList.add("open");
  $("mask").classList.add("on");
  // 打开时刷一次：抽屉关着的时候面板不渲染，数据可能是旧的
  refreshPanel();
}
function closeStats() {
  $("side2").classList.remove("open");
  if (!$("side").classList.contains("open")) $("mask").classList.remove("on");
}

// ── 攻略模式：开关与重开（2026-11-03）──────────────────
// 开关在顶部（#btnMode）。点一次切一次，靠服务端返回的 affection 回写状态——
// 不要在前端自己取反：服务端才是权威（封存/恢复都发生在它那边）。
$("btnMode").addEventListener("click", async () => {
  if (ROLE === "guest") { toast("体验版没有攻略模式", true); return; }
  if (!card) { toast("先选一个角色", true); return; }
  try {
    // 结局定格时，无论按钮眼下显示的是哪一态，点下去都是「切自由模式」：
    // 那是唯一能翻过结局这一页的操作（切回攻略模式只会提示「还停在结局」）。
    const mode = (AFF && AFF.ending) ? "free"
                                     : (isRaid(AFF) ? "free" : "raid");
    const d = await post("/api/persona/affection", { mode: mode });
    toast(d.reply || "已切换");
    AFF = d.affection || AFF;
    renderAff(AFF);
  } catch (e) { toast(e.message, true); }
});
// ── 清空存档（2026-11-04）──
// 用户原话：「想不开去点那个重新开始，导致存档全没了」——所以要拦一道。
// 拦法不是原生 confirm（那个只能点「确定」，手滑一样过），而是让玩家把
// 确认句原样打一遍，打错一个字按钮就是灰的。
// 右栏和顶栏两个按钮是同一个动作：删的是整份存档，不分攻略/自由模式。
const WIPE_TEXT = "我同意清空存档";
function openWipe() {
  if (ROLE === "guest") { toast("体验版没有存档可删", true); return; }
  $("wipeInput").value = "";
  $("wipeOk").disabled = true;
  $("wipeMask").classList.add("on");
  setTimeout(() => { try { $("wipeInput").focus(); } catch (e) {} }, 60);
}
function closeWipe() { $("wipeMask").classList.remove("on"); }
$("wipeInput").addEventListener("input", e => {
  $("wipeOk").disabled = e.target.value.trim() !== WIPE_TEXT;
});
$("wipeInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !$("wipeOk").disabled) $("wipeOk").click();
  if (e.key === "Escape") closeWipe();
});
$("wipeCancel").onclick = closeWipe;
$("wipeMask").addEventListener("click", e => {
  if (e.target === $("wipeMask")) closeWipe();
});
$("wipeOk").onclick = async () => {
  const btn = $("wipeOk");
  btn.disabled = true;
  btn.textContent = "删除中…";
  try {
    const d = await post("/api/persona/affection/wipe", { confirm: WIPE_TEXT });
    closeWipe();
    clearPicStore();              // 本地图缓存也得清：行号从 0 重数，旧图会挂到新气泡上
    INTRO = "";                   // 开场导读要按新起点重铺，别留着上一轮的场景
    toast(d.reply || "存档已删除");
    await loadSession();          // 聊天记录和好感都清了，整屏重画
  } catch (e) {
    toast(e.message, true);
  } finally {
    btn.textContent = "确认删除";
    btn.disabled = $("wipeInput").value.trim() !== WIPE_TEXT;
  }
};
$("btnAffRestart").addEventListener("click", openWipe);
$("btnBurger").onclick = openDrawer;

// ── 自定义模型（2026-11-05）───────────────────────────
// key 只存浏览器 localStorage；每轮聊天 body 里带给后端临时用一次（见
// deliver）。CM 为 null = 用默认模型。「测试链接」把弹窗里的现值直接
// 发给 /custom_test，测的是没保存的草稿，报错原样回显。
const CM_KEY = "persona_custom_model";
let CM = null;
try { CM = JSON.parse(localStorage.getItem(CM_KEY) || "null"); } catch (e) { CM = null; }
if (!CM || !CM.base_url || !CM.model || !CM.api_key) CM = null;

function renderCmNow() {
  const el = $("cmNow");
  if (CM) { el.style.display = ""; el.textContent = "当前：" + CM.model; }
  else { el.style.display = "none"; el.textContent = ""; }
}
function openCm() {
  $("cmUrl").value = CM ? CM.base_url : "";
  $("cmModel").value = CM ? CM.model : "";
  $("cmKey").value = CM ? CM.api_key : "";
  const s = $("cmStatus");
  s.textContent = ""; s.className = "cmStatus";
  $("cmMask").classList.add("on");
}
function closeCm() { $("cmMask").classList.remove("on"); }
$("btnCustom").onclick = openCm;
$("cmMask").addEventListener("click", e => {
  if (e.target === $("cmMask")) closeCm();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("cmMask").classList.contains("on")) closeCm();
});

function cmFields() {
  return { base_url: $("cmUrl").value.trim(),
           model: $("cmModel").value.trim(),
           api_key: $("cmKey").value.trim() };
}
function cmFilled(f) { return f.base_url && f.model && f.api_key; }

$("cmTest").onclick = async () => {
  const s = $("cmStatus");
  const f = cmFields();
  if (!cmFilled(f)) { s.className = "cmStatus err"; s.textContent = "三个框都要填"; return; }
  s.className = "cmStatus"; s.textContent = "测试中…";
  try {
    const d = await post("/api/persona/custom_test", f);
    s.className = "cmStatus ok";
    s.textContent = "通了，" + d.elapsed + "s" + (d.info ? " · 她说：" + d.info : "");
  } catch (err) {
    s.className = "cmStatus err"; s.textContent = err.message;
  }
};

$("cmSave").onclick = () => {
  const f = cmFields();
  if (!cmFilled(f)) { toast("接口地址、模型名、Key 都要填", true); return; }
  CM = f;
  try { localStorage.setItem(CM_KEY, JSON.stringify(CM)); } catch (e) {}
  renderCmNow();
  closeCm();
  toast("自定义模型已启用：" + CM.model);
};

$("cmClear").onclick = () => {
  CM = null;
  try { localStorage.removeItem(CM_KEY); } catch (e) {}
  $("cmUrl").value = ""; $("cmModel").value = ""; $("cmKey").value = "";
  const s = $("cmStatus"); s.textContent = ""; s.className = "cmStatus";
  renderCmNow();
  toast("已恢复默认模型");
};
renderCmNow();

// 遮罩两边都要能关：哪个开着就关哪个（同一次点击里可能两个都判一下，
// 但 openDrawer / openStats 已经保证了不会同时开）。
$("mask").onclick = function () { closeDrawer(); closeStats(); };
$("btnStats").onclick = openStats;

// ── 绑定 ──────────────────────────────────────────────
$("btnSend").onclick = send;
$("btnSkip").onclick = skipDay;
$("inp").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("inp").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(140, e.target.scrollHeight) + "px";
});
$("btnNew").onclick = () => { location.href = "/characters" + (QQ ? ("?qq=" + QQ) : ""); };

// ── 角色列表的点击：**事件委托**（2026-11-03）────────────────
//
// 用户报「点角色没反应」。原来是把 onclick 挂在每个动态创建的 `.ci` 上——
// 但 `loadCards()` 每次刷新都会 `innerHTML = ""` 重建节点，稍有不慎就挂不上；
// 而且 `.mask`（抽屉遮罩，z-index 90）在某些布局下会盖住列表，事件根本到
// 不了元素本身。
//
// 改成在**容器上一次性委托**，用 `data-cid` 找回是哪张卡：
//   · 节点重建多少次都不影响
//   · 冒泡到容器，遮罩层只要没盖住容器就照样触发
$("cards").addEventListener("click", function (ev) {
  // 从实际点到的元素往上找，直到碰到带 data-cid 的那层
  let t = ev.target;
  while (t && t !== this && !t.getAttribute("data-cid")) {
    t = t.parentNode;
  }
  if (!t || t === this) return;
  const cid = t.getAttribute("data-cid");
  const c = CARD_MAP[cid];
  console.log("[cards] click", cid, c && c.name);
  if (c && tapOnce(cid)) pick(c);
});
// 触摸设备上补一道：某些老 WebView 的 click 事件在快速点击时会被吞
//
// ⚠️ 2026-11-03：touchend 和 click 在手机上**都会触发**，不防重会让 `pick`
// 被调两次——第二次进来 `busy` 已经是 true，于是弹「上一件事还没做完」。
// 窗口给 350ms：slow WebView 上合成 click 可能迟到 200ms+，150ms 挡不住。
// 代价只是 350ms 内对同一张卡的第二次点按被忽略，没有实际损失。
function tapOnce(cid) {
  const now = Date.now();
  if (LAST_TAP.id === cid && now - LAST_TAP.t < 350) return false;
  LAST_TAP = { id: cid, t: now };
  return true;
}
// 滑动误触保护：touchend 在**滑动列表停在卡片上**时也会触发，不判位移的话
// 划一下列表就会随机切角色。touchstart 记下起点，touchend 只认
// 「位移 < 12px 且按住 < 600ms」的真点按；滑动则放行（不 preventDefault，
// 让浏览器正常处理滚动和惯性）。
let TOUCH_START = null;
$("cards").addEventListener("touchstart", function (ev) {
  const t = ev.touches[0];
  TOUCH_START = t ? { x: t.clientX, y: t.clientY, t: Date.now() } : null;
}, { passive: true });
$("cards").addEventListener("touchend", function (ev) {
  let t = ev.target;
  while (t && t !== this && !t.getAttribute("data-cid")) {
    t = t.parentNode;
  }
  if (!t || t === this) return;
  const cid = t.getAttribute("data-cid");
  const c = CARD_MAP[cid];
  if (!c) return;
  const s = TOUCH_START;
  TOUCH_START = null;
  if (s) {
    const end = ev.changedTouches[0];
    const dx = end ? Math.abs(end.clientX - s.x) : 99;
    const dy = end ? Math.abs(end.clientY - s.y) : 99;
    const dt = Date.now() - s.t;
    if (dx + dy > 12 || dt > 600) return;   // 是滑动，不是点按
  }
  ev.preventDefault();          // 阻止随后那次 click，交给这里统一处理
  if (tapOnce(cid)) pick(c);
}, { passive: false });
// 「清空 / 出戏 / 自检」三个按钮已经去掉（2026-11-03 用户要求）：
//   出戏  —— 没意义了，选另一个角色就是另一条线
//   清空  —— 同上，换角色 = 换会话
//   自检  —— 兼容问题已经收干净，留着只是多一个按钮
$("zoom").onclick = () => $("zoom").classList.remove("on");

// 滚到顶就自动翻更早的记录（2026-11-04）。留 64px 余量，手指还没顶到头
// 就开始加载，翻起来不会一顿一顿的。
$("log").addEventListener("scroll", () => {
  if ($("log").scrollTop < 64) loadEarlier();
});
// 第一次打开如果一屏就装下了（新线只有几轮），也允许手动往回翻：
// 这条线本来就没更多了，MORE_HIST 会是 false，函数自己会退出。

loadSession();
</script>
